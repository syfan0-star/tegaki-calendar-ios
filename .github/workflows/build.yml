# Builds and tests the pure Swift package (TegakiKit) on macOS, then builds the app for the
# iOS Simulator and runs the app's unit tests on a 13-inch iPad simulator. Afterwards it launches
# the app in its screenshot mode on four simulators (docs/M4B_CONTRACT.md §6: the 13-inch iPad
# with 4 pages + 6 sheets, then an iPhone, an iPad mini and an 11-inch iPad with 4 pages each,
# booted one at a time; the iPhone also shoots the week with a Sunday 「今日」 and tries the 4 pages
# in landscape; since M4c (docs/M4C_CONTRACT.md §6) the 13-inch iPad also shoots the month, week and
# year zoomed in to twice their overview and the iPhone the week at three times, plus the week of
# 6/1, and the app logs are grepped for the canvas's `zoom:` lines; since M5 (docs/M5_CONTRACT.md §7.5,
# §7.7) a seventh sheet "paywall" and three read-only shots ("--screenshot-readonly": the 13-inch month
# with the 「閲覧専用」 badge and the toast, the 11-inch day page with the symbol-only badge, the iPhone
# week with the notice row), and the logs are grepped for the store's `store:` lines; since M6
# (docs/M6_CONTRACT.md §4.2, §7.4) an eighth sheet "export" (the export sheet in its choose state), the
# iPhone's paywall sheet, five shots on a 6.9-inch iPhone (iPhone 17 Pro Max) and a "Store listing set"
# step that converts the App Store shots into JPEGs under store/<device>/) and uploads the
# screenshots (artifact "screenshots", kept 7 days: up to 55 images + 5 logs + store/ + fixtures/) so the
# app can be looked at without Xcode. The screenshot steps never fail the job. Since 1.0.1 (docs/R1_0_1.md §5.1)
# a UI test (YearTapUITests) runs on an iPhone after the screenshots and does fail the job; its log
# and screenshots go to shots/ui-tests/. Since 1.1 (docs/M7A_CONTRACT.md §7.4, §7.5) the 13-inch iPad
# also shoots the folded toolbar (bottom left and bottom right), the eraser chosen from the toolbar, the
# grown month memo, the day's free memo below 24:00 and a ninth sheet "info" (the settings' stroke
# counts), and the iPhone the folded toolbar (portrait and landscape), the grown month memo and the
# free memo; `swift test` is followed by the check of the frozen 1.0 copy (Compat10, FROZEN.sha256);
# the unit tests write the page JSON of a missing or changed ledger-* / screenshot-* fixture into
# shots/fixtures/; and a second job, compat-v1.0, runs the 1.1 fixtures on the real 1.0 (commit
# a21e469: its TegakiKit and its app's ledger and sync engine) next to the frozen copy (K-7). Since 1.1.1
# (docs/R1_1_1.md) a third job, blank-paper, runs BlankPaperShotsUITests: the paper with no events and
# no handwriting on four devices (artifact "blank-paper", kept 7 days; that test skips itself in the UI
# test step of the first job). In the first job 1.1.1 adds two photos of the one-time pinch hint and
# HeaderAndPaperUITests, and the grown memo's photos scroll to the stroke (the paper ends far below it).
# The UI test step also runs EraserAndBelowDayUITests (since the end of 1.1, 8 tests), and "The unit tests'
# repro lines" prints the canvas tests' `repro:` lines. Since 1.2 (docs/M7B_CONTRACT.md §7.5) the macOS part
# also runs the localization lint and checks the frozen data code (DATA_1_1.sha256), "Localized bundle check"
# looks into the built app, the unit tests and every photo of the first job are in Japanese whatever the
# simulator's language is (-testLanguage ja, JA_ARGS; the photos are compared with those of
# .github/workflows/ja-baseline.yml, J-4), the UI test step also runs LanguageUITests and WeekStartUITests,
# compat-v1.0 also runs tools/weekstart-compat on the real 1.0 and the real 1.1.1, and a fourth job,
# l10n-shots, takes the other nine languages, the Sunday pages and the doubled texts (artifact
# "l10n-screenshots", kept 7 days; never fails on a photo). store-shots.yml takes the App Store's photos.
# Since 1.2.2 (docs/R1_2_2.md §6.3) the macOS part also checks that only Views/AgeRangeAsker.swift imports
# DeclaredAgeRange ("Age range isolation"), and the built app loads it weakly ("Weak link of DeclaredAgeRange").
# Since 1.3 (docs/M7C_CONTRACT.md §6.4, §10.6) the macOS part also checks that 1.2.3's tests of the one-page path
# are the bytes of 43fe366 (tools/span/TESTS_1_2_3.sha256), and KitChecks reads the compat-span fixtures.
# A push to the branch r13-quick, or to a branch r13-q-<track> (S5's parallel tracks, docs/M7C.md S5) (§10.6 速い確かめの
# 道) runs the first job only, without its photos, UI tests and repeated sync engine tests, and of the app's unit
# tests only the Span ones (QUICK below).
# Nothing here touches iCloud: the Simulator build is unsigned (the entitlements are not embedded)
# and the test host / screenshot mode use the in-memory fake database.
# Public repository → GitHub-hosted macOS runners are free.
name: build

on:
  push:
    # The two branches only exist to start ja-baseline.yml and store-shots.yml with the commit of m7b
    # (docs/M7B_CONTRACT.md §7.5, 0-40); the same CI on them would only take the runners.
    branches-ignore:
      - ja-baseline
      - store-shots
  pull_request:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: Build and test (iOS Simulator)
    runs-on: macos-26
    # 1.1: 75 → 90 (1.0.1's run took 56 min; 1.1 adds Compat10Tests, more unit tests and 10 shots, and a
    # simulator boot alone has taken 4 min). 1.1 fix, the lead's review: kept at 90. The last runs took
    # 52 min (run 41195642254) and 56 min (1.0.1), their UI test step about 4 min (estimated: the boot,
    # the 60 s wait, YearTapUITests' 97 s); the 8 new UI tests make that step about 7 min, its own limit
    # of 25 min adds at most 21 min to those runs (≈ 77 min), and the new unit tests well under a minute.
    # 1.2 (docs/M7B_CONTRACT.md §7.5): 90 → 110. The UI test step may now take 40 min (below). The longest
    # run so far is 1.1.1's 67.9 min with a UI test step of 11.9 (run 41922318959; e7b4d2f took 57.6, run
    # 41264726309): 67.9 − 11.9 + 3 (the lint, the data check, the bundle check, 2 more sheets, the new unit
    # tests) + 2 (the 13-inch iPad's wait) + 40 = 101, and 9 min for a slow boot (one alone has taken 4 min).
    # A job cut by this limit does not reach "Upload screenshots", so J-4's photos and the UI tests' log would
    # be lost with it. 1.2.3 (docs/R1_2_3.md §4): 110 → 120 for the repeated sync engine tests (a step of at
    # most 9 min: 101 + 9 = 110, and the slow boot's margin kept).
    timeout-minutes: 120
    env:
      HOMEBREW_NO_AUTO_UPDATE: "1"
      HOMEBREW_NO_INSTALL_CLEANUP: "1"
      NSUnbufferedIO: "YES"
      # 1.3 (docs/M7C_CONTRACT.md §10.6 速い確かめの道): "true" on a push to the branch r13-quick or to a branch
      # r13-q-<track> (S5's parallel tracks; concurrency is per ref, so the tracks do not stop each other), "false"
      # anywhere else. Then this job builds and runs KitChecks, the Kit's tests (CompatSpanTests among them) and the checks
      # of the macOS part (seconds), and of the app's unit tests only the Span ones ("Run unit tests on the
      # simulator"); the repeated sync engine tests, the photos and the UI tests are skipped (`env.QUICK`), and the
      # other jobs do not run (their `if:` leaves out r13-quick and r13-q-*). S5 runs there; r13 and main run
      # everything.
      QUICK: ${{ github.ref_name == 'r13-quick' || startsWith(github.ref_name, 'r13-q-') }}
      # J-4 (docs/M7B_CONTRACT.md §1.3, §7.5, 0-25): every screenshot launch ends with these, as in
      # ja-baseline.yml (the runner's simulator is English; without them the app would be in English since
      # 1.2 and the kanji would fall back to PingFang SC). Expanded unquoted on purpose: four words, none
      # with a space.
      JA_ARGS: "-AppleLanguages (ja) -AppleLocale ja_JP"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Xcode
        run: |
          set -euo pipefail
          if [ -d /Applications/Xcode_26.6.app ]; then
            sudo xcode-select -s /Applications/Xcode_26.6.app
          fi
          xcode-select -p
          xcodebuild -version

      # The pure modules (TegakiKit: DayKit / Holidays / Layout / InkModel) build and test on macOS
      # itself, before anything touches the Simulator. KitChecks is the same check set that runs on
      # the owner's Mac without Xcode (docs/M2_CONTRACT.md §8); `swift test` runs the XCTest targets.
      - name: Build TegakiKit (macOS)
        run: |
          set -euo pipefail
          swift --version
          swift build --package-path TegakiKit

      # The count is checked as a number (docs/M4B_CONTRACT.md §7.1, M4B-9; docs/M4C_CONTRACT.md §6,
      # M4C-10; docs/M5_CONTRACT.md §7.4, M5-25; docs/M6_CONTRACT.md §7.1, M6-18; docs/M7A_CONTRACT.md
      # §7.1): 1.1 counts 24446 (1.0.1's 23446 + 578 for the "growing paper", "date taps" and "stroke
      # budget (1.1)" sections + 278 for "compat with 1.0 (K-7)" on K's fixtures + 144 for the 8
      # fixtures of the ledger and the screenshot mode); 1.1.1 (docs/R1_1_1.md) counts 24929 (+ 244 for
      # the loops over the taller paper + 239 for the changed checks and the section "opening zoom and
      # top-aligned paper (1.1.1)"); 1.2 (docs/M7B_CONTRACT.md §7.1, §10.8; the split is in docs/M7B.md, K2)
      # counts 29470 (+ 4541 for the sections "languages", "kit strings", "date text", "holidays", "holiday
      # geometry" and "week start"); 1.2.1 (docs/R1_2_1.md §2.7) counts 29504 (+ 34 for the section "review
      # prompt (1.2.1)"); 1.2.2 (docs/R1_2_2.md §6.1) counts 29982 (+ 478 for the section "age range (1.2.2)"),
      # and 1.2.3 keeps it; 1.3 (docs/M7C_CONTRACT.md §10.1; the split is in docs/M7C.md) counts 36968 (+ 819
      # for the section "span (1.3)": the joined pages' names, plan, window table, bottom floors and layout,
      # + 6167 for "span ink (1.3)": the save guard, the composer and its page deltas (the safety net tried
      # without each of the random edits' deltas in turn), and the 13 compat-span fixtures of
      # TegakiKit/Tests/Fixtures/compat-span read byte for byte and through the frozen 1.0 copy).
      # The threshold is that number minus 50, so anything below 36918 means a section or a fixture went missing.
      - name: Run KitChecks (macOS)
        run: |
          set -euo pipefail
          swift run --package-path TegakiKit KitChecks 2>&1 | tee kitchecks.log
          N="$(grep -oE 'all [0-9]+ checks passed' kitchecks.log | grep -oE '[0-9]+' | tail -1)"
          echo "KitChecks count: ${N:-0} (required: 36918 or more)"
          grep -E 'compat10( with compat-span)?: [0-9]+ checks' kitchecks.log || true
          test "${N:-0}" -ge 36918

      # 1.3 (docs/M7C_CONTRACT.md §4.2, §6.3): KitChecks compares the committed compat-span fixtures with what
      # the Kit's joined path writes and fails when one is missing or differs. Then, as the unit tests do for
      # compat11 (TEGAKI_FIXTURE_OUT, below), the files the Kit writes here go into shots/fixtures/compat-span
      # (uploaded with the screenshots) for the lead to read; the committed ones are made again on a Mac with
      # `swift run --package-path TegakiKit KitChecks --write-compat-span-fixtures`. Only after a red step,
      # only when a compat-span check failed; never fails the job itself.
      - name: The compat-span fixtures the Kit writes (after a failed KitChecks)
        if: failure()
        continue-on-error: true
        run: |
          set -euo pipefail
          if grep -q 'FAIL: compat-span' kitchecks.log 2>/dev/null; then
            mkdir -p shots/fixtures/compat-span
            swift run --package-path TegakiKit KitChecks --write-compat-span-fixtures --out shots/fixtures/compat-span
          else
            echo "No compat-span check failed."
          fi

      - name: Test TegakiKit (macOS)
        run: |
          set -euo pipefail
          swift test --package-path TegakiKit

      # 1.1 (docs/M7A_CONTRACT.md §1.4, §7.4, K-7): the frozen copy of 1.0's InkModel (TegakiKit/Tests/
      # Compat10, made from commit a21e469) is never edited; FROZEN.sha256 lists its 11 files (not
      # Checks/), so every line is found in that directory. The compat-v1.0 job below checks the copy
      # against the real 1.0.
      - name: Frozen 1.0 copy
        run: |
          set -euo pipefail
          cd TegakiKit/Tests/Compat10 && shasum -a 256 -c FROZEN.sha256

      # 1.2 (docs/M7B_CONTRACT.md §2.7): the 14 rules on the languages (no Japanese outside the keys, every
      # key in ten languages, the generated files are what the sources give, the week start reaches every
      # call, the store's texts). L-12 only warns. No git, no writes.
      - name: Localization lint
        run: |
          set -euo pipefail
          python3 -I tools/l10n/lint.py .

      # 1.2.2 (docs/R1_2_2.md §6.3): Apple's DeclaredAgeRange (iOS 26) is imported by one file only
      # (Views/AgeRangeAsker.swift, behind #available), the entitlements file asks for it (read with
      # PlistBuddy: `plutil -extract` reads every '.' of the key as a separator, §4), and the mark of the
      # check build (AGE_FORCE, §6.4; testflight.yml's input `age_force`) never gets into project.yml.
      - name: Age range isolation
        run: |
          set -euo pipefail
          FILES="$(grep -rl --include='*.swift' '^import DeclaredAgeRange' Sources Tests TegakiKit | sort || true)"
          echo "import DeclaredAgeRange: ${FILES:-none}"
          if [ "$FILES" != "Sources/TegakiCalendar/Views/AgeRangeAsker.swift" ]; then
            echo "::error::import DeclaredAgeRange は Sources/TegakiCalendar/Views/AgeRangeAsker.swift の 1 つだけにしてください（docs/R1_2_2.md §3.8）。"
            exit 1
          fi
          ENT="$(/usr/libexec/PlistBuddy -c 'Print :com.apple.developer.declared-age-range' Support/TegakiCalendar.entitlements 2>/dev/null || echo missing)"
          echo "entitlements: declared-age-range $ENT"
          if [ "$ENT" != "true" ]; then
            echo "::error::Support/TegakiCalendar.entitlements に com.apple.developer.declared-age-range（true）がありません（docs/R1_2_2.md §3.8）。"
            exit 1
          fi
          if grep -n 'AGE_FORCE' project.yml; then
            echo "::error::project.yml に AGE_FORCE があります。確かめ用のビルドの印は testflight.yml の入力 age_force だけで付けます（docs/R1_2_2.md §6.4）。"
            exit 1
          fi
          echo "AGE_FORCE: not in project.yml"

      # 1.3 (docs/M7C_CONTRACT.md §4.6, D12, §10.6): the mark of the prototype build (SPAN_PROTOTYPE) never gets into
      # project.yml, so every build made from the project (this job's, the photos', the App Store's) is the normal
      # app; only xcodebuild's command line adds it (the span-shots job, testflight.yml's input `span_prototype`).
      - name: Prototype mark isolation (1.3)
        run: |
          set -euo pipefail
          if grep -n 'SPAN_PROTOTYPE' project.yml; then
            echo "::error::project.yml に SPAN_PROTOTYPE があります。試作のビルドの印は span-shots のジョブと testflight.yml の入力 span_prototype の xcodebuild の引数だけで付けます（docs/M7C_CONTRACT.md §4.6）。"
            exit 1
          fi
          echo "SPAN_PROTOTYPE: not in project.yml"

      # 1.3 (docs/M7C_CONTRACT.md §12.2 S3 (2), D12): the gate testflight.yml runs before the prototype build
      # (tools/span/prototype_gate.py) fails on every way a change could leave the normal app different from 43fe366
      # while only adding lines — a `#if SPAN_PROTOTYPE` block around a row of 43fe366, a new key that is not a
      # prototype key, a new key of InfoPlist.xcstrings. Its own test builds a throwaway repository (seconds).
      - name: The prototype gate's own test (1.3)
        run: |
          set -euo pipefail
          python3 -I tools/span/prototype_gate_test.py

      # 1.2 (docs/M7B_CONTRACT.md §1.1 D14, §1.5, 0-47): the 18 files of the handwriting's data are the
      # bytes of 1.1.1, except Sync/SyncEngine.swift, whose line is 1.2.3's (docs/R1_2_3.md §3.10: the sync's
      # order and account checks changed, not the data's form) and, after the H4 fix, that of the commit
      # with the two pendingCloudErase guards. The file keeps its name; the commit it was made from is in
      # docs/M7B.md.
      # 1.3 (docs/M7C_CONTRACT.md §6.4, D9): the four files 1.3 may change (Ink/InkLedger.swift, Ink/InkCanvasView.swift,
      # Ink/InkOverlayView.swift, Sync/SyncEngine.swift) get their row rewritten in the commit that changes them (step 2;
      # since S4 the rows of InkLedger.swift and SyncEngine.swift, the latter with the H4 fix merged, are 1.3's); every
      # other row is still the bytes above. At the submission the table is made again from that commit's tree, with
      # the two new InkModel files (20 rows), and this step becomes "Data code frozen (re-based in 1.3)" (steps 4–5).
      - name: Data code frozen since 1.1.1
        run: |
          set -euo pipefail
          shasum -a 256 -c tools/compat10/DATA_1_1.sha256

      # 1.3 (docs/M7C_CONTRACT.md §6.4, D9): the 8 test files of 1.2.3 that guard the one-page path (6 of the
      # app's unit tests, PaperGrowthTests and Compat10FixtureTests) are the bytes of commit 43fe366, so the new
      # path never passes by rewriting the old tests; new tests go into new files (§10.2). No exceptions.
      - name: The tests of 1.2.3 unchanged (1.3)
        run: |
          set -euo pipefail
          shasum -a 256 -c tools/span/TESTS_1_2_3.sha256

      - name: Install XcodeGen
        run: |
          set -euo pipefail
          brew install xcodegen
          xcodegen --version

      - name: Generate the Xcode project
        run: |
          set -euo pipefail
          xcodegen generate
          xcodebuild -project TegakiCalendar.xcodeproj -list

      # 1.2 (docs/M7B_CONTRACT.md §2.2): what XcodeGen made of the String Catalogs. Its version is not
      # pinned (brew has no old versions), so docs/M7B.md records this; "Localized bundle check" is the guard.
      - name: The project's known regions
        run: |
          set -euo pipefail
          xcodegen --version
          grep -n -A 14 'knownRegions' TegakiCalendar.xcodeproj/project.pbxproj || echo "::warning::no knownRegions in the generated project"
          grep -n 'developmentRegion' TegakiCalendar.xcodeproj/project.pbxproj || true

      - name: Build for the iOS Simulator
        run: |
          set -euo pipefail
          xcodebuild \
            -project TegakiCalendar.xcodeproj \
            -scheme TegakiCalendar \
            -configuration Debug \
            -destination "generic/platform=iOS Simulator" \
            -derivedDataPath build/DerivedData \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            build

      # 1.2.2 (docs/R1_2_2.md §6.3, §3.8): every binary of the built app that loads DeclaredAgeRange loads it
      # weakly (LC_LOAD_WEAK_DYLIB), so iOS / iPadOS 17–18, which do not have it, still launch the app. A Debug
      # build may keep the app's code in TegakiCalendar.debug.dylib, so both are looked at. A strong load
      # fails the job; no binary loading it is only a warning. testflight.yml checks the Release archive.
      - name: Weak link of DeclaredAgeRange
        run: |
          set -euo pipefail
          APP="$(find build/DerivedData -name "TegakiCalendar.app" -path "*iphonesimulator*" -not -path "*/Index.noindex/*" | head -1)"
          if [ -z "$APP" ]; then echo "::error::TegakiCalendar.app not found under build/DerivedData."; exit 1; fi
          FOUND=0
          FAILED=0
          for BIN in "$APP/TegakiCalendar" "$APP/TegakiCalendar.debug.dylib"; do
            [ -f "$BIN" ] || continue
            LOADS="$(otool -l "$BIN" | grep -B2 'DeclaredAgeRange.framework' || true)"
            if [ -z "$LOADS" ]; then
              echo "$(basename "$BIN"): does not load DeclaredAgeRange"
              continue
            fi
            FOUND=1
            if printf '%s\n' "$LOADS" | grep -q LC_LOAD_WEAK_DYLIB; then
              echo "$(basename "$BIN"): DeclaredAgeRange weak"
            else
              printf '%s\n' "$LOADS"
              echo "::error::$(basename "$BIN") が DeclaredAgeRange を強いリンクで読んでいます（iOS 17〜18 で起動できなくなる）。project.yml の OTHER_LDFLAGS を見てください。"
              FAILED=1
            fi
          done
          if [ "$FOUND" = 0 ]; then
            echo "::warning::DeclaredAgeRange を読むバイナリがありません（弱いリンクを確かめられません。docs/R1_2_2.md §6.3）。"
          fi
          exit "$FAILED"

      # 1.2 (docs/M7B_CONTRACT.md §2.2, §7.5, 0-4, 0-5): the built app has the ten languages (a `.lproj` that
      # is missing or named a little differently gives its users English without a word), the holidays and
      # their licence, not the alias UK.json and no right-to-left language, the privacy manifest's reasons
      # (CA92.1 UserDefaults; 35F9.1 system boot time, the frozen InkCanvasView needs it), and Xcode did not
      # add keys to the catalogs (SWIFT_EMIT_LOC_STRINGS is NO). If the catalogs give no `.lproj`, 0-4 says
      # what to do (build.py --format strings); if HolidayData is missing, §2.2 (Resources/HolidayData).
      - name: Localized bundle check
        run: |
          set -euo pipefail
          APP="$(find build/DerivedData -name "TegakiCalendar.app" -path "*iphonesimulator*" -not -path "*/Index.noindex/*" | head -1)"
          if [ -z "$APP" ]; then echo "::error::TegakiCalendar.app not found under build/DerivedData."; exit 1; fi
          echo "App bundle: $APP"
          FAILED=0
          fail() { echo "::error::$1"; FAILED=1; }
          for L in ja en zh-Hans zh-Hant ko fr de es it pt-BR; do
            [ -f "$APP/$L.lproj/Localizable.strings" ] || [ -f "$APP/$L.lproj/Localizable.stringsdict" ] || fail "no $L.lproj/Localizable.strings or .stringsdict"
            [ -f "$APP/$L.lproj/InfoPlist.strings" ] || fail "no $L.lproj/InfoPlist.strings"
          done
          for F in JP.json US.json index.json SOURCE.json LICENSE-python-holidays.txt CONTRIBUTORS-python-holidays.txt; do
            [ -f "$APP/HolidayData/$F" ] || fail "no HolidayData/$F"
          done
          for BAD in HolidayData/UK.json ar.lproj he.lproj; do
            if [ -e "$APP/$BAD" ]; then fail "$BAD must not be in the app"; fi
          done
          if PRIVACY="$(plutil -p "$APP/PrivacyInfo.xcprivacy")"; then
            printf '%s\n' "$PRIVACY"
            for REASON in CA92.1 35F9.1; do
              case "$PRIVACY" in
                *"$REASON"*) ;;
                *) fail "PrivacyInfo.xcprivacy has no $REASON" ;;
              esac
            done
          else
            fail "PrivacyInfo.xcprivacy is missing or unreadable"
          fi
          ls -d "$APP"/*.lproj || true
          echo "HolidayData: $(ls "$APP/HolidayData" 2>/dev/null | wc -l | tr -d ' ') files, $(du -sh "$APP/HolidayData" 2>/dev/null | cut -f1)"
          git diff --exit-code -- Sources/TegakiCalendar/Resources || fail "the build changed the String Catalogs (0-5)"
          exit "$FAILED"

      # The primary simulator (unit tests, 4 pages, 6 sheets): the first name, in sorted order, that
      # starts with "iPad Pro 13-inch", else "iPad Air 13-inch", else any iPad, else any iPhone
      # (docs/M4B_CONTRACT.md §6.1: the runner has no "iPad Pro 13-inch (M4)", so the choice is by
      # prefix and deterministic). As a last resort the literal "iPhone 17" (the step never fails).
      - name: Pick a simulator (13-inch iPad preferred)
        id: simulator
        run: |
          set -euo pipefail
          xcrun simctl list devices available
          NAME="$(xcrun simctl list -j devices available | python3 -c '
          import json, sys
          devices = json.load(sys.stdin).get("devices", {})
          names = set()
          for runtime, items in devices.items():
              if "iOS" not in runtime:
                  continue
              for d in items:
                  if d.get("isAvailable") and d.get("name"):
                      names.add(d["name"])
          for prefix in ("iPad Pro 13-inch", "iPad Air 13-inch", "iPad", "iPhone"):
              matches = sorted(n for n in names if n.startswith(prefix))
              if matches:
                  print(matches[0])
                  raise SystemExit
          print("")
          ' || true)"
          if [ -z "$NAME" ]; then
            echo "::warning::No iOS simulator found in simctl output; falling back to 'iPhone 17'."
            NAME="iPhone 17"
          fi
          echo "Using simulator: $NAME"
          echo "name=$NAME" >> "$GITHUB_OUTPUT"

      # The iPhone UI test (1.0.1) has its own step below, on an iPhone. 1.1 (docs/M7A_CONTRACT.md §7.4,
      # 0-23): InkLedgerTests.testLedgerWritesTheCompatShapes (ledger-*.json) and ScreenshotModeTests.
      # testDemoPagesMatchCompatFixtures (screenshot-*.json) compare the page JSON they make with the
      # committed fixture in TegakiKit/Tests/Fixtures/compat11 and, when it is missing or differs, write
      # theirs into TEGAKI_FIXTURE_OUT and fail (xcodebuild hands a TEST_RUNNER_-prefixed variable to the
      # test runner without the prefix). shots/fixtures goes up with the screenshots; the lead reads the
      # files and commits them. 1.1 fix (the lead's review): the output is also kept in
      # $RUNNER_TEMP/unit-tests.log (not uploaded) for the next step. 1.2 (docs/M7B_CONTRACT.md 0-25): the
      # unit tests are in Japanese whatever the simulator's language is (their old expectations are Japanese).
      # 1.3 (docs/M7C_CONTRACT.md §10.6): on r13-quick (QUICK) only the Span classes of Tests/TegakiCalendarTests
      # that exist so far (`*SpanTests`, `SpanSessionTests`, `ScreenEraseTests`, `OnePageSession…Tests`, found by
      # their `class` lines, `@MainActor final class …:` on one line too; S5 adds them), each with -only-testing;
      # none yet → the step says so and ends.
      - name: Run unit tests on the simulator
        run: |
          set -euo pipefail
          mkdir -p shots/fixtures
          ONLY=""
          if [ "$QUICK" = "true" ]; then
            CLASSES="$(grep -rhE '^(@[A-Za-z]+ +)*(final +)?class +[A-Za-z0-9_]+ *:' Tests/TegakiCalendarTests \
              | sed -E 's/^(@[A-Za-z]+ +)*(final +)?class +([A-Za-z0-9_]+).*/\3/' \
              | grep -E '(SpanTests|SpanSessionTests|ScreenEraseTests|OnePageSession[A-Za-z0-9_]*Tests)$' | sort -u || true)"
            if [ -z "$CLASSES" ]; then
              echo "::notice::r13-quick: no Span test class in Tests/TegakiCalendarTests yet; the app's unit tests are not run"
              exit 0
            fi
            for CLASS in $CLASSES; do
              ONLY="$ONLY -only-testing:TegakiCalendarTests/$CLASS"
            done
            echo "r13-quick: the app's unit tests are only$ONLY"
          fi
          # $ONLY unquoted on purpose: one word per class (none has a space), nothing when it is empty.
          TEST_RUNNER_TEGAKI_FIXTURE_OUT="$PWD/shots/fixtures" xcodebuild \
            -project TegakiCalendar.xcodeproj \
            -scheme TegakiCalendar \
            -configuration Debug \
            -destination "platform=iOS Simulator,name=${{ steps.simulator.outputs.name }}" \
            -derivedDataPath build/DerivedData \
            -skip-testing:TegakiCalendarUITests \
            $ONLY \
            -testLanguage ja \
            -testRegion JP \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            test 2>&1 | tee "$RUNNER_TEMP/unit-tests.log"

      # 1.1 fix (docs/M7A.md ずれ 46・47; the lead's review): the lines the canvas tests print for the
      # run's reader — `repro:` (U1 / U2: the touches UIKit and PencilKit saw, and why a test skipped;
      # A17 / B8: the touch types iOS's PencilKit gives) — and XCTest's "expected failure" lines, pulled
      # out of the unit tests' log, each once (a test prints a line and NSLogs it). Prints nothing when
      # there are none; runs after a red unit test step too, and never fails the job.
      - name: The unit tests' repro lines
        if: always()
        continue-on-error: true
        run: |
          set -uo pipefail
          LOG="$RUNNER_TEMP/unit-tests.log"
          if [ -f "$LOG" ]; then
            grep -iE 'repro:|expected failure' "$LOG" | awk '{ i = index($0, "repro:"); if (i > 1) $0 = substr($0, i); if (!seen[$0]++) print }' || true
          fi

      # 1.2.3 (docs/R1_2_3.md §4): the sync engine's tests again, 20 times in a row, stopping at the first
      # failure (two of them were flaky in 1.2.2's CI, runs 42531490670 and 42438495112; TestSleeper and
      # waitUntilIdle now fix the order). The build of the step above is reused (test-without-building); the
      # 20,500-stroke test is left out (about 5 s each). Estimated 3–6 min (one pass of the 60 other tests is a
      # few seconds; the rest is xcodebuild and the simulator), limited to 9. The whole output is kept in
      # $RUNNER_TEMP/sync-repeat.log (not uploaded) and its last 80 lines are printed.
      # 1.3 (docs/M7C_CONTRACT.md §7, §10.6): SyncEngineSpanTests (pagesOpened and onRemoteDelete, M4_CONTRACT §8.2
      # 54–59) are repeated with them, and since the H4 fix SyncEngineEraseFetchTests (60–62). SpanSessionTests and
      # ScreenEraseTests (§10.2, role S) join in S5: each is added (-only-testing) as soon as its `class` line is in
      # Tests/TegakiCalendarTests (none yet, so nothing changes now). The limit: 9 → 15, the contract's estimate with
      # them (§10.6), to be set again from their first runs (the per-class lines below; docs/M7C.md). On S's work
      # branch (run 43315186882) one pass of ScreenEraseTests (11 tests) took 3.8 s and of SpanSessionTests (29) 2.2 s
      # in the unit test step: about 2 min more for 20 passes, so the step should take some 5–7 min. Measured: on r13
      # before 1.3's tests the step took 2.3–4.7 min (runs 43060727400 to 43149906124), its 1,200 passes 18–39 s; with
      # SyncEngineSpanTests (run 43163415023) 5.5 min, its 1,320 passes 44 s (57 s on the clock): SyncEngineTests 1,200
      # in 36.5 s, SyncEngineSpanTests 120 in 7.4 s; in runs 43176186917 to 43251126239 (SyncEngineEraseFetchTests in
      # the last) 2.5–4.6 min. The rest is xcodebuild and the simulator. After the tail, the time of each class over its
      # passes is printed: the measure for the next limit. Each class's count is compared with the passes
      # expected (the iterations × the tests seen starting or passing): an app log line written into the middle
      # of a "Test Case" line hides that pass from the sed (seen in the unit test step of run 43176186917:
      # [TextTransform] from PencilKit, [Client] XPC), so a class that falls short gets a warning and its time is
      # short by those passes. The step's result does not depend on it.
      - name: Sync engine tests, repeated (1.2.3)
        if: env.QUICK != 'true'
        timeout-minutes: 15
        run: |
          set -euo pipefail
          ITERATIONS=20
          MORE=""
          NAMES="SyncEngineTests, SyncEngineSpanTests, SyncEngineEraseFetchTests"
          for CLASS in SpanSessionTests ScreenEraseTests; do
            if grep -rqE "^(@[A-Za-z]+ +)*(final +)?class +$CLASS *:" Tests/TegakiCalendarTests; then
              MORE="$MORE -only-testing:TegakiCalendarTests/$CLASS"
              NAMES="$NAMES, $CLASS"
            fi
          done
          echo "Repeated $ITERATIONS times: $NAMES"
          # $MORE unquoted on purpose: one word per class (none has a space), nothing when it is empty.
          xcodebuild \
            -project TegakiCalendar.xcodeproj \
            -scheme TegakiCalendar \
            -configuration Debug \
            -destination "platform=iOS Simulator,name=${{ steps.simulator.outputs.name }}" \
            -derivedDataPath build/DerivedData \
            -only-testing:TegakiCalendarTests/SyncEngineTests \
            -only-testing:TegakiCalendarTests/SyncEngineSpanTests \
            -only-testing:TegakiCalendarTests/SyncEngineEraseFetchTests \
            $MORE \
            -skip-testing:TegakiCalendarTests/SyncEngineTests/testMergeRemoteOfATruncatedPageMarksDirty \
            -test-iterations "$ITERATIONS" \
            -run-tests-until-failure \
            -testLanguage ja \
            -testRegion JP \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            test-without-building > "$RUNNER_TEMP/sync-repeat.log" 2>&1 || { tail -n 80 "$RUNNER_TEMP/sync-repeat.log"; exit 1; }
          tail -n 80 "$RUNNER_TEMP/sync-repeat.log"
          sed -nE \
            -e 's/^Test Case .-\[TegakiCalendarTests\.([A-Za-z0-9_]+) ([A-Za-z0-9_]+)\]. started\.$/S \1 \2/p' \
            -e 's/^Test Case .-\[TegakiCalendarTests\.([A-Za-z0-9_]+) ([A-Za-z0-9_]+)\]. (passed|skipped) \(([0-9.]+) seconds\)\.$/P \1 \2 \4/p' \
            "$RUNNER_TEMP/sync-repeat.log" \
            | awk -v iterations="$ITERATIONS" '
                !(($2, $3) in seen) { seen[$2, $3] = 1; tests[$2]++ }
                $1 == "P" { n[$2]++; s[$2] += $4 }
                END {
                  for (c in tests) {
                    expected = iterations * tests[c]
                    printf "per class: %s, %d passes of %d (%d tests x %d) in %.3f s\n", c, n[c], expected, tests[c], iterations, s[c]
                    if (n[c] != expected) printf "::warning::per class: %s: %d of %d pass lines read (the others were split by app log lines), so its time is short\n", c, n[c], expected
                  }
                }' | sort

      # 1.3 (docs/M7C_CONTRACT.md §10.5; docs/M7C.md, S3's J-4): the 11 sheets' wait (the 13-inch step below) runs
      # tools/shots/screen_ready.swift, and the job's first swiftc for macOS spends almost 2 min on the SDK's modules
      # (1.9 of that step's 4.6 min in run 43325447350, which built the tool in the step; 2.3 min with the fixed 9 s,
      # run 43315186882). So it is built here, in the background, while the UI tests are built and the simulator
      # boots (about 5 min); the sheets step waits for it, or builds it itself when this build is missing or failed.
      # Never fails the job. ja-baseline.yml has no such step: its sheets step, the same lines, builds the tool.
      - name: Build the sheets' screen check in the background (1.3)
        if: ${{ !cancelled() && env.QUICK != 'true' }}
        continue-on-error: true
        run: |
          set -euo pipefail
          OUT="$RUNNER_TEMP/screen_ready.build"
          mkdir -p "$OUT"
          # Its own stdin, stdout and stderr, so this step ends at once; the build goes on (the runner ends what is
          # left of a job's processes after its last step). The status file appears only when swiftc has ended.
          nohup /bin/sh -c 'swiftc -O "$1" -o "$2/screen_ready" > "$2/log" 2>&1; echo "$?" > "$2/status.part"; mv "$2/status.part" "$2/status"' \
            sh "$GITHUB_WORKSPACE/tools/shots/screen_ready.swift" "$OUT" < /dev/null > /dev/null 2>&1 &
          echo "$!" > "$OUT/pid"
          echo "swiftc of tools/shots/screen_ready.swift started in the background (pid $(cat "$OUT/pid"))"

      # 1.0.1 (docs/R1_0_1.md §5.1): the iPhone UI test is built now and run after the screenshots
      # ("UI tests on an iPhone" below, `test-without-building`). Built now because a build late in the
      # job can fail on the runner: run 41168800617's late build re-ran CopySwiftLibs, whose Metal
      # toolchain mount (/var/run/com.apple.security.cryptexd/mnt/…MetalToolchain…) was gone by then.
      # Its own derived data, so the app the screenshot steps install stays the one built above. The
      # iPhone: iPhone 17 (fallbacks: any "iPhone 17…", then any iPhone), the booted simulator's runtime first.
      - name: Build the UI tests for an iPhone (1.0.1)
        id: uibuild
        if: env.QUICK != 'true'
        run: |
          set -euo pipefail
          FOUND="$(xcrun simctl list -j devices available | python3 -c '
          import json, re, sys
          devices = json.load(sys.stdin).get("devices", {})
          def version(runtime):
              m = re.search(r"iOS-(\d+)-(\d+)", runtime)
              return (int(m.group(1)), int(m.group(2))) if m else (0, 0)
          booted_runtime = next((r for r, items in devices.items() for d in items if d.get("state") == "Booted"), None)
          found = {}
          for runtime, items in devices.items():
              if "iOS" not in runtime:
                  continue
              for d in items:
                  if not (d.get("isAvailable") and d.get("name") and d.get("udid")):
                      continue
                  key = (runtime == booted_runtime, version(runtime))
                  if d["name"] not in found or key > found[d["name"]][1]:
                      found[d["name"]] = (d["udid"], key)
          if "iPhone 17" in found:
              print("iPhone 17|" + found["iPhone 17"][0]); raise SystemExit
          for prefix in ("iPhone 17", "iPhone"):
              for name in sorted(found):
                  if name.startswith(prefix):
                      print(name + "|" + found[name][0]); raise SystemExit
          print("")
          ')"
          if [ -z "$FOUND" ]; then echo "::error::No iPhone simulator for the UI test."; exit 1; fi
          NAME="${FOUND%%|*}"; UDID="${FOUND##*|}"
          echo "UI tests on: $NAME ($UDID)"
          echo "name=$NAME" >> "$GITHUB_OUTPUT"
          echo "udid=$UDID" >> "$GITHUB_OUTPUT"
          xcodebuild \
            -project TegakiCalendar.xcodeproj \
            -scheme TegakiCalendar \
            -configuration Debug \
            -destination "platform=iOS Simulator,id=$UDID" \
            -derivedDataPath build/UITestData \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            build-for-testing
          ls build/UITestData/Build/Products/*.xctestrun

      # ---- Screenshots of the running app (best effort; never fails the job) ----
      # 1.2 (docs/M7B_CONTRACT.md §1.3 J-4, §7.5, 0-25): every launch of these steps ends with $JA_ARGS and
      # the steps write shots/env.txt. The steps from "Pick a simulator" to "Store listing set" must stay
      # the same as .github/workflows/ja-baseline.yml (the reference of J-4; only the two sheets of 1.2 and
      # the step's name differ): when one of the two changes, change the other one too. 1.3 (docs/M7C_CONTRACT.md
      # §10.5): ja-baseline.yml now holds these steps as 43fe366 has them (all 11 sheets) and shoots 43fe366; a
      # change here changes 1.3's photos against that reference, and only the changes docs/M7C.md lists may.
      # The app is launched with "--screenshot-mode" (Sources/TegakiCalendar/Support/ScreenshotMode.swift):
      # no onboarding, no EventKit, deterministic demo events for 2026-10 and a few preloaded ink
      # strokes. Since M3a it is launched once per page ("--screenshot-page month|week|day|year",
      # docs/M3A_CONTRACT.md §9), terminated between launches; since M3b four more times on the month
      # page with "--screenshot-sheet create|edit|lasso|settings" (docs/M3B_CONTRACT.md §5, §7), which
      # opens the create / edit sheet, the lasso selection with its menu, or the settings screen half a
      # second after the canvas appeared; since M4 two more sheets, "sync" (the settings screen with the
      # demo sync engine: 「同期済み」 and 「最後に同期」) and "import" (the finished web import,
      # docs/M4_CONTRACT.md §6.6); since M5 a seventh, "paywall" (the subscription sheet of
      # docs/M5_CONTRACT.md §4.1 over the month page), and "--screenshot-readonly" (the demo store starts
      # unsubscribed: the 「閲覧専用」 badge in the header, the toast of §3.3 for 20 s, docs/M5_CONTRACT.md
      # §7.5); since M6 an eighth sheet, "export" (the export sheet of docs/M6_CONTRACT.md §3.2 in its
      # choose state — two actions with a one-line note each — over the month page, 0-6).
      # In screenshot mode the sync engine is an inert demo over an in-memory fake and the store
      # is an inert demo client (no StoreKit, no UserDefaults), so nothing here needs an iCloud account
      # or App Store Connect. simctl cannot tap or rotate the device; since
      # M4b (docs/M4B_CONTRACT.md §6.4) only the iPhone turns with "--screenshot-landscape" (the app
      # asks the window scene for landscape; iPadOS ignores that request for an app that supports
      # multitasking, so the iPad shots are portrait only).
      # The steps run even when the unit tests failed (the app was still built); the upload always runs.
      # 1.3: on r13-quick (QUICK, §10.6) none of them runs (the steps after this one wait for its success).
      - name: Resolve the simulator UDID
        id: simudid
        if: ${{ !cancelled() && steps.simulator.outcome == 'success' && env.QUICK != 'true' }}
        continue-on-error: true
        run: |
          set -euo pipefail
          NAME="${{ steps.simulator.outputs.name }}"
          UDID="$(xcrun simctl list -j devices available | SIM_NAME="$NAME" python3 -c '
          import json, os, sys
          name = os.environ["SIM_NAME"]
          devices = json.load(sys.stdin).get("devices", {})
          found = ""
          for runtime, items in devices.items():
              if "iOS" not in runtime:
                  continue
              for d in items:
                  if d.get("isAvailable") and d.get("name") == name and d.get("udid"):
                      # Prefer the one xcodebuild already booted for the tests.
                      if d.get("state") == "Booted" or not found:
                          found = d["udid"]
          print(found)
          ')"
          if [ -z "$UDID" ]; then
            echo "::warning::No simulator UDID found for '$NAME'; skipping screenshots."
            exit 1
          fi
          echo "Simulator: $NAME ($UDID)"
          echo "udid=$UDID" >> "$GITHUB_OUTPUT"

      - name: Boot the simulator
        if: ${{ !cancelled() && steps.simudid.outcome == 'success' }}
        continue-on-error: true
        run: |
          set -euo pipefail
          UDID="${{ steps.simudid.outputs.udid }}"
          xcrun simctl boot "$UDID" || true
          xcrun simctl bootstatus "$UDID" -b
          xcrun simctl ui "$UDID" appearance light
          # A fixed status bar, so two runs produce the same pixels.
          xcrun simctl status_bar "$UDID" override --time "9:41" --batteryState charged --batteryLevel 100 --wifiBars 3 || true

      - name: Install the app on the simulator
        if: ${{ !cancelled() && steps.simudid.outcome == 'success' }}
        continue-on-error: true
        run: |
          set -euo pipefail
          UDID="${{ steps.simudid.outputs.udid }}"
          APP="$(find build/DerivedData -name "TegakiCalendar.app" -path "*iphonesimulator*" -not -path "*/Index.noindex/*" | head -1)"
          if [ -z "$APP" ]; then
            echo "::warning::TegakiCalendar.app not found under build/DerivedData; skipping screenshots."
            exit 1
          fi
          echo "App bundle: $APP"
          xcrun simctl install "$UDID" "$APP"

      # File names since M4b: ipad13-portrait-<page>.png (docs/M4B_CONTRACT.md §6.2; M4 and earlier
      # wrote ipad-portrait-<page>.png, the mapping is in docs/M4B.md). Since M4c the 4 pages open at
      # the overview (the whole page fits the paper area, docs/M4C_CONTRACT.md D1) and three more shots
      # open the month, the week and the year at twice the overview with a paper point (lu) at the top
      # left ("--screenshot-zoom 2 --screenshot-offset x,y", §2.4: the photo shares the canvas's zoom
      # path with a pinch; the year's offset is clamped to the paper's right edge on purpose). Since M5
      # one more: the month page in read-only mode (docs/M5_CONTRACT.md §7.5: the orange 「閲覧専用」 badge
      # left of 「＋予定」 (1024 pt ≥ 980, so with its text), the 20 s toast, undo/redo greyed). Since 1.1
      # (docs/M7A_CONTRACT.md §7.4, §8 6) five more: the toolbar folded into the dock button at the
      # bottom left and at the bottom right ("--screenshot-toolbar collapsed|collapsed-right"), the eraser
      # chosen from the toolbar (its hint ends in 「（消すとペンに戻ります）」; the 「しまう」 button at the
      # right end), and the grown month memo and the day's free memo below 24:00 ("--screenshot-grown")
      # scrolled to their strokes ("--screenshot-offset 0,1700" and "0,2300": 1.1.1 opens the two areas
      # to 6,000 lu, so the end of the paper is blank; the red wave is at y ≈ 2,063, the black at ≈ 2,700).
      # 1.1.1 (docs/R1_1_1.md): the one-time pinch hint ("--screenshot-pinch-hint", 20 s).
      - name: Screenshots (13-inch iPad, portrait, 4 pages + 3 zoomed + read-only + 5 of 1.1 + the hint)
        if: ${{ !cancelled() && steps.simudid.outcome == 'success' }}
        continue-on-error: true
        run: |
          set -euo pipefail
          UDID="${{ steps.simudid.outputs.udid }}"
          BUNDLE="com.syfan0.tegakicalendar"
          mkdir -p shots
          # J-4 (docs/M7B_CONTRACT.md §1.3, §7.5): the Xcode and the simulator runtimes the photos were drawn
          # with. build.yml and ja-baseline.yml write the same lines (keep them the same), so a `diff` of the
          # two env.txt tells whether two runs drew with the same Xcode and runtimes. No UDIDs (they differ
          # from one runner image to the next).
          sim_env() {  # sim_env <device id> <udid>: "<id>: <device name> | <runtime name> (<runtime build>)"
            xcrun simctl list -j | SIM_ID="$1" SIM_UDID="$2" python3 -I -c '
          import json, os, sys
          data = json.load(sys.stdin)
          runtimes = {r.get("identifier"): r for r in data.get("runtimes", [])}
          for runtime, items in data.get("devices", {}).items():
              for d in items:
                  if d.get("udid") == os.environ["SIM_UDID"]:
                      r = runtimes.get(runtime, {})
                      print("%s: %s | %s (%s)" % (os.environ["SIM_ID"], d.get("name"), r.get("name", runtime), r.get("buildversion", "?")))
                      raise SystemExit
          print("%s: (no simulator %s)" % (os.environ["SIM_ID"], os.environ["SIM_UDID"]))
          '
          }
          xcodebuild -version > shots/env.txt || echo "::warning::xcodebuild -version failed"
          sim_env ipad13 "$UDID" >> shots/env.txt || echo "::warning::no runtime line for ipad13"
          cat shots/env.txt || true
          # docs/M7B.md (FIX3), docs/M7B_CONTRACT.md §12.6: a first launch after the install compiles PencilKit's
          # 34 Metal shaders (the next launches none). In run 42013415033 that took until 19 s after the launch,
          # so the month photo of 8 s had no handwriting. And a freshly booted simulator posts the banner "Ready
          # for Apple Intelligence" once, about 85–105 s after the boot (docs/M7B.md, C1), which that run caught
          # on the week photo. 120 s with the app in front outlasts both. Same lines in the other workflow.
          xcrun simctl launch "$UDID" "$BUNDLE" --screenshot-mode --screenshot-month 2026-10 --screenshot-page month $JA_ARGS || true
          sleep 120
          xcrun simctl terminate "$UDID" "$BUNDLE" 2>/dev/null || true
          for PAGE in month week day year; do
            xcrun simctl terminate "$UDID" "$BUNDLE" 2>/dev/null || true
            sleep 1
            xcrun simctl launch "$UDID" "$BUNDLE" --screenshot-mode --screenshot-month 2026-10 --screenshot-page "$PAGE" $JA_ARGS
            sleep 8
            pgrep -fl "TegakiCalendar.app/TegakiCalendar" || echo "::warning::The app is not running after 8 s ($PAGE page; crashed?)"
            xcrun simctl io "$UDID" screenshot "shots/ipad13-portrait-$PAGE.png"
          done
          # page|offset: month lu (400, 200) → the Wed–Sat columns from the second half of the 10/5 week;
          # week (300, 700) → Tue–Sat from 8:45 (the band's lanes grow past zoom 0.818, §1.6);
          # year (1000, 300) → clamped to the right edge: May's end to December.
          for SPEC in "month|400,200" "week|300,700" "year|1000,300"; do
            PAGE="${SPEC%%|*}"; OFFSET="${SPEC##*|}"
            xcrun simctl terminate "$UDID" "$BUNDLE" 2>/dev/null || true
            sleep 1
            xcrun simctl launch "$UDID" "$BUNDLE" --screenshot-mode --screenshot-month 2026-10 --screenshot-page "$PAGE" --screenshot-zoom 2 --screenshot-offset "$OFFSET" $JA_ARGS
            sleep 8
            pgrep -fl "TegakiCalendar.app/TegakiCalendar" || echo "::warning::The app is not running after 8 s ($PAGE page, zoom 2; crashed?)"
            xcrun simctl io "$UDID" screenshot "shots/ipad13-portrait-$PAGE-zoom2.png"
          done
          xcrun simctl terminate "$UDID" "$BUNDLE" 2>/dev/null || true
          sleep 1
          xcrun simctl launch "$UDID" "$BUNDLE" --screenshot-mode --screenshot-month 2026-10 --screenshot-page month --screenshot-readonly $JA_ARGS
          sleep 8
          pgrep -fl "TegakiCalendar.app/TegakiCalendar" || echo "::warning::The app is not running after 8 s (month page, read only; crashed?)"
          xcrun simctl io "$UDID" screenshot "shots/ipad13-portrait-readonly.png"
          for SPEC in "toolbar-collapsed|--screenshot-page month --screenshot-toolbar collapsed" \
                      "toolbar-collapsed-right|--screenshot-page month --screenshot-toolbar collapsed-right" \
                      "tool-eraser|--screenshot-page month --screenshot-tool eraser" \
                      "month-memo|--screenshot-page month --screenshot-grown --screenshot-offset 0,1700" \
                      "day-extra|--screenshot-page day --screenshot-grown --screenshot-offset 0,2300" \
                      "pinch-hint|--screenshot-page month --screenshot-pinch-hint"; do
            SHOT="${SPEC%%|*}"; ARGS="${SPEC#*|}"
            xcrun simctl terminate "$UDID" "$BUNDLE" 2>/dev/null || true
            sleep 1
            # $ARGS (and $JA_ARGS) is split on purpose (the values have no spaces).
            xcrun simctl launch "$UDID" "$BUNDLE" --screenshot-mode --screenshot-month 2026-10 $ARGS $JA_ARGS
            sleep 8
            pgrep -fl "TegakiCalendar.app/TegakiCalendar" || echo "::warning::The app is not running after 8 s ($SHOT; crashed?)"
            xcrun simctl io "$UDID" screenshot "shots/ipad13-portrait-$SHOT.png"
          done
          ls -la shots

      # Since 1.1 (docs/M7A_CONTRACT.md §7.3) a ninth sheet, "info": the settings scrolled to 「情報」 with
      # the demo stroke counts (「いちばん線の多いページ」 and 「今年の年のページ」). Since 1.2 (docs/M7B_CONTRACT.md
      # §7.4, §10.7, §7.6) a tenth, "holidays" (the picker of the holidays), and an eleventh, "week-start" (the
      # settings with the question of switching the week start). ja-baseline.yml does not shoot these two.
      # (1.3: it does, its reference being 43fe366.)
      # 1.3 (docs/M7C_CONTRACT.md §10.5; docs/M7C.md, S3's J-4 and its hand-off to S5): the photo of a sheet is no
      # longer only the frame of a fixed 9 s after the launch. In run 43149906124 that frame of `--screenshot-sheet
      # holidays` held the settings still sliding in, not yet at their place (the picker opens from them 0.4 s after
      # they appear). The frame of 9 s is still taken, and kept once tools/shots/screen_ready.swift finds the screen
      # ready: still (at most 1 pixel in 2,000 differs strongly from a frame taken at 8 s), and unlike the screens shown
      # before it — the month page without a sheet (ipad13-portrait-month.png, the step above) for every sheet, and the
      # settings (ipad13-portrait-sheet-settings.png, taken before them in this loop) for the four opened from them
      # (sync, info, holidays, week-start). Otherwise the next frame, a second later, is compared with that one, up to
      # 30 s after the launch and at least twice (in run 43310108102 one frame took 25 s: the simulator was slow); then
      # the last frame stays, with a warning. Every comparison is one line. So no photo is taken earlier than before, and a
      # screen that has settled is photographed as before (each sheet of the runs 43136565762 and 43149906124 and of the
      # reference run 43158921131 differs from that month page by at least 47,648 pixels, the four from those settings by
      # at least 44,318; the same screen of two runs by 0). The same lines in ja-baseline.yml (J-4). If the tool does not
      # compile, every sheet is the frame of 9 s, with a warning.
      - name: Screenshots (13-inch iPad, portrait, 11 sheets on the month page)
        if: ${{ !cancelled() && steps.simudid.outcome == 'success' }}
        continue-on-error: true
        run: |
          set -euo pipefail
          UDID="${{ steps.simudid.outputs.udid }}"
          BUNDLE="com.syfan0.tegakicalendar"
          mkdir -p shots
          # 1.3: the wait for the screen (above), built from the commit that runs the workflow: in the background before
          # the boot when a step started that build (build.yml's "Build the sheets' screen check in the background"),
          # else here.
          READY="$RUNNER_TEMP/screen_ready"
          BACKGROUND="$RUNNER_TEMP/screen_ready.build"
          if [ -f "$BACKGROUND/pid" ]; then
            BUILD_WAIT=0
            while [ ! -f "$BACKGROUND/status" ] && kill -0 "$(cat "$BACKGROUND/pid")" 2>/dev/null && [ "$BUILD_WAIT" -lt 300 ]; do
              sleep 1
              BUILD_WAIT=$((BUILD_WAIT + 1))
            done
            if [ "$(cat "$BACKGROUND/status" 2>/dev/null || true)" = "0" ] && [ -x "$BACKGROUND/screen_ready" ]; then
              cp "$BACKGROUND/screen_ready" "$READY"
              echo "tools/shots/screen_ready.swift was built in the background (waited for it ${BUILD_WAIT} s here)."
            else
              echo "::warning::the background build of tools/shots/screen_ready.swift did not end well; it is built here."
              cat "$BACKGROUND/log" 2>/dev/null || true
            fi
          fi
          if [ ! -x "$READY" ] && ! swiftc -O "$GITHUB_WORKSPACE/tools/shots/screen_ready.swift" -o "$READY"; then
            echo "::warning::tools/shots/screen_ready.swift did not compile; every sheet is taken 9 s after its launch, as before 1.3."
            READY=""
          fi
          EARLIER="$RUNNER_TEMP/sheet-earlier.png"
          for SHEET in create edit lasso settings sync import paywall export info holidays week-start; do
            SHOT="shots/ipad13-portrait-sheet-$SHEET.png"
            UNLIKE="shots/ipad13-portrait-month.png"
            case "$SHEET" in
              sync|info|holidays|week-start) UNLIKE="$UNLIKE shots/ipad13-portrait-sheet-settings.png" ;;
            esac
            xcrun simctl terminate "$UDID" "$BUNDLE" 2>/dev/null || true
            sleep 1
            xcrun simctl launch "$UDID" "$BUNDLE" --screenshot-mode --screenshot-month 2026-10 --screenshot-page month --screenshot-sheet "$SHEET" $JA_ARGS
            LAUNCHED="$(date +%s)"
            rm -f "$EARLIER"
            sleep 8
            [ -z "$READY" ] || xcrun simctl io "$UDID" screenshot "$EARLIER" > /dev/null 2>&1 || true
            sleep 1
            pgrep -fl "TegakiCalendar.app/TegakiCalendar" || echo "::warning::The app is not running after 9 s (sheet $SHEET; crashed?)"
            xcrun simctl io "$UDID" screenshot "$SHOT"
            [ -n "$READY" ] || continue
            TRIES=0
            while :; do
              STATUS=0
              # $UNLIKE is split on purpose (paths without spaces).
              LINE="$("$READY" "$SHOT" "$EARLIER" $UNLIKE)" || STATUS=$?
              WAITED=$(( $(date +%s) - LAUNCHED ))
              echo "sheet $SHEET, ${WAITED} s after the launch: $LINE"
              [ "$STATUS" != 0 ] || break
              if [ "$STATUS" != 1 ] || { [ "$WAITED" -ge 30 ] && [ "$TRIES" -ge 2 ]; }; then
                echo "::warning::sheet $SHEET: the screen was not ready ${WAITED} s after the launch; its last frame is kept."
                break
              fi
              TRIES=$((TRIES + 1))
              cp "$SHOT" "$EARLIER"
              sleep 1
              if ! xcrun simctl io "$UDID" screenshot "$SHOT" > /dev/null 2>&1; then
                echo "::warning::sheet $SHEET: a later frame could not be taken, the one before is kept"
                cp "$EARLIER" "$SHOT"
                break
              fi
            done
          done
          ls -la shots

      # The 13-inch log is collected before the other devices boot (its 25 shots since 1.2 took 8.9 min in
      # CI-0; with the 2 min wait added after CI-0 that is about 11, so a 14 min window; each extra device
      # writes its own shots/<id>-log.txt below).
      - name: Collect the app log and crash reports (13-inch iPad)
        if: ${{ !cancelled() && steps.simudid.outcome == 'success' }}
        continue-on-error: true
        run: |
          set -uo pipefail
          UDID="${{ steps.simudid.outputs.udid }}"
          mkdir -p shots
          xcrun simctl terminate "$UDID" com.syfan0.tegakicalendar 2>/dev/null || true
          xcrun simctl spawn "$UDID" log show --last 14m --style compact \
            --predicate 'process == "TegakiCalendar" OR eventMessage CONTAINS "tegakicalendar" OR eventMessage CONTAINS "TegakiCalendar"' \
            > shots/app-log.txt 2>&1 || true
          find "$HOME/Library/Logs/DiagnosticReports" -name 'TegakiCalendar*' -mmin -15 -exec cp {} shots/ \; 2>/dev/null || true
          ls -la shots
          grep -c "" shots/app-log.txt || true
          # M4c (docs/M4C_CONTRACT.md §2.4): the canvas's first layout logs "zoom: kind=… pinch=%d
          # enabled=%d min max zoom fitAll ratio view overview" (DEBUG), a pinch "zoom: begin" /
          # "zoom: end …"; pinch=1 means PKCanvasView offers a pinch (F4). C copies the numbers into docs/M4C.md.
          grep 'zoom: ' shots/app-log.txt || true
          # M5 (docs/M5_CONTRACT.md §2.2, §7.7): LiveStoreClient logs "store: …" (DEBUG: environment,
          # product count, states). Screenshot mode uses the inert demo client, so 0 lines here is the
          # expected result; the grep is the reach check for a device log read the same way.
          grep 'store: ' shots/app-log.txt || true
          # 1.1 (docs/M7A_CONTRACT.md §2.2, §5.3, §7.3, §8 3): screenshot mode logs the window's safe area
          # and the paper area with the toolbar's state ("toolbar: safeArea=<top>,<left>,<bottom>,<right>",
          # "toolbar: paperArea=<w>x<h> mode=<expanded|collapsed|peek>"; docs/M7A.md compares a folded shot
          # with the expanded one of the same page), the settings' stroke count ("budget: largest=…") and
          # the tail-only path ("canvas: tail-only": 0 lines is fine, screenshot mode opens the grown paper
          # directly). Shown only; no count is expected.
          grep -E 'toolbar: (safeArea|paperArea)=|budget: largest=|canvas: tail-only' shots/app-log.txt || true

      # 1.2 (docs/M7B_CONTRACT.md §5.3, §2.5): the language, the locale and the holidays the screen chose,
      # how long the holidays took to load (`l10n: holidays loaded <ms> ms`; about 50 ms is the aim) and
      # any key the app did not find (`l10n: missing <key>`). Shown only; the lead copies them to docs/M7B.md.
      - name: The app's l10n lines (13-inch iPad)
        if: ${{ !cancelled() && steps.simudid.outcome == 'success' }}
        continue-on-error: true
        run: |
          set -uo pipefail
          grep 'l10n: ' shots/app-log.txt | awk '{ i = index($0, "l10n: "); if (i > 1) $0 = substr($0, i); if (!seen[$0]++) print }' || true

      # The four other device classes (docs/M4B_CONTRACT.md §6.3), booted one at a time and shut
      # down afterwards: iphone (iPhone 17, 402 pt), iphone69 (iPhone 17 Pro Max, 440 pt; since M6,
      # docs/M6_CONTRACT.md 0-15 / M6-2: the 6.9-inch App Store shots, 1320×2868 — the prefix fallbacks
      # are iPhone 17 Pro Max, iPhone 17 Pro, iPhone 16 Pro Max in that order; on "iPhone 17 Pro" the
      # pixels are 6.3-inch and the store step below warns), ipadmini (iPad mini (A17 Pro), 744 pt) and
      # ipad11 (iPad Pro 11-inch (M5), 834 pt), 4 portrait pages each as <id>-portrait-<page>.png.
      # Since M6 the iPhone and the 6.9-inch iPhone also shoot the paywall sheet over the month page
      # (docs/M6_CONTRACT.md §4.2: store/iphone/05-paywall.jpg and store/iphone69/05-paywall.jpg).
      # Since M5 (docs/M5_CONTRACT.md §7.5) the 11-inch iPad also shoots the day page in read-only mode
      # (the longest title next to the symbol-only badge: 834 < 980, M5-32) and the iPhone the week in
      # read-only mode (no badge in the two-row header; the notice row 「閲覧専用です。…」 + 「購読する」).
      # The iPhone also shoots the week of 2026-06 (6/7 is a Sunday: the paper starts at the right
      # edge, M4B-3; since M4c the overview shows the whole week, and the same week is shot again as
      # -week-jun for the "6/1" heading of the narrow column, M4C-28), the week at three times its
      # overview ("--screenshot-zoom 3 --screenshot-offset 300,700", docs/M4C_CONTRACT.md §6) and
      # tries the 4 pages in landscape ("--screenshot-landscape", §6.4; the file is still written when
      # the request was ignored, the header then stays two rows). Every shot is best effort; a
      # missing simulator or a failed boot only skips that device. The 13-inch simulator is shut down
      # first to leave the runner's memory to the next one. Since M6 (docs/M6.md §5.1) every device
      # waits 40 s after its boot with the app in front before the first shot and shoots its four pages
      # again at the end: a freshly booted iOS 26 simulator posts a system banner once, 15–35 s after
      # the boot, and two runs caught it on an App Store source (see the step body).
      - name: Screenshots (iPhone, 6.9-inch iPhone, iPad mini, 11-inch iPad; portrait, 4 pages each)
        if: ${{ !cancelled() && steps.simudid.outcome == 'success' }}
        continue-on-error: true
        run: |
          set -euo pipefail
          PRIMARY="${{ steps.simudid.outputs.udid }}"
          APP="$(find build/DerivedData -name "TegakiCalendar.app" -path "*iphonesimulator*" -not -path "*/Index.noindex/*" | head -1)"
          BUNDLE="com.syfan0.tegakicalendar"
          if [ -z "$APP" ]; then
            echo "::warning::TegakiCalendar.app not found under build/DerivedData; skipping the extra devices."
            exit 0
          fi
          mkdir -p shots
          # J-4 (docs/M7B_CONTRACT.md §1.3, §7.5): the Xcode and the simulator runtimes the photos were drawn
          # with. build.yml and ja-baseline.yml write the same lines (keep them the same), so a `diff` of the
          # two env.txt tells whether two runs drew with the same Xcode and runtimes. No UDIDs (they differ
          # from one runner image to the next).
          sim_env() {  # sim_env <device id> <udid>: "<id>: <device name> | <runtime name> (<runtime build>)"
            xcrun simctl list -j | SIM_ID="$1" SIM_UDID="$2" python3 -I -c '
          import json, os, sys
          data = json.load(sys.stdin)
          runtimes = {r.get("identifier"): r for r in data.get("runtimes", [])}
          for runtime, items in data.get("devices", {}).items():
              for d in items:
                  if d.get("udid") == os.environ["SIM_UDID"]:
                      r = runtimes.get(runtime, {})
                      print("%s: %s | %s (%s)" % (os.environ["SIM_ID"], d.get("name"), r.get("name", runtime), r.get("buildversion", "?")))
                      raise SystemExit
          print("%s: (no simulator %s)" % (os.environ["SIM_ID"], os.environ["SIM_UDID"]))
          '
          }
          xcrun simctl shutdown "$PRIMARY" || true
          # device-id | exact first choice | prefix fallbacks (in order)
          for SPEC in "iphone|iPhone 17|iPhone 17,iPhone" \
                      "iphone69|iPhone 17 Pro Max|iPhone 17 Pro Max,iPhone 17 Pro,iPhone 16 Pro Max" \
                      "ipadmini|iPad mini (A17 Pro)|iPad mini" \
                      "ipad11|iPad Pro 11-inch (M5)|iPad Pro 11,iPad Air 11,iPad (A"; do
            ID="${SPEC%%|*}"; REST="${SPEC#*|}"; EXACT="${REST%%|*}"; PREFIXES="${REST#*|}"
            FOUND="$(xcrun simctl list -j devices available | SIM_EXACT="$EXACT" SIM_PREFIXES="$PREFIXES" SIM_PRIMARY="$PRIMARY" python3 -c '
          import json, os, re, sys
          devices = json.load(sys.stdin).get("devices", {})
          def version(runtime):                                  # "…iOS-26-5" → (26, 5)
              m = re.search(r"iOS-(\d+)-(\d+)", runtime)
              return (int(m.group(1)), int(m.group(2))) if m else (0, 0)
          primary_runtime = next((r for r, items in devices.items() for d in items if d.get("udid") == os.environ["SIM_PRIMARY"]), None)
          found = {}                                             # name → (udid, key): same runtime as the 13-inch > newer iOS
          for runtime, items in devices.items():
              if "iOS" not in runtime:
                  continue
              for d in items:
                  if not (d.get("isAvailable") and d.get("name") and d.get("udid")):
                      continue
                  key = (runtime == primary_runtime, version(runtime))
                  if d["name"] not in found or key > found[d["name"]][1]:
                      found[d["name"]] = (d["udid"], key)
          exact = os.environ["SIM_EXACT"]
          if exact in found:
              print(exact + "|" + found[exact][0])
              raise SystemExit
          for prefix in os.environ["SIM_PREFIXES"].split(","):
              for name in sorted(found):
                  if name.startswith(prefix):
                      print(name + "|" + found[name][0])
                      raise SystemExit
          print("")
          ' || true)"
            if [ -z "$FOUND" ]; then echo "::warning::No simulator for $ID; skipping."; continue; fi
            NAME="${FOUND%%|*}"; UDID="${FOUND##*|}"
            echo "$ID: $NAME ($UDID)"
            sim_env "$ID" "$UDID" >> shots/env.txt || echo "::warning::no runtime line for $ID"
            xcrun simctl boot "$UDID" || true
            xcrun simctl bootstatus "$UDID" -b || { echo "::warning::$ID ($NAME) did not boot; skipping."; continue; }
            xcrun simctl ui "$UDID" appearance light || true
            xcrun simctl status_bar "$UDID" override --time "9:41" --batteryState charged --batteryLevel 100 --wifiBars 3 || true
            if ! xcrun simctl install "$UDID" "$APP"; then
              echo "::warning::install failed on $ID; skipping."
              [ "$UDID" = "$PRIMARY" ] || xcrun simctl shutdown "$UDID" || true
              continue
            fi
            shoot() {  # shoot <file> <launch args…>: one shot; a failure only loses this one file (never stops the step)
              local FILE="$1"; shift
              xcrun simctl terminate "$UDID" "$BUNDLE" 2>/dev/null || true
              sleep 1
              xcrun simctl launch "$UDID" "$BUNDLE" --screenshot-mode "$@" $JA_ARGS || { echo "::warning::launch failed ($FILE)"; return 0; }
              sleep 9
              # `grep` without -q reads the whole list (docs/M7C.md, S1 の残り, decision 8): with -q it stops at the first match,
              # simctl, still writing the list, gets SIGPIPE, and pipefail makes the pipeline fail although the app is in
              # the list (a false warning in 0–9 of build.yml's photos and 5–14 of l10n-shots' in the runs of 11/11–12;
              # none in span-shots, which reads the whole list). An app not in the list, or no list, still warns.
              xcrun simctl spawn "$UDID" launchctl list 2>/dev/null | grep tegakicalendar > /dev/null || echo "::warning::The app is not running after 9 s ($FILE)"
              xcrun simctl io "$UDID" screenshot "shots/$FILE" || echo "::warning::screenshot failed ($FILE)"
            }
            # M6 (docs/M6.md §5.1): a freshly booted iOS 26 simulator posts a system banner once, 15–35 s
            # after the boot ("Ready for Apple Intelligence" — run 39034481760 caught it on
            # iphone-portrait-week.png, run 39031277533 on ipad11-portrait-day.png, both App Store
            # sources). Wait that window out with the app in front before the first shot (settle) …
            xcrun simctl launch "$UDID" "$BUNDLE" --screenshot-mode --screenshot-month 2026-10 --screenshot-page month $JA_ARGS || true
            sleep 40
            xcrun simctl terminate "$UDID" "$BUNDLE" 2>/dev/null || true
            for PAGE in month week day year; do
              shoot "$ID-portrait-$PAGE.png" --screenshot-month 2026-10 --screenshot-page "$PAGE"
            done
            if [ "$ID" = "ipad11" ]; then
              # M5-32: the day page's title 「2026年10月7日(水)」 must stay on one line next to the lock-only badge.
              shoot "$ID-portrait-readonly.png" --screenshot-month 2026-10 --screenshot-page day --screenshot-readonly
            fi
            if [ "$ID" = "iphone" ]; then
              # M5-13: compact width → no badge, the notice row under the header instead.
              shoot "$ID-portrait-readonly.png" --screenshot-month 2026-10 --screenshot-page week --screenshot-readonly
            fi
            if [ "$ID" = "iphone" ] || [ "$ID" = "iphone69" ]; then
              # M6 (docs/M6_CONTRACT.md §4.2, §7.4): the full-height paywall sheet (.large detent) over the
              # month page — the App Store shot 05-paywall of both iPhone classes.
              shoot "$ID-portrait-sheet-paywall.png" --screenshot-month 2026-10 --screenshot-page month --screenshot-sheet paywall
            fi
            # … and shoot the four pages (the store/ sources) once more now, 1.5–2 min after the boot, so
            # a banner that still slipped into a first take is not in the file that is kept (retake).
            for PAGE in month week day year; do
              shoot "$ID-portrait-$PAGE.png" --screenshot-month 2026-10 --screenshot-page "$PAGE"
            done
            if [ "$ID" = "iphone" ]; then
              # 1.1 (docs/M7A_CONTRACT.md §7.4, §8 6): the folded toolbar (the dock button above the home
              # indicator), the grown month memo and the day's free memo below 24:00 at their strokes,
              # the one-time pinch hint (1.1.1), and (below, with the landscape shots) the folded toolbar
              # in landscape.
              shoot "$ID-portrait-toolbar-collapsed.png" --screenshot-month 2026-10 --screenshot-page month --screenshot-toolbar collapsed
              shoot "$ID-portrait-month-memo.png" --screenshot-month 2026-10 --screenshot-page month --screenshot-grown --screenshot-offset 0,1700
              shoot "$ID-portrait-day-extra.png" --screenshot-month 2026-10 --screenshot-page day --screenshot-grown --screenshot-offset 0,2300
              shoot "$ID-portrait-pinch-hint.png" --screenshot-month 2026-10 --screenshot-page month --screenshot-pinch-hint
              # M4B-3 / M4B-27: 6/7 is a Sunday → the 「今日」 column is the last one → the paper starts
              # at the right edge and the time labels are off screen.
              shoot "$ID-portrait-week-sun.png" --screenshot-month 2026-06 --screenshot-page week
              # M4c: the week at 3 × fitAll (0.8613: Tue–Thu from 8:45, the text at its minPoints) and
              # the week of 6/1–6/7 (M4C-28: the first heading is "6/1" without its weekday).
              shoot "$ID-portrait-week-zoom3.png" --screenshot-month 2026-10 --screenshot-page week --screenshot-zoom 3 --screenshot-offset 300,700
              shoot "$ID-portrait-week-jun.png" --screenshot-month 2026-06 --screenshot-page week
              for PAGE in month week day year; do        # §6.4: only the iPhone can turn
                shoot "$ID-landscape-$PAGE.png" --screenshot-month 2026-10 --screenshot-page "$PAGE" --screenshot-landscape
              done
              shoot "$ID-landscape-month-toolbar-collapsed.png" --screenshot-month 2026-10 --screenshot-page month --screenshot-toolbar collapsed --screenshot-landscape
              # The simulator's framebuffer stays portrait (only the app's interface turned), so the
              # landscape shots come out rotated by 90°; stand them up. When the request was ignored
              # (header still two rows) they end up sideways instead, which is the tell.
              for f in shots/"$ID"-landscape-*.png; do
                [ -f "$f" ] && { sips -r 270 "$f" > /dev/null || echo "::warning::could not rotate $f"; }
              done
            fi
            xcrun simctl terminate "$UDID" "$BUNDLE" 2>/dev/null || true
            # 1.1: 6 → 8 min (the iPhone takes about 21 shots now, plus the 40 s wait).
            xcrun simctl spawn "$UDID" log show --last 8m --style compact --predicate 'process == "TegakiCalendar"' > "shots/$ID-log.txt" 2>&1 || true
            grep 'zoom: ' "shots/$ID-log.txt" || true     # M4c: the canvas's zoom lines of this device
            grep 'store: ' "shots/$ID-log.txt" || true    # M5: the store's lines (0 in screenshot mode, see above)
            grep -E 'toolbar: (safeArea|paperArea)=|budget: largest=|canvas: tail-only' "shots/$ID-log.txt" || true   # 1.1 (see the 13-inch log)
            [ "$UDID" = "$PRIMARY" ] || xcrun simctl shutdown "$UDID" || true
          done
          ls -la shots

      # 1.0.1 (docs/R1_0_1.md §5.1): the UI test of the fix on the iPhone picked and built above
      # (`test-without-building`: nothing is compiled this late). YearTapUITests launches the app in
      # screenshot mode on the year page and taps the middle of 3/16 with a real (simulated finger) tap
      # or double tap — 「指でも書く」 on and off, portrait and landscape — and expects the day page. It
      # runs after the screenshots, so their devices start exactly as before (the shots are compared
      # pixel by pixel with 1.0's), and it fails the job when a test fails. The log and the screenshots
      # the test keeps (before / after each tap) go to shots/ui-tests/. 1.1 fix (docs/M7A.md ずれ 46・47):
      # EraserAndBelowDayUITests (8 tests: the toolbar's eraser goes back to the pen, nothing below 24:00
      # becomes an event) runs here too; its steps are the `eraser-memo UI:` lines. The lead's review: the
      # step stops after 25 minutes (normally about 7: the boot, the 60 s wait, YearTapUITests 97 s in
      # run 41164839330 and about 3–4 min for the 8; an overloaded simulator stretches every wait of the
      # tests, each of which is bounded). 1.1.1 (docs/R1_1_1.md): HeaderAndPaperUITests (3 tests, about a
      # minute: where 「今日」 sits and that it works, an empty page at the top of the real paper area);
      # its steps are the `header-paper UI:` lines. 1.2 (docs/M7B_CONTRACT.md §7.3, §10.8): LanguageUITests
      # (3.8 min in CI-0 for 29 launches of about 8 s, now 30; which language iOS chooses and, in German, that the purchase
      # sheet reaches its links, its steps are the `l10n UI:` lines) and WeekStartUITests (the `week-start UI:` lines) run here too; the xcodebuild of the
      # step took 10.2 min in CI-0 (1.1.1's whole step took 11.9 in run 41922318959) and the step stops after 40. The tests pass their own language in their launch arguments.
      # 1.3 (docs/M7C_CONTRACT.md §10.3, §10.6): the joined pages' UI tests (SpanUITests, and the old UI tests again with
      # the joined pages on in SpanRerunUITests) mark their steps `span UI:`; the grep shows them once they exist.
      - name: UI tests on an iPhone (the year page's tap, 1.0.1)
        if: env.QUICK != 'true'
        timeout-minutes: 40
        run: |
          set -euo pipefail
          UDID="${{ steps.uibuild.outputs.udid }}"
          echo "UI tests on: ${{ steps.uibuild.outputs.name }} ($UDID)"
          # A freshly booted simulator stays busy for a while (and posts a system banner 15–35 s after
          # the boot, docs/M6.md §5.1). In run 41172398011 the last UI test met that load (5–10 s per
          # query) and its tap never reached the app. Boot first and let it settle.
          xcrun simctl boot "$UDID" 2>/dev/null || true
          xcrun simctl bootstatus "$UDID" -b
          sleep 60
          mkdir -p shots/ui-tests
          rm -rf build/ui-tests.xcresult
          xcodebuild \
            -project TegakiCalendar.xcodeproj \
            -scheme TegakiCalendar \
            -configuration Debug \
            -destination "platform=iOS Simulator,id=$UDID" \
            -derivedDataPath build/UITestData \
            -resultBundlePath build/ui-tests.xcresult \
            -only-testing:TegakiCalendarUITests \
            test-without-building 2>&1 | tee shots/ui-tests/ui-tests.log
          grep -E 'year-tap UI:|eraser-memo UI:|header-paper UI:|l10n UI:|week-start UI:|span UI:|Test Case .*(passed|failed|skipped)' shots/ui-tests/ui-tests.log || true

      # The screenshots YearTapUITests kept (best effort, also after a failure).
      - name: Export the UI test's screenshots
        if: ${{ always() && env.QUICK != 'true' }}
        continue-on-error: true
        run: |
          set -uo pipefail
          if [ -d build/ui-tests.xcresult ]; then
            mkdir -p shots/ui-tests/attachments
            xcrun xcresulttool export attachments --path build/ui-tests.xcresult --output-path shots/ui-tests/attachments || echo "::warning::xcresulttool could not export the attachments"
            ls -la shots/ui-tests/attachments || true
          else
            echo "No UI test result bundle."
          fi

      # M6 (docs/M6_CONTRACT.md §4.1, §4.2, §7.4): the App Store listing set. The shots of §4.2 are
      # converted to JPEG (no alpha: `simctl io screenshot` PNGs are usually opaque but that is not
      # guaranteed, and Apple rejects alpha) under shots/store/<device>/NN-<name>.jpg, and each file's
      # pixel size is compared with Apple's accepted portrait sizes for that device class (help page
      # "Screenshot specifications", read 2026-10-17): iPad 13-inch 2064×2752 or 2048×2732, iPhone
      # Dynamic Island (medium) 1206×2622 or 1179×2556, iPhone Dynamic Island (large) 1320×2868 /
      # 1290×2796 / 1260×2736, iPad 11-inch 1668×2420 / 1668×2388 / 1640×2360 / 1488×2266. A size
      # outside its set is a ::warning (a run that fell back to "iPad Air 13-inch" gives 2048×2732 and
      # passes; one that fell back to "iPhone 17 Pro" for iphone69 gives 1206×2622 and warns). The
      # numbers are the provisional listing order (§4.2 — the lead may reorder at §8-5). Always runs,
      # never fails the job; a missing source only skips that one file.
      - name: Store listing set (JPEG, App Store sizes)
        if: ${{ always() && env.QUICK != 'true' }}
        continue-on-error: true
        run: |
          set -uo pipefail
          mkdir -p shots/store/ipad13 shots/store/iphone shots/store/iphone69 shots/store/ipad11
          accepted() {  # accepted <device>: Apple's accepted portrait pixel sizes (docs/M6_CONTRACT.md §4.1)
            case "$1" in
              ipad13)   echo "2064x2752 2048x2732" ;;
              iphone)   echo "1206x2622 1179x2556" ;;
              iphone69) echo "1320x2868 1290x2796 1260x2736" ;;
              ipad11)   echo "1668x2420 1668x2388 1640x2360 1488x2266" ;;
              *)        echo "" ;;
            esac
          }
          store() {  # store <device> <NN-name> <source shot without .png>: convert, then check the size
            local DEV="$1" NAME="$2" SRC="shots/$3.png" OUT="shots/store/$1/$2.jpg" W H SIZE
            if [ ! -f "$SRC" ]; then echo "::warning::store/$DEV/$NAME.jpg: source $SRC is missing; skipped."; return 0; fi
            if ! sips -s format jpeg -s formatOptions 100 "$SRC" --out "$OUT" > /dev/null; then echo "::warning::store/$DEV/$NAME.jpg: sips could not convert $SRC."; return 0; fi
            W="$(sips -g pixelWidth "$OUT" | awk '/pixelWidth/ {print $2}')"
            H="$(sips -g pixelHeight "$OUT" | awk '/pixelHeight/ {print $2}')"
            SIZE="${W}x${H}"
            case " $(accepted "$DEV") " in
              *" $SIZE "*) echo "store/$DEV/$NAME.jpg: ${SIZE} (accepted for $DEV)" ;;
              *) echo "::warning::store/$DEV/$NAME.jpg is ${SIZE}, not one of the accepted sizes for $DEV ($(accepted "$DEV"))." ;;
            esac
          }
          store ipad13   01-month    ipad13-portrait-month
          store ipad13   02-week     ipad13-portrait-week
          store ipad13   03-day      ipad13-portrait-day
          store ipad13   04-year     ipad13-portrait-year
          store ipad13   05-paywall  ipad13-portrait-sheet-paywall
          store ipad13   06-settings ipad13-portrait-sheet-settings
          store iphone   01-week     iphone-portrait-week
          store iphone   02-month    iphone-portrait-month
          store iphone   03-day      iphone-portrait-day
          store iphone   04-year     iphone-portrait-year
          store iphone   05-paywall  iphone-portrait-sheet-paywall
          store iphone69 01-week     iphone69-portrait-week
          store iphone69 02-month    iphone69-portrait-month
          store iphone69 03-day      iphone69-portrait-day
          store iphone69 04-year     iphone69-portrait-year
          store iphone69 05-paywall  iphone69-portrait-sheet-paywall
          store ipad11   01-month    ipad11-portrait-month
          store ipad11   02-week     ipad11-portrait-week
          store ipad11   03-day      ipad11-portrait-day
          store ipad11   04-year     ipad11-portrait-year
          ls -la shots/store/*

      - name: Upload screenshots
        if: ${{ always() && env.QUICK != 'true' }}
        uses: actions/upload-artifact@v4
        with:
          name: screenshots
          path: shots
          retention-days: 7
          if-no-files-found: warn

  # 1.1 (docs/M7A_CONTRACT.md §1.4, §7.4, §8 2; K-7 of docs/M7_PLAN.md §1.3): the compatibility checks
  # on the REAL 1.0. A 1.0 / 1.0.1 device and a 1.1 device share one iCloud, so the 1.1 fixtures
  # (TegakiKit/Tests/Fixtures/compat11: K's pages, the ledger's and the screenshot mode's) are read by
  # the code of commit a21e4692109e504701b507ad9c695181fdecddfd (1.0, checked out at v10 by SHA — there
  # is no tag, M7A-8): ② the frozen copy (TegakiKit/Tests/Compat10) is checked against the files and
  # line ranges it was made from, and against what tools/compat10/freeze.py makes from them; ③ K's
  # large fixtures are made again and the committed digests.json must come out byte for byte; ④⑤
  # tools/compat10/run.sh runs Compat10Checks on 1.0's real TegakiKit (RunReal) and on the frozen copy
  # (RunFrozen) — the same N, 0 failed, N ≥ tools/compat10/EXPECTED_MIN; ⑥ 1.0's app ledger and sync
  # engine run tools/compat10/AppTests/Real10LedgerTests.swift on the simulator (only that class).
  # Runs next to the build job (no `needs`). The job id has no dot (GitHub allows only letters, digits,
  # `-` and `_`); its name is the contract's "compat-v1.0".
  # 1.3 (docs/M7C_CONTRACT.md §6.3, §10.4): the compat-span fixtures (TegakiKit/Tests/Fixtures/compat-span, what
  # the joined pages write) are read by the real old versions too: the files of shape "monday" in its MANIFEST
  # are copied into the compat11 folder (so ④⑤ and ⑥ read them; tools/compat10 is not touched) and checked to
  # be there; tools/span-compat's Probe reads every file (Monday and Sunday) on the real 1.0 (v10), <1.1.1> (v11)
  # and 1.2.3 (v123: commit 43fe366, taken out with `git archive`); and 1.2.3's app runs
  # tools/span-compat/AppTests/Real123LedgerTests.swift (its ledger and sync engine) on every file. Fixture 4 (the
  # week memo) comes with the week memo stage (§5): its MANIFEST row then needs its counts in tools/span-compat.
  # The limit (§10.4: 45 → 65 min for the 1.2.3 Kit and app, back to 45 when the measured times leave room; docs/M7C.md,
  # S1 の残り, decision 7): 45 again. With 1.3's steps the job took 8.8–16.7 min in the 14 runs of 11/11–12 that ran
  # them to the end (runs 43065300839 to 43237335436; the median 13.7), its two app test steps 2.9–7.2 (1.0's) and
  # 3.2–6.8 (1.2.3's), the other steps at most 1.6 each. The slowest time of every step added up is 18.8 min, and with
  # two boots 4 min slower (as seen in the other jobs) about 27. 45 is the limit of the job before 1.3 (8 min then).
  compat-v1-0:
    name: compat-v1.0
    # 1.3 (docs/M7C_CONTRACT.md §10.6): not on r13-quick (the fast path runs the first job only).
    if: ${{ !(github.ref_name == 'r13-quick' || startsWith(github.ref_name, 'r13-q-')) }}
    runs-on: macos-26
    timeout-minutes: 45
    env:
      HOMEBREW_NO_AUTO_UPDATE: "1"
      HOMEBREW_NO_INSTALL_CLEANUP: "1"
      NSUnbufferedIO: "YES"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Must be the repository root's v10: tools/compat10/Package.swift uses ../../v10/TegakiKit.
      - name: Check out 1.0 (a21e469) at v10
        uses: actions/checkout@v4
        with:
          ref: a21e4692109e504701b507ad9c695181fdecddfd
          path: v10

      - name: Select Xcode
        run: |
          set -euo pipefail
          if [ -d /Applications/Xcode_26.6.app ]; then
            sudo xcode-select -s /Applications/Xcode_26.6.app
          fi
          xcode-select -p
          xcodebuild -version
          git -C v10 log -1 --format='v10: %H %s'

      # ② ORIGIN.sha256 (18 whole files of 1.0), ORIGIN.ranges (28 line ranges copied in part or
      # transcribed by LedgerV10 / LayoutFactsV10), FROZEN.sha256 (11 files), and the copy made again
      # from v10 by freeze.py must equal the committed one byte for byte.
      - name: The frozen copy against 1.0
        run: |
          set -euo pipefail
          (cd v10 && shasum -a 256 -c ../TegakiKit/Tests/Compat10/ORIGIN.sha256)
          tools/compat10/check-origin.sh v10
          python3 -I tools/compat10/freeze.py --check --from-dir v10

      # ③ K's large fixtures (y-2026.*, not committed) are made again next to a copy of the committed
      # ones; the committed files (K's pages, digests.json, and the ledger's / screenshot mode's once
      # committed) must come out unchanged.
      - name: The fixtures (K's large ones made again)
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/compat11"
          cp TegakiKit/Tests/Fixtures/compat11/*.json "$RUNNER_TEMP/compat11/"
          swift run --package-path TegakiKit KitChecks --write-compat-fixtures --out "$RUNNER_TEMP/compat11"
          for f in TegakiKit/Tests/Fixtures/compat11/*.json; do
            cmp "$f" "$RUNNER_TEMP/compat11/$(basename "$f")"
          done
          ls -la "$RUNNER_TEMP/compat11"

      # 1.3 (docs/M7C_CONTRACT.md §6.3, §10.4): the compat-span files of shape "monday" (MANIFEST: "<file>
      # <fixture> <monday|sunday>" after the "#" lines) go into the same folder, so RunReal, RunFrozen and
      # Real10LedgerTests read them with K's (Compat10Checks reads every *.json of the folder). The Sunday-start
      # week stays out: Real10LedgerTests lays every w- page out as a Monday week; tools/span-compat reads it.
      # Fails unless every Monday row is in the folder byte for byte and no Sunday row is.
      - name: The compat-span fixtures of the Monday shape into the compat11 folder (1.3)
        run: |
          set -euo pipefail
          SRC=TegakiKit/Tests/Fixtures/compat-span
          DEST="$RUNNER_TEMP/compat11"
          MONDAY=0
          SUNDAY=0
          while read -r FILE FIXTURE SHAPE REST; do
            case "$FILE" in ''|'#'*) continue ;; esac
            if [ -n "${REST:-}" ] || [ -z "${FIXTURE:-}" ]; then echo "::error::compat-span/MANIFEST: \"$FILE $FIXTURE $SHAPE $REST\" is not <file> <fixture> <shape>"; exit 1; fi
            case "$SHAPE" in
              monday) cp "$SRC/$FILE" "$DEST/$FILE"; MONDAY=$((MONDAY + 1)) ;;
              sunday) SUNDAY=$((SUNDAY + 1)) ;;
              *) echo "::error::compat-span/MANIFEST: $FILE has the shape \"$SHAPE\" (monday or sunday)"; exit 1 ;;
            esac
          done < "$SRC/MANIFEST"
          FAILED=0
          while read -r FILE FIXTURE SHAPE REST; do
            case "$FILE" in ''|'#'*) continue ;; esac
            if [ "$SHAPE" = monday ]; then
              cmp "$SRC/$FILE" "$DEST/$FILE" || { echo "::error::$FILE (fixture $FIXTURE, monday) is not in the compat11 folder"; FAILED=1; }
            elif [ -e "$DEST/$FILE" ]; then
              echo "::error::$FILE (fixture $FIXTURE, sunday) must not be in the compat11 folder"; FAILED=1
            fi
          done < "$SRC/MANIFEST"
          echo "compat-span: $MONDAY files of shape monday copied into the compat11 folder ($SUNDAY of shape sunday left out)"
          ls -la "$DEST"
          exit "$FAILED"

      # ④⑤ The copies into tools/compat10 (ignored by git), RunReal and RunFrozen, the comparison. Since 1.3 the
      # folder holds the Monday compat-span files too; the output is also kept in $RUNNER_TEMP/compat10-run.log.
      - name: The checks on the real 1.0 and on the frozen copy
        run: |
          set -euo pipefail
          tools/compat10/run.sh "$RUNNER_TEMP/compat11" 2>&1 | tee "$RUNNER_TEMP/compat10-run.log"

      # 1.3 (docs/M7C_CONTRACT.md §6.3, §10.4): the real 1.0 read the Monday compat-span files: run.sh's `real N=`
      # is at least tools/compat-span/EXPECTED_MIN, 565 = 1.2.3's 361 + the 12 Monday files × 17 checks (measured
      # in run 43065300839; RunFrozen gave the same). tools/compat10/EXPECTED_MIN (225) is not touched. A Monday
      # fixture added later raises the number: count again from the next run's `real N=`.
      - name: The real 1.0 read the compat-span fixtures (1.3)
        run: |
          set -euo pipefail
          MIN="$(tr -d '[:space:]' < tools/compat-span/EXPECTED_MIN)"
          REAL_N="$(sed -nE 's/^compat-v1\.0: real N=([0-9]+) .*/\1/p' "$RUNNER_TEMP/compat10-run.log" | tail -1)"
          echo "compat-span: real N=${REAL_N:-?}, tools/compat-span/EXPECTED_MIN=$MIN"
          if ! printf '%s' "$MIN" | grep -Eq '^[0-9]+$'; then
            echo "::error::tools/compat-span/EXPECTED_MIN must hold one number."
            exit 1
          fi
          if [ -z "$REAL_N" ] || [ "$REAL_N" -lt "$MIN" ]; then
            echo "::error::the real 1.0 ran ${REAL_N:-no} checks, fewer than tools/compat-span/EXPECTED_MIN ($MIN): a compat-span file of the Monday shape did not reach it."
            exit 1
          fi

      # 1.2 (docs/M7B_CONTRACT.md K-11, §7.5, §10.8): the REAL old versions read what 1.2 writes (a week
      # page that starts on a Sunday, a month page written in the Sunday order) and neither lose nor move
      # anything: tools/weekstart-compat on 1.0 (v10 above) and on the commit in
      # tools/l10n/ja-baseline-ref.txt (<1.1.1> of §1.5). tools/compat10 is not touched. A failure prints FAIL
      # lines and exits 1 (tools/weekstart-compat/README.md).
      - name: Read the <1.1.1> commit
        id: ref111
        run: |
          set -euo pipefail
          REF="$(tr -d '[:space:]' < tools/l10n/ja-baseline-ref.txt)"
          if ! printf '%s' "$REF" | grep -Eq '^[0-9a-f]{40}$'; then
            echo "::error::tools/l10n/ja-baseline-ref.txt must hold one full commit sha."
            exit 1
          fi
          echo "sha=$REF" >> "$GITHUB_OUTPUT"

      - name: Check out <1.1.1> at v11
        uses: actions/checkout@v4
        with:
          ref: ${{ steps.ref111.outputs.sha }}
          path: v11

      - name: The week start on the real 1.0 and the real <1.1.1>
        run: |
          set -euo pipefail
          git -C v11 log -1 --format='v11: %H %s'
          cp -R tools/weekstart-compat/v10/run v10/run
          swift run --package-path v10/run Probe
          cp -R tools/weekstart-compat/v11/run v11/run
          swift run --package-path v11/run Probe

      # 1.3 (docs/M7C_CONTRACT.md §6.3, §10.4): 1.2.3, the version on sale when 1.3 starts, taken out of git (the
      # checkout above is only one commit deep, so its commit is fetched first): its TegakiKit at v123 for
      # tools/span-compat, and its whole tree at v123app for its app's ledger test below.
      - name: Take out 1.2.3 (43fe366) at v123 and v123app
        run: |
          set -euo pipefail
          SHA=43fe36666a2120e8a23adf4fc76244151a395e6f
          git fetch --no-tags --depth=1 origin "$SHA"
          git log -1 --format='v123: %H %s' "$SHA"
          mkdir -p v123 v123app
          git archive "$SHA" TegakiKit | tar -x -C v123
          git archive "$SHA" | tar -x -C v123app
          ls v123/TegakiKit v123app

      # 1.3 (§6.3): every compat-span file (Monday and Sunday) on the real 1.0, <1.1.1> and 1.2.3 Kits: what each
      # reads and writes back, what its layout draws and its lasso reaches, its migration, merge, erase and own
      # edit, the app export's round trip (tools/span-compat/README.md). All three run; any FAIL fails the step.
      - name: The compat-span fixtures on the real 1.0, <1.1.1> and 1.2.3 (span-compat)
        run: |
          set -euo pipefail
          FAILED=0
          for V in v10 v11 v123; do
            tools/span-compat/run.sh "$V" "$V/TegakiKit" "$RUNNER_TEMP/span-compat" || FAILED=1
          done
          exit "$FAILED"

      - name: Install XcodeGen
        run: |
          set -euo pipefail
          brew install xcodegen
          xcodegen --version

      # ⑥ 1.0's app (v10, its own project.yml) with Real10LedgerTests.swift added to its unit tests, on
      # the same 13-inch iPad the build job picks; only that class runs.
      - name: 1.0's ledger and sync on the fixtures (Real10LedgerTests)
        run: |
          set -euo pipefail
          cp tools/compat10/AppTests/Real10LedgerTests.swift v10/Tests/TegakiCalendarTests/
          (cd v10 && xcodegen generate)
          NAME="$(xcrun simctl list -j devices available | python3 -c '
          import json, sys
          devices = json.load(sys.stdin).get("devices", {})
          names = set()
          for runtime, items in devices.items():
              if "iOS" not in runtime:
                  continue
              for d in items:
                  if d.get("isAvailable") and d.get("name"):
                      names.add(d["name"])
          for prefix in ("iPad Pro 13-inch", "iPad Air 13-inch", "iPad", "iPhone"):
              matches = sorted(n for n in names if n.startswith(prefix))
              if matches:
                  print(matches[0])
                  raise SystemExit
          print("")
          ' || true)"
          if [ -z "$NAME" ]; then
            echo "::warning::No iOS simulator found in simctl output; falling back to 'iPhone 17'."
            NAME="iPhone 17"
          fi
          echo "Using simulator: $NAME"
          TEST_RUNNER_TEGAKI_COMPAT_FIXTURES="$RUNNER_TEMP/compat11" xcodebuild \
            -project v10/TegakiCalendar.xcodeproj \
            -scheme TegakiCalendar \
            -configuration Debug \
            -destination "platform=iOS Simulator,name=$NAME" \
            -derivedDataPath "$RUNNER_TEMP/v10-derived" \
            -only-testing:TegakiCalendarTests/Real10LedgerTests \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            test 2>&1 | tee "$RUNNER_TEMP/real10.log"
          grep -E 'Test Case .*(passed|failed|skipped)|Executed [0-9]+ test' "$RUNNER_TEMP/real10.log" || true

      # 1.3 (docs/M7C_CONTRACT.md §6.3, §10.4): 1.2.3's app (v123app, its own project.yml) with
      # tools/span-compat/AppTests/Real123LedgerTests.swift added to its unit tests, on the same simulator; only
      # that class runs, on every compat-span file (TEGAKI_COMPAT_SPAN_FIXTURES: the folder of this checkout).
      - name: 1.2.3's ledger and sync on the compat-span fixtures (Real123LedgerTests)
        run: |
          set -euo pipefail
          cp tools/span-compat/AppTests/Real123LedgerTests.swift v123app/Tests/TegakiCalendarTests/
          (cd v123app && xcodegen generate)
          NAME="$(xcrun simctl list -j devices available | python3 -c '
          import json, sys
          devices = json.load(sys.stdin).get("devices", {})
          names = set()
          for runtime, items in devices.items():
              if "iOS" not in runtime:
                  continue
              for d in items:
                  if d.get("isAvailable") and d.get("name"):
                      names.add(d["name"])
          for prefix in ("iPad Pro 13-inch", "iPad Air 13-inch", "iPad", "iPhone"):
              matches = sorted(n for n in names if n.startswith(prefix))
              if matches:
                  print(matches[0])
                  raise SystemExit
          print("")
          ' || true)"
          if [ -z "$NAME" ]; then
            echo "::warning::No iOS simulator found in simctl output; falling back to 'iPhone 17'."
            NAME="iPhone 17"
          fi
          echo "Using simulator: $NAME"
          TEST_RUNNER_TEGAKI_COMPAT_SPAN_FIXTURES="$PWD/TegakiKit/Tests/Fixtures/compat-span" xcodebuild \
            -project v123app/TegakiCalendar.xcodeproj \
            -scheme TegakiCalendar \
            -configuration Debug \
            -destination "platform=iOS Simulator,name=$NAME" \
            -derivedDataPath "$RUNNER_TEMP/v123-derived" \
            -only-testing:TegakiCalendarTests/Real123LedgerTests \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            test 2>&1 | tee "$RUNNER_TEMP/real123.log"
          grep -E 'Test Case .*(passed|failed|skipped)|Executed [0-9]+ test' "$RUNNER_TEMP/real123.log" || true

  # 1.2 (docs/M7B_CONTRACT.md §7.5, §7.6, §4.4, §4.5, §10.7, §8 8): the other nine languages, seen by the
  # lead and the owner without being able to read them. Next to the other jobs (no `needs`). No test here;
  # a photo that fails is only a warning, so this job fails only when the app does not build. 63 photos in
  # shots/l10n (artifact "l10n-screenshots", kept 7 days), each language with its region's holidays and week
  # start (en_US, zh_*, ko_KR, es_MX and pt_BR start on a Sunday, fr_FR, de_DE and it_IT on a Monday):
  #   <language>/ipad13-portrait-{month,day}.png, iphone-portrait-{week,year}.png     36
  #   {en,de}/ipad13-portrait-sheet-{settings,holidays,paywall,week-start}.png         8
  #   {de,fr}/{ipad13,iphone}-portrait-tool-eraser.png (the toolbar's two lines)       4
  #   {fr,de}/iphone-portrait-sheet-lasso.png (the three words of the menu)            2
  #   de/iphone-portrait-sheet-paywall.png (the longest real language)                 1
  #   en/ipad13-portrait-week.png, en/iphone-portrait-month.png (Sunday first)         2
  #   ja-sunday/{ipad13,iphone}-portrait-{month,week}.png (Japanese, Sunday first)     4
  #   pseudo/{ipad13,iphone}-portrait-{month,sheet-settings,sheet-paywall}.png         6
  # pseudo/ is `-NSDoubleLocalizedStrings YES`: every text from the Bundle twice, longer than any language.
  # That and `-NSShowNonLocalizedStrings YES` only reach the app's own words (Localizable): the Kit's table
  # (titles, plan texts, +n, holiday marks) neither doubles nor logs. Its lengths are for PaperFitTests and
  # L-12, its gaps for L-2 and KitStringsTests.
  # The limit: a build and XcodeGen 3 min, two boots 3.5 each (run 41922318959), the two waits 4 min, 63
  # photos of 11–15 s at most 16: about 30 min. It stays at 75 because the job's last step is the upload.
  l10n-shots:
    name: Localized shots (1.2)
    # 1.3's work branches (r13-w-*) skip the two photo jobs so the macOS runners stay free for the jobs the
    # work needs; r13 and main run everything (docs/M7C.md, S1 の残り). Nor on r13-quick (§10.6).
    if: ${{ !startsWith(github.ref_name, 'r13-w-') && !(github.ref_name == 'r13-quick' || startsWith(github.ref_name, 'r13-q-')) }}
    runs-on: macos-26
    timeout-minutes: 75
    env:
      HOMEBREW_NO_AUTO_UPDATE: "1"
      HOMEBREW_NO_INSTALL_CLEANUP: "1"
      NSUnbufferedIO: "YES"
      # The Sunday photos' Japanese (see the first job).
      JA_ARGS: "-AppleLanguages (ja) -AppleLocale ja_JP"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Xcode
        run: |
          set -euo pipefail
          if [ -d /Applications/Xcode_26.6.app ]; then
            sudo xcode-select -s /Applications/Xcode_26.6.app
          fi
          xcode-select -p
          xcodebuild -version

      - name: Install XcodeGen
        run: |
          set -euo pipefail
          brew install xcodegen
          xcodegen --version

      - name: Generate the Xcode project
        run: |
          set -euo pipefail
          xcodegen generate

      - name: Build for the iOS Simulator
        run: |
          set -euo pipefail
          xcodebuild \
            -project TegakiCalendar.xcodeproj \
            -scheme TegakiCalendar \
            -configuration Debug \
            -destination "generic/platform=iOS Simulator" \
            -derivedDataPath build/DerivedData \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            build

      # One device at a time, the 13-inch iPad first. The language and the region are launch arguments
      # (the app's own argument domain; nothing changes on the simulator). A first boot's system banner
      # comes 85–105 s after the boot (docs/M7B.md, C1), hence the 120 s with the app in front.
      - name: Shots (13-inch iPad and iPhone 17)
        timeout-minutes: 55
        continue-on-error: true
        run: |
          set -uo pipefail
          APP="$(find build/DerivedData -name "TegakiCalendar.app" -path "*iphonesimulator*" -not -path "*/Index.noindex/*" | head -1)"
          BUNDLE="com.syfan0.tegakicalendar"
          OUT="shots/l10n"
          LOG="$OUT/pseudo/l10n-log.txt"
          mkdir -p "$OUT/pseudo"
          : > "$LOG"
          if [ -z "$APP" ]; then
            echo "::warning::TegakiCalendar.app not found under build/DerivedData; no shots."
            exit 0
          fi
          # language|region (docs/M7B_CONTRACT.md §7.5)
          LANGS="en|en_US zh-Hans|zh_CN zh-Hant|zh_TW ko|ko_KR fr|fr_FR de|de_DE it|it_IT es|es_MX pt-BR|pt_BR"
          lang_args() {  # the launch arguments of a language: it, its region, that region's holidays and week start
            local P
            for P in $LANGS; do
              if [ "${P%%|*}" = "$1" ]; then
                echo "-AppleLanguages ($1) -AppleLocale ${P##*|} --screenshot-holidays auto --screenshot-week-start auto"
              fi
            done
          }
          shoot() {  # shoot <folder> <file> <launch args…>: one shot; a failure only loses this one file
            local FOLDER="$1" FILE="$2"
            shift 2
            mkdir -p "$OUT/$FOLDER"
            xcrun simctl terminate "$UDID" "$BUNDLE" 2>/dev/null || true
            sleep 1
            xcrun simctl launch "$UDID" "$BUNDLE" --screenshot-mode --screenshot-month 2026-10 "$@" || { echo "::warning::launch failed ($FOLDER/$FILE)"; return 0; }
            sleep 9
            # `grep` without -q reads the whole list (docs/M7C.md, S1 の残り, decision 8): with -q it stops at the first match,
            # simctl, still writing the list, gets SIGPIPE, and pipefail makes the pipeline fail although the app is in
            # the list (a false warning in 0–9 of build.yml's photos and 5–14 of l10n-shots' in the runs of 11/11–12;
            # none in span-shots, which reads the whole list). An app not in the list, or no list, still warns.
            xcrun simctl spawn "$UDID" launchctl list 2>/dev/null | grep tegakicalendar > /dev/null || echo "::warning::The app is not running after 9 s ($FOLDER/$FILE)"
            xcrun simctl io "$UDID" screenshot "$OUT/$FOLDER/$FILE" || echo "::warning::screenshot failed ($FOLDER/$FILE)"
          }
          # device-id | exact first choice | prefix fallbacks (in order)
          for SPEC in "ipad13|iPad Pro 13-inch (M5)|iPad Pro 13,iPad Air 13" \
                      "iphone|iPhone 17|iPhone 17,iPhone"; do
            ID="${SPEC%%|*}"; REST="${SPEC#*|}"; EXACT="${REST%%|*}"; PREFIXES="${REST#*|}"
            FOUND="$(xcrun simctl list -j devices available | SIM_EXACT="$EXACT" SIM_PREFIXES="$PREFIXES" python3 -c '
          import json, os, re, sys
          devices = json.load(sys.stdin).get("devices", {})
          def version(runtime):                                  # "…iOS-26-5" → (26, 5)
              m = re.search(r"iOS-(\d+)-(\d+)", runtime)
              return (int(m.group(1)), int(m.group(2))) if m else (0, 0)
          found = {}                                             # name → (udid, version): the newest iOS
          for runtime, items in devices.items():
              if "iOS" not in runtime:
                  continue
              for d in items:
                  if not (d.get("isAvailable") and d.get("name") and d.get("udid")):
                      continue
                  key = version(runtime)
                  if d["name"] not in found or key > found[d["name"]][1]:
                      found[d["name"]] = (d["udid"], key)
          exact = os.environ["SIM_EXACT"]
          if exact in found:
              print(exact + "|" + found[exact][0])
              raise SystemExit
          for prefix in os.environ["SIM_PREFIXES"].split(","):
              for name in sorted(found):
                  if name.startswith(prefix):
                      print(name + "|" + found[name][0])
                      raise SystemExit
          print("")
          ' || true)"
            if [ -z "$FOUND" ]; then echo "::warning::No simulator for $ID; skipping."; continue; fi
            NAME="${FOUND%%|*}"; UDID="${FOUND##*|}"
            echo "$ID: $NAME ($UDID)"
            xcrun simctl boot "$UDID" || true
            xcrun simctl bootstatus "$UDID" -b || { echo "::warning::$ID ($NAME) did not boot; skipping."; continue; }
            xcrun simctl ui "$UDID" appearance light || true
            xcrun simctl status_bar "$UDID" override --time "9:41" --batteryState charged --batteryLevel 100 --wifiBars 3 || true
            if ! xcrun simctl install "$UDID" "$APP"; then
              echo "::warning::install failed on $ID; skipping."
              xcrun simctl shutdown "$UDID" || true
              continue
            fi
            xcrun simctl launch "$UDID" "$BUNDLE" --screenshot-mode --screenshot-month 2026-10 --screenshot-page month || true
            sleep 120
            xcrun simctl terminate "$UDID" "$BUNDLE" 2>/dev/null || true
            if [ "$ID" = "ipad13" ]; then
              for P in $LANGS; do
                L="${P%%|*}"
                for PAGE in month day; do
                  # $(lang_args …) and $JA_ARGS are split on purpose (the values have no spaces).
                  shoot "$L" "ipad13-portrait-$PAGE.png" --screenshot-page "$PAGE" $(lang_args "$L")
                done
              done
              for L in en de; do
                for SHEET in settings holidays paywall week-start; do
                  shoot "$L" "ipad13-portrait-sheet-$SHEET.png" --screenshot-page month --screenshot-sheet "$SHEET" $(lang_args "$L")
                done
              done
              shoot en ipad13-portrait-week.png --screenshot-page week $(lang_args en)
            else
              for P in $LANGS; do
                L="${P%%|*}"
                for PAGE in week year; do
                  shoot "$L" "iphone-portrait-$PAGE.png" --screenshot-page "$PAGE" $(lang_args "$L")
                done
              done
              for L in fr de; do
                shoot "$L" iphone-portrait-sheet-lasso.png --screenshot-page month --screenshot-sheet lasso $(lang_args "$L")
              done
              shoot en iphone-portrait-month.png --screenshot-page month $(lang_args en)
              # The longest real language's purchase sheet on an iPhone (the top of it; that sending it down
              # reaches the links is LanguageUITests.testGermanPaywallReachesItsLinks, with its own photos).
              shoot de iphone-portrait-sheet-paywall.png --screenshot-page month --screenshot-sheet paywall $(lang_args de)
            fi
            for L in de fr; do
              shoot "$L" "$ID-portrait-tool-eraser.png" --screenshot-page month --screenshot-tool eraser $(lang_args "$L")
            done
            for PAGE in month week; do
              shoot ja-sunday "$ID-portrait-$PAGE.png" --screenshot-page "$PAGE" $JA_ARGS --screenshot-week-start sunday
            done
            shoot pseudo "$ID-portrait-month.png" --screenshot-page month -AppleLanguages "(en)" -NSDoubleLocalizedStrings YES
            for SHEET in settings paywall; do
              shoot pseudo "$ID-portrait-sheet-$SHEET.png" --screenshot-page month --screenshot-sheet "$SHEET" -AppleLanguages "(en)" -NSDoubleLocalizedStrings YES
            done
            # The gaps in the app's words, once per device: Foundation logs what the Bundle does not have.
            xcrun simctl terminate "$UDID" "$BUNDLE" 2>/dev/null || true
            sleep 1
            xcrun simctl launch "$UDID" "$BUNDLE" --screenshot-mode --screenshot-month 2026-10 --screenshot-page month --screenshot-sheet settings $(lang_args de) -NSShowNonLocalizedStrings YES || true
            sleep 12
            xcrun simctl terminate "$UDID" "$BUNDLE" 2>/dev/null || true
            echo "== $ID: $NAME" >> "$LOG"
            xcrun simctl spawn "$UDID" log show --last 40m --style compact --predicate 'process == "TegakiCalendar"' >> "$LOG" 2>&1 || true
            xcrun simctl shutdown "$UDID" || true
          done
          find "$OUT" -name '*.png' | sort

      # docs/M7B_CONTRACT.md §7.5, §8 4: 0 is the expected number of both kinds of lines.
      - name: The words the app did not find
        if: ${{ !cancelled() }}
        continue-on-error: true
        run: |
          set -uo pipefail
          OUT="shots/l10n"
          LOG="$OUT/pseudo/l10n-log.txt"
          [ -f "$LOG" ] || : > "$LOG"
          PHOTOS="$(find "$OUT" -name '*.png' | wc -l | tr -d ' ')"
          MISSING="$(grep 'l10n: missing' "$LOG" | sed 's/.*l10n: missing //' | sort -u | wc -l | tr -d ' ')"
          NOT_LOCALIZED="$(grep 'not found in strings table' "$LOG" | grep -c 'TegakiCalendar.app' || true)"
          HOLIDAYS="$(grep -E 'l10n: holidays loaded' "$LOG" | sed 's/.*l10n: holidays loaded //' | sort -n | tail -1)"
          grep 'l10n: missing' "$LOG" | sed 's/.*l10n: missing //' | sort -u || true
          grep 'not found in strings table' "$LOG" | grep 'TegakiCalendar.app' | head -50 || true
          [ "$PHOTOS" = "63" ] || echo "::warning::$PHOTOS photos, 63 expected."
          [ "$MISSING" = "0" ] || echo "::warning::$MISSING keys the app did not find (l10n: missing)."
          [ "${NOT_LOCALIZED:-0}" = "0" ] || echo "::warning::$NOT_LOCALIZED non-localized lines of the app's bundle."
          {
            echo "### l10n-shots"
            echo ""
            echo "- photos: $PHOTOS (63 expected)"
            echo "- keys the app did not find (\`l10n: missing\`): $MISSING (0 expected)"
            echo "- non-localized lines of the app's bundle: ${NOT_LOCALIZED:-0} (0 expected)"
            echo "- the slowest \`l10n: holidays loaded\`: ${HOLIDAYS:-none}"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload the shots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: l10n-screenshots
          path: shots/l10n
          retention-days: 7
          if-no-files-found: warn

  # 1.1.1 (docs/R1_1_1.md): the paper with no events and no handwriting on the owner's four kinds of
  # device, portrait and landscape, toolbar out and folded, to compare before and after the fix. Its
  # own job so the other shots and the 90-minute job do not change. Best effort: never fails the run.
  # The limits, from run 41264726309: a build took 0.9 min (8 is allowed for), a device 5.8–9.6 min
  # (its boot 1.9–3.2, the 60 s wait, xcodebuild up to the first test 1.1, 10 or 13 shots of 11–15 s, and
  # at most 1 for a slow first test), so 24–36 min for the four. The shots stop after 46 min, which
  # leaves the upload inside the 55. 36 was too short: run 80 (fix-1-1-1) was stopped while booting the
  # last device, the owner's iPad Air 11-inch, and took 33 of the 43 photos.
  blank-paper:
    name: Blank paper shots (1.1.1)
    if: ${{ !startsWith(github.ref_name, 'r13-w-') && !(github.ref_name == 'r13-quick' || startsWith(github.ref_name, 'r13-q-')) }}
    runs-on: macos-26
    timeout-minutes: 55
    continue-on-error: true
    env:
      HOMEBREW_NO_AUTO_UPDATE: "1"
      HOMEBREW_NO_INSTALL_CLEANUP: "1"
      NSUnbufferedIO: "YES"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Xcode
        run: |
          set -euo pipefail
          if [ -d /Applications/Xcode_26.6.app ]; then
            sudo xcode-select -s /Applications/Xcode_26.6.app
          fi
          xcode-select -p
          xcodebuild -version

      - name: Install XcodeGen
        run: |
          set -euo pipefail
          brew install xcodegen
          xcodegen --version

      - name: Generate the Xcode project
        run: |
          set -euo pipefail
          xcodegen generate

      # Built once, before anything boots: the products run on all four devices (one platform, one
      # architecture; TARGETED_DEVICE_FAMILY is 1,2).
      - name: Build the UI tests
        run: |
          set -euo pipefail
          xcodebuild \
            -project TegakiCalendar.xcodeproj \
            -scheme TegakiCalendar \
            -configuration Debug \
            -destination "platform=iOS Simulator,name=iPad Pro 13-inch (M5)" \
            -derivedDataPath build/BlankData \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            build-for-testing

      # One device at a time, the iPhone and the 13-inch iPad first: if the limit stops the step, the
      # photos of the two questions still open are already taken (Upload always runs). The test writes
      # <id>-<portrait|landscape>-<expanded|collapsed>-<page>.png (4 × 8, the iPhone's week 4, the year that
      # grew 4, the iPads' month after 「ツールバーをいつも出す」 3: 43) and one `blank UI:` line for each,
      # shown here once (a test prints a line and NSLogs it). ipad11 is the
      # owner's iPad Air 11-inch (820 × 1180); the first job's ipad11 photos stay the iPad Pro 11-inch.
      # If no PNG arrived, the attachments are taken out of the result bundle instead.
      - name: Shots on four devices
        timeout-minutes: 46
        continue-on-error: true
        run: |
          set -uo pipefail
          mkdir -p shots/blank
          # device-id | exact first choice | prefix fallbacks (in order)
          for SPEC in "iphone69|iPhone 17 Pro Max|iPhone 17 Pro Max,iPhone 16 Pro Max" \
                      "ipad13|iPad Pro 13-inch (M5)|iPad Pro 13" \
                      "ipadmini|iPad mini (A17 Pro)|iPad mini" \
                      "ipad11|iPad Air 11-inch (M4)|iPad Air 11,iPad Pro 11"; do
            ID="${SPEC%%|*}"; REST="${SPEC#*|}"; EXACT="${REST%%|*}"; PREFIXES="${REST#*|}"
            FOUND="$(xcrun simctl list -j devices available | SIM_EXACT="$EXACT" SIM_PREFIXES="$PREFIXES" python3 -c '
          import json, os, re, sys
          devices = json.load(sys.stdin).get("devices", {})
          def version(runtime):                                  # "…iOS-26-5" → (26, 5)
              m = re.search(r"iOS-(\d+)-(\d+)", runtime)
              return (int(m.group(1)), int(m.group(2))) if m else (0, 0)
          found = {}                                             # name → (udid, version): the newest iOS
          for runtime, items in devices.items():
              if "iOS" not in runtime:
                  continue
              for d in items:
                  if not (d.get("isAvailable") and d.get("name") and d.get("udid")):
                      continue
                  key = version(runtime)
                  if d["name"] not in found or key > found[d["name"]][1]:
                      found[d["name"]] = (d["udid"], key)
          exact = os.environ["SIM_EXACT"]
          if exact in found:
              print(exact + "|" + found[exact][0])
              raise SystemExit
          for prefix in os.environ["SIM_PREFIXES"].split(","):
              for name in sorted(found):
                  if name.startswith(prefix):
                      print(name + "|" + found[name][0])
                      raise SystemExit
          print("")
          ' || true)"
            if [ -z "$FOUND" ]; then echo "::warning::No simulator for $ID; skipping."; continue; fi
            NAME="${FOUND%%|*}"; UDID="${FOUND##*|}"
            echo "$ID: $NAME ($UDID)"
            xcrun simctl boot "$UDID" || true
            xcrun simctl bootstatus "$UDID" -b || { echo "::warning::$ID ($NAME) did not boot; skipping."; continue; }
            xcrun simctl ui "$UDID" appearance light || true
            xcrun simctl status_bar "$UDID" override --time "9:41" --batteryState charged --batteryLevel 100 --wifiBars 3 || true
            sleep 60    # the banner of a freshly booted simulator, docs/M6.md §5.1
            TEST_RUNNER_TEGAKI_SHOT_OUT="$PWD/shots/blank" TEST_RUNNER_TEGAKI_SHOT_DEVICE="$ID" xcodebuild \
              -project TegakiCalendar.xcodeproj \
              -scheme TegakiCalendar \
              -configuration Debug \
              -destination "platform=iOS Simulator,id=$UDID" \
              -derivedDataPath build/BlankData \
              -resultBundlePath "build/blank-$ID.xcresult" \
              -only-testing:TegakiCalendarUITests/BlankPaperShotsUITests \
              test-without-building 2>&1 | tee "shots/blank/$ID-log.txt" || true
            grep 'blank UI:' "shots/blank/$ID-log.txt" | awk '{ i = index($0, "blank UI:"); if (i > 1) $0 = substr($0, i); if (!seen[$0]++) print }' || true
            SHOTS="$(find shots/blank -name "$ID-*.png" | wc -l | tr -d ' ')"
            echo "$ID: $SHOTS shots"
            if [ "$SHOTS" = "0" ]; then
              echo "::warning::No PNG from $ID; taking the attachments out of its result bundle."
              mkdir -p "shots/blank/attachments-$ID"
              xcrun xcresulttool export attachments --path "build/blank-$ID.xcresult" --output-path "shots/blank/attachments-$ID" || echo "::warning::xcresulttool could not export the attachments of $ID"
            fi
            xcrun simctl shutdown "$UDID" || true
          done
          ls -la shots/blank

      - name: Upload the shots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: blank-paper
          path: shots/blank
          retention-days: 7
          if-no-files-found: warn

  # 1.3 (docs/M7C_CONTRACT.md §4.5, §4.6, §10.2, §10.5, §10.6, D11, D12; §12.2 S2 and S3 (3)): the prototype build.
  # The app and its test host are built WITH the compilation condition SPAN_PROTOTYPE — on the xcodebuild command
  # line only: it is never in project.yml (checked below), and the other jobs build, test and photograph the normal
  # app — into a DerivedData of their own (build/ProtoData). On a 13-inch iPad, PrototypeIsolationTests (§4.6: the
  # prototype leaves the real ink folder byte for byte, never calls the shared engine's save or page fetch, leaves
  # its onRemoteUpdate alone, and its guard refuses real ids) and SpanPrototypeInteractionTests (the band's moves)
  # run; the job fails unless at least 4 and 19 of them passed and none failed, so an empty run (the classes compiled
  # without the condition hold no tests) fails too. Then the sample images of §4.5 are taken from the prototype
  # screen ("--screenshot-prototype <scene>", Sources/TegakiCalendar/Span/SpanPrototypeShots.swift: screenshot mode
  # opens 設定 › 情報 and the prototype's row there opens the scene) on four devices, portrait (iPadOS ignores the
  # orientation request, see the first job's screenshot steps), the iPhone also in landscape, and go up as the
  # artifact "span-shots" (kept 7 days) with the tests' log and each device's app log. A photo that is missing fails
  # the job; what each one shows is looked at by eye (docs/M7C.md). No `needs`: it runs next to the other jobs.
  # The limits, from run 43094010843 (46.3 min in all): the build 3.2 min, the tests 7.7 with the boot (the 16 tests
  # themselves 2 s), the photos 24.8 (the 13-inch iPad, already booted, 3.1; the iPad Air 11-inch 8.9 for 8 photos; the
  # iPad mini 6.1; the iPhone 6.8 for 7), the upload 10.2 (4.4 MB; unusually slow, the first job's takes seconds). The
  # photo step stops after 40 and the job after 60: room for a boot of 4 min more on each device or a slow upload.
  # Since the review's fixes (2026-11-12): 23 photos (the day band, §4.5, on every device; the memo's third form,
  # PLAN_WEEK_MEMO.md Q2) and 23 tests (two wait for the pen's settle and for 「線の数」, a few seconds): about 2 min more.
  span-shots:
    name: span-shots (1.3 prototype)
    # Not on r13-quick (docs/M7C_CONTRACT.md §10.6).
    if: ${{ !(github.ref_name == 'r13-quick' || startsWith(github.ref_name, 'r13-q-')) }}
    runs-on: macos-26
    timeout-minutes: 60
    env:
      HOMEBREW_NO_AUTO_UPDATE: "1"
      HOMEBREW_NO_INSTALL_CLEANUP: "1"
      NSUnbufferedIO: "YES"
      # The photos and the tests in Japanese whatever the simulator's language is (see the first job).
      JA_ARGS: "-AppleLanguages (ja) -AppleLocale ja_JP"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Xcode
        run: |
          set -euo pipefail
          if [ -d /Applications/Xcode_26.6.app ]; then
            sudo xcode-select -s /Applications/Xcode_26.6.app
          fi
          xcode-select -p
          xcodebuild -version

      # D12: the mark of the prototype build is passed on the command line below and nowhere else.
      - name: SPAN_PROTOTYPE not in project.yml
        run: |
          set -euo pipefail
          if grep -n 'SPAN_PROTOTYPE' project.yml; then
            echo "::error::project.yml に SPAN_PROTOTYPE があります。試作の印は xcodebuild のコマンドの行（このジョブと testflight.yml の入力 span_prototype）だけで付けます（docs/M7C_CONTRACT.md D12）。"
            exit 1
          fi
          echo "SPAN_PROTOTYPE: not in project.yml"

      - name: Install XcodeGen
        run: |
          set -euo pipefail
          brew install xcodegen
          xcodegen --version

      - name: Generate the Xcode project
        run: |
          set -euo pipefail
          xcodegen generate

      # One quoted word (it has a space), as testflight.yml passes AGE_FORCE. Built for testing once, before
      # anything boots: the products run on every simulator (one platform, one architecture). The built app must
      # hold the prototype (its launch argument is in the binary), or the photos below would be of the normal app.
      - name: Build the prototype app and its tests (SPAN_PROTOTYPE)
        run: |
          set -euo pipefail
          xcodebuild \
            -project TegakiCalendar.xcodeproj \
            -scheme TegakiCalendar \
            -configuration Debug \
            -destination "generic/platform=iOS Simulator" \
            -derivedDataPath build/ProtoData \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            'SWIFT_ACTIVE_COMPILATION_CONDITIONS=$(inherited) SPAN_PROTOTYPE' \
            build-for-testing
          ls build/ProtoData/Build/Products/*.xctestrun
          APP="$(find build/ProtoData -name "TegakiCalendar.app" -path "*iphonesimulator*" -not -path "*/Index.noindex/*" | head -1)"
          if [ -z "$APP" ]; then echo "::error::TegakiCalendar.app not found under build/ProtoData."; exit 1; fi
          FOUND=0
          for BIN in "$APP/TegakiCalendar" "$APP/TegakiCalendar.debug.dylib"; do
            [ -f "$BIN" ] || continue
            if grep -a -q -- '--screenshot-prototype' "$BIN"; then echo "$(basename "$BIN"): holds the prototype"; FOUND=1; fi
          done
          if [ "$FOUND" = 0 ]; then
            echo "::error::作ったアプリに試作が入っていません（SPAN_PROTOTYPE が効いていない）。"
            exit 1
          fi

      # The tests of the prototype on a 13-inch iPad (the newest runtime). Counted from the log, one line per
      # test case ("Test Case '-[TegakiCalendarTests.<class> <test>]' passed|failed|skipped", or the parallel
      # form), and compared with the result bundle's summary when xcresulttool can read it.
      - name: Prototype tests (PrototypeIsolationTests 4+, SpanPrototypeInteractionTests 19+, 0 failures)
        id: prototests
        timeout-minutes: 20
        run: |
          set -uo pipefail
          mkdir -p shots/span
          FOUND="$(xcrun simctl list -j devices available | python3 -I -c '
          import json, re, sys
          devices = json.load(sys.stdin).get("devices", {})
          def version(runtime):
              m = re.search(r"iOS-(\d+)-(\d+)", runtime)
              return (int(m.group(1)), int(m.group(2))) if m else (0, 0)
          found = {}
          for runtime, items in devices.items():
              if "iOS" not in runtime:
                  continue
              for d in items:
                  if d.get("isAvailable") and d.get("name") and d.get("udid"):
                      key = version(runtime)
                      if d["name"] not in found or key > found[d["name"]][1]:
                          found[d["name"]] = (d["udid"], key)
          for exact in ("iPad Pro 13-inch (M5)",):
              if exact in found:
                  print(exact + "|" + found[exact][0]); raise SystemExit
          for prefix in ("iPad Pro 13", "iPad Air 13", "iPad"):
              for name in sorted(found):
                  if name.startswith(prefix):
                      print(name + "|" + found[name][0]); raise SystemExit
          print("")
          ')"
          if [ -z "$FOUND" ]; then echo "::error::No iPad simulator for the prototype tests."; exit 1; fi
          NAME="${FOUND%%|*}"; UDID="${FOUND##*|}"
          echo "Prototype tests on: $NAME ($UDID)"
          echo "udid=$UDID" >> "$GITHUB_OUTPUT"
          xcrun simctl boot "$UDID" 2>/dev/null || true
          xcrun simctl bootstatus "$UDID" -b
          LOG="shots/span/prototype-tests.log"
          rm -rf build/proto-tests.xcresult
          xcodebuild \
            -project TegakiCalendar.xcodeproj \
            -scheme TegakiCalendar \
            -configuration Debug \
            -destination "platform=iOS Simulator,id=$UDID" \
            -derivedDataPath build/ProtoData \
            -resultBundlePath build/proto-tests.xcresult \
            -only-testing:TegakiCalendarTests/PrototypeIsolationTests \
            -only-testing:TegakiCalendarTests/SpanPrototypeInteractionTests \
            -parallel-testing-enabled NO \
            -testLanguage ja \
            -testRegion JP \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            test-without-building > "$LOG" 2>&1
          STATUS=$?
          grep -E "Test (Case|case|Suite) |error:|Executed " "$LOG" | tail -n 80 || true
          SUMMARY="$(xcrun xcresulttool get test-results summary --path build/proto-tests.xcresult 2>/dev/null || true)"
          printf '%s\n' "$SUMMARY" > shots/span/prototype-tests-summary.json
          XCODEBUILD_STATUS="$STATUS" python3 -I - "$LOG" shots/span/prototype-tests-summary.json <<'PY'
          import json, os, re, sys
          log_path, summary_path = sys.argv[1], sys.argv[2]
          text = open(log_path, encoding="utf-8", errors="replace").read()
          case = re.compile(r"Test [Cc]ase '(?:-\[)?(?:\w+\.)?(?P<cls>\w+)[ .](?P<name>test\w*)(?:\(\))?\]?' (?P<result>passed|failed|skipped)")
          results = {}
          for m in case.finditer(text):
              results[(m.group("cls"), m.group("name"))] = m.group("result")
          def count(cls, result):
              return sum(1 for (c, _), r in results.items() if c == cls and r == result)
          need = {"PrototypeIsolationTests": 4, "SpanPrototypeInteractionTests": 19}
          problems = []
          status = int(os.environ.get("XCODEBUILD_STATUS", "1"))
          if status != 0:
              problems.append("xcodebuild test-without-building ended with %d" % status)
          for cls, least in need.items():
              passed, failed, skipped = count(cls, "passed"), count(cls, "failed"), count(cls, "skipped")
              print("%s: %d passed, %d failed, %d skipped (at least %d must pass)" % (cls, passed, failed, skipped, least))
              if passed < least:
                  problems.append("%s: %d passed, fewer than %d" % (cls, passed, least))
              if failed:
                  problems.append("%s: %d failed" % (cls, failed))
          others = sorted(c for (c, _) in results if c not in need)
          if others:
              problems.append("other classes ran: %s" % ", ".join(sorted(set(others))))
          failed_all = sum(1 for r in results.values() if r == "failed")
          passed_all = sum(1 for r in results.values() if r == "passed")
          try:
              summary = json.load(open(summary_path, encoding="utf-8"))
          except Exception:
              summary = None
          if isinstance(summary, dict) and "passedTests" in summary:
              print("result bundle: %s, %s passed, %s failed, %s skipped of %s" % (summary.get("result"), summary.get("passedTests"),
                    summary.get("failedTests"), summary.get("skippedTests"), summary.get("totalTestCount")))
              if summary.get("failedTests", 0) != 0:
                  problems.append("the result bundle has %s failed tests" % summary.get("failedTests"))
              if summary.get("passedTests") != passed_all:
                  problems.append("the result bundle has %s passed tests, the log %d" % (summary.get("passedTests"), passed_all))
          else:
              print("::warning::xcresulttool gave no summary; the log alone counts")
          print("span-shots tests: %d passed, %d failed in the log" % (passed_all, failed_all))
          for p in problems:
              print("::error::" + p)
          sys.exit(1 if problems else 0)
          PY

      # Each device: boot, install, 110 s with the prototype in front (a first launch compiles PencilKit's Metal
      # shaders, and a freshly booted simulator posts a system banner once, 15–35 or 85–105 s after the boot,
      # docs/M6.md §5.1, docs/M7B.md C1), then one launch per scene, 12 s each. A launch opens the month page with
      # the settings at 情報 (--screenshot-sheet info), whose last row opens the prototype in the scene. Files:
      # <device>-<portrait|landscape>-<scene>.png. The iPhone's landscape photos are stood up as in the first job.
      - name: Sample images of the prototype (§4.5)
        id: shots
        if: ${{ !cancelled() && steps.prototests.outcome != 'skipped' }}
        timeout-minutes: 40
        run: |
          set -uo pipefail
          OUT="shots/span"
          mkdir -p "$OUT"
          BUNDLE="com.syfan0.tegakicalendar"
          APP="$(find build/ProtoData -name "TegakiCalendar.app" -path "*iphonesimulator*" -not -path "*/Index.noindex/*" | head -1)"
          if [ -z "$APP" ]; then echo "::error::TegakiCalendar.app not found under build/ProtoData."; exit 1; fi
          xcodebuild -version > "$OUT/env.txt" || true
          # device-id | exact first choice | prefix fallbacks | portrait scenes | landscape scenes
          for SPEC in "ipad13|iPad Pro 13-inch (M5)|iPad Pro 13,iPad Air 13|boundary day-boundary|" \
                      "ipad11|iPad Air 11-inch (M4)|iPad Air 11,iPad Pro 11|boundary day-boundary sunday overview single-page single-page-next guide memo-ruled memo-grid memo-weekdays|" \
                      "ipadmini|iPad mini (A17 Pro)|iPad mini|boundary day-boundary|" \
                      "iphone|iPhone 17|iPhone 17,iPhone|boundary day-boundary overview single-page guide|boundary day-boundary landscape-now landscape-cap"; do
            ID="${SPEC%%|*}"; REST="${SPEC#*|}"
            EXACT="${REST%%|*}"; REST="${REST#*|}"
            PREFIXES="${REST%%|*}"; REST="${REST#*|}"
            PORTRAIT="${REST%%|*}"; LANDSCAPE="${REST#*|}"
            FOUND="$(xcrun simctl list -j devices available | SIM_EXACT="$EXACT" SIM_PREFIXES="$PREFIXES" python3 -I -c '
          import json, os, re, sys
          devices = json.load(sys.stdin).get("devices", {})
          def version(runtime):
              m = re.search(r"iOS-(\d+)-(\d+)", runtime)
              return (int(m.group(1)), int(m.group(2))) if m else (0, 0)
          found = {}
          for runtime, items in devices.items():
              if "iOS" not in runtime:
                  continue
              for d in items:
                  if d.get("isAvailable") and d.get("name") and d.get("udid"):
                      key = version(runtime)
                      if d["name"] not in found or key > found[d["name"]][1]:
                          found[d["name"]] = (d["udid"], key)
          exact = os.environ["SIM_EXACT"]
          if exact in found:
              print(exact + "|" + found[exact][0]); raise SystemExit
          for prefix in os.environ["SIM_PREFIXES"].split(","):
              for name in sorted(found):
                  if name.startswith(prefix):
                      print(name + "|" + found[name][0]); raise SystemExit
          print("")
          ' || true)"
            if [ -z "$FOUND" ]; then echo "::error::No simulator for $ID."; continue; fi
            NAME="${FOUND%%|*}"; UDID="${FOUND##*|}"
            echo "$ID: $NAME ($UDID)"
            echo "$ID: $NAME" >> "$OUT/env.txt"
            xcrun simctl boot "$UDID" 2>/dev/null || true
            xcrun simctl bootstatus "$UDID" -b || { echo "::error::$ID ($NAME) did not boot."; continue; }
            xcrun simctl ui "$UDID" appearance light || true
            xcrun simctl status_bar "$UDID" override --time "9:41" --batteryState charged --batteryLevel 100 --wifiBars 3 || true
            if ! xcrun simctl install "$UDID" "$APP"; then
              echo "::error::install failed on $ID."
              xcrun simctl shutdown "$UDID" || true
              continue
            fi
            STARTED="$(date +%s)"
            shoot() {  # shoot <file> <scene> [more launch arguments]
              local FILE="$1" SCENE="$2"; shift 2
              xcrun simctl terminate "$UDID" "$BUNDLE" 2>/dev/null || true
              sleep 1
              # $JA_ARGS is split on purpose (four words, none with a space).
              xcrun simctl launch "$UDID" "$BUNDLE" --screenshot-mode --screenshot-month 2026-10 --screenshot-sheet info \
                --screenshot-prototype "$SCENE" "$@" $JA_ARGS > /dev/null || { echo "::warning::launch failed ($FILE)"; return 0; }
              sleep 12
              # `grep` without -q reads the whole list: with -q it stops at the first match, launchctl gets SIGPIPE
              # and pipefail turns the pipeline into a failure (run 43094010843 warned about four running apps).
              xcrun simctl spawn "$UDID" launchctl list 2>/dev/null | grep tegakicalendar > /dev/null || echo "::warning::The app is not running after 12 s ($FILE)"
              xcrun simctl io "$UDID" screenshot "$OUT/$FILE" > /dev/null || echo "::warning::screenshot failed ($FILE)"
            }
            xcrun simctl launch "$UDID" "$BUNDLE" --screenshot-mode --screenshot-month 2026-10 --screenshot-sheet info \
              --screenshot-prototype boundary $JA_ARGS > /dev/null || true
            sleep 110
            for SCENE in $PORTRAIT; do
              shoot "$ID-portrait-$SCENE.png" "$SCENE"
            done
            for SCENE in $LANDSCAPE; do
              shoot "$ID-landscape-$SCENE.png" "$SCENE" --screenshot-landscape
            done
            for f in "$OUT/$ID"-landscape-*.png; do
              [ -f "$f" ] && { sips -r 270 "$f" > /dev/null || echo "::warning::could not rotate $f"; }
            done
            xcrun simctl terminate "$UDID" "$BUNDLE" 2>/dev/null || true
            MINUTES=$(( ($(date +%s) - STARTED) / 60 + 2 ))
            xcrun simctl spawn "$UDID" log show --last "${MINUTES}m" --style compact --predicate 'process == "TegakiCalendar"' > "$OUT/$ID-log.txt" 2>&1 || true
            grep -E 'span prototype shot:|span prototype:|zoom: ' "$OUT/$ID-log.txt" | awk '{ i = index($0, "span prototype"); if (i < 1) i = index($0, "zoom: "); if (i > 1) $0 = substr($0, i); print }' || true
            find "$HOME/Library/Logs/DiagnosticReports" -name 'TegakiCalendar*' -mmin -15 -exec cp {} "$OUT/" \; 2>/dev/null || true
            xcrun simctl shutdown "$UDID" || true
          done
          ls -la "$OUT"
          MISSING=0
          for FILE in ipad13-portrait-boundary ipad13-portrait-day-boundary \
                      ipad11-portrait-boundary ipad11-portrait-day-boundary ipad11-portrait-sunday ipad11-portrait-overview \
                      ipad11-portrait-single-page ipad11-portrait-single-page-next ipad11-portrait-guide \
                      ipad11-portrait-memo-ruled ipad11-portrait-memo-grid ipad11-portrait-memo-weekdays \
                      ipadmini-portrait-boundary ipadmini-portrait-day-boundary \
                      iphone-portrait-boundary iphone-portrait-day-boundary iphone-portrait-overview iphone-portrait-single-page \
                      iphone-portrait-guide \
                      iphone-landscape-boundary iphone-landscape-day-boundary iphone-landscape-landscape-now iphone-landscape-landscape-cap; do
            if [ ! -s "$OUT/$FILE.png" ]; then echo "::error::$FILE.png is missing."; MISSING=1; fi
          done
          exit "$MISSING"

      # overwrite: a re-run of this job (gh run rerun --failed) replaces the photos of the attempt before instead of
      # failing on the name that attempt already uploaded (as ja-baseline.yml's and store-shots.yml's uploads do).
      - name: Upload the span shots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: span-shots
          path: shots/span
          retention-days: 7
          if-no-files-found: warn
          overwrite: true
