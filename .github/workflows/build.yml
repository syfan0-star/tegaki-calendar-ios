# Builds and tests the pure Swift package (TegakiKit) on macOS, then builds the app for the
# iOS Simulator and runs the app's unit tests on a 13-inch iPad simulator. Afterwards it launches
# the app in its screenshot mode on four simulators (docs/M4B_CONTRACT.md §6: the 13-inch iPad
# with 4 pages + 6 sheets, then an iPhone, an iPad mini and an 11-inch iPad with 4 pages each,
# booted one at a time; the iPhone also shoots the week with a Sunday 「今日」 and tries the 4 pages
# in landscape; since M4c (docs/M4C_CONTRACT.md §6) the 13-inch iPad also shoots the month, week and
# year zoomed in to twice their overview and the iPhone the week at three times, plus the week of
# 6/1, and the app logs are grepped for the canvas's `zoom:` lines; since M5 (docs/M5_CONTRACT.md §7.5,
# §7.7) a seventh sheet "paywall" and three read-only shots ("--screenshot-readonly": the 13-inch month
# with the 「閲覧専用」 badge and the toast, the 11-inch day page with the symbol-only badge, the iPhone
# week with the notice row), and the logs are grepped for the store's `store:` lines; since M6
# (docs/M6_CONTRACT.md §4.2, §7.4) an eighth sheet "export" (the export sheet in its choose state), the
# iPhone's paywall sheet, five shots on a 6.9-inch iPhone (iPhone 17 Pro Max) and a "Store listing set"
# step that converts the App Store shots into JPEGs under store/<device>/) and uploads the
# screenshots (artifact "screenshots", kept 7 days: up to 43 images + 5 logs + store/) so the app can be
# looked at without Xcode. The screenshot steps never fail the job. Since 1.0.1 (docs/R1_0_1.md §5.1)
# a UI test (YearTapUITests) runs on an iPhone after the screenshots and does fail the job; its log
# and screenshots go to shots/ui-tests/.
# Nothing here touches iCloud: the Simulator build is unsigned (the entitlements are not embedded)
# and the test host / screenshot mode use the in-memory fake database.
# Public repository → GitHub-hosted macOS runners are free.
name: build

on:
  push:
  pull_request:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: Build and test (iOS Simulator)
    runs-on: macos-26
    timeout-minutes: 75
    env:
      HOMEBREW_NO_AUTO_UPDATE: "1"
      HOMEBREW_NO_INSTALL_CLEANUP: "1"
      NSUnbufferedIO: "YES"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Xcode
        run: |
          set -euo pipefail
          if [ -d /Applications/Xcode_26.6.app ]; then
            sudo xcode-select -s /Applications/Xcode_26.6.app
          fi
          xcode-select -p
          xcodebuild -version

      # The pure modules (TegakiKit: DayKit / Holidays / Layout / InkModel) build and test on macOS
      # itself, before anything touches the Simulator. KitChecks is the same check set that runs on
      # the owner's Mac without Xcode (docs/M2_CONTRACT.md §8); `swift test` runs the XCTest targets.
      - name: Build TegakiKit (macOS)
        run: |
          set -euo pipefail
          swift --version
          swift build --package-path TegakiKit

      # The count is checked as a number (docs/M4B_CONTRACT.md §7.1, M4B-9; docs/M4C_CONTRACT.md §6,
      # M4C-10; docs/M5_CONTRACT.md §7.4, M5-25; docs/M6_CONTRACT.md §7.1, M6-18): M6 counts 23386
      # (M5's 23114 + 272 for the "app export (M6)" section) and the threshold is that number minus 50,
      # so anything below 23336 means a section went missing.
      - name: Run KitChecks (macOS)
        run: |
          set -euo pipefail
          swift run --package-path TegakiKit KitChecks 2>&1 | tee kitchecks.log
          N="$(grep -oE 'all [0-9]+ checks passed' kitchecks.log | grep -oE '[0-9]+' | tail -1)"
          echo "KitChecks count: ${N:-0} (required: 23336 or more)"
          test "${N:-0}" -ge 23336

      - name: Test TegakiKit (macOS)
        run: |
          set -euo pipefail
          swift test --package-path TegakiKit

      - name: Install XcodeGen
        run: |
          set -euo pipefail
          brew install xcodegen
          xcodegen --version

      - name: Generate the Xcode project
        run: |
          set -euo pipefail
          xcodegen generate
          xcodebuild -project TegakiCalendar.xcodeproj -list

      - name: Build for the iOS Simulator
        run: |
          set -euo pipefail
          xcodebuild \
            -project TegakiCalendar.xcodeproj \
            -scheme TegakiCalendar \
            -configuration Debug \
            -destination "generic/platform=iOS Simulator" \
            -derivedDataPath build/DerivedData \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            build

      # The primary simulator (unit tests, 4 pages, 6 sheets): the first name, in sorted order, that
      # starts with "iPad Pro 13-inch", else "iPad Air 13-inch", else any iPad, else any iPhone
      # (docs/M4B_CONTRACT.md §6.1: the runner has no "iPad Pro 13-inch (M4)", so the choice is by
      # prefix and deterministic). As a last resort the literal "iPhone 17" (the step never fails).
      - name: Pick a simulator (13-inch iPad preferred)
        id: simulator
        run: |
          set -euo pipefail
          xcrun simctl list devices available
          NAME="$(xcrun simctl list -j devices available | python3 -c '
          import json, sys
          devices = json.load(sys.stdin).get("devices", {})
          names = set()
          for runtime, items in devices.items():
              if "iOS" not in runtime:
                  continue
              for d in items:
                  if d.get("isAvailable") and d.get("name"):
                      names.add(d["name"])
          for prefix in ("iPad Pro 13-inch", "iPad Air 13-inch", "iPad", "iPhone"):
              matches = sorted(n for n in names if n.startswith(prefix))
              if matches:
                  print(matches[0])
                  raise SystemExit
          print("")
          ' || true)"
          if [ -z "$NAME" ]; then
            echo "::warning::No iOS simulator found in simctl output; falling back to 'iPhone 17'."
            NAME="iPhone 17"
          fi
          echo "Using simulator: $NAME"
          echo "name=$NAME" >> "$GITHUB_OUTPUT"

      # The iPhone UI test (1.0.1) has its own step below, on an iPhone.
      - name: Run unit tests on the simulator
        run: |
          set -euo pipefail
          xcodebuild \
            -project TegakiCalendar.xcodeproj \
            -scheme TegakiCalendar \
            -configuration Debug \
            -destination "platform=iOS Simulator,name=${{ steps.simulator.outputs.name }}" \
            -derivedDataPath build/DerivedData \
            -skip-testing:TegakiCalendarUITests \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            test

      # ---- Screenshots of the running app (best effort; never fails the job) ----
      # The app is launched with "--screenshot-mode" (Sources/TegakiCalendar/Support/ScreenshotMode.swift):
      # no onboarding, no EventKit, deterministic demo events for 2026-10 and a few preloaded ink
      # strokes. Since M3a it is launched once per page ("--screenshot-page month|week|day|year",
      # docs/M3A_CONTRACT.md §9), terminated between launches; since M3b four more times on the month
      # page with "--screenshot-sheet create|edit|lasso|settings" (docs/M3B_CONTRACT.md §5, §7), which
      # opens the create / edit sheet, the lasso selection with its menu, or the settings screen half a
      # second after the canvas appeared; since M4 two more sheets, "sync" (the settings screen with the
      # demo sync engine: 「同期済み」 and 「最後に同期」) and "import" (the finished web import,
      # docs/M4_CONTRACT.md §6.6); since M5 a seventh, "paywall" (the subscription sheet of
      # docs/M5_CONTRACT.md §4.1 over the month page), and "--screenshot-readonly" (the demo store starts
      # unsubscribed: the 「閲覧専用」 badge in the header, the toast of §3.3 for 20 s, docs/M5_CONTRACT.md
      # §7.5); since M6 an eighth sheet, "export" (the export sheet of docs/M6_CONTRACT.md §3.2 in its
      # choose state — two actions with a one-line note each — over the month page, 0-6).
      # In screenshot mode the sync engine is an inert demo over an in-memory fake and the store
      # is an inert demo client (no StoreKit, no UserDefaults), so nothing here needs an iCloud account
      # or App Store Connect. simctl cannot tap or rotate the device; since
      # M4b (docs/M4B_CONTRACT.md §6.4) only the iPhone turns with "--screenshot-landscape" (the app
      # asks the window scene for landscape; iPadOS ignores that request for an app that supports
      # multitasking, so the iPad shots are portrait only).
      # The steps run even when the unit tests failed (the app was still built); the upload always runs.
      - name: Resolve the simulator UDID
        id: simudid
        if: ${{ !cancelled() && steps.simulator.outcome == 'success' }}
        continue-on-error: true
        run: |
          set -euo pipefail
          NAME="${{ steps.simulator.outputs.name }}"
          UDID="$(xcrun simctl list -j devices available | SIM_NAME="$NAME" python3 -c '
          import json, os, sys
          name = os.environ["SIM_NAME"]
          devices = json.load(sys.stdin).get("devices", {})
          found = ""
          for runtime, items in devices.items():
              if "iOS" not in runtime:
                  continue
              for d in items:
                  if d.get("isAvailable") and d.get("name") == name and d.get("udid"):
                      # Prefer the one xcodebuild already booted for the tests.
                      if d.get("state") == "Booted" or not found:
                          found = d["udid"]
          print(found)
          ')"
          if [ -z "$UDID" ]; then
            echo "::warning::No simulator UDID found for '$NAME'; skipping screenshots."
            exit 1
          fi
          echo "Simulator: $NAME ($UDID)"
          echo "udid=$UDID" >> "$GITHUB_OUTPUT"

      - name: Boot the simulator
        if: ${{ !cancelled() && steps.simudid.outcome == 'success' }}
        continue-on-error: true
        run: |
          set -euo pipefail
          UDID="${{ steps.simudid.outputs.udid }}"
          xcrun simctl boot "$UDID" || true
          xcrun simctl bootstatus "$UDID" -b
          xcrun simctl ui "$UDID" appearance light
          # A fixed status bar, so two runs produce the same pixels.
          xcrun simctl status_bar "$UDID" override --time "9:41" --batteryState charged --batteryLevel 100 --wifiBars 3 || true

      - name: Install the app on the simulator
        if: ${{ !cancelled() && steps.simudid.outcome == 'success' }}
        continue-on-error: true
        run: |
          set -euo pipefail
          UDID="${{ steps.simudid.outputs.udid }}"
          APP="$(find build/DerivedData -name "TegakiCalendar.app" -path "*iphonesimulator*" -not -path "*/Index.noindex/*" | head -1)"
          if [ -z "$APP" ]; then
            echo "::warning::TegakiCalendar.app not found under build/DerivedData; skipping screenshots."
            exit 1
          fi
          echo "App bundle: $APP"
          xcrun simctl install "$UDID" "$APP"

      # File names since M4b: ipad13-portrait-<page>.png (docs/M4B_CONTRACT.md §6.2; M4 and earlier
      # wrote ipad-portrait-<page>.png, the mapping is in docs/M4B.md). Since M4c the 4 pages open at
      # the overview (the whole page fits the paper area, docs/M4C_CONTRACT.md D1) and three more shots
      # open the month, the week and the year at twice the overview with a paper point (lu) at the top
      # left ("--screenshot-zoom 2 --screenshot-offset x,y", §2.4: the photo shares the canvas's zoom
      # path with a pinch; the year's offset is clamped to the paper's right edge on purpose). Since M5
      # one more: the month page in read-only mode (docs/M5_CONTRACT.md §7.5: the orange 「閲覧専用」 badge
      # left of 「＋予定」 (1024 pt ≥ 980, so with its text), the 20 s toast, undo/redo greyed).
      - name: Screenshots (13-inch iPad, portrait, 4 pages + 3 zoomed + read-only)
        if: ${{ !cancelled() && steps.simudid.outcome == 'success' }}
        continue-on-error: true
        run: |
          set -euo pipefail
          UDID="${{ steps.simudid.outputs.udid }}"
          BUNDLE="com.syfan0.tegakicalendar"
          mkdir -p shots
          for PAGE in month week day year; do
            xcrun simctl terminate "$UDID" "$BUNDLE" 2>/dev/null || true
            sleep 1
            xcrun simctl launch "$UDID" "$BUNDLE" --screenshot-mode --screenshot-month 2026-10 --screenshot-page "$PAGE"
            sleep 8
            pgrep -fl "TegakiCalendar.app/TegakiCalendar" || echo "::warning::The app is not running after 8 s ($PAGE page; crashed?)"
            xcrun simctl io "$UDID" screenshot "shots/ipad13-portrait-$PAGE.png"
          done
          # page|offset: month lu (400, 200) → the Wed–Sat columns from the second half of the 10/5 week;
          # week (300, 700) → Tue–Sat from 8:45 (the band's lanes grow past zoom 0.818, §1.6);
          # year (1000, 300) → clamped to the right edge: May's end to December.
          for SPEC in "month|400,200" "week|300,700" "year|1000,300"; do
            PAGE="${SPEC%%|*}"; OFFSET="${SPEC##*|}"
            xcrun simctl terminate "$UDID" "$BUNDLE" 2>/dev/null || true
            sleep 1
            xcrun simctl launch "$UDID" "$BUNDLE" --screenshot-mode --screenshot-month 2026-10 --screenshot-page "$PAGE" --screenshot-zoom 2 --screenshot-offset "$OFFSET"
            sleep 8
            pgrep -fl "TegakiCalendar.app/TegakiCalendar" || echo "::warning::The app is not running after 8 s ($PAGE page, zoom 2; crashed?)"
            xcrun simctl io "$UDID" screenshot "shots/ipad13-portrait-$PAGE-zoom2.png"
          done
          xcrun simctl terminate "$UDID" "$BUNDLE" 2>/dev/null || true
          sleep 1
          xcrun simctl launch "$UDID" "$BUNDLE" --screenshot-mode --screenshot-month 2026-10 --screenshot-page month --screenshot-readonly
          sleep 8
          pgrep -fl "TegakiCalendar.app/TegakiCalendar" || echo "::warning::The app is not running after 8 s (month page, read only; crashed?)"
          xcrun simctl io "$UDID" screenshot "shots/ipad13-portrait-readonly.png"
          ls -la shots

      - name: Screenshots (13-inch iPad, portrait, 8 sheets on the month page)
        if: ${{ !cancelled() && steps.simudid.outcome == 'success' }}
        continue-on-error: true
        run: |
          set -euo pipefail
          UDID="${{ steps.simudid.outputs.udid }}"
          BUNDLE="com.syfan0.tegakicalendar"
          mkdir -p shots
          for SHEET in create edit lasso settings sync import paywall export; do
            xcrun simctl terminate "$UDID" "$BUNDLE" 2>/dev/null || true
            sleep 1
            xcrun simctl launch "$UDID" "$BUNDLE" --screenshot-mode --screenshot-month 2026-10 --screenshot-page month --screenshot-sheet "$SHEET"
            sleep 9
            pgrep -fl "TegakiCalendar.app/TegakiCalendar" || echo "::warning::The app is not running after 9 s (sheet $SHEET; crashed?)"
            xcrun simctl io "$UDID" screenshot "shots/ipad13-portrait-sheet-$SHEET.png"
          done
          ls -la shots

      # The 13-inch log is collected before the other devices boot (its 16 shots fit in the 8 min
      # window; each extra device writes its own shots/<id>-log.txt below).
      - name: Collect the app log and crash reports (13-inch iPad)
        if: ${{ !cancelled() && steps.simudid.outcome == 'success' }}
        continue-on-error: true
        run: |
          set -uo pipefail
          UDID="${{ steps.simudid.outputs.udid }}"
          mkdir -p shots
          xcrun simctl terminate "$UDID" com.syfan0.tegakicalendar 2>/dev/null || true
          xcrun simctl spawn "$UDID" log show --last 8m --style compact \
            --predicate 'process == "TegakiCalendar" OR eventMessage CONTAINS "tegakicalendar" OR eventMessage CONTAINS "TegakiCalendar"' \
            > shots/app-log.txt 2>&1 || true
          find "$HOME/Library/Logs/DiagnosticReports" -name 'TegakiCalendar*' -mmin -15 -exec cp {} shots/ \; 2>/dev/null || true
          ls -la shots
          grep -c "" shots/app-log.txt || true
          # M4c (docs/M4C_CONTRACT.md §2.4): the canvas's first layout logs "zoom: kind=… pinch=%d
          # enabled=%d min max zoom fitAll ratio view overview" (DEBUG), a pinch "zoom: begin" /
          # "zoom: end …"; pinch=1 means PKCanvasView offers a pinch (F4). C copies the numbers into docs/M4C.md.
          grep 'zoom: ' shots/app-log.txt || true
          # M5 (docs/M5_CONTRACT.md §2.2, §7.7): LiveStoreClient logs "store: …" (DEBUG: environment,
          # product count, states). Screenshot mode uses the inert demo client, so 0 lines here is the
          # expected result; the grep is the reach check for a device log read the same way.
          grep 'store: ' shots/app-log.txt || true

      # The four other device classes (docs/M4B_CONTRACT.md §6.3), booted one at a time and shut
      # down afterwards: iphone (iPhone 17, 402 pt), iphone69 (iPhone 17 Pro Max, 440 pt; since M6,
      # docs/M6_CONTRACT.md 0-15 / M6-2: the 6.9-inch App Store shots, 1320×2868 — the prefix fallbacks
      # are iPhone 17 Pro Max, iPhone 17 Pro, iPhone 16 Pro Max in that order; on "iPhone 17 Pro" the
      # pixels are 6.3-inch and the store step below warns), ipadmini (iPad mini (A17 Pro), 744 pt) and
      # ipad11 (iPad Pro 11-inch (M5), 834 pt), 4 portrait pages each as <id>-portrait-<page>.png.
      # Since M6 the iPhone and the 6.9-inch iPhone also shoot the paywall sheet over the month page
      # (docs/M6_CONTRACT.md §4.2: store/iphone/05-paywall.jpg and store/iphone69/05-paywall.jpg).
      # Since M5 (docs/M5_CONTRACT.md §7.5) the 11-inch iPad also shoots the day page in read-only mode
      # (the longest title next to the symbol-only badge: 834 < 980, M5-32) and the iPhone the week in
      # read-only mode (no badge in the two-row header; the notice row 「閲覧専用です。…」 + 「購読する」).
      # The iPhone also shoots the week of 2026-06 (6/7 is a Sunday: the paper starts at the right
      # edge, M4B-3; since M4c the overview shows the whole week, and the same week is shot again as
      # -week-jun for the "6/1" heading of the narrow column, M4C-28), the week at three times its
      # overview ("--screenshot-zoom 3 --screenshot-offset 300,700", docs/M4C_CONTRACT.md §6) and
      # tries the 4 pages in landscape ("--screenshot-landscape", §6.4; the file is still written when
      # the request was ignored, the header then stays two rows). Every shot is best effort; a
      # missing simulator or a failed boot only skips that device. The 13-inch simulator is shut down
      # first to leave the runner's memory to the next one. Since M6 (docs/M6.md §5.1) every device
      # waits 40 s after its boot with the app in front before the first shot and shoots its four pages
      # again at the end: a freshly booted iOS 26 simulator posts a system banner once, 15–35 s after
      # the boot, and two runs caught it on an App Store source (see the step body).
      - name: Screenshots (iPhone, 6.9-inch iPhone, iPad mini, 11-inch iPad; portrait, 4 pages each)
        if: ${{ !cancelled() && steps.simudid.outcome == 'success' }}
        continue-on-error: true
        run: |
          set -euo pipefail
          PRIMARY="${{ steps.simudid.outputs.udid }}"
          APP="$(find build/DerivedData -name "TegakiCalendar.app" -path "*iphonesimulator*" -not -path "*/Index.noindex/*" | head -1)"
          BUNDLE="com.syfan0.tegakicalendar"
          if [ -z "$APP" ]; then
            echo "::warning::TegakiCalendar.app not found under build/DerivedData; skipping the extra devices."
            exit 0
          fi
          mkdir -p shots
          xcrun simctl shutdown "$PRIMARY" || true
          # device-id | exact first choice | prefix fallbacks (in order)
          for SPEC in "iphone|iPhone 17|iPhone 17,iPhone" \
                      "iphone69|iPhone 17 Pro Max|iPhone 17 Pro Max,iPhone 17 Pro,iPhone 16 Pro Max" \
                      "ipadmini|iPad mini (A17 Pro)|iPad mini" \
                      "ipad11|iPad Pro 11-inch (M5)|iPad Pro 11,iPad Air 11,iPad (A"; do
            ID="${SPEC%%|*}"; REST="${SPEC#*|}"; EXACT="${REST%%|*}"; PREFIXES="${REST#*|}"
            FOUND="$(xcrun simctl list -j devices available | SIM_EXACT="$EXACT" SIM_PREFIXES="$PREFIXES" SIM_PRIMARY="$PRIMARY" python3 -c '
          import json, os, re, sys
          devices = json.load(sys.stdin).get("devices", {})
          def version(runtime):                                  # "…iOS-26-5" → (26, 5)
              m = re.search(r"iOS-(\d+)-(\d+)", runtime)
              return (int(m.group(1)), int(m.group(2))) if m else (0, 0)
          primary_runtime = next((r for r, items in devices.items() for d in items if d.get("udid") == os.environ["SIM_PRIMARY"]), None)
          found = {}                                             # name → (udid, key): same runtime as the 13-inch > newer iOS
          for runtime, items in devices.items():
              if "iOS" not in runtime:
                  continue
              for d in items:
                  if not (d.get("isAvailable") and d.get("name") and d.get("udid")):
                      continue
                  key = (runtime == primary_runtime, version(runtime))
                  if d["name"] not in found or key > found[d["name"]][1]:
                      found[d["name"]] = (d["udid"], key)
          exact = os.environ["SIM_EXACT"]
          if exact in found:
              print(exact + "|" + found[exact][0])
              raise SystemExit
          for prefix in os.environ["SIM_PREFIXES"].split(","):
              for name in sorted(found):
                  if name.startswith(prefix):
                      print(name + "|" + found[name][0])
                      raise SystemExit
          print("")
          ' || true)"
            if [ -z "$FOUND" ]; then echo "::warning::No simulator for $ID; skipping."; continue; fi
            NAME="${FOUND%%|*}"; UDID="${FOUND##*|}"
            echo "$ID: $NAME ($UDID)"
            xcrun simctl boot "$UDID" || true
            xcrun simctl bootstatus "$UDID" -b || { echo "::warning::$ID ($NAME) did not boot; skipping."; continue; }
            xcrun simctl ui "$UDID" appearance light || true
            xcrun simctl status_bar "$UDID" override --time "9:41" --batteryState charged --batteryLevel 100 --wifiBars 3 || true
            if ! xcrun simctl install "$UDID" "$APP"; then
              echo "::warning::install failed on $ID; skipping."
              [ "$UDID" = "$PRIMARY" ] || xcrun simctl shutdown "$UDID" || true
              continue
            fi
            shoot() {  # shoot <file> <launch args…>: one shot; a failure only loses this one file (never stops the step)
              local FILE="$1"; shift
              xcrun simctl terminate "$UDID" "$BUNDLE" 2>/dev/null || true
              sleep 1
              xcrun simctl launch "$UDID" "$BUNDLE" --screenshot-mode "$@" || { echo "::warning::launch failed ($FILE)"; return 0; }
              sleep 9
              xcrun simctl spawn "$UDID" launchctl list 2>/dev/null | grep -q tegakicalendar || echo "::warning::The app is not running after 9 s ($FILE)"
              xcrun simctl io "$UDID" screenshot "shots/$FILE" || echo "::warning::screenshot failed ($FILE)"
            }
            # M6 (docs/M6.md §5.1): a freshly booted iOS 26 simulator posts a system banner once, 15–35 s
            # after the boot ("Ready for Apple Intelligence" — run 39034481760 caught it on
            # iphone-portrait-week.png, run 39031277533 on ipad11-portrait-day.png, both App Store
            # sources). Wait that window out with the app in front before the first shot (settle) …
            xcrun simctl launch "$UDID" "$BUNDLE" --screenshot-mode --screenshot-month 2026-10 --screenshot-page month || true
            sleep 40
            xcrun simctl terminate "$UDID" "$BUNDLE" 2>/dev/null || true
            for PAGE in month week day year; do
              shoot "$ID-portrait-$PAGE.png" --screenshot-month 2026-10 --screenshot-page "$PAGE"
            done
            if [ "$ID" = "ipad11" ]; then
              # M5-32: the day page's title 「2026年10月7日(水)」 must stay on one line next to the lock-only badge.
              shoot "$ID-portrait-readonly.png" --screenshot-month 2026-10 --screenshot-page day --screenshot-readonly
            fi
            if [ "$ID" = "iphone" ]; then
              # M5-13: compact width → no badge, the notice row under the header instead.
              shoot "$ID-portrait-readonly.png" --screenshot-month 2026-10 --screenshot-page week --screenshot-readonly
            fi
            if [ "$ID" = "iphone" ] || [ "$ID" = "iphone69" ]; then
              # M6 (docs/M6_CONTRACT.md §4.2, §7.4): the full-height paywall sheet (.large detent) over the
              # month page — the App Store shot 05-paywall of both iPhone classes.
              shoot "$ID-portrait-sheet-paywall.png" --screenshot-month 2026-10 --screenshot-page month --screenshot-sheet paywall
            fi
            # … and shoot the four pages (the store/ sources) once more now, 1.5–2 min after the boot, so
            # a banner that still slipped into a first take is not in the file that is kept (retake).
            for PAGE in month week day year; do
              shoot "$ID-portrait-$PAGE.png" --screenshot-month 2026-10 --screenshot-page "$PAGE"
            done
            if [ "$ID" = "iphone" ]; then
              # M4B-3 / M4B-27: 6/7 is a Sunday → the 「今日」 column is the last one → the paper starts
              # at the right edge and the time labels are off screen.
              shoot "$ID-portrait-week-sun.png" --screenshot-month 2026-06 --screenshot-page week
              # M4c: the week at 3 × fitAll (0.8613: Tue–Thu from 8:45, the text at its minPoints) and
              # the week of 6/1–6/7 (M4C-28: the first heading is "6/1" without its weekday).
              shoot "$ID-portrait-week-zoom3.png" --screenshot-month 2026-10 --screenshot-page week --screenshot-zoom 3 --screenshot-offset 300,700
              shoot "$ID-portrait-week-jun.png" --screenshot-month 2026-06 --screenshot-page week
              for PAGE in month week day year; do        # §6.4: only the iPhone can turn
                shoot "$ID-landscape-$PAGE.png" --screenshot-month 2026-10 --screenshot-page "$PAGE" --screenshot-landscape
              done
              # The simulator's framebuffer stays portrait (only the app's interface turned), so the
              # landscape shots come out rotated by 90°; stand them up. When the request was ignored
              # (header still two rows) they end up sideways instead, which is the tell.
              for f in shots/"$ID"-landscape-*.png; do
                [ -f "$f" ] && { sips -r 270 "$f" > /dev/null || echo "::warning::could not rotate $f"; }
              done
            fi
            xcrun simctl terminate "$UDID" "$BUNDLE" 2>/dev/null || true
            xcrun simctl spawn "$UDID" log show --last 6m --style compact --predicate 'process == "TegakiCalendar"' > "shots/$ID-log.txt" 2>&1 || true
            grep 'zoom: ' "shots/$ID-log.txt" || true     # M4c: the canvas's zoom lines of this device
            grep 'store: ' "shots/$ID-log.txt" || true    # M5: the store's lines (0 in screenshot mode, see above)
            [ "$UDID" = "$PRIMARY" ] || xcrun simctl shutdown "$UDID" || true
          done
          ls -la shots

      # 1.0.1 (docs/R1_0_1.md §5.1): the UI test of the fix on an iPhone (iPhone 17; the fallbacks are
      # any "iPhone 17…", then any iPhone; the same runtime as the 13-inch simulator first). YearTapUITests
      # launches the app in screenshot mode on the year page and taps the middle of 3/16 with a real
      # (simulated finger) tap or double tap — 「指でも書く」 on and off, portrait and landscape — and
      # expects the day page. It runs after the screenshots, so their devices start exactly as before (the
      # shots are compared pixel by pixel with 1.0's), and it fails the job when a test fails. The log and
      # the screenshots the test keeps (before / after each tap) go to shots/ui-tests/.
      - name: UI tests on an iPhone (the year page's tap, 1.0.1)
        run: |
          set -euo pipefail
          PRIMARY="${{ steps.simudid.outputs.udid }}"
          FOUND="$(xcrun simctl list -j devices available | SIM_PRIMARY="$PRIMARY" python3 -c '
          import json, os, re, sys
          devices = json.load(sys.stdin).get("devices", {})
          def version(runtime):
              m = re.search(r"iOS-(\d+)-(\d+)", runtime)
              return (int(m.group(1)), int(m.group(2))) if m else (0, 0)
          primary_runtime = next((r for r, items in devices.items() for d in items if d.get("udid") == os.environ["SIM_PRIMARY"]), None)
          found = {}
          for runtime, items in devices.items():
              if "iOS" not in runtime:
                  continue
              for d in items:
                  if not (d.get("isAvailable") and d.get("name") and d.get("udid")):
                      continue
                  key = (runtime == primary_runtime, version(runtime))
                  if d["name"] not in found or key > found[d["name"]][1]:
                      found[d["name"]] = (d["udid"], key)
          if "iPhone 17" in found:
              print("iPhone 17|" + found["iPhone 17"][0]); raise SystemExit
          for prefix in ("iPhone 17", "iPhone"):
              for name in sorted(found):
                  if name.startswith(prefix):
                      print(name + "|" + found[name][0]); raise SystemExit
          print("")
          ')"
          if [ -z "$FOUND" ]; then echo "::error::No iPhone simulator for the UI test."; exit 1; fi
          NAME="${FOUND%%|*}"; UDID="${FOUND##*|}"
          echo "UI tests on: $NAME ($UDID)"
          mkdir -p shots/ui-tests
          rm -rf build/ui-tests.xcresult
          xcodebuild \
            -project TegakiCalendar.xcodeproj \
            -scheme TegakiCalendar \
            -configuration Debug \
            -destination "platform=iOS Simulator,id=$UDID" \
            -derivedDataPath build/DerivedData \
            -resultBundlePath build/ui-tests.xcresult \
            -only-testing:TegakiCalendarUITests \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            test 2>&1 | tee shots/ui-tests/ui-tests.log
          grep -E 'year-tap UI:|Test Case .*(passed|failed|skipped)' shots/ui-tests/ui-tests.log || true

      # The screenshots YearTapUITests kept (best effort, also after a failure).
      - name: Export the UI test's screenshots
        if: always()
        continue-on-error: true
        run: |
          set -uo pipefail
          if [ -d build/ui-tests.xcresult ]; then
            mkdir -p shots/ui-tests/attachments
            xcrun xcresulttool export attachments --path build/ui-tests.xcresult --output-path shots/ui-tests/attachments || echo "::warning::xcresulttool could not export the attachments"
            ls -la shots/ui-tests/attachments || true
          else
            echo "No UI test result bundle."
          fi

      # M6 (docs/M6_CONTRACT.md §4.1, §4.2, §7.4): the App Store listing set. The shots of §4.2 are
      # converted to JPEG (no alpha: `simctl io screenshot` PNGs are usually opaque but that is not
      # guaranteed, and Apple rejects alpha) under shots/store/<device>/NN-<name>.jpg, and each file's
      # pixel size is compared with Apple's accepted portrait sizes for that device class (help page
      # "Screenshot specifications", read 2026-10-17): iPad 13-inch 2064×2752 or 2048×2732, iPhone
      # Dynamic Island (medium) 1206×2622 or 1179×2556, iPhone Dynamic Island (large) 1320×2868 /
      # 1290×2796 / 1260×2736, iPad 11-inch 1668×2420 / 1668×2388 / 1640×2360 / 1488×2266. A size
      # outside its set is a ::warning (a run that fell back to "iPad Air 13-inch" gives 2048×2732 and
      # passes; one that fell back to "iPhone 17 Pro" for iphone69 gives 1206×2622 and warns). The
      # numbers are the provisional listing order (§4.2 — the lead may reorder at §8-5). Always runs,
      # never fails the job; a missing source only skips that one file.
      - name: Store listing set (JPEG, App Store sizes)
        if: always()
        continue-on-error: true
        run: |
          set -uo pipefail
          mkdir -p shots/store/ipad13 shots/store/iphone shots/store/iphone69 shots/store/ipad11
          accepted() {  # accepted <device>: Apple's accepted portrait pixel sizes (docs/M6_CONTRACT.md §4.1)
            case "$1" in
              ipad13)   echo "2064x2752 2048x2732" ;;
              iphone)   echo "1206x2622 1179x2556" ;;
              iphone69) echo "1320x2868 1290x2796 1260x2736" ;;
              ipad11)   echo "1668x2420 1668x2388 1640x2360 1488x2266" ;;
              *)        echo "" ;;
            esac
          }
          store() {  # store <device> <NN-name> <source shot without .png>: convert, then check the size
            local DEV="$1" NAME="$2" SRC="shots/$3.png" OUT="shots/store/$1/$2.jpg" W H SIZE
            if [ ! -f "$SRC" ]; then echo "::warning::store/$DEV/$NAME.jpg: source $SRC is missing; skipped."; return 0; fi
            if ! sips -s format jpeg -s formatOptions 100 "$SRC" --out "$OUT" > /dev/null; then echo "::warning::store/$DEV/$NAME.jpg: sips could not convert $SRC."; return 0; fi
            W="$(sips -g pixelWidth "$OUT" | awk '/pixelWidth/ {print $2}')"
            H="$(sips -g pixelHeight "$OUT" | awk '/pixelHeight/ {print $2}')"
            SIZE="${W}x${H}"
            case " $(accepted "$DEV") " in
              *" $SIZE "*) echo "store/$DEV/$NAME.jpg: ${SIZE} (accepted for $DEV)" ;;
              *) echo "::warning::store/$DEV/$NAME.jpg is ${SIZE}, not one of the accepted sizes for $DEV ($(accepted "$DEV"))." ;;
            esac
          }
          store ipad13   01-month    ipad13-portrait-month
          store ipad13   02-week     ipad13-portrait-week
          store ipad13   03-day      ipad13-portrait-day
          store ipad13   04-year     ipad13-portrait-year
          store ipad13   05-paywall  ipad13-portrait-sheet-paywall
          store ipad13   06-settings ipad13-portrait-sheet-settings
          store iphone   01-week     iphone-portrait-week
          store iphone   02-month    iphone-portrait-month
          store iphone   03-day      iphone-portrait-day
          store iphone   04-year     iphone-portrait-year
          store iphone   05-paywall  iphone-portrait-sheet-paywall
          store iphone69 01-week     iphone69-portrait-week
          store iphone69 02-month    iphone69-portrait-month
          store iphone69 03-day      iphone69-portrait-day
          store iphone69 04-year     iphone69-portrait-year
          store iphone69 05-paywall  iphone69-portrait-sheet-paywall
          store ipad11   01-month    ipad11-portrait-month
          store ipad11   02-week     ipad11-portrait-week
          store ipad11   03-day      ipad11-portrait-day
          store ipad11   04-year     ipad11-portrait-year
          ls -la shots/store/*

      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: screenshots
          path: shots
          retention-days: 7
          if-no-files-found: warn
