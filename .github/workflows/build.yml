# Builds and tests the pure Swift package (TegakiKit) on macOS, then builds the app for the
# iOS Simulator and runs the app's unit tests on a 13-inch iPad simulator. Afterwards it launches
# the app in its screenshot mode on four simulators (docs/M4B_CONTRACT.md §6: the 13-inch iPad
# with 4 pages + 6 sheets, then an iPhone, an iPad mini and an 11-inch iPad with 4 pages each,
# booted one at a time; the iPhone also shoots the week with a Sunday 「今日」 and tries the 4 pages
# in landscape; since M4c (docs/M4C_CONTRACT.md §6) the 13-inch iPad also shoots the month, week and
# year zoomed in to twice their overview and the iPhone the week at three times, plus the week of
# 6/1, and the app logs are grepped for the canvas's `zoom:` lines; since M5 (docs/M5_CONTRACT.md §7.5,
# §7.7) a seventh sheet "paywall" and three read-only shots ("--screenshot-readonly": the 13-inch month
# with the 「閲覧専用」 badge and the toast, the 11-inch day page with the symbol-only badge, the iPhone
# week with the notice row), and the logs are grepped for the store's `store:` lines; since M6
# (docs/M6_CONTRACT.md §4.2, §7.4) an eighth sheet "export" (the export sheet in its choose state), the
# iPhone's paywall sheet, five shots on a 6.9-inch iPhone (iPhone 17 Pro Max) and a "Store listing set"
# step that converts the App Store shots into JPEGs under store/<device>/) and uploads the
# screenshots (artifact "screenshots", kept 7 days: up to 55 images + 5 logs + store/ + fixtures/) so the
# app can be looked at without Xcode. The screenshot steps never fail the job. Since 1.0.1 (docs/R1_0_1.md §5.1)
# a UI test (YearTapUITests) runs on an iPhone after the screenshots and does fail the job; its log
# and screenshots go to shots/ui-tests/ (since 1.3's wave C2 in the job ui-tests, below). Since 1.1
# (docs/M7A_CONTRACT.md §7.4, §7.5) the 13-inch iPad
# also shoots the folded toolbar (bottom left and bottom right), the eraser chosen from the toolbar, the
# grown month memo, the day's free memo below 24:00 and a ninth sheet "info" (the settings' stroke
# counts), and the iPhone the folded toolbar (portrait and landscape), the grown month memo and the
# free memo; `swift test` is followed by the check of the frozen 1.0 copy (Compat10, FROZEN.sha256);
# the unit tests write the page JSON of a missing or changed ledger-* / screenshot-* fixture into
# shots/fixtures/; and a second job, compat-v1.0, runs the 1.1 fixtures on the real 1.0 (commit
# a21e469: its TegakiKit and its app's ledger and sync engine) next to the frozen copy (K-7). Since 1.1.1
# (docs/R1_1_1.md) a third job, blank-paper, runs BlankPaperShotsUITests: the paper with no events and
# no handwriting on four devices (artifact "blank-paper", kept 7 days; that test skips itself in the UI
# test step of the first job). In the first job 1.1.1 adds two photos of the one-time pinch hint and
# HeaderAndPaperUITests, and the grown memo's photos scroll to the stroke (the paper ends far below it).
# The UI test step also runs EraserAndBelowDayUITests (since the end of 1.1, 8 tests), and "The unit tests'
# repro lines" prints the canvas tests' `repro:` lines. Since 1.2 (docs/M7B_CONTRACT.md §7.5) the macOS part
# also runs the localization lint and checks the frozen data code (DATA_1_1.sha256), "Localized bundle check"
# looks into the built app, the unit tests and every photo of the first job are in Japanese whatever the
# simulator's language is (-testLanguage ja, JA_ARGS; the photos are compared with those of
# .github/workflows/ja-baseline.yml, J-4), the UI test step also runs LanguageUITests and WeekStartUITests,
# compat-v1.0 also runs tools/weekstart-compat on the real 1.0 and the real 1.1.1, and a fourth job,
# l10n-shots, takes the other nine languages, the Sunday pages and the doubled texts (artifact
# "l10n-screenshots", kept 7 days; never fails on a photo). store-shots.yml takes the App Store's photos.
# Since 1.2.2 (docs/R1_2_2.md §6.3) the macOS part also checks that only Views/AgeRangeAsker.swift imports
# DeclaredAgeRange ("Age range isolation"), and the built app loads it weakly ("Weak link of DeclaredAgeRange").
# Since 1.3 (docs/M7C_CONTRACT.md §6.4, §10.6) the macOS part also checks that 1.2.3's tests of the one-page path
# are the bytes of 43fe366 (tools/span/TESTS_1_2_3.sha256), and KitChecks reads the compat-span fixtures; at S6 the
# frozen data code's table was made again from the submission commit (20 files, "Data code frozen (re-based in 1.3)").
# A push to the branch r13-quick, or to a branch r13-q-<track> (S5's parallel tracks, docs/M7C.md S5) (§10.6 速い確かめの
# 道) runs the first job only, without its photos, UI tests and repeated sync engine tests, and of the app's unit
# tests only the Span ones (QUICK below).
# 1.3's wave C2 (docs/M7C.md, wave C1's lead decision 7): the UI tests on an iPhone are a job of their own, ui-tests
# ("UI tests (iPhone)"), so the first job stays well inside its limit.
# The pinch hint's two photos of the first job are taken once more when they were written after the hint's 20 s (lead
# decision 6).
# A sixth job, span-shots-app ("span-shots (1.3 app)", docs/M7C_CONTRACT.md §10.5 (2)), photographs the joined pages
# of the normal app: bands, the pairs before and after a shift with their gate, the old versions' margins with their
# controls, the neighbour ink's PDF, and on r13 and r13-s5c* ten languages of the guide, 設定 › ページ and N-8. S6
# (docs/M7C_CONTRACT.md §11.1 4) took out the prototype: its job span-shots (1.3 prototype), the check that project.yml
# has no SPAN_PROTOTYPE and the test of the prototype's gate (the tag r13-proto-1 keeps them); the self-test of
# tools/shots/shift_pair.swift that ran in that job is span-shots-app's now.
# 1.4 (docs/M7D_CONTRACT.md §3, D0: only the Xcode changes): every job but compat-v1.0 runs on the image `xcode-27` with
# Xcode 27.2, chosen by what `xcodebuild -version` says (a release build; none fails the job, §3.1); compat-v1.0 stays on
# macos-26 with Xcode 26.6 (§3.9). Each job that boots a simulator first checks that the simulators of its table are there
# (§3.2: the 6.9-inch iPhone is now the iPhone 18 Pro Max, the iPad mini (A17 Pro) stays on iOS 27.0) and afterwards that
# the devices it took are the table's; a missing one fails the job instead of a warning. XcodeGen is 2.46.0 from its
# release zip, pinned by sha256 (tools/ci/install-xcodegen.sh, §3.3 4), in every job. env.txt also has the Xcode's path,
# the runner image, the runtimes, XcodeGen and Python (§3.3 3). The macOS part checks 1.3's tests and fixtures against the
# bytes of 955fe67 (tools/span/TESTS_1_3.sha256, FIXTURES_1_3.sha256, §5.5). The quick lane takes r14-quick and r14-q-*
# too (§3.10); on r14-q-m1, the branch of the app's mutations (§5.3 6, §6), it runs every unit test class and compat-v1.0
# runs too (MUTATIONS). The iPhone Duo is photographed by .github/workflows/duo.yml, never here (§3.10, 0d-45).
# 1.4's D1 (docs/M7D_CONTRACT.md §3.10): KitChecks' threshold for its two new sections ("duo (1.4)", "window & finger
# (1.4)"), the idiom watch (tools/duo/idiom_check.py, §4.1), the check that project.yml has no DUO_HINGE, D1's new unit test
# classes in the quick lane, and in compat-v1.0 the real 1.3 (955fe67) as a partner (§5.3) and a missing Xcode 26.6 failing
# the job (§3.9).
# 1.4.1's D0 (docs/R1_4_1_CONTRACT.md, CI only): the branch names of 1.4 are kept and 1.4.1's are added the same way —
# the quick lane r141-quick and r141-q-* (QUICK), the app's mutations on r141-q-m1 (MUTATIONS), the language photos on
# r141, and the branches r141-duo* left to duo.yml. J-4's reference for 1.4.1 is tools/l10n/ja-baseline-ref-1.4.1.txt
# (2fb8fb1, TestFlight 1.4 build 28).
# 1.4.2's D0 (docs/R1_4_2_CONTRACT.md §6.5, §9.1 D0, 0f-27, 0f-28; CI only): the names of 1.4 and 1.4.1 are kept and
# 1.4.2's are added the same way — the quick lane r142-quick and r142-q-* and, new in 1.4.2, the work branches r142-w-*
# (QUICK: a work branch pushed for its own check runs the quick lane only and never a full run; in 1.4.1 a push of an
# r141-w-* branch started a full run that took the runners of another, docs/R1_4_1.md, P1), the app's mutations on
# r142-q-m1 (MUTATIONS; compat-v1.0 runs there too), the language photos on r142, and the branches r142-duo* left to
# duo.yml. The quick lane also names 1.4.2's new unit test classes (§6.1), and the 16 test files 1.4.1 added are frozen at
# the bytes of fbd1f7a in tools/span/TESTS_1_4_1.sha256 (§5.5). J-4's reference for 1.4.2 is
# tools/l10n/ja-baseline-ref-1.4.2.txt (fbd1f7a, 1.4.1's build 31).
# 1.4.3's D0 (docs/R1_4_3_CONTRACT.md §12.1, §12.2, §8.5, §14.1 D0, 0g-29, 0g-40, 0g-41; CI only): the names of 1.4,
# 1.4.1 and 1.4.2 are kept and 1.4.3's are added the same way — the quick lane r143-quick, r143-q-* and the work
# branches r143-w-* (QUICK and the jobs' if:), the app's mutations on r143-q-m1 (MUTATIONS; compat-v1.0 runs there too),
# the language photos on r143, and the branches r143-duo* left to duo.yml. The quick lane also names 1.4.3's new unit
# test classes (§11.2), and the 15 test files 1.4.2 added are frozen at the bytes of 57ffd0f in
# tools/span/TESTS_1_4_2.sha256 (§8.5). J-4's reference for 1.4.3 is tools/l10n/ja-baseline-ref-1.4.3.txt (57ffd0f,
# 1.4.2's build 32).
# 1.4.3's D1b (docs/R1_4_3_CONTRACT.md §11.3, §12.1, §12.4): the UI test step also runs SpanMonthYearUITests (`span-my UI:`;
# its step 55 min and its job 70), and a seventh job, span-shots-my, photographs the joined months (24 photos and a PDF on
# four devices, artifact "span-shots-my", kept 7 days; outside J-4 and ja-baseline.yml). It `needs` compat-v1.0, so it
# takes a runner only after the six others had theirs (macOS runs 5 jobs at once). D1y (§11.3, §12.1, §12.4) adds the
# years: SpanMonthYearUITests' year (its step 60 min and its job 75), span-shots-my's 22 photos of the joined year (46 in
# all, the PDF still the month's one; its photos' step 140 min and its job 160), and the unit tests' `span weight:` lines
# (SpanWeightLogTests, §3.10) in the summary of the step after them.
# Nothing here touches iCloud: the Simulator build is unsigned (the entitlements are not embedded)
# and the test host / screenshot mode use the in-memory fake database.
# Public repository → GitHub-hosted macOS runners are free.
name: build

on:
  push:
    # The two branches only exist to start ja-baseline.yml and store-shots.yml with the commit of m7b
    # (docs/M7B_CONTRACT.md §7.5, 0-40); the same CI on them would only take the runners.
    branches-ignore:
      - ja-baseline
      - store-shots
      # 1.4 (docs/M7D_CONTRACT.md §3.10, 0d-45): the branches r14-duo* start .github/workflows/duo.yml (the iPhone Duo's
      # jobs; r14-duo-m1 holds the UI mutations, §6); this workflow's six jobs on them as well would pass the five macOS
      # jobs that run at once.
      - 'r14-duo*'
      # 1.4.1 (docs/R1_4_1_CONTRACT.md, D0): the same for r141-duo*.
      - 'r141-duo*'
      # 1.4.2 (docs/R1_4_2_CONTRACT.md §6.5, D0): the same for r142-duo*.
      - 'r142-duo*'
      # 1.4.3 (docs/R1_4_3_CONTRACT.md §12.1, D0): the same for r143-duo*.
      - 'r143-duo*'
  pull_request:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: Build and test (iOS Simulator)
    # 1.4 (docs/M7D_CONTRACT.md §3.1, §3.3 1, 0d-2): the image with Xcode 27 (macos-26 and macos-15 do not get it).
    runs-on: xcode-27
    # 1.1: 75 → 90 (1.0.1's run took 56 min; 1.1 adds Compat10Tests, more unit tests and 10 shots, and a
    # simulator boot alone has taken 4 min). 1.1 fix, the lead's review: kept at 90. The last runs took
    # 52 min (run 41195642254) and 56 min (1.0.1), their UI test step about 4 min (estimated: the boot,
    # the 60 s wait, YearTapUITests' 97 s); the 8 new UI tests make that step about 7 min, its own limit
    # of 25 min adds at most 21 min to those runs (≈ 77 min), and the new unit tests well under a minute.
    # 1.2 (docs/M7B_CONTRACT.md §7.5): 90 → 110. The UI test step may now take 40 min (below). The longest
    # run so far is 1.1.1's 67.9 min with a UI test step of 11.9 (run 41922318959; e7b4d2f took 57.6, run
    # 41264726309): 67.9 − 11.9 + 3 (the lint, the data check, the bundle check, 2 more sheets, the new unit
    # tests) + 2 (the 13-inch iPad's wait) + 40 = 101, and 9 min for a slow boot (one alone has taken 4 min).
    # A job cut by this limit does not reach "Upload screenshots", so J-4's photos and the UI tests' log would
    # be lost with it. 1.2.3 (docs/R1_2_3.md §4): 110 → 120 for the repeated sync engine tests (a step of at
    # most 9 min: 101 + 9 = 110, and the slow boot's margin kept).
    # 1.3 (docs/M7C.md, wave C1's lead decision 7): 120 → 90. The UI tests and their build are the job ui-tests now
    # (below). Without them the runs of 11/14 took 79.7 − 15.4 − 1.4 = 62.9 min (run 43584152837), 82.0 − 17.3 − 1.4 =
    # 63.3 (43570477701) and at most about 93.1 − 19.4 − 2 = 72 (43552123427, the slowest runner): 90 keeps 18 min over
    # the slowest, as the old limit kept about that over the old steps.
    # 1.4 (docs/M7D_CONTRACT.md §3.3 9): 90 → 110 for D0. 1.3's last run (44474759145) took 72.2 min, and a simulator's
    # first boot on the new image takes minutes ([S4]); D0 measures it, and D1 brings the limit back if there is room.
    # 1.4 D0b (docs/M7D_CONTRACT.md §3.3 9, §3.8; docs/M7D.md, D0b): 110 → 160. D0 (run 44632524223, image
    # 20261119.0378.1) was cut by 110 in the photos of the other devices, the iPad mini's 8th photo, and the iPad Air
    # 11-inch not begun. Measured there (1.3's 44474759145 in brackets): up to the unit tests 6.4 min (5.6), the unit
    # tests 25.2 (10.5; 15.0 of it from "Testing started" to the test host, the 13-inch's first boot inside xcodebuild
    # with a 120 s lockdown time-out, 3.1 in 1.3), "Boot the simulator" 5.2 (2.9), the 13-inch's photos, sheets and log
    # 16.6 (10.3), each other device 17.5–20.4 (8.0–12.1; its `simctl boot` alone 4.7–10.6, 0.6–0.8). At that pace the
    # job is 6.4 + 25.2 + 9.4 (the repeated sync tests, skipped in D0 after the red unit tests: 5.7 in 1.3, its boot
    # slower) + 5.7 + 16.6 + 75 (the four devices) + 2.7 (the store set, the upload, the check) ≈ 141 min; 160 keeps
    # about 19 over it, as 1.3's 90 kept 18 over its slowest. The photos' handwriting retakes (§3.5 (f),
    # tools/shots/ink_retake.sh) can add about 9.5 more at that pace when many photos are short (180 s a step and the
    # takes under way, the pinch hints' second takes), which leaves about 9.5. D1 brings it back when the runs measure
    # less (§3.3 9).
    timeout-minutes: 160
    env:
      HOMEBREW_NO_AUTO_UPDATE: "1"
      HOMEBREW_NO_INSTALL_CLEANUP: "1"
      NSUnbufferedIO: "YES"
      # 1.3 (docs/M7C_CONTRACT.md §10.6 速い確かめの道): "true" on a push to the branch r13-quick or to a branch
      # r13-q-<track> (S5's parallel tracks; concurrency is per ref, so the tracks do not stop each other), "false"
      # anywhere else. Then this job builds and runs KitChecks, the Kit's tests (CompatSpanTests among them) and the checks
      # of the macOS part (seconds), and of the app's unit tests only the Span ones ("Run unit tests on the
      # simulator"); the repeated sync engine tests, the photos and the UI tests are skipped (`env.QUICK`), and the
      # other jobs do not run (their `if:` leaves out r13-quick and r13-q-*). S5 runs there; r13 and main run
      # everything.
      # 1.4 (docs/M7D_CONTRACT.md §3.10): also on r14-quick and r14-q-<name> (D1's lane, and r14-q-m1 for the app's
      # mutations, §6); r13's names stay.
      # 1.4.2 (docs/R1_4_2_CONTRACT.md §6.5, 0f-27): also on r142-quick, r142-q-<name> and the work branches r142-w-<name>
      # (a role's branch, pushed for its own check: the quick lane only, never a full run); the older names stay.
      # 1.4.3 (docs/R1_4_3_CONTRACT.md §12.1, 0g-40): r143-quick, r143-q-<name> and the work branches r143-w-<name> the
      # same way; the older names stay.
      QUICK: ${{ github.ref_name == 'r13-quick' || startsWith(github.ref_name, 'r13-q-') || github.ref_name == 'r14-quick' || startsWith(github.ref_name, 'r14-q-') || github.ref_name == 'r141-quick' || startsWith(github.ref_name, 'r141-q-') || github.ref_name == 'r142-quick' || startsWith(github.ref_name, 'r142-q-') || startsWith(github.ref_name, 'r142-w-') || github.ref_name == 'r143-quick' || startsWith(github.ref_name, 'r143-q-') || startsWith(github.ref_name, 'r143-w-') }}
      # 1.4 (docs/M7D_CONTRACT.md §3.10, §5.3 6, §6): "true" on r14-q-m1 only, the quick branch that holds all the app's
      # mutations at once. They are caught by unit test classes that are not Span ones (WindowClassTests, PencilPhoneTests,
      # CappedOverviewWideTests, DuoFoldTests, …) and by compat-v1.0 (Real13LedgerTests), so there "Run unit tests on the
      # simulator" runs every class and compat-v1.0 runs; the photos, the repeated sync engine tests and the other jobs stay
      # off, as on every quick branch. 1.4.2 (docs/R1_4_2_CONTRACT.md §6.4, §6.5): r142-q-m1 the same way.
      # 1.4.3 (docs/R1_4_3_CONTRACT.md §11.5, §12.1): r143-q-m1 the same way.
      MUTATIONS: ${{ github.ref_name == 'r14-q-m1' || github.ref_name == 'r141-q-m1' || github.ref_name == 'r142-q-m1' || github.ref_name == 'r143-q-m1' }}
      # J-4 (docs/M7B_CONTRACT.md §1.3, §7.5, 0-25): every screenshot launch ends with these, as in
      # ja-baseline.yml (the runner's simulator is English; without them the app would be in English since
      # 1.2 and the kanji would fall back to PingFang SC). Expanded unquoted on purpose: four words, none
      # with a space.
      JA_ARGS: "-AppleLanguages (ja) -AppleLocale ja_JP"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # 1.4 (docs/M7D_CONTRACT.md §3.1, 0d-1): Xcode 27.2, chosen by what each candidate says it is, never by its path.
      # Every /Applications/Xcode_27.2*.app is read with `xcodebuild -version` (DEVELOPER_DIR set to it); one whose version is
      # 27.2 or 27.2.x and whose build ends in a digit is a release (a beta's build ends in a lower-case letter, as 27.3
      # beta's 27C5020n; the rolling-out image 20261119 gives that beta aliases named like a release, §3.1), and the newest
      # release is selected. None fails the job: until 1.3 this step chose Xcode 26.6 only when it was there and otherwise
      # went on with the image's default Xcode, unseen. Then `sudo xcodebuild -runFirstLaunch` (harmless when it has run).
      # The same lines in every job on xcode-27 (build.yml, ja-baseline.yml, store-shots.yml, testflight.yml, duo.yml).
      - name: Select Xcode 27.2
        run: |
          set -euo pipefail
          XCODE="$(python3 -I -c '
          import glob, os, re, subprocess, sys
          def key(version, build):                               # (27, 2, 0), then the build: digits as numbers
              numbers = tuple((int(p) for p in version.split("."))) + (0, 0, 0)
              return numbers[:3], tuple((0, int(t)) if t.isdigit() else (1, t) for t in re.findall(r"[0-9]+|[^0-9]+", build))
          best = None
          seen = {}
          for app in sorted(glob.glob("/Applications/Xcode_27.2*.app")):
              real = os.path.realpath(app)
              if real in seen:
                  print("%s: the same Xcode as %s" % (app, seen[real]), file=sys.stderr)
                  continue
              seen[real] = app
              env = dict(os.environ, DEVELOPER_DIR=os.path.join(real, "Contents", "Developer"))
              try:
                  out = subprocess.run(["xcodebuild", "-version"], env=env, capture_output=True, text=True, timeout=300).stdout
              except Exception as error:
                  print("%s: xcodebuild -version failed (%s)" % (app, error), file=sys.stderr)
                  continue
              version = re.search(r"^Xcode ([0-9.]+)$", out, re.M)
              build = re.search(r"^Build version ([0-9A-Za-z]+)$", out, re.M)
              version = version.group(1) if version else "?"
              build = build.group(1) if build else "?"
              release = re.fullmatch(r"27\.2(\.[0-9]+)?", version) is not None and re.search(r"[0-9]$", build) is not None
              print("%s (%s): Xcode %s, build %s%s" % (app, real, version, build, ": a release of 27.2" if release else ": not a release of 27.2"), file=sys.stderr)
              if release and (best is None or key(version, build) > best[0]):
                  best = (key(version, build), real)
          print(best[1] if best else "")
          ')"
          if [ -z "$XCODE" ]; then
            echo "::error::No release of Xcode 27.2 in /Applications (xcodebuild -version 27.2 or 27.2.x, its build ending in a digit; docs/M7D_CONTRACT.md §3.1). The job does not go on with another Xcode."
            exit 1
          fi
          echo "Selected: $XCODE"
          sudo xcode-select -s "$XCODE"
          sudo xcodebuild -runFirstLaunch
          xcode-select -p
          xcodebuild -version
          echo "runner image: ${ImageOS:-?} ${ImageVersion:-?}"

      # 1.4 (docs/M7D_CONTRACT.md §3.2, 0d-3): the simulators of the table that this job uses must be on the runner, each
      # under its exact name on its runtime (iOS 27.2; the iPad mini (A17 Pro) is on iOS 27.0 only; the iPhone Duo on the
      # Duo's iOS 27.2 runtime). One that is missing fails the job here: until 1.3 a missing device was a warning ("No
      # simulator for …; skipping") and the job stayed green, so all the 6.9-inch photos could be gone unseen. Each one's
      # UDID is an output of this step (steps.required.outputs.<id>); the table and the runtime (name and build) each one
      # resolved to go to $RUNNER_TEMP for "The simulators used are the table's" after the photos, and the UDIDs to
      # $RUNNER_TEMP/required-simulators-udids.txt, which the pickers of the later steps take first (so they boot the very
      # devices checked here). When the name is on two runtimes of that version (iOS 27.2 has two sets, the usual devices'
      # and the iPhone Duo's, §3.1), every other device is taken from the runtime with no iPhone Duo and the iPhone Duo from
      # the runtime of iPhone Duos only; a warning only when nothing tells the runtimes apart. The same lines in every job
      # that boots a simulator; only the table differs.
      - name: Required simulators (1.4)
        id: required
        env:
          # <id>|<exact name>|<runtime version> (docs/M7D_CONTRACT.md §3.2)
          REQUIRED: |
            ipad13|iPad Pro 13-inch (M5)|27.2
            iphone|iPhone 17|27.2
            iphone69|iPhone 18 Pro Max|27.2
            ipadmini|iPad mini (A17 Pro)|27.0
            ipad11|iPad Pro 11-inch (M5)|27.2
        run: |
          set -euo pipefail
          printf '%s\n' "$REQUIRED" | grep -v '^[[:space:]]*$' > "$RUNNER_TEMP/required-simulators.txt"
          xcrun simctl list -j > "$RUNNER_TEMP/simctl-list.json"
          python3 -I - "$RUNNER_TEMP/simctl-list.json" "$RUNNER_TEMP/required-simulators.txt" <<'EOF'
          import json, os, re, sys
          data = json.load(open(sys.argv[1], encoding="utf-8"))
          runtimes = {r.get("identifier"): r for r in data.get("runtimes", [])}
          def version(runtime):                                  # the runtime's "version" ("27.2"), else from its identifier
              v = runtimes.get(runtime, {}).get("version")
              if v:
                  return v
              m = re.search(r"iOS-([0-9]+)-([0-9]+)", runtime)
              return "%s.%s" % m.groups() if m else "?"
          devices = {runtime: [d for d in items if d.get("isAvailable") and d.get("name") and d.get("udid")]
                     for runtime, items in data.get("devices", {}).items() if "iOS" in runtime}
          def duos(runtime):                                     # 0: iPhone Duos only, 1: some, 2: none
              n = sum(d["name"].startswith("iPhone Duo") for d in devices[runtime])
              return 0 if n == len(devices[runtime]) else 1 if n else 2
          failed = False
          outputs = []
          resolved = []
          for line in open(sys.argv[2], encoding="utf-8"):
              ident, name, want = [p.strip() for p in line.rstrip("\n").split("|")]
              def wanted(runtime):
                  return version(runtime) == want or version(runtime).startswith(want + ".")
              # The runtime that suits the name first: for the iPhone Duo the one of iPhone Duos only (the Duo's own iOS 27.2
              # set), for every other device the one with no iPhone Duo (§3.1); then a runtime with some iPhone Duos.
              found = sorted((duos(runtime) if name.startswith("iPhone Duo") else 2 - duos(runtime), runtime, d["udid"])
                             for runtime, items in devices.items() if wanted(runtime) for d in items if d["name"] == name)
              if not found:
                  there = sorted({d["name"] for runtime, items in devices.items() if wanted(runtime) for d in items})
                  print("::error::%s: no available simulator \"%s\" on iOS %s (docs/M7D_CONTRACT.md §3.2). The devices of iOS %s: %s"
                        % (ident, name, want, want, ", ".join(there) or "none (no such runtime)"))
                  failed = True
                  continue
              _, runtime, udid = found[0]
              r = runtimes.get(runtime, {})
              print("%s: %s | %s (%s) %s" % (ident, name, r.get("name", runtime), r.get("buildversion", "?"), udid))
              if len(found) > 1:
                  tie = found[0][0] == found[1][0]
                  print("%s%s: \"%s\" is on %d runtimes of iOS %s (%s); %s is taken (%s)."
                        % ("::warning::" if tie else "", ident, name, len(found), want, ", ".join(f[1] for f in found), runtime,
                           "nothing tells them apart: the first by its identifier" if tie
                           else "iPhone Duos only" if name.startswith("iPhone Duo") else "no iPhone Duo"))
              outputs.append("%s=%s\n" % (ident, udid))
              resolved.append("%s|%s|%s|%s\n" % (ident, name, r.get("name", runtime), r.get("buildversion", "?")))
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as out:
              out.write("".join(outputs))
          with open(sys.argv[2].replace(".txt", "-resolved.txt"), "w", encoding="utf-8") as out:
              out.write("".join(resolved))
          with open(sys.argv[2].replace(".txt", "-udids.txt"), "w", encoding="utf-8") as out:
              out.write("".join(o.split("=", 1)[1] for o in outputs))
          sys.exit(1 if failed else 0)
          EOF

      # The pure modules (TegakiKit: DayKit / Holidays / Layout / InkModel) build and test on macOS
      # itself, before anything touches the Simulator. KitChecks is the same check set that runs on
      # the owner's Mac without Xcode (docs/M2_CONTRACT.md §8); `swift test` runs the XCTest targets.
      - name: Build TegakiKit (macOS)
        run: |
          set -euo pipefail
          swift --version
          swift build --package-path TegakiKit

      # The count is checked as a number (docs/M4B_CONTRACT.md §7.1, M4B-9; docs/M4C_CONTRACT.md §6,
      # M4C-10; docs/M5_CONTRACT.md §7.4, M5-25; docs/M6_CONTRACT.md §7.1, M6-18; docs/M7A_CONTRACT.md
      # §7.1): 1.1 counts 24446 (1.0.1's 23446 + 578 for the "growing paper", "date taps" and "stroke
      # budget (1.1)" sections + 278 for "compat with 1.0 (K-7)" on K's fixtures + 144 for the 8
      # fixtures of the ledger and the screenshot mode); 1.1.1 (docs/R1_1_1.md) counts 24929 (+ 244 for
      # the loops over the taller paper + 239 for the changed checks and the section "opening zoom and
      # top-aligned paper (1.1.1)"); 1.2 (docs/M7B_CONTRACT.md §7.1, §10.8; the split is in docs/M7B.md, K2)
      # counts 29470 (+ 4541 for the sections "languages", "kit strings", "date text", "holidays", "holiday
      # geometry" and "week start"); 1.2.1 (docs/R1_2_1.md §2.7) counts 29504 (+ 34 for the section "review
      # prompt (1.2.1)"); 1.2.2 (docs/R1_2_2.md §6.1) counts 29982 (+ 478 for the section "age range (1.2.2)"),
      # and 1.2.3 keeps it; 1.3 (docs/M7C_CONTRACT.md §10.1; the split is in docs/M7C.md) counts 36968 (+ 819
      # for the section "span (1.3)": the joined pages' names, plan, window table, bottom floors and layout,
      # + 6167 for "span ink (1.3)": the save guard, the composer and its page deltas (the safety net tried
      # without each of the random edits' deltas in turn), and the 13 compat-span fixtures of
      # TegakiKit/Tests/Fixtures/compat-span read byte for byte and through the frozen 1.0 copy); with the week
      # memo (§5; docs/M7C.md, 週のメモ) 1.3 counts 38060 (+ 1021 for the section "week memo (1.3)": 1.2.3's week
      # without the memo, the memo's shape, cells, events, growth, overview, floors, window and names; + 71 in "span
      # ink (1.3)" for fixture 4's three files, so 16 compat-span files in all); with the iPhone's landscape overview
      # cap (§3.6, P-B6 イ; docs/M7C.md) 1.3 counts 40020 (+ 1960 for "overview cap (1.3)": the rule, the capped
      # window table, the zoom limits, the all-day lanes, the paper area's own orientation, the iPads and cappedBounds).
      # 1.4 (docs/M7D_CONTRACT.md §4.6, §6; D1) counts 40794 (+ 345 for "duo (1.4)": the Duo's paper areas, measured or
      # estimated, on the iPhone's plan with and without the cap, their V, R, largest window and lowest zoom, the all-day
      # band at 35 %, the 1.3-against-1.4 rows at the border; + 429 for "window & finger (1.4)": WindowClass (isWide,
      # openingKind, usesFormSheet, capsOverview, Opening) and FingerDefault (origin, every row of §4.8's table, the
      # rollback, the order, touches)); each of the two also prints "<n> checks in this section", a line that is not a check.
      # With the outer screen measured (D1d, §4.2: duo-shots run 44696154794) 1.4 counts 40826: "duo (1.4)" has 377 (+ 32:
      # 4 measured outer rows of 10 checks for the 8 estimated ones, − 40, and the 9 measure lines as CI printed them, 8
      # checks each, + 72; the inner screen's rows stay estimates, path 3).
      # 1.4.3 (docs/R1_4_3_CONTRACT.md §11.1, §8.3; D1a) counts 42380 (+ 1397 for "span month & year (1.4.3)": the
      # month's and the year's floors, the three month forms, the caps, the floor policy and scrollDelta across a shift;
      # + 157 for "compat-span-143 (1.4.3)": the fixtures 8-13 the Kit's joined path writes). The lead raised the
      # threshold with this count (docs/R1_4_3.md, D1a), as 1.3 and 1.4 did; D1b and D1y read it again.
      # The threshold is that number minus 50, so anything below 42330 means a section or a fixture went missing.
      - name: Run KitChecks (macOS)
        run: |
          set -euo pipefail
          swift run --package-path TegakiKit KitChecks 2>&1 | tee kitchecks.log
          N="$(grep -oE 'all [0-9]+ checks passed' kitchecks.log | grep -oE '[0-9]+' | tail -1)"
          echo "KitChecks count: ${N:-0} (required: 42330 or more)"
          grep -E 'compat10( with compat-span(-143)?)?: [0-9]+ checks' kitchecks.log || true
          test "${N:-0}" -ge 42330

      # 1.3 (docs/M7C_CONTRACT.md §4.2, §6.3): KitChecks compares the committed compat-span fixtures with what
      # the Kit's joined path writes and fails when one is missing or differs. Then, as the unit tests do for
      # compat11 (TEGAKI_FIXTURE_OUT, below), the files the Kit writes here go into shots/fixtures/compat-span
      # (uploaded with the screenshots) for the lead to read; the committed ones are made again on a Mac with
      # `swift run --package-path TegakiKit KitChecks --write-compat-span-fixtures`. Only after a red step,
      # only when a compat-span check failed; never fails the job itself. 1.4.3: the pattern ends in ':' or ' '
      # ("compat-span:", "compat-span 4:", "compat-span 1.0:"), so a failed compat-span-143 check (the next step's) does
      # not run this one.
      - name: The compat-span fixtures the Kit writes (after a failed KitChecks)
        if: failure()
        continue-on-error: true
        run: |
          set -euo pipefail
          if grep -qE 'FAIL: compat-span[: ]' kitchecks.log 2>/dev/null; then
            mkdir -p shots/fixtures/compat-span
            swift run --package-path TegakiKit KitChecks --write-compat-span-fixtures --out shots/fixtures/compat-span
          else
            echo "No compat-span check failed."
          fi

      # 1.4.3 (docs/R1_4_3_CONTRACT.md §8.3, 0g-30): the same for the compat-span-143 fixtures (the month and the year joined
      # sideways, KitChecks' section "compat-span-143 (1.4.3)"): after a red step, when one of its checks failed, the files the
      # Kit writes go into shots/fixtures/compat-span-143 for the lead to read; made again on a Mac with
      # `swift run --package-path TegakiKit KitChecks --write-compat-span-143-fixtures`. Never fails the job itself.
      - name: The compat-span-143 fixtures the Kit writes (after a failed KitChecks)
        if: failure()
        continue-on-error: true
        run: |
          set -euo pipefail
          if grep -q 'FAIL: compat-span-143' kitchecks.log 2>/dev/null; then
            mkdir -p shots/fixtures/compat-span-143
            swift run --package-path TegakiKit KitChecks --write-compat-span-143-fixtures --out shots/fixtures/compat-span-143
          else
            echo "No compat-span-143 check failed."
          fi

      - name: Test TegakiKit (macOS)
        run: |
          set -euo pipefail
          swift test --package-path TegakiKit

      # 1.1 (docs/M7A_CONTRACT.md §1.4, §7.4, K-7): the frozen copy of 1.0's InkModel (TegakiKit/Tests/
      # Compat10, made from commit a21e469) is never edited; FROZEN.sha256 lists its 11 files (not
      # Checks/), so every line is found in that directory. The compat-v1.0 job below checks the copy
      # against the real 1.0.
      - name: Frozen 1.0 copy
        run: |
          set -euo pipefail
          cd TegakiKit/Tests/Compat10 && shasum -a 256 -c FROZEN.sha256

      # 1.2 (docs/M7B_CONTRACT.md §2.7): the 14 rules on the languages (no Japanese outside the keys, every
      # key in ten languages, the generated files are what the sources give, the week start reaches every
      # call, the store's texts). L-12 only warns. No git, no writes.
      - name: Localization lint
        run: |
          set -euo pipefail
          python3 -I tools/l10n/lint.py .

      # 1.2.2 (docs/R1_2_2.md §6.3): Apple's DeclaredAgeRange (iOS 26) is imported by one file only
      # (Views/AgeRangeAsker.swift, behind #available), the entitlements file asks for it (read with
      # PlistBuddy: `plutil -extract` reads every '.' of the key as a separator, §4), and the mark of the
      # check build (AGE_FORCE, §6.4; testflight.yml's input `age_force`) never gets into project.yml.
      - name: Age range isolation
        run: |
          set -euo pipefail
          FILES="$(grep -rl --include='*.swift' '^import DeclaredAgeRange' Sources Tests TegakiKit | sort || true)"
          echo "import DeclaredAgeRange: ${FILES:-none}"
          if [ "$FILES" != "Sources/TegakiCalendar/Views/AgeRangeAsker.swift" ]; then
            echo "::error::import DeclaredAgeRange は Sources/TegakiCalendar/Views/AgeRangeAsker.swift の 1 つだけにしてください（docs/R1_2_2.md §3.8）。"
            exit 1
          fi
          ENT="$(/usr/libexec/PlistBuddy -c 'Print :com.apple.developer.declared-age-range' Support/TegakiCalendar.entitlements 2>/dev/null || echo missing)"
          echo "entitlements: declared-age-range $ENT"
          if [ "$ENT" != "true" ]; then
            echo "::error::Support/TegakiCalendar.entitlements に com.apple.developer.declared-age-range（true）がありません（docs/R1_2_2.md §3.8）。"
            exit 1
          fi
          if grep -n 'AGE_FORCE' project.yml; then
            echo "::error::project.yml に AGE_FORCE があります。確かめ用のビルドの印は testflight.yml の入力 age_force だけで付けます（docs/R1_2_2.md §6.4）。"
            exit 1
          fi
          echo "AGE_FORCE: not in project.yml"

      # 1.4 (docs/M7D_CONTRACT.md §3.10, §4.9, §6): the mark of the hinge's UI tests (DUO_HINGE: DuoHingeUITests is compiled
      # only with it) is given by duo.yml's job duo-hinge alone, on its xcodebuild line; it never gets into project.yml, so
      # no other build (this one, TestFlight's) compiles those tests. The same shape as the AGE_FORCE check above.
      - name: The hinge tests' mark (1.4)
        run: |
          set -euo pipefail
          if grep -n 'DUO_HINGE' project.yml; then
            echo "::error::project.yml に DUO_HINGE があります。開閉の UI テストの印は duo.yml の duo-hinge のジョブだけで付けます（docs/M7D_CONTRACT.md §3.10）。"
            exit 1
          fi
          echo "DUO_HINGE: not in project.yml"

      # 1.4 (docs/M7D_CONTRACT.md §4.1, 0d-19): the layout goes by the window's size and the iPhone Duo is told by the
      # Pencil's touch and the hinge, never by the kind of device. tools/duo/idiom_check.py reads the code of every Swift file
      # of Sources/TegakiCalendar but the 20 frozen ones (tools/l10n/lint-skip.txt) and fails on a line that reads the idiom,
      # the interface orientation or the device's orientation without a row in tools/duo/idiom-allow.txt (the list is
      # exactly the code's: a row that covers no line fails too), and on any UIScreen.main or model name (utsname,
      # hw.machine, UIDevice.current.model, "iPhone1…9), which never go on the list. Its self-test first (made-up files it
      # must pass and fail). No git, no writes.
      - name: The idiom watch (1.4)
        run: |
          set -euo pipefail
          python3 -I tools/duo/idiom_check.py --self-test
          python3 -I tools/duo/idiom_check.py --list .

      # 1.2 (docs/M7B_CONTRACT.md §1.1 D14, §1.5, 0-47): the files of the handwriting's data are frozen. Until 1.3
      # the table held 18 files at the bytes of 1.1.1, except Sync/SyncEngine.swift, whose line was 1.2.3's
      # (docs/R1_2_3.md §3.10) and then that of the H4 and G4 fixes (docs/M7B.md).
      # 1.3 (docs/M7C_CONTRACT.md §6.4, D9): while 1.3 was made, the four files it may change (Ink/InkLedger.swift,
      # Ink/InkCanvasView.swift, Ink/InkOverlayView.swift, Sync/SyncEngine.swift) got their row rewritten in the commit
      # that changed them (step 2). At the submission (S6, steps 4–5) the table was made again from that commit's own
      # tree, paths from the repository's top, sorted, no comment lines: the 18 files at 1.3's bytes (InkLedger.swift,
      # InkCanvasView.swift and SyncEngine.swift differ from 43fe366, the 15 others are its bytes) and the two InkModel
      # files 1.3 added, SpanGuard.swift and SpanComposer.swift: 20 rows, and tools/l10n/lint-skip.txt lists the same 20
      # (frozen for 1.4, so the lint does not read them). The base commit is in docs/M7C.md. A change to one of the 20
      # before 1.3 is submitted makes the table again in its last commit, and the lint is run on it by hand first, with
      # the changed files taken out of lint-skip.txt for that run only (L-7, L-8, L-13 and L-14 would not read their new
      # code otherwise; review S6-RM-5); from 1.4 the version that touches the handwriting's data takes the real 1.3
      # (the base commit) as a compatibility partner too (§6.4). The file keeps its name (D9: this step reads it by name).
      - name: Data code frozen (re-based in 1.4.1 and 1.4.3)
        run: |
          set -euo pipefail
          shasum -a 256 -c tools/compat10/DATA_1_1.sha256

      # 1.3 (docs/M7C_CONTRACT.md §6.4, D9): the 8 test files of 1.2.3 that guard the one-page path (6 of the
      # app's unit tests, PaperGrowthTests and Compat10FixtureTests) are the bytes of commit 43fe366, so the new
      # path never passes by rewriting the old tests; new tests go into new files (§10.2). One exception, the lead's
      # (11/15): SyncEngineTests.swift, whose two expected call lists test16 and test23 G4 changed (M4_CONTRACT §8.2
      # 16, 23: the account is confirmed before a zone recovery and before 「全て消す」); nothing else in it.
      - name: The tests of 1.2.3 unchanged (1.3)
        run: |
          set -euo pipefail
          shasum -a 256 -c tools/span/TESTS_1_2_3.sha256

      # 1.4 (docs/M7D_CONTRACT.md §5.5, 0d-17): the test files that 1.2.4 and 1.3 added to guard the data, the sync, the
      # ledger, the canvas, the joined pages, the screenshot mode, the guide's cards and the settings, the older tests of what
      # 1.4 touches (PaperView, SpanPlan, the screenshot mode, the cards' record), the compat-span tests and four sections of
      # KitChecks are the bytes of 955fe67 (1.3, build 26), so a test that fails with the new SDK is not passed by rewriting
      # it (§5.5 (a)(b) say when a row may change: in its own commit, with the run and the reason in docs/M7D.md). 29 rows,
      # each made from 955fe67's blob with §5.5's printf line, not from a tree; 1.2.3's 8 files stay in TESTS_1_2_3.
      - name: 1.3's tests unchanged (TESTS_1_3)
        run: |
          set -euo pipefail
          shasum -a 256 -c tools/span/TESTS_1_3.sha256

      # 1.4.2 (docs/R1_4_2_CONTRACT.md §5.5, 0f-28): the 16 test files that 1.4.1 added and 1.4.2 has no reason to rewrite
      # (13 unit tests: the header, the hand, 等倍, the toolbar's edge, grip and 「動かす」, the screenshot mode's hand and
      # palette; 3 UI tests: HeaderRoomUITests, PaletteMoveUITests, ZoomResetUITests) are the bytes of fbd1f7a (1.4.1 as
      # released, build 31), so 1.4.2's work on ToolbarView, ToolbarLogic and CalendarRootScreen never passes by weakening
      # them: a test of the table that fails is answered in the code, and a test found wrong stops the work for the lead's
      # decision (§5.5). Left out: PaletteShotsUITests (1.4.2 adds its photos) and the files 1.4.1 rewrote. 16 rows, each made
      # from fbd1f7a's blob with M7D_CONTRACT §5.5's printf line, sorted; TESTS_1_3, TESTS_1_2_3 and FIXTURES_1_3 stay.
      - name: 1.4.1 tests frozen (1.4.2)
        run: |
          set -euo pipefail
          shasum -a 256 -c tools/span/TESTS_1_4_1.sha256

      # 1.4.3 (docs/R1_4_3_CONTRACT.md §8.5, 0g-29): the 15 test files that 1.4.2 added (11 unit tests: the pen colours'
      # slots, panel, rim and round trip, the memo paper's style, drawing and redrawing, the screen's wiring of the colour
      # panel, the screenshot mode's colours and memo paper; 4 UI tests: ColorPanelPadUITests, ColorPanelUITests,
      # MemoPaperShotsUITests, MemoPaperUITests) are the bytes of 57ffd0f (1.4.2 as released, build 32), so 1.4.3's work on
      # the month's paper (memo.minY, from which MonthPaper draws its lines and dots) and the screen never passes by
      # weakening them: a test of the table that fails is answered in the code, and a test found wrong stops the work for
      # the lead's decision. None is left out (1.4.3 adds no photo row to any of them). 15 rows, each made from 57ffd0f's
      # blob with M7D_CONTRACT §5.5's printf line, sorted; TESTS_1_4_1, TESTS_1_3, TESTS_1_2_3 and FIXTURES_1_3 stay.
      - name: 1.4.2 tests frozen (1.4.3)
        run: |
          set -euo pipefail
          shasum -a 256 -c tools/span/TESTS_1_4_2.sha256

      # 1.4 (§5.5): every file of the folders compat11, compat-span (with its MANIFEST) and CompatFixtures and the two
      # EXPECTED_MIN are the bytes of 955fe67 (37 rows; until 1.4 only Compat10's FROZEN.sha256, DATA_1_1 and TESTS_1_2_3
      # were checked by hash, and the JSON could be written again from TEGAKI_FIXTURE_OUT). The three folders also hold
      # exactly the table's files: 1.4 makes no new fixture (§5.1), so a file added or taken away fails as well. A folder's
      # files are git's, tracked or untracked but not ignored (compat11's large y-2026.* are made again on every run and
      # ignored by its .gitignore, which is one of the rows).
      - name: 1.3's fixtures unchanged (FIXTURES_1_3)
        run: |
          set -euo pipefail
          shasum -a 256 -c tools/span/FIXTURES_1_3.sha256
          FOLDERS="TegakiKit/Tests/Fixtures/compat11 TegakiKit/Tests/Fixtures/compat-span TegakiKit/Tests/CompatFixtures"
          LISTED="$(sed -nE 's/^[0-9a-f]{64}  //p' tools/span/FIXTURES_1_3.sha256 | grep -E '^TegakiKit/Tests/(Fixtures/compat11|Fixtures/compat-span|CompatFixtures)/' | LC_ALL=C sort)"
          # $FOLDERS unquoted on purpose: three paths without spaces.
          PRESENT="$(git ls-files --cached --others --exclude-standard -- $FOLDERS | LC_ALL=C sort)"
          echo "FIXTURES_1_3: $(printf '%s\n' "$LISTED" | grep -c .) files of the three folders in the table, $(printf '%s\n' "$PRESENT" | grep -c .) in the folders"
          if [ "$LISTED" != "$PRESENT" ]; then
            diff <(printf '%s\n' "$LISTED") <(printf '%s\n' "$PRESENT") || true
            echo "::error::The fixture folders do not hold the files of tools/span/FIXTURES_1_3.sha256 (<: only in the table, >: only in a folder). 1.4 makes no new fixture (docs/M7D_CONTRACT.md §5.1, §5.5)."
            exit 1
          fi

      # 1.4.3 (docs/R1_4_3_CONTRACT.md §8.3, 0g-30): the new folder compat-span-143 (fixtures 8–13: the month and the year joined
      # sideways, made by `KitChecks --write-compat-span-143-fixtures` through the Kit's joined path) is frozen the same way:
      # every file of it with its MANIFEST, 9 rows, sorted, and the folder holds exactly the table's files, so a file added or
      # taken away fails as well. FIXTURES_1_3 and its three folders stay byte for byte (the step above). A fixture made again
      # on purpose rewrites its row here and its hash in TegakiKit/Tests/CompatSpan143Tests in the same commit, with the reason
      # in docs/R1_4_3.md.
      - name: 1.4.3's fixtures unchanged (FIXTURES_1_4_3)
        run: |
          set -euo pipefail
          shasum -a 256 -c tools/span/FIXTURES_1_4_3.sha256
          FOLDER="TegakiKit/Tests/Fixtures/compat-span-143"
          LISTED="$(sed -nE 's/^[0-9a-f]{64}  //p' tools/span/FIXTURES_1_4_3.sha256 | grep -E '^TegakiKit/Tests/Fixtures/compat-span-143/' | LC_ALL=C sort)"
          PRESENT="$(git ls-files --cached --others --exclude-standard -- "$FOLDER" | LC_ALL=C sort)"
          echo "FIXTURES_1_4_3: $(printf '%s\n' "$LISTED" | grep -c .) files of the folder in the table, $(printf '%s\n' "$PRESENT" | grep -c .) in the folder"
          if [ "$LISTED" != "$PRESENT" ]; then
            diff <(printf '%s\n' "$LISTED") <(printf '%s\n' "$PRESENT") || true
            echo "::error::The folder $FOLDER does not hold the files of tools/span/FIXTURES_1_4_3.sha256 (<: only in the table, >: only in the folder; docs/R1_4_3_CONTRACT.md §8.3)."
            exit 1
          fi

      # 1.4 (docs/M7D_CONTRACT.md §3.3 4, 0d-28): XcodeGen 2.46.0 from its release zip, pinned by sha256, the same in every
      # job (until 1.3 `brew install xcodegen`, whose version was the image's formula). The script fails unless
      # `xcodegen --version` then says 2.46.0; the job's later steps find it first in PATH.
      - name: Install XcodeGen
        run: |
          set -euo pipefail
          bash "$GITHUB_WORKSPACE/tools/ci/install-xcodegen.sh"

      - name: Generate the Xcode project
        run: |
          set -euo pipefail
          xcodegen generate
          xcodebuild -project TegakiCalendar.xcodeproj -list

      # 1.2 (docs/M7B_CONTRACT.md §2.2): what XcodeGen made of the String Catalogs. Its version was not
      # pinned (brew has no old versions), so docs/M7B.md records this; "Localized bundle check" is the guard.
      # 1.4 (docs/M7D_CONTRACT.md §3.3 4): pinned at 2.46.0 ("Install XcodeGen").
      - name: The project's known regions
        run: |
          set -euo pipefail
          xcodegen --version
          grep -n -A 14 'knownRegions' TegakiCalendar.xcodeproj/project.pbxproj || echo "::warning::no knownRegions in the generated project"
          grep -n 'developmentRegion' TegakiCalendar.xcodeproj/project.pbxproj || true

      - name: Build for the iOS Simulator
        run: |
          set -euo pipefail
          xcodebuild \
            -project TegakiCalendar.xcodeproj \
            -scheme TegakiCalendar \
            -configuration Debug \
            -destination "generic/platform=iOS Simulator" \
            -derivedDataPath build/DerivedData \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            build

      # 1.2.2 (docs/R1_2_2.md §6.3, §3.8): every binary of the built app that loads DeclaredAgeRange loads it
      # weakly (LC_LOAD_WEAK_DYLIB), so iOS / iPadOS 17–18, which do not have it, still launch the app. A Debug
      # build may keep the app's code in TegakiCalendar.debug.dylib, so both are looked at. A strong load
      # fails the job; no binary loading it is only a warning. testflight.yml checks the Release archive.
      - name: Weak link of DeclaredAgeRange
        run: |
          set -euo pipefail
          APP="$(find build/DerivedData -name "TegakiCalendar.app" -path "*iphonesimulator*" -not -path "*/Index.noindex/*" | head -1)"
          if [ -z "$APP" ]; then echo "::error::TegakiCalendar.app not found under build/DerivedData."; exit 1; fi
          FOUND=0
          FAILED=0
          for BIN in "$APP/TegakiCalendar" "$APP/TegakiCalendar.debug.dylib"; do
            [ -f "$BIN" ] || continue
            LOADS="$(otool -l "$BIN" | grep -B2 'DeclaredAgeRange.framework' || true)"
            if [ -z "$LOADS" ]; then
              echo "$(basename "$BIN"): does not load DeclaredAgeRange"
              continue
            fi
            FOUND=1
            if printf '%s\n' "$LOADS" | grep -q LC_LOAD_WEAK_DYLIB; then
              echo "$(basename "$BIN"): DeclaredAgeRange weak"
            else
              printf '%s\n' "$LOADS"
              echo "::error::$(basename "$BIN") が DeclaredAgeRange を強いリンクで読んでいます（iOS 17〜18 で起動できなくなる）。project.yml の OTHER_LDFLAGS を見てください。"
              FAILED=1
            fi
          done
          if [ "$FOUND" = 0 ]; then
            echo "::warning::DeclaredAgeRange を読むバイナリがありません（弱いリンクを確かめられません。docs/R1_2_2.md §6.3）。"
          fi
          exit "$FAILED"

      # 1.2 (docs/M7B_CONTRACT.md §2.2, §7.5, 0-4, 0-5): the built app has the ten languages (a `.lproj` that
      # is missing or named a little differently gives its users English without a word), the holidays and
      # their licence, not the alias UK.json and no right-to-left language, the privacy manifest's reasons
      # (CA92.1 UserDefaults; 35F9.1 system boot time, the frozen InkCanvasView needs it), and Xcode did not
      # add keys to the catalogs (SWIFT_EMIT_LOC_STRINGS is NO). If the catalogs give no `.lproj`, 0-4 says
      # what to do (build.py --format strings); if HolidayData is missing, §2.2 (Resources/HolidayData).
      - name: Localized bundle check
        run: |
          set -euo pipefail
          APP="$(find build/DerivedData -name "TegakiCalendar.app" -path "*iphonesimulator*" -not -path "*/Index.noindex/*" | head -1)"
          if [ -z "$APP" ]; then echo "::error::TegakiCalendar.app not found under build/DerivedData."; exit 1; fi
          echo "App bundle: $APP"
          FAILED=0
          fail() { echo "::error::$1"; FAILED=1; }
          for L in ja en zh-Hans zh-Hant ko fr de es it pt-BR; do
            [ -f "$APP/$L.lproj/Localizable.strings" ] || [ -f "$APP/$L.lproj/Localizable.stringsdict" ] || fail "no $L.lproj/Localizable.strings or .stringsdict"
            [ -f "$APP/$L.lproj/InfoPlist.strings" ] || fail "no $L.lproj/InfoPlist.strings"
          done
          for F in JP.json US.json index.json SOURCE.json LICENSE-python-holidays.txt CONTRIBUTORS-python-holidays.txt; do
            [ -f "$APP/HolidayData/$F" ] || fail "no HolidayData/$F"
          done
          for BAD in HolidayData/UK.json ar.lproj he.lproj; do
            if [ -e "$APP/$BAD" ]; then fail "$BAD must not be in the app"; fi
          done
          if PRIVACY="$(plutil -p "$APP/PrivacyInfo.xcprivacy")"; then
            printf '%s\n' "$PRIVACY"
            for REASON in CA92.1 35F9.1; do
              case "$PRIVACY" in
                *"$REASON"*) ;;
                *) fail "PrivacyInfo.xcprivacy has no $REASON" ;;
              esac
            done
          else
            fail "PrivacyInfo.xcprivacy is missing or unreadable"
          fi
          ls -d "$APP"/*.lproj || true
          echo "HolidayData: $(ls "$APP/HolidayData" 2>/dev/null | wc -l | tr -d ' ') files, $(du -sh "$APP/HolidayData" 2>/dev/null | cut -f1)"
          git diff --exit-code -- Sources/TegakiCalendar/Resources || fail "the build changed the String Catalogs (0-5)"
          exit "$FAILED"

      # The primary simulator (unit tests, 4 pages, 6 sheets): the first name, in sorted order, that
      # starts with "iPad Pro 13-inch", else "iPad Air 13-inch", else any iPad, else any iPhone
      # (docs/M4B_CONTRACT.md §6.1: the runner has no "iPad Pro 13-inch (M4)", so the choice is by
      # prefix and deterministic). Until 1.3 the literal "iPhone 17" was the last resort (the step never failed);
      # 1.4 (docs/M7D_CONTRACT.md §3.2): the name chosen must be the table's "iPad Pro 13-inch (M5)", or the step fails.
      - name: Pick a simulator (13-inch iPad preferred)
        id: simulator
        run: |
          set -euo pipefail
          xcrun simctl list devices available
          NAME="$(xcrun simctl list -j devices available | python3 -c '
          import json, sys
          devices = json.load(sys.stdin).get("devices", {})
          names = set()
          for runtime, items in devices.items():
              if "iOS" not in runtime:
                  continue
              for d in items:
                  if d.get("isAvailable") and d.get("name"):
                      names.add(d["name"])
          for prefix in ("iPad Pro 13-inch", "iPad Air 13-inch", "iPad", "iPhone"):
              matches = sorted(n for n in names if n.startswith(prefix))
              if matches:
                  print(matches[0])
                  raise SystemExit
          print("")
          ' || true)"
          echo "Using simulator: ${NAME:-none}"
          if [ "$NAME" != "iPad Pro 13-inch (M5)" ]; then
            echo "::error::The primary simulator must be the table's \"iPad Pro 13-inch (M5)\", not \"${NAME:-none}\" (docs/M7D_CONTRACT.md §3.2)."
            exit 1
          fi
          echo "name=$NAME" >> "$GITHUB_OUTPUT"

      # The iPhone UI test (1.0.1) has its own step, on an iPhone (since 1.3's wave C2 in the job ui-tests).
      # 1.1 (docs/M7A_CONTRACT.md §7.4, 0-23): InkLedgerTests.testLedgerWritesTheCompatShapes (ledger-*.json) and ScreenshotModeTests.
      # testDemoPagesMatchCompatFixtures (screenshot-*.json) compare the page JSON they make with the
      # committed fixture in TegakiKit/Tests/Fixtures/compat11 and, when it is missing or differs, write
      # theirs into TEGAKI_FIXTURE_OUT and fail (xcodebuild hands a TEST_RUNNER_-prefixed variable to the
      # test runner without the prefix). shots/fixtures goes up with the screenshots; the lead reads the
      # files and commits them. 1.1 fix (the lead's review): the output is also kept in
      # $RUNNER_TEMP/unit-tests.log (not uploaded) for the next step. 1.2 (docs/M7B_CONTRACT.md 0-25): the
      # unit tests are in Japanese whatever the simulator's language is (their old expectations are Japanese).
      # 1.3 (docs/M7C_CONTRACT.md §10.6): on r13-quick (QUICK) only the Span classes of Tests/TegakiCalendarTests
      # that exist so far (`*SpanTests`, `SpanSessionTests`, `ScreenEraseTests`, `OnePageSession…Tests`, found by
      # their `class` lines, `@MainActor final class …:` on one line too; S5 adds them), each with -only-testing;
      # none yet → the step says so and ends. S5 wave A's decision 10 (docs/M7C.md): SettingsPageSectionTests (設定 ›
      # ページ and the guide, §10.2 U) too; wave C's ScreenPathsSpanTests, ScreenPathsCanvasSpanTests and
      # ScreenshotModeSpanTests are found by the `SpanTests` ending.
      # 1.4 (docs/M7D_CONTRACT.md §3.2): on the table's 13-inch iPad by its UDID ("Required simulators"), iOS 27.2: by its
      # name alone xcodebuild may take the same name on iOS 27.0. The photo steps below find it booted. On r14-q-m1
      # (MUTATIONS, §6) every class runs, as off the quick lane: the mutations there are caught by classes of every kind.
      # 1.4 D1 (§3.10, §6): the quick lane (r14-quick, r14-q-*) also runs D1's new classes, each by its whole name:
      # WindowClassTests, PencilPhoneTests, CappedOverviewWideTests, OnePageRevealTests, SnapshotScaleTests and DuoFoldTests
      # (role S) and PaperViewScaleTests (role P); a class not written yet is not found and not run. D1b: MeasureLineFileTests.
      # D1d: PageHeaderRoomTests (the header's tight row on the Duo's outer screen; pure, no layout).
      # 1.4.1 (docs/R1_4_1_CONTRACT.md §6.1, §6.6, 0e-23): the quick lane (r141-quick, r141-q-*) also runs 1.4.1's new classes,
      # each by its whole name: HeaderOrderTests, HandSettingTests, ScreenshotModeHandPaletteTests and HeaderGlyphTests (the
      # header and the hand; PageHeaderRoomTests, rewritten, stays), InkCanvasZoomResetTests, InkCanvasSpanZoomResetTests and
      # InkCanvasWidthCentreTests (等倍 and 0d-44), ToolbarPlacementTests and PaletteGripTests (the toolbar, D1b); a class not
      # written yet is not found and not run. D2: HeaderTitleTests (the short title on an iPhone's wide row, §3.4). The rework
      # (§16.5, §16.6, §16.8): ZoomResetTargetTests (等倍's target of each kind, role Z) and ZoomFitWiringTests (the screen's
      # 等倍 of the week and the day: ScreenPaths' `fit:`, `--screenshot-zoom fit`, the two canvases' wires, role S). The
      # second rework (§17.4): PaletteMoveButtonTests (the 「動かす」 button: where it shows, tap or drag, the choices, VoiceOver).
      # 1.4.2 (docs/R1_4_2_CONTRACT.md §6.1, §6.5, 0f-27): the quick lane (r142-quick, r142-q-*, r142-w-*) also runs 1.4.2's
      # new classes, each by its whole name: PenSlotsTests, ColorPanelLogicTests, ColorPanelWatchTests, SwatchRimTests,
      # ColorPanelFitTests and InkColorRoundTripTests (the pen colours, role T), ColorPanelWiringTests and
      # ScreenshotModeColorMemoTests (the screen, role S), MemoPaperStyleTests, MemoPaperDrawTests and MemoPaperRedrawTests
      # (the memo paper, role M). D0 names them before they are written; a class not written yet is not found and not run.
      # The classes 1.4.2 only adds to (ToolbarLogicTests, AppSettingsTests, SettingsScreenTests, §6.2) run off the quick
      # lane and on r142-q-m1.
      # 1.4.3 (docs/R1_4_3_CONTRACT.md §11.2, §12.1, 0g-40): the quick lane (r143-quick, r143-q-*, r143-w-*) also runs
      # 1.4.3's new classes, each by its whole name: SpanKindsTests, ScreenPathsMonthYearTests, SpanSessionMonthYearTests,
      # EventStoreModelYearTests, ZoomResetMonthYearTests, SpanGuideMonthYearTests, ScreenshotModeMonthYearTests and
      # SpanWeightLogTests (role S; SpanWeightLogTests with Z), PaperSpanMonthYearTests, MonthPaperLineTests,
      # StickyHeaderMonthYearTests and PDFMonthYearTests (role P), InkCanvasMonthYearTests (role Z). D0 names them before
      # they are written; a class not written yet is not found and not run. The tests R0 rewrites (§8.5) are in the lane
      # already (ScreenPathsSpanTests and SettingsPageSectionTests by their endings, ZoomResetTargetTests,
      # ZoomFitWiringTests and InkCanvasZoomResetTests by name); AppSettingsTests runs off the quick lane and on r143-q-m1.
      # 1.4 D0c (docs/M7D_CONTRACT.md §3.8; docs/M7D.md, D0c): xcodebuild boots the 13-inch iPad here itself again, as
      # until D0. D0b booted it with simctl in the background from the job's start (a step "Boot the 13-inch iPad in the
      # background" and a wait here, both removed in D0c). That boot took 129 s, but the macOS steps beside it ran 3 to 19
      # times slower (run 44676125566, image 20261104.0337.1: `swift --version` 318 s and the first `swift build` 498 s,
      # against 3–5 s and 32–54 s in the five runs without it on the two macOS 27 images; KitChecks, the Kit's tests and
      # the iOS build 3.0–4.7 times), so this step began 29.5 min into the job (4.7 in D0's attempt 2, same image). It saved
      # xcodebuild's boot here (1.1 min from "Testing started" to the test host, against 4.9 in D0's attempt 2 and 9.7 and
      # 11.9 in two quick lanes on that image), 1.7 min after the tests and the repeated sync tests' second boot (about 2
      # to 3): up to the photos' boot about 10 min lost against D0's attempt 2, although that run's tests also lost 6 min
      # to a stall and a restart (3 to 19 over the boots and the tests seen). With it on the quick lane, `swift --version`
      # had not ended 8.4 min into its step when the job was cancelled (run 44690586694, image 20261119.0378.1), and the
      # Kit's build took 12.0 min (run 44696154799).
      - name: Run unit tests on the simulator
        run: |
          set -euo pipefail
          mkdir -p shots/fixtures
          ONLY=""
          if [ "$QUICK" = "true" ] && [ "$MUTATIONS" = "true" ]; then
            echo "the quick lane on the mutation branch ($GITHUB_REF_NAME; the app's mutations, docs/M7D_CONTRACT.md §6, docs/R1_4_1_CONTRACT.md, docs/R1_4_2_CONTRACT.md §6.4, docs/R1_4_3_CONTRACT.md §11.5): every unit test class"
          elif [ "$QUICK" = "true" ]; then
            CLASSES="$(grep -rhE '^(@[A-Za-z]+ +)*(final +)?class +[A-Za-z0-9_]+ *:' Tests/TegakiCalendarTests \
              | sed -E 's/^(@[A-Za-z]+ +)*(final +)?class +([A-Za-z0-9_]+).*/\3/' \
              | grep -E '(SpanTests|SpanSessionTests|ScreenEraseTests|OnePageSession[A-Za-z0-9_]*Tests|SettingsPageSectionTests)$|^(WindowClassTests|PencilPhoneTests|CappedOverviewWideTests|OnePageRevealTests|SnapshotScaleTests|DuoFoldTests|PaperViewScaleTests|MeasureLineFileTests|PageHeaderRoomTests|HeaderOrderTests|HandSettingTests|ScreenshotModeHandPaletteTests|HeaderGlyphTests|InkCanvasZoomResetTests|InkCanvasSpanZoomResetTests|InkCanvasWidthCentreTests|ToolbarPlacementTests|PaletteGripTests|HeaderTitleTests|ZoomResetTargetTests|ZoomFitWiringTests|PaletteMoveButtonTests|PenSlotsTests|ColorPanelLogicTests|ColorPanelWatchTests|SwatchRimTests|ColorPanelFitTests|InkColorRoundTripTests|ColorPanelWiringTests|ScreenshotModeColorMemoTests|MemoPaperStyleTests|MemoPaperDrawTests|MemoPaperRedrawTests|SpanKindsTests|ScreenPathsMonthYearTests|SpanSessionMonthYearTests|EventStoreModelYearTests|ZoomResetMonthYearTests|SpanGuideMonthYearTests|ScreenshotModeMonthYearTests|SpanWeightLogTests|PaperSpanMonthYearTests|MonthPaperLineTests|StickyHeaderMonthYearTests|PDFMonthYearTests|InkCanvasMonthYearTests)$' | sort -u || true)"
            if [ -z "$CLASSES" ]; then
              echo "::notice::the quick lane: no Span or 1.4 test class in Tests/TegakiCalendarTests yet; the app's unit tests are not run"
              exit 0
            fi
            for CLASS in $CLASSES; do
              ONLY="$ONLY -only-testing:TegakiCalendarTests/$CLASS"
            done
            echo "the quick lane: the app's unit tests are only$ONLY"
          fi
          # $ONLY unquoted on purpose: one word per class (none has a space), nothing when it is empty.
          TEST_RUNNER_TEGAKI_FIXTURE_OUT="$PWD/shots/fixtures" xcodebuild \
            -project TegakiCalendar.xcodeproj \
            -scheme TegakiCalendar \
            -configuration Debug \
            -destination "platform=iOS Simulator,id=${{ steps.required.outputs.ipad13 }}" \
            -derivedDataPath build/DerivedData \
            -skip-testing:TegakiCalendarUITests \
            $ONLY \
            -testLanguage ja \
            -testRegion JP \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            test 2>&1 | tee "$RUNNER_TEMP/unit-tests.log"

      # 1.1 fix (docs/M7A.md ずれ 46・47; the lead's review): the lines the canvas tests print for the
      # run's reader — `repro:` (U1 / U2: the touches UIKit and PencilKit saw, and why a test skipped;
      # A17 / B8: the touch types iOS's PencilKit gives) — and XCTest's "expected failure" lines, pulled
      # out of the unit tests' log, each once (a test prints a line and NSLogs it). Prints nothing when
      # there are none; runs after a red unit test step too, and never fails the job.
      - name: The unit tests' repro lines
        if: always()
        continue-on-error: true
        run: |
          set -uo pipefail
          LOG="$RUNNER_TEMP/unit-tests.log"
          if [ -f "$LOG" ]; then
            grep -iE 'repro:|expected failure' "$LOG" | awk '{ i = index($0, "repro:"); if (i > 1) $0 = substr($0, i); if (!seen[$0]++) print }' || true
          fi

      # 1.4.3 D1y (docs/R1_4_3_CONTRACT.md §3.10, 0g-3): SpanWeightLogTests' `span weight:` lines out of the unit tests' log,
      # each once, here and in the job's summary, for the lead to read: the joined years' window of 7 pages (the 13-inch
      # iPad turned) with 1,064, 7,000 and 19,600 strokes (compose and shift, then relayout; the 19,600's shift the median of
      # three), the week's window of 19,600 beside it (`ref=week`, the runner's weight) and the months' window of 5,080.
      # 0g-3's "heavy" is the year's median shift over 1,000 ms in two runs while the week's reference is not over it
      # (§3.10), the lead's reading. Not a gate: nothing reads the milliseconds, a missing line is only counted (9
      # expected), and the step never fails the job. On the quick lanes too (the class is in their list above).
      - name: The joined years' weight (span weight, 1.4.3 D1y)
        if: always()
        continue-on-error: true
        timeout-minutes: 3
        run: |
          set -uo pipefail
          LOG="$RUNNER_TEMP/unit-tests.log"
          LINES=""
          if [ -f "$LOG" ]; then
            LINES="$(grep -a 'span weight: ' "$LOG" | awk '{ i = index($0, "span weight: "); if (i > 1) $0 = substr($0, i); if (!seen[$0]++) print }' || true)"
          fi
          COUNT="$(printf '%s' "$LINES" | grep -c '^span weight: ' || true)"
          echo "span weight: ${COUNT:-0} lines (9 expected; SpanWeightLogTests, docs/R1_4_3_CONTRACT.md §3.10; not a gate)"
          if [ -n "$LINES" ]; then printf '%s\n' "$LINES"; fi
          {
            echo "### The joined years' weight (span weight, §3.10)"
            echo ""
            echo "- ${COUNT:-0} lines (9 expected). Not a gate: 0g-3's \"heavy\" is the lead's reading of two runs."
            if [ -n "$LINES" ]; then printf '%s\n' "$LINES" | sed 's/^/- `/; s/$/`/'; fi
          } >> "${GITHUB_STEP_SUMMARY:-/dev/null}"

      # 1.2.3 (docs/R1_2_3.md §4): the sync engine's tests again, 20 times in a row, stopping at the first
      # failure (two of them were flaky in 1.2.2's CI, runs 42531490670 and 42438495112; TestSleeper and
      # waitUntilIdle now fix the order). The build of the step above is reused (test-without-building); the
      # 20,500-stroke test is left out (about 5 s each). Estimated 3–6 min (one pass of the 60 other tests is a
      # few seconds; the rest is xcodebuild and the simulator), limited to 9. The whole output is kept in
      # $RUNNER_TEMP/sync-repeat.log (not uploaded) and its last 80 lines are printed.
      # 1.3 (docs/M7C_CONTRACT.md §7, §10.6): SyncEngineSpanTests (pagesOpened and onRemoteDelete, M4_CONTRACT §8.2
      # 54–59) are repeated with them, since the H4 fix SyncEngineEraseFetchTests (60–62), and in S5 SpanSessionTests and
      # ScreenEraseTests (§10.2, role S: the sessions over the live engine). Their two -only-testing lines and the line
      # just above the step are the ones S's work branch added (a15a08e), so the branches merge without a conflict; on a
      # branch without those test files the two lines find no test. The limit stays 9, from the measured time (§10.6:
      # measure it with them; the contract's estimate was 15): with them (S's work branch, run 43315186882) the step took
      # 3.8 min, ScreenEraseTests 220 passes in 8.0 s, SpanSessionTests 580 in 23.8 s, SyncEngineTests 1,200 in 23.1 s.
      # Before them: on r13 before 1.3's tests 2.3–4.7 min (runs 43060727400 to 43149906124), its 1,200 passes 18–39 s;
      # with SyncEngineSpanTests (run 43163415023) 5.5 min, its 1,320 passes 44 s (57 s on the clock): SyncEngineTests
      # 1,200 in 36.5 s, SyncEngineSpanTests 120 in 7.4 s; runs 43176186917 to 43251126239 (SyncEngineEraseFetchTests in
      # the last) 2.5–4.6 min. The rest is xcodebuild and the simulator. After the tail, the time of each class over its
      # passes is printed: the measure for the next limit. Each class's count is compared with the passes
      # expected (the iterations × the tests seen starting or passing): an app log line written into the middle
      # of a "Test Case" line hides that pass from the sed (seen in the unit test step of run 43176186917:
      # [TextTransform] from PencilKit, [Client] XPC), so a class that falls short gets a warning and its time is
      # short by those passes. The step's result does not depend on it.
      # S5 (§10.6): SpanSessionTests and ScreenEraseTests (the sessions over the live engine) are repeated with them.
      # S5 wave C (§10.6; the lead's decision C3-m2): the screen's pure tests ScreenPathsSpanTests (the screen's call
      # sites in Span/ScreenPaths.swift over the live engine, no UIKit or PencilKit) join them; the screen tests with
      # the real canvas are another class, ScreenPathsCanvasSpanTests, which is not listed here: it runs once with
      # the unit tests (and on the quick lane, by its `SpanTests` ending) and is not repeated. Until wave C's screen
      # branch adds the class, the line finds no test and the check at the end of the step warns (its file and its
      # class line are not in Tests/TegakiCalendarTests), so the step passes. The limit stays 9 min until the first
      # run of the build-and-test job with the class prints its per-class time (the measure for the next limit).
      # G4: SyncEngineZoneAccountTests (a zone gone, a record gone or a change token expired, and 「全て消す」,
      # confirm the account first) are repeated with them.
      # 1.4 (docs/M7D_CONTRACT.md §3.2): on the unit tests' simulator, by its UDID.
      # 1.4 D0b (docs/M7D_CONTRACT.md §3.3 9, §3.8; docs/M7D.md, D0b): 9 → 14. In 1.3's run (44474759145) the step took
      # 5.7 min with a boot of the 13-inch in it: xcodebuild leaves the iPad shut down after its tests ("Boot the
      # simulator" after this step found it off and took 2.9 min; in D0, right after the unit tests, its `simctl boot`
      # alone took 4.4). D0 skipped this step (the unit tests were red); at D0's pace, a 5.2 min boot and (5.7 − 2.9) ×
      # 1.5 of tests, it is about 9.4 min, over 9. 14 keeps about half again, as 9 did over 1.3's 5.7. Measured again in
      # D0b; D1 brings it back with the job's limit. 1.4 D0c: in D0b's run (44676125566) the iPad, booted in the
      # background with simctl, was still running after the unit tests, and this step took 3.9 min with no boot (its 4,000
      # tests 185 s). D0c leaves the boot to xcodebuild again (the unit test step says why), so this step boots the iPad
      # again, as in 1.3 and in the estimate above.
      - name: Sync engine tests, repeated (1.2.3)
        if: env.QUICK != 'true'
        timeout-minutes: 14
        run: |
          set -euo pipefail
          ITERATIONS=20
          xcodebuild \
            -project TegakiCalendar.xcodeproj \
            -scheme TegakiCalendar \
            -configuration Debug \
            -destination "platform=iOS Simulator,id=${{ steps.required.outputs.ipad13 }}" \
            -derivedDataPath build/DerivedData \
            -only-testing:TegakiCalendarTests/SyncEngineTests \
            -only-testing:TegakiCalendarTests/SyncEngineSpanTests \
            -only-testing:TegakiCalendarTests/SyncEngineEraseFetchTests \
            -only-testing:TegakiCalendarTests/SpanSessionTests \
            -only-testing:TegakiCalendarTests/ScreenEraseTests \
            -only-testing:TegakiCalendarTests/ScreenPathsSpanTests \
            -only-testing:TegakiCalendarTests/SyncEngineZoneAccountTests \
            -skip-testing:TegakiCalendarTests/SyncEngineTests/testMergeRemoteOfATruncatedPageMarksDirty \
            -test-iterations "$ITERATIONS" \
            -run-tests-until-failure \
            -testLanguage ja \
            -testRegion JP \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            test-without-building > "$RUNNER_TEMP/sync-repeat.log" 2>&1 || { tail -n 80 "$RUNNER_TEMP/sync-repeat.log"; exit 1; }
          tail -n 80 "$RUNNER_TEMP/sync-repeat.log"
          sed -nE \
            -e 's/^Test Case .-\[TegakiCalendarTests\.([A-Za-z0-9_]+) ([A-Za-z0-9_]+)\]. started\.$/S \1 \2/p' \
            -e 's/^Test Case .-\[TegakiCalendarTests\.([A-Za-z0-9_]+) ([A-Za-z0-9_]+)\]. (passed|skipped) \(([0-9.]+) seconds\)\.$/P \1 \2 \4/p' \
            "$RUNNER_TEMP/sync-repeat.log" \
            | awk -v iterations="$ITERATIONS" '
                !(($2, $3) in seen) { seen[$2, $3] = 1; tests[$2]++ }
                $1 == "P" { n[$2]++; s[$2] += $4 }
                END {
                  for (c in tests) {
                    expected = iterations * tests[c]
                    printf "per class: %s, %d passes of %d (%d tests x %d) in %.3f s\n", c, n[c], expected, tests[c], iterations, s[c]
                    if (n[c] != expected) printf "::warning::per class: %s: %d of %d pass lines read (the others were split by app log lines), so its time is short\n", c, n[c], expected
                  }
                }' | sort
          # 1.3 (docs/M7C_CONTRACT.md §10.6; the review of S5's track C): xcodebuild says nothing about an
          # -only-testing class the build does not have, so a class lost or renamed would leave the 20 times without
          # a sign. Each class listed above must have test cases in the log. The list is read from this script ($0,
          # the step's lines as the runner wrote them: `shell: /bin/bash -e {0}`), so it is written once. A class with
          # none fails the step when Tests/TegakiCalendarTests has its file (<class>.swift, §10.2's names) or its
          # class line; when it has neither (S's two classes on a branch without S's tests, ScreenPathsSpanTests
          # before wave C's screen branch) it is a warning.
          LISTED=""
          if [ -f "$0" ]; then
            LISTED="$(sed -nE 's/^[[:space:]]*-only-testing:TegakiCalendarTests\/([A-Za-z0-9_]+)[[:space:]]*\\$/\1/p' "$0" | sort -u)"
          fi
          if [ -z "$LISTED" ]; then
            echo "::warning::The classes this step lists could not be read from its script ($0), so none is checked."
            exit 0
          fi
          LOST=0
          for CLASS in $LISTED; do
            if grep -qE "Test Case .-\[TegakiCalendarTests\.$CLASS [A-Za-z0-9_]+\]. " "$RUNNER_TEMP/sync-repeat.log"; then
              continue
            fi
            if [ -f "Tests/TegakiCalendarTests/$CLASS.swift" ] \
              || grep -rqE "^(@[A-Za-z]+ +)*(final +)?class +$CLASS *:" Tests/TegakiCalendarTests; then
              echo "::error::$CLASS is in Tests/TegakiCalendarTests and listed here, but none of its tests ran (§10.6: it is repeated 20 times). Was it renamed, moved or left out of the build?"
              LOST=1
            else
              echo "::warning::$CLASS is listed here but not in Tests/TegakiCalendarTests on this branch, so it is not repeated."
            fi
          done
          exit "$LOST"

      # 1.4 D0b (docs/M7D_CONTRACT.md §3.5, §3.8; docs/M7D.md, D0b): until D0 xcodebuild booted the 13-inch iPad for the
      # unit tests and the repeated sync tests and shut it down after each ("Boot the simulator" found it off: 2.9 min in
      # 1.3's run 44474759145, 4.4 in D0's 44632524223), so the J-4 photos were taken on a fresh boot, as ja-baseline.yml's
      # are. In D0b the iPad was booted in the background with simctl, and xcodebuild left it running (run 44676125566:
      # "Booted" here, "Shutdown" 4 s later). 1.4 D0c: that boot is gone and xcodebuild boots and shuts down the iPad
      # again, so this step normally finds it shut down. It stays, so that the photo steps (the same as ja-baseline.yml's)
      # begin with the iPad off whatever ran before them (a sync step stopped by its limit, say).
      # Never fails the job; "Unable to shutdown device in current state: Shutdown" only means xcodebuild had done it.
      - name: Shut down the 13-inch iPad before the photos (1.4 D0b)
        if: ${{ !cancelled() && env.QUICK != 'true' }}
        continue-on-error: true
        timeout-minutes: 5
        run: |
          set -uo pipefail
          UDID="${{ steps.required.outputs.ipad13 }}"
          xcrun simctl list devices | grep -F "$UDID" || true
          xcrun simctl shutdown "$UDID" || true
          xcrun simctl list devices | grep -F "$UDID" || true

      # 1.3 (docs/M7C_CONTRACT.md §10.5; docs/M7C.md, S3's J-4): the 11 sheets' wait (the 13-inch step below) runs
      # tools/shots/screen_ready.swift, and the job's first swiftc for macOS spends almost 2 min on the SDK's modules
      # (1.9 of that step's 4.6 min in run 43325447350, which built the tool in the step; 2.3 min with the fixed 9 s,
      # run 43315186882). So it is built here, in the background, while the simulator boots and the 13-inch's first photos
      # are taken (about 10 min; until 1.3's wave C2 the UI tests' build came first, about 5 min more); the sheets step
      # waits for it, or builds it itself when this build is missing or failed.
      # Never fails the job. ja-baseline.yml has no such step: its sheets step, the same lines, builds the tool.
      - name: Build the sheets' screen check in the background (1.3)
        if: ${{ !cancelled() && env.QUICK != 'true' }}
        continue-on-error: true
        run: |
          set -euo pipefail
          OUT="$RUNNER_TEMP/screen_ready.build"
          mkdir -p "$OUT"
          # Its own stdin, stdout and stderr, so this step ends at once; the build goes on (the runner ends what is
          # left of a job's processes after its last step). The status file appears only when swiftc has ended.
          nohup /bin/sh -c 'swiftc -O "$1" -o "$2/screen_ready" > "$2/log" 2>&1; echo "$?" > "$2/status.part"; mv "$2/status.part" "$2/status"' \
            sh "$GITHUB_WORKSPACE/tools/shots/screen_ready.swift" "$OUT" < /dev/null > /dev/null 2>&1 &
          echo "$!" > "$OUT/pid"
          echo "swiftc of tools/shots/screen_ready.swift started in the background (pid $(cat "$OUT/pid"))"

      # 1.4 D0b (docs/M7D_CONTRACT.md §3.5 (f); docs/M7D.md, D0b): tools/shots/ink_check.swift, the photo steps' handwriting
      # check, is built here, in the background while the simulator boots, so that its swiftc (in ja-baseline.yml the job's
      # first for macOS, almost 2 min on the SDK's modules) does not run beside the 13-inch photos' 120 s wait and first
      # photos in one workflow and not in the other (J-4: the same conditions). `ink_build` (tools/shots/ink_retake.sh)
      # waits for it and builds the tool itself when this build is missing or failed. The same step in build.yml and
      # ja-baseline.yml, read from the pushed commit. Never fails the job.
      - name: Build the handwriting check in the background (1.4 D0b)
        if: ${{ !cancelled() && env.QUICK != 'true' }}
        continue-on-error: true
        run: |
          set -euo pipefail
          OUT="$RUNNER_TEMP/ink_check.build"
          mkdir -p "$OUT"
          # Its own stdin, stdout and stderr, so this step ends at once; the status file appears only when swiftc has ended.
          nohup /bin/sh -c 'swiftc -O "$1" -o "$2/ink_check" > "$2/log" 2>&1; echo "$?" > "$2/status.part"; mv "$2/status.part" "$2/status"' \
            sh "$GITHUB_WORKSPACE/tools/shots/ink_check.swift" "$OUT" < /dev/null > /dev/null 2>&1 &
          echo "$!" > "$OUT/pid"
          echo "swiftc of tools/shots/ink_check.swift started in the background (pid $(cat "$OUT/pid"))"

      # ---- Screenshots of the running app (best effort; never fails the job) ----
      # 1.2 (docs/M7B_CONTRACT.md §1.3 J-4, §7.5, 0-25): every launch of these steps ends with $JA_ARGS and
      # the steps write shots/env.txt. The steps from "Pick a simulator" to "Store listing set" must stay
      # the same as .github/workflows/ja-baseline.yml (the reference of J-4; only the two sheets of 1.2 and
      # the step's name differ): when one of the two changes, change the other one too. 1.3 (docs/M7C_CONTRACT.md
      # §10.5): ja-baseline.yml now holds these steps as 43fe366 has them (all 11 sheets) and shoots 43fe366; a
      # change here changes 1.3's photos against that reference, and only the changes docs/M7C.md lists may.
      # 1.4 (docs/M7D_CONTRACT.md §3.5): ja-baseline.yml holds these steps again, as 955fe67 has them, with only 1.4's
      # changes of the runner and the Xcode, the devices' list, the required devices' checks, the env.txt lines and
      # XcodeGen, in the same words as here, and shoots 955fe67 (tools/l10n/ja-baseline-ref-1.4.txt) with Xcode 27.2;
      # only the photo docs/M7D.md lists beforehand may differ (ipad13-portrait-sheet-info.png, its version).
      # The app is launched with "--screenshot-mode" (Sources/TegakiCalendar/Support/ScreenshotMode.swift):
      # no onboarding, no EventKit, deterministic demo events for 2026-10 and a few preloaded ink
      # strokes. Since M3a it is launched once per page ("--screenshot-page month|week|day|year",
      # docs/M3A_CONTRACT.md §9), terminated between launches; since M3b four more times on the month
      # page with "--screenshot-sheet create|edit|lasso|settings" (docs/M3B_CONTRACT.md §5, §7), which
      # opens the create / edit sheet, the lasso selection with its menu, or the settings screen half a
      # second after the canvas appeared; since M4 two more sheets, "sync" (the settings screen with the
      # demo sync engine: 「同期済み」 and 「最後に同期」) and "import" (the finished web import,
      # docs/M4_CONTRACT.md §6.6); since M5 a seventh, "paywall" (the subscription sheet of
      # docs/M5_CONTRACT.md §4.1 over the month page), and "--screenshot-readonly" (the demo store starts
      # unsubscribed: the 「閲覧専用」 badge in the header, the toast of §3.3 for 20 s, docs/M5_CONTRACT.md
      # §7.5); since M6 an eighth sheet, "export" (the export sheet of docs/M6_CONTRACT.md §3.2 in its
      # choose state — two actions with a one-line note each — over the month page, 0-6).
      # In screenshot mode the sync engine is an inert demo over an in-memory fake and the store
      # is an inert demo client (no StoreKit, no UserDefaults), so nothing here needs an iCloud account
      # or App Store Connect. simctl cannot tap or rotate the device; since
      # M4b (docs/M4B_CONTRACT.md §6.4) only the iPhone turns with "--screenshot-landscape" (the app
      # asks the window scene for landscape; iPadOS ignores that request for an app that supports
      # multitasking, so the iPad shots are portrait only).
      # The steps run even when the unit tests failed (the app was still built); the upload always runs.
      # 1.3: on r13-quick (QUICK, §10.6) none of them runs (the steps after this one wait for its success).
      - name: Resolve the simulator UDID
        id: simudid
        if: ${{ !cancelled() && steps.simulator.outcome == 'success' && env.QUICK != 'true' }}
        continue-on-error: true
        run: |
          set -euo pipefail
          NAME="${{ steps.simulator.outputs.name }}"
          UDID="$(xcrun simctl list -j devices available | SIM_NAME="$NAME" python3 -c '
          import json, os, re, sys
          name = os.environ["SIM_NAME"]
          devices = json.load(sys.stdin).get("devices", {})
          def version(runtime):                                  # "…iOS-27-2" → (27, 2)
              m = re.search(r"iOS-(\d+)-(\d+)", runtime)
              return (int(m.group(1)), int(m.group(2))) if m else (0, 0)
          try:                                                   # 1.4 (docs/M7D_CONTRACT.md §3.2): "Required simulators"
              required = set(open(os.path.join(os.environ["RUNNER_TEMP"], "required-simulators-udids.txt"), encoding="utf-8").read().split())
          except (KeyError, OSError):
              required = set()
          found = ""
          best = None
          for runtime, items in devices.items():
              if "iOS" not in runtime:
                  continue
              for d in items:
                  if d.get("isAvailable") and d.get("name") == name and d.get("udid"):
                      # 1.4 (docs/M7D_CONTRACT.md §3.2): the device "Required simulators" resolved; else the one xcodebuild
                      # already booted for the tests; else the newest iOS (ja-baseline.yml boots nothing first, and the name is
                      # on iOS 27.0 and 27.2).
                      key = (d["udid"] in required, d.get("state") == "Booted", version(runtime))
                      if best is None or key > best:
                          best, found = key, d["udid"]
          print(found)
          ')"
          if [ -z "$UDID" ]; then
            echo "::warning::No simulator UDID found for '$NAME'; skipping screenshots."
            exit 1
          fi
          echo "Simulator: $NAME ($UDID)"
          echo "udid=$UDID" >> "$GITHUB_OUTPUT"

      - name: Boot the simulator
        if: ${{ !cancelled() && steps.simudid.outcome == 'success' }}
        continue-on-error: true
        run: |
          set -euo pipefail
          UDID="${{ steps.simudid.outputs.udid }}"
          xcrun simctl boot "$UDID" || true
          xcrun simctl bootstatus "$UDID" -b
          xcrun simctl ui "$UDID" appearance light
          # A fixed status bar, so two runs produce the same pixels.
          xcrun simctl status_bar "$UDID" override --time "9:41" --batteryState charged --batteryLevel 100 --wifiBars 3 || true

      - name: Install the app on the simulator
        if: ${{ !cancelled() && steps.simudid.outcome == 'success' }}
        continue-on-error: true
        run: |
          set -euo pipefail
          UDID="${{ steps.simudid.outputs.udid }}"
          APP="$(find build/DerivedData -name "TegakiCalendar.app" -path "*iphonesimulator*" -not -path "*/Index.noindex/*" | head -1)"
          if [ -z "$APP" ]; then
            echo "::warning::TegakiCalendar.app not found under build/DerivedData; skipping screenshots."
            exit 1
          fi
          echo "App bundle: $APP"
          xcrun simctl install "$UDID" "$APP"

      # File names since M4b: ipad13-portrait-<page>.png (docs/M4B_CONTRACT.md §6.2; M4 and earlier
      # wrote ipad-portrait-<page>.png, the mapping is in docs/M4B.md). Since M4c the 4 pages open at
      # the overview (the whole page fits the paper area, docs/M4C_CONTRACT.md D1) and three more shots
      # open the month, the week and the year at twice the overview with a paper point (lu) at the top
      # left ("--screenshot-zoom 2 --screenshot-offset x,y", §2.4: the photo shares the canvas's zoom
      # path with a pinch; the year's offset is clamped to the paper's right edge on purpose). Since M5
      # one more: the month page in read-only mode (docs/M5_CONTRACT.md §7.5: the orange 「閲覧専用」 badge
      # left of 「＋予定」 (1024 pt ≥ 980, so with its text), the 20 s toast, undo/redo greyed). Since 1.1
      # (docs/M7A_CONTRACT.md §7.4, §8 6) five more: the toolbar folded into the dock button at the
      # bottom left and at the bottom right ("--screenshot-toolbar collapsed|collapsed-right"), the eraser
      # chosen from the toolbar (its hint ends in 「（消すとペンに戻ります）」; the 「しまう」 button at the
      # right end), and the grown month memo and the day's free memo below 24:00 ("--screenshot-grown")
      # scrolled to their strokes ("--screenshot-offset 0,1700" and "0,2300": 1.1.1 opens the two areas
      # to 6,000 lu, so the end of the paper is blank; the red wave is at y ≈ 2,063, the black at ≈ 2,700).
      # 1.1.1 (docs/R1_1_1.md): the one-time pinch hint ("--screenshot-pinch-hint", 20 s).
      # 1.3 (docs/M7C.md, wave C1's lead decision 6): screenshot mode shows the hint's toast from half a second after the
      # canvas appeared for 20 s. In run 43570477701 a slow simulator wrote this photo 56 s after its launch (the launch
      # 12 s late, `simctl io` 32 s), after the toast, and J-4 saw it missing. So the hint's photo is kept when it was written
      # at most 20 s after its launch (the canvas appears a few seconds after the launch, so the toast is still up then;
      # here the last loop, `hint_shot` in the step of the other devices) and taken once more otherwise; a second late one stays, with a warning. A photo taken in time is the same as
      # before (same arguments and waits; the app's toast is not changed, J-4). ja-baseline.yml kept its one take until
      # 1.4, whose copy of these steps (955fe67's) takes the hint the same way.
      - name: Screenshots (13-inch iPad, portrait, 4 pages + 3 zoomed + read-only + 5 of 1.1 + the hint)
        if: ${{ !cancelled() && steps.simudid.outcome == 'success' }}
        continue-on-error: true
        run: |
          set -euo pipefail
          UDID="${{ steps.simudid.outputs.udid }}"
          BUNDLE="com.syfan0.tegakicalendar"
          mkdir -p shots
          # J-4 (docs/M7B_CONTRACT.md §1.3, §7.5): the Xcode and the simulator runtimes the photos were drawn
          # with. build.yml and ja-baseline.yml write the same lines (keep them the same), so a `diff` of the
          # two env.txt tells whether two runs drew with the same Xcode and runtimes. No UDIDs (they differ
          # from one runner image to the next).
          sim_env() {  # sim_env <device id> <udid>: "<id>: <device name> | <runtime name> (<runtime build>)"
            xcrun simctl list -j | SIM_ID="$1" SIM_UDID="$2" python3 -I -c '
          import json, os, sys
          data = json.load(sys.stdin)
          runtimes = {r.get("identifier"): r for r in data.get("runtimes", [])}
          for runtime, items in data.get("devices", {}).items():
              for d in items:
                  if d.get("udid") == os.environ["SIM_UDID"]:
                      r = runtimes.get(runtime, {})
                      print("%s: %s | %s (%s)" % (os.environ["SIM_ID"], d.get("name"), r.get("name", runtime), r.get("buildversion", "?")))
                      raise SystemExit
          print("%s: (no simulator %s)" % (os.environ["SIM_ID"], os.environ["SIM_UDID"]))
          '
          }
          xcodebuild -version > shots/env.txt || echo "::warning::xcodebuild -version failed"
          # 1.4 (docs/M7D_CONTRACT.md §3.3 3): the Xcode's path, the runner image (§3.8: an image being rolled out has another
          # Xcode and other runtimes), the simulator runtimes, XcodeGen and Python, so two env.txt tell those apart too.
          {
            echo "Xcode path: $(xcode-select -p)"
            echo "runner image: ${ImageOS:-?} ${ImageVersion:-?}"
            echo "xcodegen: $(xcodegen --version 2>&1 | head -n 1)"
            echo "python3: $(python3 --version 2>&1)"
            xcrun simctl list runtimes
          } >> shots/env.txt || echo "::warning::env.txt: the lines of 1.4 could not all be written"
          sim_env ipad13 "$UDID" >> shots/env.txt || echo "::warning::no runtime line for ipad13"
          cat shots/env.txt || true
          # 1.4 D0b (docs/M7D_CONTRACT.md §3.5 (f); docs/M7D.md, D0b): in D0 (run 44632524223) photos of the image 20261119
          # lacked part of their demo handwriting (whole PencilKit tiles not shown). Each photo is checked with
          # tools/shots/ink_check.swift (built by "Build the handwriting check in the background", else here) against its
          # line in tools/shots/ink_ref.tsv; a photo whose handwriting is short is taken again with the same launch and wait
          # (ink_retake), at most twice, and then the take with the fewest pixels short stays, with a warning (a notice when
          # a retake is complete; no more takes again after 3 such photos of a device, or 180 s of them in a step). A complete
          # photo is kept as before (same arguments and waits). Every result is a line of shots/ink.txt
          # (tools/shots/ink_retake.sh). Same lines in both workflows.
          . "$GITHUB_WORKSPACE/tools/shots/ink_retake.sh"
          ink_build
          # docs/M7B.md (FIX3), docs/M7B_CONTRACT.md §12.6: a first launch after the install compiles PencilKit's
          # 34 Metal shaders (the next launches none). In run 42013415033 that took until 19 s after the launch,
          # so the month photo of 8 s had no handwriting. And a freshly booted simulator posts the banner "Ready
          # for Apple Intelligence" once, about 85–105 s after the boot (docs/M7B.md, C1), which that run caught
          # on the week photo. 120 s with the app in front outlasts both. Same lines in the other workflow.
          xcrun simctl launch "$UDID" "$BUNDLE" --screenshot-mode --screenshot-month 2026-10 --screenshot-page month $JA_ARGS || true
          sleep 120
          xcrun simctl terminate "$UDID" "$BUNDLE" 2>/dev/null || true
          for PAGE in month week day year; do
            xcrun simctl terminate "$UDID" "$BUNDLE" 2>/dev/null || true
            sleep 1
            xcrun simctl launch "$UDID" "$BUNDLE" --screenshot-mode --screenshot-month 2026-10 --screenshot-page "$PAGE" $JA_ARGS
            sleep 8
            pgrep -fl "TegakiCalendar.app/TegakiCalendar" || echo "::warning::The app is not running after 8 s ($PAGE page; crashed?)"
            xcrun simctl io "$UDID" screenshot "shots/ipad13-portrait-$PAGE.png"
            ink_retake "shots/ipad13-portrait-$PAGE.png" "ipad13-portrait-$PAGE.png" 8 --screenshot-mode --screenshot-month 2026-10 --screenshot-page "$PAGE" $JA_ARGS
          done
          # page|offset: month lu (400, 200) → the Wed–Sat columns from the second half of the 10/5 week;
          # week (300, 700) → Tue–Sat from 8:45 (the band's lanes grow past zoom 0.818, §1.6);
          # year (1000, 300) → clamped to the right edge: May's end to December.
          for SPEC in "month|400,200" "week|300,700" "year|1000,300"; do
            PAGE="${SPEC%%|*}"; OFFSET="${SPEC##*|}"
            xcrun simctl terminate "$UDID" "$BUNDLE" 2>/dev/null || true
            sleep 1
            xcrun simctl launch "$UDID" "$BUNDLE" --screenshot-mode --screenshot-month 2026-10 --screenshot-page "$PAGE" --screenshot-zoom 2 --screenshot-offset "$OFFSET" $JA_ARGS
            sleep 8
            pgrep -fl "TegakiCalendar.app/TegakiCalendar" || echo "::warning::The app is not running after 8 s ($PAGE page, zoom 2; crashed?)"
            xcrun simctl io "$UDID" screenshot "shots/ipad13-portrait-$PAGE-zoom2.png"
            ink_retake "shots/ipad13-portrait-$PAGE-zoom2.png" "ipad13-portrait-$PAGE-zoom2.png" 8 --screenshot-mode --screenshot-month 2026-10 --screenshot-page "$PAGE" --screenshot-zoom 2 --screenshot-offset "$OFFSET" $JA_ARGS
          done
          xcrun simctl terminate "$UDID" "$BUNDLE" 2>/dev/null || true
          sleep 1
          xcrun simctl launch "$UDID" "$BUNDLE" --screenshot-mode --screenshot-month 2026-10 --screenshot-page month --screenshot-readonly $JA_ARGS
          sleep 8
          pgrep -fl "TegakiCalendar.app/TegakiCalendar" || echo "::warning::The app is not running after 8 s (month page, read only; crashed?)"
          xcrun simctl io "$UDID" screenshot "shots/ipad13-portrait-readonly.png"
          ink_retake shots/ipad13-portrait-readonly.png ipad13-portrait-readonly.png 8 --screenshot-mode --screenshot-month 2026-10 --screenshot-page month --screenshot-readonly $JA_ARGS
          for SPEC in "toolbar-collapsed|--screenshot-page month --screenshot-toolbar collapsed" \
                      "toolbar-collapsed-right|--screenshot-page month --screenshot-toolbar collapsed-right" \
                      "tool-eraser|--screenshot-page month --screenshot-tool eraser" \
                      "month-memo|--screenshot-page month --screenshot-grown --screenshot-offset 0,1700" \
                      "day-extra|--screenshot-page day --screenshot-grown --screenshot-offset 0,2300"; do
            SHOT="${SPEC%%|*}"; ARGS="${SPEC#*|}"
            xcrun simctl terminate "$UDID" "$BUNDLE" 2>/dev/null || true
            sleep 1
            # $ARGS (and $JA_ARGS) is split on purpose (the values have no spaces).
            xcrun simctl launch "$UDID" "$BUNDLE" --screenshot-mode --screenshot-month 2026-10 $ARGS $JA_ARGS
            sleep 8
            pgrep -fl "TegakiCalendar.app/TegakiCalendar" || echo "::warning::The app is not running after 8 s ($SHOT; crashed?)"
            xcrun simctl io "$UDID" screenshot "shots/ipad13-portrait-$SHOT.png"
            ink_retake "shots/ipad13-portrait-$SHOT.png" "ipad13-portrait-$SHOT.png" 8 --screenshot-mode --screenshot-month 2026-10 $ARGS $JA_ARGS
          done
          # The pinch hint, last as before (the comment above the step: kept when written within the toast's 20 s).
          # 1.4 D0b (§3.5 (f)): and with its handwriting complete (ink_hint); after 2 takes the better one stays (in time
          # first, then fewer pixels short; two late complete takes: the second, as before).
          HINT_SECONDS=20
          for TAKE in 1 2; do
            xcrun simctl terminate "$UDID" "$BUNDLE" 2>/dev/null || true
            sleep 1
            LAUNCHED="$(date +%s)"
            xcrun simctl launch "$UDID" "$BUNDLE" --screenshot-mode --screenshot-month 2026-10 --screenshot-page month --screenshot-pinch-hint $JA_ARGS
            sleep 8
            pgrep -fl "TegakiCalendar.app/TegakiCalendar" || echo "::warning::The app is not running after 8 s (pinch-hint; crashed?)"
            xcrun simctl io "$UDID" screenshot "shots/ipad13-portrait-pinch-hint.png"
            TOOK=$(( $(date +%s) - LAUNCHED ))
            if ink_hint shots/ipad13-portrait-pinch-hint.png ipad13-portrait-pinch-hint.png "$TAKE" "$TOOK" "$HINT_SECONDS"; then
              echo "pinch hint (ipad13): written ${TOOK} s after the launch (take $TAKE), inside the toast's ${HINT_SECONDS} s"
              break
            fi
            if [ "$TOOK" -le "$HINT_SECONDS" ]; then
              echo "pinch hint (ipad13): written ${TOOK} s after the launch (take $TAKE), inside the toast's ${HINT_SECONDS} s, its handwriting short"
            else
              echo "pinch hint (ipad13): written ${TOOK} s after the launch (take $TAKE), after the toast's ${HINT_SECONDS} s"
            fi
            if [ "$TAKE" = 2 ]; then
              echo "::warning::ipad13-portrait-pinch-hint.png was written more than ${HINT_SECONDS} s after its launch, or with its handwriting short, twice; the toast or some handwriting may be missing from it (J-4)."
            fi
          done
          ls -la shots

      # Since 1.1 (docs/M7A_CONTRACT.md §7.3) a ninth sheet, "info": the settings scrolled to 「情報」 with
      # the demo stroke counts (「いちばん線の多いページ」 and 「今年の年のページ」). Since 1.2 (docs/M7B_CONTRACT.md
      # §7.4, §10.7, §7.6) a tenth, "holidays" (the picker of the holidays), and an eleventh, "week-start" (the
      # settings with the question of switching the week start). ja-baseline.yml does not shoot these two.
      # (1.3: it does, its reference being 43fe366.)
      # 1.3 (docs/M7C_CONTRACT.md §10.5; docs/M7C.md, S3's J-4 and its hand-off to S5): the photo of a sheet is no
      # longer only the frame of a fixed 9 s after the launch. In run 43149906124 that frame of `--screenshot-sheet
      # holidays` held the settings still sliding in, not yet at their place (the picker opens from them 0.4 s after
      # they appear). The frame of 9 s is still taken, and kept once tools/shots/screen_ready.swift finds the screen
      # ready: still (at most 1 pixel in 2,000 differs strongly from a frame taken at 8 s), and unlike the screens shown
      # before it — the month page without a sheet (ipad13-portrait-month.png, the step above) for every sheet, and the
      # settings (ipad13-portrait-sheet-settings.png, taken before them in this loop) for the four opened from them
      # (sync, info, holidays, week-start). Otherwise the next frame, a second later, is compared with that one, up to
      # 30 s after the launch and at least twice (in run 43310108102 one frame took 25 s: the simulator was slow); then
      # the last frame stays, with a warning. Every comparison is one line. So no photo is taken earlier than before, and a
      # screen that has settled is photographed as before (each sheet of the runs 43136565762 and 43149906124 and of the
      # reference run 43158921131 differs from that month page by at least 47,648 pixels, the four from those settings by
      # at least 44,318; the same screen of two runs by 0). The same lines in ja-baseline.yml (J-4). If the tool does not
      # compile, every sheet is the frame of 9 s, with a warning.
      # 1.3's review of the week memo (docs/M7C.md, the lead's decision 1 of the week memo's integration): in run
      # 44296486095 the frame of 9 s of `--screenshot-sheet holidays` held the settings, still, a few pixels from their
      # place, the picker not yet open, and was kept (32,648 pixels from the settings' photo). The tool now counts only
      # the pixels with no like pixel within 3 pixels (that frame: 1,220, not unlike; a settled sheet: at least 23,816 from
      # the settings, 37,015 from the month page), so such a frame is not kept and the step waits for the expected screen
      # (the loop below, unchanged). The frame of 9 s stays the first one taken, so no photo is earlier than before. The
      # tool is read from the commit a run is on, so ja-baseline.yml (which runs on r13) waits the same way once this
      # change is on r13.
      - name: Screenshots (13-inch iPad, portrait, 11 sheets on the month page)
        if: ${{ !cancelled() && steps.simudid.outcome == 'success' }}
        continue-on-error: true
        run: |
          set -euo pipefail
          UDID="${{ steps.simudid.outputs.udid }}"
          BUNDLE="com.syfan0.tegakicalendar"
          mkdir -p shots
          # 1.3: the wait for the screen (above), built from the commit that runs the workflow: in the background before
          # the boot when a step started that build (build.yml's "Build the sheets' screen check in the background"),
          # else here.
          READY="$RUNNER_TEMP/screen_ready"
          BACKGROUND="$RUNNER_TEMP/screen_ready.build"
          if [ -f "$BACKGROUND/pid" ]; then
            BUILD_WAIT=0
            while [ ! -f "$BACKGROUND/status" ] && kill -0 "$(cat "$BACKGROUND/pid")" 2>/dev/null && [ "$BUILD_WAIT" -lt 300 ]; do
              sleep 1
              BUILD_WAIT=$((BUILD_WAIT + 1))
            done
            if [ "$(cat "$BACKGROUND/status" 2>/dev/null || true)" = "0" ] && [ -x "$BACKGROUND/screen_ready" ]; then
              cp "$BACKGROUND/screen_ready" "$READY"
              echo "tools/shots/screen_ready.swift was built in the background (waited for it ${BUILD_WAIT} s here)."
            else
              echo "::warning::the background build of tools/shots/screen_ready.swift did not end well; it is built here."
              cat "$BACKGROUND/log" 2>/dev/null || true
            fi
          fi
          if [ ! -x "$READY" ] && ! swiftc -O "$GITHUB_WORKSPACE/tools/shots/screen_ready.swift" -o "$READY"; then
            echo "::warning::tools/shots/screen_ready.swift did not compile; every sheet is taken 9 s after its launch, as before 1.3."
            READY=""
          fi
          EARLIER="$RUNNER_TEMP/sheet-earlier.png"
          for SHEET in create edit lasso settings sync import paywall export info holidays week-start; do
            SHOT="shots/ipad13-portrait-sheet-$SHEET.png"
            UNLIKE="shots/ipad13-portrait-month.png"
            case "$SHEET" in
              sync|info|holidays|week-start) UNLIKE="$UNLIKE shots/ipad13-portrait-sheet-settings.png" ;;
            esac
            xcrun simctl terminate "$UDID" "$BUNDLE" 2>/dev/null || true
            sleep 1
            xcrun simctl launch "$UDID" "$BUNDLE" --screenshot-mode --screenshot-month 2026-10 --screenshot-page month --screenshot-sheet "$SHEET" $JA_ARGS
            LAUNCHED="$(date +%s)"
            rm -f "$EARLIER"
            sleep 8
            [ -z "$READY" ] || xcrun simctl io "$UDID" screenshot "$EARLIER" > /dev/null 2>&1 || true
            sleep 1
            pgrep -fl "TegakiCalendar.app/TegakiCalendar" || echo "::warning::The app is not running after 9 s (sheet $SHEET; crashed?)"
            xcrun simctl io "$UDID" screenshot "$SHOT"
            [ -n "$READY" ] || continue
            TRIES=0
            while :; do
              STATUS=0
              # $UNLIKE is split on purpose (paths without spaces).
              LINE="$("$READY" "$SHOT" "$EARLIER" $UNLIKE)" || STATUS=$?
              WAITED=$(( $(date +%s) - LAUNCHED ))
              echo "sheet $SHEET, ${WAITED} s after the launch: $LINE"
              [ "$STATUS" != 0 ] || break
              if [ "$STATUS" != 1 ] || { [ "$WAITED" -ge 30 ] && [ "$TRIES" -ge 2 ]; }; then
                echo "::warning::sheet $SHEET: the screen was not ready ${WAITED} s after the launch; its last frame is kept."
                break
              fi
              TRIES=$((TRIES + 1))
              cp "$SHOT" "$EARLIER"
              sleep 1
              if ! xcrun simctl io "$UDID" screenshot "$SHOT" > /dev/null 2>&1; then
                echo "::warning::sheet $SHEET: a later frame could not be taken, the one before is kept"
                cp "$EARLIER" "$SHOT"
                break
              fi
            done
          done
          # 1.4 D0b (docs/M7D_CONTRACT.md §3.5 (f); docs/M7D.md, D0b): the sheets' handwriting is checked and written into
          # shots/ink.txt, but a sheet is not taken again (its frame is screen_ready's); of the 11 only the lasso's has a line
          # in tools/shots/ink_ref.tsv. Same lines in both workflows.
          . "$GITHUB_WORKSPACE/tools/shots/ink_retake.sh"
          ink_build
          for SHEET in create edit lasso settings sync import paywall export info holidays week-start; do
            ink_read "shots/ipad13-portrait-sheet-$SHEET.png" "ipad13-portrait-sheet-$SHEET.png" 1
            [ "$INK_STATUS" != 1 ] || echo "::warning::ipad13-portrait-sheet-$SHEET.png: its handwriting is short ($INK_SHORT px); a sheet is not taken again."
          done
          ls -la shots

      # The 13-inch log is collected before the other devices boot (its 25 shots since 1.2 took 8.9 min in
      # CI-0; with the 2 min wait added after CI-0 that is about 11, so a 14 min window; each extra device
      # writes its own shots/<id>-log.txt below).
      - name: Collect the app log and crash reports (13-inch iPad)
        if: ${{ !cancelled() && steps.simudid.outcome == 'success' }}
        continue-on-error: true
        run: |
          set -uo pipefail
          UDID="${{ steps.simudid.outputs.udid }}"
          mkdir -p shots
          xcrun simctl terminate "$UDID" com.syfan0.tegakicalendar 2>/dev/null || true
          xcrun simctl spawn "$UDID" log show --last 14m --style compact \
            --predicate 'process == "TegakiCalendar" OR eventMessage CONTAINS "tegakicalendar" OR eventMessage CONTAINS "TegakiCalendar"' \
            > shots/app-log.txt 2>&1 || true
          find "$HOME/Library/Logs/DiagnosticReports" -name 'TegakiCalendar*' -mmin -15 -exec cp {} shots/ \; 2>/dev/null || true
          ls -la shots
          grep -c "" shots/app-log.txt || true
          # M4c (docs/M4C_CONTRACT.md §2.4): the canvas's first layout logs "zoom: kind=… pinch=%d
          # enabled=%d min max zoom fitAll ratio view overview" (DEBUG), a pinch "zoom: begin" /
          # "zoom: end …"; pinch=1 means PKCanvasView offers a pinch (F4). C copies the numbers into docs/M4C.md.
          grep 'zoom: ' shots/app-log.txt || true
          # M5 (docs/M5_CONTRACT.md §2.2, §7.7): LiveStoreClient logs "store: …" (DEBUG: environment,
          # product count, states). Screenshot mode uses the inert demo client, so 0 lines here is the
          # expected result; the grep is the reach check for a device log read the same way.
          grep 'store: ' shots/app-log.txt || true
          # 1.1 (docs/M7A_CONTRACT.md §2.2, §5.3, §7.3, §8 3): screenshot mode logs the window's safe area
          # and the paper area with the toolbar's state ("toolbar: safeArea=<top>,<left>,<bottom>,<right>",
          # "toolbar: paperArea=<w>x<h> mode=<expanded|collapsed|peek>"; docs/M7A.md compares a folded shot
          # with the expanded one of the same page), the settings' stroke count ("budget: largest=…") and
          # the tail-only path ("canvas: tail-only": 0 lines is fine, screenshot mode opens the grown paper
          # directly). Shown only; no count is expected.
          grep -E 'toolbar: (safeArea|paperArea)=|budget: largest=|canvas: tail-only' shots/app-log.txt || true

      # 1.2 (docs/M7B_CONTRACT.md §5.3, §2.5): the language, the locale and the holidays the screen chose,
      # how long the holidays took to load (`l10n: holidays loaded <ms> ms`; about 50 ms is the aim) and
      # any key the app did not find (`l10n: missing <key>`). Shown only; the lead copies them to docs/M7B.md.
      - name: The app's l10n lines (13-inch iPad)
        if: ${{ !cancelled() && steps.simudid.outcome == 'success' }}
        continue-on-error: true
        run: |
          set -uo pipefail
          grep 'l10n: ' shots/app-log.txt | awk '{ i = index($0, "l10n: "); if (i > 1) $0 = substr($0, i); if (!seen[$0]++) print }' || true

      # The four other device classes (docs/M4B_CONTRACT.md §6.3), booted one at a time and shut
      # down afterwards: iphone (iPhone 17, 402 pt), iphone69 (iPhone 17 Pro Max, 440 pt, until 1.3; since M6,
      # docs/M6_CONTRACT.md 0-15 / M6-2: the 6.9-inch App Store shots, 1320×2868; 1.4, docs/M7D_CONTRACT.md §3.2: the
      # iPhone 18 Pro Max, the image xcode-27 having no iPhone 17 Pro Max — the prefix fallbacks are iPhone 18 Pro Max,
      # iPhone 17 Pro Max in that order, and a device other than the table's fails the job at "The simulators used are the
      # table's"; whether its pixels are one of the accepted 6.9-inch sizes is not known yet, the store step below warns if
      # not), ipadmini (iPad mini (A17 Pro), 744 pt; iOS 27.0, the only runtime that has it) and
      # ipad11 (iPad Pro 11-inch (M5), 834 pt), 4 portrait pages each as <id>-portrait-<page>.png.
      # Since M6 the iPhone and the 6.9-inch iPhone also shoot the paywall sheet over the month page
      # (docs/M6_CONTRACT.md §4.2: store/iphone/05-paywall.jpg and store/iphone69/05-paywall.jpg).
      # Since M5 (docs/M5_CONTRACT.md §7.5) the 11-inch iPad also shoots the day page in read-only mode
      # (the longest title next to the symbol-only badge: 834 < 980, M5-32) and the iPhone the week in
      # read-only mode (no badge in the two-row header; the notice row 「閲覧専用です。…」 + 「購読する」).
      # The iPhone also shoots the week of 2026-06 (6/7 is a Sunday: the paper starts at the right
      # edge, M4B-3; since M4c the overview shows the whole week, and the same week is shot again as
      # -week-jun for the "6/1" heading of the narrow column, M4C-28), the week at three times its
      # overview ("--screenshot-zoom 3 --screenshot-offset 300,700", docs/M4C_CONTRACT.md §6) and
      # tries the 4 pages in landscape ("--screenshot-landscape", §6.4; the file is still written when
      # the request was ignored, the header then stays two rows). Every shot is best effort; a
      # failed boot only skips that device (1.4: a missing simulator fails the job, at "The simulators used are the
      # table's", §3.2). The 13-inch simulator is shut down
      # first to leave the runner's memory to the next one. Since M6 (docs/M6.md §5.1) every device
      # waits 40 s after its boot with the app in front before the first shot and shoots its four pages
      # again at the end: a freshly booted iOS 26 simulator posts a system banner once, 15–35 s after
      # the boot, and two runs caught it on an App Store source (see the step body).
      - name: Screenshots (iPhone, 6.9-inch iPhone, iPad mini, 11-inch iPad; portrait, 4 pages each)
        if: ${{ !cancelled() && steps.simudid.outcome == 'success' }}
        continue-on-error: true
        run: |
          set -euo pipefail
          PRIMARY="${{ steps.simudid.outputs.udid }}"
          APP="$(find build/DerivedData -name "TegakiCalendar.app" -path "*iphonesimulator*" -not -path "*/Index.noindex/*" | head -1)"
          BUNDLE="com.syfan0.tegakicalendar"
          if [ -z "$APP" ]; then
            echo "::warning::TegakiCalendar.app not found under build/DerivedData; skipping the extra devices."
            exit 0
          fi
          mkdir -p shots
          # J-4 (docs/M7B_CONTRACT.md §1.3, §7.5): the Xcode and the simulator runtimes the photos were drawn
          # with. build.yml and ja-baseline.yml write the same lines (keep them the same), so a `diff` of the
          # two env.txt tells whether two runs drew with the same Xcode and runtimes. No UDIDs (they differ
          # from one runner image to the next).
          sim_env() {  # sim_env <device id> <udid>: "<id>: <device name> | <runtime name> (<runtime build>)"
            xcrun simctl list -j | SIM_ID="$1" SIM_UDID="$2" python3 -I -c '
          import json, os, sys
          data = json.load(sys.stdin)
          runtimes = {r.get("identifier"): r for r in data.get("runtimes", [])}
          for runtime, items in data.get("devices", {}).items():
              for d in items:
                  if d.get("udid") == os.environ["SIM_UDID"]:
                      r = runtimes.get(runtime, {})
                      print("%s: %s | %s (%s)" % (os.environ["SIM_ID"], d.get("name"), r.get("name", runtime), r.get("buildversion", "?")))
                      raise SystemExit
          print("%s: (no simulator %s)" % (os.environ["SIM_ID"], os.environ["SIM_UDID"]))
          '
          }
          xcrun simctl shutdown "$PRIMARY" || true
          # 1.4 D0b (docs/M7D_CONTRACT.md §3.5 (f); docs/M7D.md, D0b; the 13-inch step says why): `shoot` checks each photo's
          # handwriting and takes a short one again, at most twice (ink_retake); the hint, ink_hint. Not the first round of the
          # four pages (INK_SKIP: taken again at the end). INK_STALE counts per device. Same lines in both workflows.
          . "$GITHUB_WORKSPACE/tools/shots/ink_retake.sh"
          ink_build
          # device-id | exact first choice | prefix fallbacks (in order)
          for SPEC in "iphone|iPhone 17|iPhone 17,iPhone" \
                      "iphone69|iPhone 18 Pro Max|iPhone 18 Pro Max,iPhone 17 Pro Max" \
                      "ipadmini|iPad mini (A17 Pro)|iPad mini" \
                      "ipad11|iPad Pro 11-inch (M5)|iPad Pro 11,iPad Air 11,iPad (A"; do
            ID="${SPEC%%|*}"; REST="${SPEC#*|}"; EXACT="${REST%%|*}"; PREFIXES="${REST#*|}"
            FOUND="$(xcrun simctl list -j devices available | SIM_EXACT="$EXACT" SIM_PREFIXES="$PREFIXES" SIM_PRIMARY="$PRIMARY" python3 -c '
          import json, os, re, sys
          devices = json.load(sys.stdin).get("devices", {})
          def version(runtime):                                  # "…iOS-26-5" → (26, 5)
              m = re.search(r"iOS-(\d+)-(\d+)", runtime)
              return (int(m.group(1)), int(m.group(2))) if m else (0, 0)
          primary_runtime = next((r for r, items in devices.items() for d in items if d.get("udid") == os.environ["SIM_PRIMARY"]), None)
          try:                                                   # 1.4 (docs/M7D_CONTRACT.md §3.2): "Required simulators"
              required = set(open(os.path.join(os.environ["RUNNER_TEMP"], "required-simulators-udids.txt"), encoding="utf-8").read().split())
          except (KeyError, OSError):
              required = set()
          found = {}                                             # name → (udid, key): one Required resolved (1.4) > same runtime as the 13-inch > newer iOS
          for runtime, items in devices.items():
              if "iOS" not in runtime:
                  continue
              for d in items:
                  if not (d.get("isAvailable") and d.get("name") and d.get("udid")):
                      continue
                  key = (d["udid"] in required, runtime == primary_runtime, version(runtime))
                  if d["name"] not in found or key > found[d["name"]][1]:
                      found[d["name"]] = (d["udid"], key)
          exact = os.environ["SIM_EXACT"]
          if exact in found:
              print(exact + "|" + found[exact][0])
              raise SystemExit
          for prefix in os.environ["SIM_PREFIXES"].split(","):
              for name in sorted(found):
                  if name.startswith(prefix):
                      print(name + "|" + found[name][0])
                      raise SystemExit
          print("")
          ' || true)"
            if [ -z "$FOUND" ]; then echo "::error::No simulator for $ID (docs/M7D_CONTRACT.md §3.2); the job fails at \"The simulators used are the table's\"."; continue; fi
            NAME="${FOUND%%|*}"; UDID="${FOUND##*|}"
            echo "$ID: $NAME ($UDID)"
            INK_STALE=0
            sim_env "$ID" "$UDID" >> shots/env.txt || echo "::warning::no runtime line for $ID"
            xcrun simctl boot "$UDID" || true
            xcrun simctl bootstatus "$UDID" -b || { echo "::warning::$ID ($NAME) did not boot; skipping."; continue; }
            xcrun simctl ui "$UDID" appearance light || true
            xcrun simctl status_bar "$UDID" override --time "9:41" --batteryState charged --batteryLevel 100 --wifiBars 3 || true
            if ! xcrun simctl install "$UDID" "$APP"; then
              echo "::warning::install failed on $ID; skipping."
              [ "$UDID" = "$PRIMARY" ] || xcrun simctl shutdown "$UDID" || true
              continue
            fi
            shoot() {  # shoot <file> <launch args…>: one shot; a failure only loses this one file (never stops the step)
              local FILE="$1"; shift
              xcrun simctl terminate "$UDID" "$BUNDLE" 2>/dev/null || true
              sleep 1
              SHOT_LAUNCHED="$(date +%s)"   # 1.3: read by hint_shot
              xcrun simctl launch "$UDID" "$BUNDLE" --screenshot-mode "$@" $JA_ARGS || { echo "::warning::launch failed ($FILE)"; return 0; }
              sleep 9
              # `grep` without -q reads the whole list (docs/M7C.md, S1 の残り, decision 8): with -q it stops at the first match,
              # simctl, still writing the list, gets SIGPIPE, and pipefail makes the pipeline fail although the app is in
              # the list (a false warning in 0–9 of build.yml's photos and 5–14 of l10n-shots' in the runs of 11/11–12;
              # none in the prototype's span-shots, removed in S6, which read the whole list). An app not in the list, or no list, still warns.
              xcrun simctl spawn "$UDID" launchctl list 2>/dev/null | grep tegakicalendar > /dev/null || echo "::warning::The app is not running after 9 s ($FILE)"
              xcrun simctl io "$UDID" screenshot "shots/$FILE" || echo "::warning::screenshot failed ($FILE)"
              ink_retake "shots/$FILE" "$FILE" 9 --screenshot-mode "$@" $JA_ARGS
            }
            # 1.3 (docs/M7C.md, wave C1's lead decision 6; the 13-inch step's comment): the pinch hint's toast is up for 20 s
            # from half a second after the canvas appeared. A photo written more than 20 s after its launch is taken once more;
            # a second late one stays, with a warning. A photo taken in time is `shoot`'s, as before.
            # 1.4 D0b (§3.5 (f)): kept also only with its handwriting complete (ink_hint, not shoot's ink_retake); after 2 takes
            # the better one stays (in time first, then fewer pixels short; two late complete takes: the second, as before).
            hint_shot() {  # hint_shot <file> <launch args…>
              local TAKE TOOK
              for TAKE in 1 2; do
                INK_SKIP=1
                shoot "$@"
                INK_SKIP=0
                TOOK=$(( $(date +%s) - SHOT_LAUNCHED ))
                if ink_hint "shots/$1" "$1" "$TAKE" "$TOOK" 20; then
                  echo "pinch hint ($1): written ${TOOK} s after the launch (take $TAKE), inside the toast's 20 s"
                  return 0
                fi
                if [ "$TOOK" -le 20 ]; then
                  echo "pinch hint ($1): written ${TOOK} s after the launch (take $TAKE), inside the toast's 20 s, its handwriting short"
                else
                  echo "pinch hint ($1): written ${TOOK} s after the launch (take $TAKE), after the toast's 20 s"
                fi
              done
              echo "::warning::$1 was written more than 20 s after its launch, or with its handwriting short, twice; the toast or some handwriting may be missing from it (J-4)."
            }
            # M6 (docs/M6.md §5.1): a freshly booted iOS 26 simulator posts a system banner once, 15–35 s
            # after the boot ("Ready for Apple Intelligence" — run 39034481760 caught it on
            # iphone-portrait-week.png, run 39031277533 on ipad11-portrait-day.png, both App Store
            # sources). Wait that window out with the app in front before the first shot (settle) …
            xcrun simctl launch "$UDID" "$BUNDLE" --screenshot-mode --screenshot-month 2026-10 --screenshot-page month $JA_ARGS || true
            sleep 40
            xcrun simctl terminate "$UDID" "$BUNDLE" 2>/dev/null || true
            INK_SKIP=1   # 1.4 D0b: these four are taken again below; their handwriting is checked there
            for PAGE in month week day year; do
              shoot "$ID-portrait-$PAGE.png" --screenshot-month 2026-10 --screenshot-page "$PAGE"
            done
            INK_SKIP=0
            if [ "$ID" = "ipad11" ]; then
              # M5-32: the day page's title 「2026年10月7日(水)」 must stay on one line next to the lock-only badge.
              shoot "$ID-portrait-readonly.png" --screenshot-month 2026-10 --screenshot-page day --screenshot-readonly
            fi
            if [ "$ID" = "iphone" ]; then
              # M5-13: compact width → no badge, the notice row under the header instead.
              shoot "$ID-portrait-readonly.png" --screenshot-month 2026-10 --screenshot-page week --screenshot-readonly
            fi
            if [ "$ID" = "iphone" ] || [ "$ID" = "iphone69" ]; then
              # M6 (docs/M6_CONTRACT.md §4.2, §7.4): the full-height paywall sheet (.large detent) over the
              # month page — the App Store shot 05-paywall of both iPhone classes.
              shoot "$ID-portrait-sheet-paywall.png" --screenshot-month 2026-10 --screenshot-page month --screenshot-sheet paywall
            fi
            # … and shoot the four pages (the store/ sources) once more now, 1.5–2 min after the boot, so
            # a banner that still slipped into a first take is not in the file that is kept (retake).
            for PAGE in month week day year; do
              shoot "$ID-portrait-$PAGE.png" --screenshot-month 2026-10 --screenshot-page "$PAGE"
            done
            if [ "$ID" = "iphone69" ]; then
              # 1.4 (docs/M7D_CONTRACT.md §3.2): the iPhone 18 Pro Max's pixels go into env.txt (whether App Store takes them
              # as a 6.9-inch size is not known; "Store listing set" still only warns). Not a device line ("<id>: …"), so
              # "The simulators used are the table's" does not read it.
              PIXELS="$(sips -g pixelWidth -g pixelHeight "shots/$ID-portrait-month.png" 2>/dev/null | awk '/pixel(Width|Height)/ { printf "%s%s", (n++ ? "x" : ""), $2 }' || true)"
              echo "iphone69 pixels: ${PIXELS:-no photo} ($ID-portrait-month.png)" >> shots/env.txt || true
            fi
            if [ "$ID" = "iphone" ]; then
              # 1.1 (docs/M7A_CONTRACT.md §7.4, §8 6): the folded toolbar (the dock button above the home
              # indicator), the grown month memo and the day's free memo below 24:00 at their strokes,
              # the one-time pinch hint (1.1.1), and (below, with the landscape shots) the folded toolbar
              # in landscape.
              shoot "$ID-portrait-toolbar-collapsed.png" --screenshot-month 2026-10 --screenshot-page month --screenshot-toolbar collapsed
              shoot "$ID-portrait-month-memo.png" --screenshot-month 2026-10 --screenshot-page month --screenshot-grown --screenshot-offset 0,1700
              shoot "$ID-portrait-day-extra.png" --screenshot-month 2026-10 --screenshot-page day --screenshot-grown --screenshot-offset 0,2300
              hint_shot "$ID-portrait-pinch-hint.png" --screenshot-month 2026-10 --screenshot-page month --screenshot-pinch-hint
              # M4B-3 / M4B-27: 6/7 is a Sunday → the 「今日」 column is the last one → the paper starts
              # at the right edge and the time labels are off screen.
              shoot "$ID-portrait-week-sun.png" --screenshot-month 2026-06 --screenshot-page week
              # M4c: the week at 3 × fitAll (0.8613: Tue–Thu from 8:45, the text at its minPoints) and
              # the week of 6/1–6/7 (M4C-28: the first heading is "6/1" without its weekday).
              shoot "$ID-portrait-week-zoom3.png" --screenshot-month 2026-10 --screenshot-page week --screenshot-zoom 3 --screenshot-offset 300,700
              shoot "$ID-portrait-week-jun.png" --screenshot-month 2026-06 --screenshot-page week
              for PAGE in month week day year; do        # §6.4: only the iPhone can turn
                shoot "$ID-landscape-$PAGE.png" --screenshot-month 2026-10 --screenshot-page "$PAGE" --screenshot-landscape
              done
              shoot "$ID-landscape-month-toolbar-collapsed.png" --screenshot-month 2026-10 --screenshot-page month --screenshot-toolbar collapsed --screenshot-landscape
              # The simulator's framebuffer stays portrait (only the app's interface turned), so the
              # landscape shots come out rotated by 90°; stand them up. When the request was ignored
              # (header still two rows) they end up sideways instead, which is the tell.
              # 1.4 D0b (docs/M7D_CONTRACT.md §3.5 (g); docs/M7D.md, D0b): the iOS 27.2 simulator writes them in landscape
              # already (D0, run 44632524223: 2622x1206, turned by 270° they stood sideways), so only a PNG taller than wide
              # is turned. Same lines in both workflows.
              for f in shots/"$ID"-landscape-*.png; do
                [ -f "$f" ] || continue
                TURN_SIZE="$(sips -g pixelWidth -g pixelHeight "$f" 2>/dev/null | awk '/pixelWidth/ { w = $2 } /pixelHeight/ { h = $2 } END { print w + 0, h + 0 }' || true)"
                if [ "${TURN_SIZE#* }" -gt "${TURN_SIZE% *}" ]; then
                  sips -r 270 "$f" > /dev/null || echo "::warning::could not rotate $f"
                fi
              done
            fi
            xcrun simctl terminate "$UDID" "$BUNDLE" 2>/dev/null || true
            # 1.1: 6 → 8 min (the iPhone takes about 21 shots now, plus the 40 s wait).
            xcrun simctl spawn "$UDID" log show --last 8m --style compact --predicate 'process == "TegakiCalendar"' > "shots/$ID-log.txt" 2>&1 || true
            grep 'zoom: ' "shots/$ID-log.txt" || true     # M4c: the canvas's zoom lines of this device
            grep 'store: ' "shots/$ID-log.txt" || true    # M5: the store's lines (0 in screenshot mode, see above)
            grep -E 'toolbar: (safeArea|paperArea)=|budget: largest=|canvas: tail-only' "shots/$ID-log.txt" || true   # 1.1 (see the 13-inch log)
            [ "$UDID" = "$PRIMARY" ] || xcrun simctl shutdown "$UDID" || true
          done
          ls -la shots

      # M6 (docs/M6_CONTRACT.md §4.1, §4.2, §7.4): the App Store listing set. The shots of §4.2 are
      # converted to JPEG (no alpha: `simctl io screenshot` PNGs are usually opaque but that is not
      # guaranteed, and Apple rejects alpha) under shots/store/<device>/NN-<name>.jpg, and each file's
      # pixel size is compared with Apple's accepted portrait sizes for that device class (help page
      # "Screenshot specifications", read 2026-10-17): iPad 13-inch 2064×2752 or 2048×2732, iPhone
      # Dynamic Island (medium) 1206×2622 or 1179×2556, iPhone Dynamic Island (large) 1320×2868 /
      # 1290×2796 / 1260×2736, iPad 11-inch 1668×2420 / 1668×2388 / 1640×2360 / 1488×2266. A size
      # outside its set is a ::warning (a run that fell back to "iPad Air 13-inch" gives 2048×2732 and
      # passes; one that fell back to "iPhone 17 Pro" for iphone69 gives 1206×2622 and warns). The
      # numbers are the provisional listing order (§4.2 — the lead may reorder at §8-5). Always runs,
      # never fails the job; a missing source only skips that one file.
      - name: Store listing set (JPEG, App Store sizes)
        if: ${{ always() && env.QUICK != 'true' }}
        continue-on-error: true
        run: |
          set -uo pipefail
          mkdir -p shots/store/ipad13 shots/store/iphone shots/store/iphone69 shots/store/ipad11
          accepted() {  # accepted <device>: Apple's accepted portrait pixel sizes (docs/M6_CONTRACT.md §4.1)
            case "$1" in
              ipad13)   echo "2064x2752 2048x2732" ;;
              iphone)   echo "1206x2622 1179x2556" ;;
              iphone69) echo "1320x2868 1290x2796 1260x2736" ;;
              ipad11)   echo "1668x2420 1668x2388 1640x2360 1488x2266" ;;
              *)        echo "" ;;
            esac
          }
          store() {  # store <device> <NN-name> <source shot without .png>: convert, then check the size
            local DEV="$1" NAME="$2" SRC="shots/$3.png" OUT="shots/store/$1/$2.jpg" W H SIZE
            if [ ! -f "$SRC" ]; then echo "::warning::store/$DEV/$NAME.jpg: source $SRC is missing; skipped."; return 0; fi
            if ! sips -s format jpeg -s formatOptions 100 "$SRC" --out "$OUT" > /dev/null; then echo "::warning::store/$DEV/$NAME.jpg: sips could not convert $SRC."; return 0; fi
            W="$(sips -g pixelWidth "$OUT" | awk '/pixelWidth/ {print $2}')"
            H="$(sips -g pixelHeight "$OUT" | awk '/pixelHeight/ {print $2}')"
            SIZE="${W}x${H}"
            case " $(accepted "$DEV") " in
              *" $SIZE "*) echo "store/$DEV/$NAME.jpg: ${SIZE} (accepted for $DEV)" ;;
              *) echo "::warning::store/$DEV/$NAME.jpg is ${SIZE}, not one of the accepted sizes for $DEV ($(accepted "$DEV"))." ;;
            esac
          }
          store ipad13   01-month    ipad13-portrait-month
          store ipad13   02-week     ipad13-portrait-week
          store ipad13   03-day      ipad13-portrait-day
          store ipad13   04-year     ipad13-portrait-year
          store ipad13   05-paywall  ipad13-portrait-sheet-paywall
          store ipad13   06-settings ipad13-portrait-sheet-settings
          store iphone   01-week     iphone-portrait-week
          store iphone   02-month    iphone-portrait-month
          store iphone   03-day      iphone-portrait-day
          store iphone   04-year     iphone-portrait-year
          store iphone   05-paywall  iphone-portrait-sheet-paywall
          store iphone69 01-week     iphone69-portrait-week
          store iphone69 02-month    iphone69-portrait-month
          store iphone69 03-day      iphone69-portrait-day
          store iphone69 04-year     iphone69-portrait-year
          store iphone69 05-paywall  iphone69-portrait-sheet-paywall
          store ipad11   01-month    ipad11-portrait-month
          store ipad11   02-week     ipad11-portrait-week
          store ipad11   03-day      ipad11-portrait-day
          store ipad11   04-year     ipad11-portrait-year
          ls -la shots/store/*

      # 1.4 D0b (docs/M7D_CONTRACT.md §3.5, §3.8; docs/M7D.md, D0b): the reach of the app logs the photo steps took with
      # `log show` (shots/app-log.txt of the 13-inch, shots/<id>-log.txt of the other devices). On the iOS 27 simulators
      # `log show` gives the app's NSLog lines as "<compose failure …>" (D0, run 44632524223: no `toolbar: paperArea=`
      # line in any of them, 18–52 in 1.3's run 44474759145), and those steps only show what they find. The check is a
      # step of its own, after "Store listing set", so the photo steps stay word for word those of ja-baseline.yml (J-4,
      # §3.5) and how they launch the app does not change. Warns only (tools/ci/log-reach.sh). ja-baseline.yml has the
      # same step (the script from $GITHUB_WORKSPACE, the pushed commit: ja-baseline.yml's steps run in the reference
      # commit's tree).
      - name: The app logs' reach (1.4 D0b)
        if: ${{ !cancelled() && steps.simudid.outcome == 'success' }}
        continue-on-error: true
        timeout-minutes: 2
        run: |
          set -uo pipefail
          REACH="$GITHUB_WORKSPACE/tools/ci/log-reach.sh"
          bash "$REACH" "13-inch iPad (log show)" shots/app-log.txt 'toolbar: paperArea=' 'l10n: ui=' || true
          for ID in iphone iphone69 ipadmini ipad11; do
            bash "$REACH" "$ID (log show)" "shots/$ID-log.txt" 'toolbar: paperArea=' || true
          done

      - name: Upload screenshots
        if: ${{ always() && env.QUICK != 'true' }}
        uses: actions/upload-artifact@v4
        with:
          name: screenshots
          path: shots
          retention-days: 7
          if-no-files-found: warn

      # 1.4 (docs/M7D_CONTRACT.md §3.2): the devices this job took are the table's ("Required simulators"): each line
      # "<id>: <name> | <runtime> (<build>)" of its env.txt has the table's name, on the runtime (name and build) that
      # "Required simulators" found for it, and every device of the table has a line (none means it was not found, and its
      # photos or tests are missing). A prefix fallback that landed on another device, or another runtime taken instead of
      # the table's (a newer one, or the iPhone Duo's iOS 27.2), fails the job here. The same lines in every job that boots
      # a simulator; only ENV_TXT differs.
      - name: The simulators used are the table's (1.4)
        if: ${{ !cancelled() && env.QUICK != 'true' }}
        env:
          ENV_TXT: shots/env.txt
        run: |
          set -euo pipefail
          python3 -I - "$RUNNER_TEMP/required-simulators.txt" "$ENV_TXT" <<'EOF'
          import re, sys
          table = [[p.strip() for p in line.rstrip("\n").split("|")] for line in open(sys.argv[1], encoding="utf-8") if line.strip()]
          try:
              resolved = {row[0]: row[2:] for row in (line.rstrip("\n").split("|") for line in open(sys.argv[1].replace(".txt", "-resolved.txt"), encoding="utf-8")) if len(row) == 4}
          except OSError:
              resolved = {}
          try:
              lines = open(sys.argv[2], encoding="utf-8").read().splitlines()
          except OSError as error:
              print("::error::%s could not be read (%s): the devices this job took are not known (docs/M7D_CONTRACT.md §3.2)." % (sys.argv[2], error))
              sys.exit(1)
          taken = {}
          for line in lines:
              m = re.fullmatch(r"([a-z0-9]+): (.+) \| (.+) \(([^()]*)\)", line)
              if m:
                  taken.setdefault(m.group(1), []).append(m.group(2, 3, 4))
          failed = False
          for ident, name, want in table:
              if ident not in taken:
                  print("::error::%s (%s): no line in %s, so it was not taken (docs/M7D_CONTRACT.md §3.2)." % (ident, name, sys.argv[2]))
                  failed = True
              for got, runtime, build in taken.get(ident, []):
                  if ident in resolved:
                      ok = got == name and [runtime, build] == resolved[ident]
                      where = "%s (%s)" % tuple(resolved[ident])
                  else:
                      ok = got == name and (runtime == "iOS " + want or runtime.startswith("iOS " + want + "."))
                      where = "iOS " + want
                  print("%s: %s | %s (%s): %s" % (ident, got, runtime, build, "the table's" if ok else "NOT the table's"))
                  if not ok:
                      print("::error::%s took %s on %s (%s), not the table's %s on %s (docs/M7D_CONTRACT.md §3.2)." % (ident, got, runtime, build, name, where))
                      failed = True
          sys.exit(1 if failed else 0)
          EOF

      # 1.4 D1d (docs/M7D.md, 実行機の打ち切り): only when this job is cancelled (by hand, by its time limit, or by the runner's
      # side with nothing but "The operation was canceled.", four times on xcode-27 on 11/20), tools/ci/cancel-diag.sh prints
      # the load, the memory, the 15 busiest processes and, from the runner's own _diag folder, only its lines about a
      # cancel, a shutdown, a lost connection, a time-out or a signal (200 at most; the folder is never uploaded or printed
      # whole, nothing is written to disk: the repository is public). Not on success or failure; never fails the job. The
      # same lines at the end of every job on xcode-27 of build.yml and duo.yml.
      - name: Diagnostics of a cancelled job (1.4 D1d)
        if: cancelled()
        continue-on-error: true
        timeout-minutes: 3
        run: |
          if [ -f tools/ci/cancel-diag.sh ]; then
            bash tools/ci/cancel-diag.sh || true
          else
            echo "tools/ci/cancel-diag.sh is not here (cancelled before the checkout?)."
            uptime || true
          fi

  # 1.3 (docs/M7C.md, wave C1's lead decision 7; the wave C plan §4.4, §7.6): the UI tests on an iPhone, out of the first
  # job since wave C2. Without the joined pages' UI tests their step took 15.4 and 17.3 min (runs 43584152837 and
  # 43570477701); SpanUITests and SpanRerunUITests (about 6 tests and 9 re-runs) were expected to bring it to 23–26 min,
  # past the 22 min at which the plan gives them a job of their own, and to 100 min or more for the first job (79.7 and
  # 82.0 in those runs, 93.1 in run 43552123427). The three steps are the first job's as they were (the build of 1.0.1 in a
  # DerivedData of its own, the tests with `test-without-building`, the attachments); no other step of the first job used
  # the build's outputs or its DerivedData. The tests pass their own language and arguments. The log and the screenshots
  # are the artifact "ui-tests" (shots/ui-tests, kept 7 days; before 1.3's wave C2 they were in "screenshots"). Not on
  # r13-quick and r13-q-* (§10.6: the quick lane has no UI test). No `needs`. The limit: checkout and the project about
  # 1.5 min, the build 2–6 (1.4 in run 43570477701, where the first job's build had warmed the modules; a cold one about 5),
  # the boot with its 60 s wait 2–4, the tests 13–22 and the step's own 40 at most: 60.
  # 1.4.3 D1b (docs/R1_4_3_CONTRACT.md §11.3, §12.1; open question 8 of D1b's plan): 60 → 70 with the step's 45 → 55 below
  # (SpanMonthYearUITests' month adds about 6 min); the other steps take 8–12, so 70 keeps 10 or more over a step of 44–48.
  # 1.4.3 D1y (§11.3, §12.1): 70 → 75 with the step's 55 → 60 below. D1b's two runs measured the job at 44.1 and 47.8 min
  # (runs 46119423355 and 46129477127, its step 41.3 and 43.5, the other steps 2.8 and 4.3); the year's two tests and the
  # year-tap probe's settling add about 2–3 (the step's comment), so the job is about 47–51 and 75 keeps 10 or more over
  # the step's 60 with the other steps.
  ui-tests:
    name: UI tests (iPhone)
    if: ${{ !(github.ref_name == 'r13-quick' || startsWith(github.ref_name, 'r13-q-') || github.ref_name == 'r14-quick' || startsWith(github.ref_name, 'r14-q-') || github.ref_name == 'r141-quick' || startsWith(github.ref_name, 'r141-q-') || github.ref_name == 'r142-quick' || startsWith(github.ref_name, 'r142-q-') || startsWith(github.ref_name, 'r142-w-') || github.ref_name == 'r143-quick' || startsWith(github.ref_name, 'r143-q-') || startsWith(github.ref_name, 'r143-w-')) }}
    # 1.4 (docs/M7D_CONTRACT.md §3.1, §3.3 1, 0d-2): the image with Xcode 27 (macos-26 and macos-15 do not get it).
    runs-on: xcode-27
    timeout-minutes: 75
    env:
      HOMEBREW_NO_AUTO_UPDATE: "1"
      HOMEBREW_NO_INSTALL_CLEANUP: "1"
      NSUnbufferedIO: "YES"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # 1.4 (docs/M7D_CONTRACT.md §3.1, 0d-1): Xcode 27.2, chosen by what each candidate says it is, never by its path.
      # Every /Applications/Xcode_27.2*.app is read with `xcodebuild -version` (DEVELOPER_DIR set to it); one whose version is
      # 27.2 or 27.2.x and whose build ends in a digit is a release (a beta's build ends in a lower-case letter, as 27.3
      # beta's 27C5020n; the rolling-out image 20261119 gives that beta aliases named like a release, §3.1), and the newest
      # release is selected. None fails the job: until 1.3 this step chose Xcode 26.6 only when it was there and otherwise
      # went on with the image's default Xcode, unseen. Then `sudo xcodebuild -runFirstLaunch` (harmless when it has run).
      # The same lines in every job on xcode-27 (build.yml, ja-baseline.yml, store-shots.yml, testflight.yml, duo.yml).
      - name: Select Xcode 27.2
        run: |
          set -euo pipefail
          XCODE="$(python3 -I -c '
          import glob, os, re, subprocess, sys
          def key(version, build):                               # (27, 2, 0), then the build: digits as numbers
              numbers = tuple((int(p) for p in version.split("."))) + (0, 0, 0)
              return numbers[:3], tuple((0, int(t)) if t.isdigit() else (1, t) for t in re.findall(r"[0-9]+|[^0-9]+", build))
          best = None
          seen = {}
          for app in sorted(glob.glob("/Applications/Xcode_27.2*.app")):
              real = os.path.realpath(app)
              if real in seen:
                  print("%s: the same Xcode as %s" % (app, seen[real]), file=sys.stderr)
                  continue
              seen[real] = app
              env = dict(os.environ, DEVELOPER_DIR=os.path.join(real, "Contents", "Developer"))
              try:
                  out = subprocess.run(["xcodebuild", "-version"], env=env, capture_output=True, text=True, timeout=300).stdout
              except Exception as error:
                  print("%s: xcodebuild -version failed (%s)" % (app, error), file=sys.stderr)
                  continue
              version = re.search(r"^Xcode ([0-9.]+)$", out, re.M)
              build = re.search(r"^Build version ([0-9A-Za-z]+)$", out, re.M)
              version = version.group(1) if version else "?"
              build = build.group(1) if build else "?"
              release = re.fullmatch(r"27\.2(\.[0-9]+)?", version) is not None and re.search(r"[0-9]$", build) is not None
              print("%s (%s): Xcode %s, build %s%s" % (app, real, version, build, ": a release of 27.2" if release else ": not a release of 27.2"), file=sys.stderr)
              if release and (best is None or key(version, build) > best[0]):
                  best = (key(version, build), real)
          print(best[1] if best else "")
          ')"
          if [ -z "$XCODE" ]; then
            echo "::error::No release of Xcode 27.2 in /Applications (xcodebuild -version 27.2 or 27.2.x, its build ending in a digit; docs/M7D_CONTRACT.md §3.1). The job does not go on with another Xcode."
            exit 1
          fi
          echo "Selected: $XCODE"
          sudo xcode-select -s "$XCODE"
          sudo xcodebuild -runFirstLaunch
          xcode-select -p
          xcodebuild -version
          echo "runner image: ${ImageOS:-?} ${ImageVersion:-?}"

      # 1.4 (docs/M7D_CONTRACT.md §3.2, 0d-3): the simulators of the table that this job uses must be on the runner, each
      # under its exact name on its runtime (iOS 27.2; the iPad mini (A17 Pro) is on iOS 27.0 only; the iPhone Duo on the
      # Duo's iOS 27.2 runtime). One that is missing fails the job here: until 1.3 a missing device was a warning ("No
      # simulator for …; skipping") and the job stayed green, so all the 6.9-inch photos could be gone unseen. Each one's
      # UDID is an output of this step (steps.required.outputs.<id>); the table and the runtime (name and build) each one
      # resolved to go to $RUNNER_TEMP for "The simulators used are the table's" after the photos, and the UDIDs to
      # $RUNNER_TEMP/required-simulators-udids.txt, which the pickers of the later steps take first (so they boot the very
      # devices checked here). When the name is on two runtimes of that version (iOS 27.2 has two sets, the usual devices'
      # and the iPhone Duo's, §3.1), every other device is taken from the runtime with no iPhone Duo and the iPhone Duo from
      # the runtime of iPhone Duos only; a warning only when nothing tells the runtimes apart. The same lines in every job
      # that boots a simulator; only the table differs.
      - name: Required simulators (1.4)
        id: required
        env:
          # <id>|<exact name>|<runtime version> (docs/M7D_CONTRACT.md §3.2)
          REQUIRED: |
            iphone|iPhone 17|27.2
        run: |
          set -euo pipefail
          printf '%s\n' "$REQUIRED" | grep -v '^[[:space:]]*$' > "$RUNNER_TEMP/required-simulators.txt"
          xcrun simctl list -j > "$RUNNER_TEMP/simctl-list.json"
          python3 -I - "$RUNNER_TEMP/simctl-list.json" "$RUNNER_TEMP/required-simulators.txt" <<'EOF'
          import json, os, re, sys
          data = json.load(open(sys.argv[1], encoding="utf-8"))
          runtimes = {r.get("identifier"): r for r in data.get("runtimes", [])}
          def version(runtime):                                  # the runtime's "version" ("27.2"), else from its identifier
              v = runtimes.get(runtime, {}).get("version")
              if v:
                  return v
              m = re.search(r"iOS-([0-9]+)-([0-9]+)", runtime)
              return "%s.%s" % m.groups() if m else "?"
          devices = {runtime: [d for d in items if d.get("isAvailable") and d.get("name") and d.get("udid")]
                     for runtime, items in data.get("devices", {}).items() if "iOS" in runtime}
          def duos(runtime):                                     # 0: iPhone Duos only, 1: some, 2: none
              n = sum(d["name"].startswith("iPhone Duo") for d in devices[runtime])
              return 0 if n == len(devices[runtime]) else 1 if n else 2
          failed = False
          outputs = []
          resolved = []
          for line in open(sys.argv[2], encoding="utf-8"):
              ident, name, want = [p.strip() for p in line.rstrip("\n").split("|")]
              def wanted(runtime):
                  return version(runtime) == want or version(runtime).startswith(want + ".")
              # The runtime that suits the name first: for the iPhone Duo the one of iPhone Duos only (the Duo's own iOS 27.2
              # set), for every other device the one with no iPhone Duo (§3.1); then a runtime with some iPhone Duos.
              found = sorted((duos(runtime) if name.startswith("iPhone Duo") else 2 - duos(runtime), runtime, d["udid"])
                             for runtime, items in devices.items() if wanted(runtime) for d in items if d["name"] == name)
              if not found:
                  there = sorted({d["name"] for runtime, items in devices.items() if wanted(runtime) for d in items})
                  print("::error::%s: no available simulator \"%s\" on iOS %s (docs/M7D_CONTRACT.md §3.2). The devices of iOS %s: %s"
                        % (ident, name, want, want, ", ".join(there) or "none (no such runtime)"))
                  failed = True
                  continue
              _, runtime, udid = found[0]
              r = runtimes.get(runtime, {})
              print("%s: %s | %s (%s) %s" % (ident, name, r.get("name", runtime), r.get("buildversion", "?"), udid))
              if len(found) > 1:
                  tie = found[0][0] == found[1][0]
                  print("%s%s: \"%s\" is on %d runtimes of iOS %s (%s); %s is taken (%s)."
                        % ("::warning::" if tie else "", ident, name, len(found), want, ", ".join(f[1] for f in found), runtime,
                           "nothing tells them apart: the first by its identifier" if tie
                           else "iPhone Duos only" if name.startswith("iPhone Duo") else "no iPhone Duo"))
              outputs.append("%s=%s\n" % (ident, udid))
              resolved.append("%s|%s|%s|%s\n" % (ident, name, r.get("name", runtime), r.get("buildversion", "?")))
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as out:
              out.write("".join(outputs))
          with open(sys.argv[2].replace(".txt", "-resolved.txt"), "w", encoding="utf-8") as out:
              out.write("".join(resolved))
          with open(sys.argv[2].replace(".txt", "-udids.txt"), "w", encoding="utf-8") as out:
              out.write("".join(o.split("=", 1)[1] for o in outputs))
          sys.exit(1 if failed else 0)
          EOF

      # 1.4 (docs/M7D_CONTRACT.md §3.3 4, 0d-28): XcodeGen 2.46.0 from its release zip, pinned by sha256, the same in every
      # job (until 1.3 `brew install xcodegen`, whose version was the image's formula). The script fails unless
      # `xcodegen --version` then says 2.46.0; the job's later steps find it first in PATH.
      - name: Install XcodeGen
        run: |
          set -euo pipefail
          bash "$GITHUB_WORKSPACE/tools/ci/install-xcodegen.sh"

      - name: Generate the Xcode project
        run: |
          set -euo pipefail
          xcodegen generate

      # 1.0.1 (docs/R1_0_1.md §5.1): the iPhone UI test is built first and run afterwards ("UI tests on an
      # iPhone" below, `test-without-building`). Built early because a build late in a job can fail on the
      # runner: run 41168800617's late build re-ran CopySwiftLibs, whose Metal toolchain mount
      # (/var/run/com.apple.security.cryptexd/mnt/…MetalToolchain…) was gone by then. Its own derived data (in the
      # first job, so the app the screenshot steps installed stayed the one built there). The iPhone: iPhone 17
      # (fallbacks: any "iPhone 17…", then any iPhone), the booted simulator's runtime first. 1.4 (docs/M7D_CONTRACT.md
      # §3.2): its line goes into shots/ui-tests/env.txt, and a device other than the table's iPhone 17 on iOS 27.2 fails
      # the job at the next step, before the tests.
      - name: Build the UI tests for an iPhone (1.0.1)
        id: uibuild
        run: |
          set -euo pipefail
          FOUND="$(xcrun simctl list -j devices available | python3 -c '
          import json, os, re, sys
          devices = json.load(sys.stdin).get("devices", {})
          def version(runtime):
              m = re.search(r"iOS-(\d+)-(\d+)", runtime)
              return (int(m.group(1)), int(m.group(2))) if m else (0, 0)
          booted_runtime = next((r for r, items in devices.items() for d in items if d.get("state") == "Booted"), None)
          try:                                                   # 1.4 (docs/M7D_CONTRACT.md §3.2): "Required simulators"
              required = set(open(os.path.join(os.environ["RUNNER_TEMP"], "required-simulators-udids.txt"), encoding="utf-8").read().split())
          except (KeyError, OSError):
              required = set()
          found = {}                                             # name → (udid, key): one Required resolved (1.4) > booted runtime > newer iOS
          for runtime, items in devices.items():
              if "iOS" not in runtime:
                  continue
              for d in items:
                  if not (d.get("isAvailable") and d.get("name") and d.get("udid")):
                      continue
                  key = (d["udid"] in required, runtime == booted_runtime, version(runtime))
                  if d["name"] not in found or key > found[d["name"]][1]:
                      found[d["name"]] = (d["udid"], key)
          if "iPhone 17" in found:
              print("iPhone 17|" + found["iPhone 17"][0]); raise SystemExit
          for prefix in ("iPhone 17", "iPhone"):
              for name in sorted(found):
                  if name.startswith(prefix):
                      print(name + "|" + found[name][0]); raise SystemExit
          print("")
          ')"
          if [ -z "$FOUND" ]; then echo "::error::No iPhone simulator for the UI test."; exit 1; fi
          NAME="${FOUND%%|*}"; UDID="${FOUND##*|}"
          echo "UI tests on: $NAME ($UDID)"
          echo "name=$NAME" >> "$GITHUB_OUTPUT"
          echo "udid=$UDID" >> "$GITHUB_OUTPUT"
          mkdir -p shots/ui-tests
          # 1.4 (docs/M7D_CONTRACT.md §3.3 3, gate 8): this job's environment (the lines of build.yml's env.txt), then each
          # device it takes ("<id>: <name> | <runtime> (<build>)", sim_env), which "The simulators used are the table's" reads.
          {
            xcodebuild -version
            echo "Xcode path: $(xcode-select -p)"
            echo "runner image: ${ImageOS:-?} ${ImageVersion:-?}"
            echo "xcodegen: $(xcodegen --version 2>&1 | head -n 1)"
            echo "python3: $(python3 --version 2>&1)"
            xcrun simctl list runtimes
          } > shots/ui-tests/env.txt || echo "::warning::env.txt could not all be written"
          sim_env() {  # sim_env <device id> <udid>: "<id>: <device name> | <runtime name> (<runtime build>)"
            xcrun simctl list -j | SIM_ID="$1" SIM_UDID="$2" python3 -I -c '
          import json, os, sys
          data = json.load(sys.stdin)
          runtimes = {r.get("identifier"): r for r in data.get("runtimes", [])}
          for runtime, items in data.get("devices", {}).items():
              for d in items:
                  if d.get("udid") == os.environ["SIM_UDID"]:
                      r = runtimes.get(runtime, {})
                      print("%s: %s | %s (%s)" % (os.environ["SIM_ID"], d.get("name"), r.get("name", runtime), r.get("buildversion", "?")))
                      raise SystemExit
          print("%s: (no simulator %s)" % (os.environ["SIM_ID"], os.environ["SIM_UDID"]))
          '
          }
          sim_env iphone "$UDID" >> shots/ui-tests/env.txt || echo "::warning::no runtime line for iphone"
          xcodebuild \
            -project TegakiCalendar.xcodeproj \
            -scheme TegakiCalendar \
            -configuration Debug \
            -destination "platform=iOS Simulator,id=$UDID" \
            -derivedDataPath build/UITestData \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            build-for-testing
          ls build/UITestData/Build/Products/*.xctestrun

      # 1.4 (docs/M7D_CONTRACT.md §3.2): the devices this job took are the table's ("Required simulators"): each line
      # "<id>: <name> | <runtime> (<build>)" of its env.txt has the table's name, on the runtime (name and build) that
      # "Required simulators" found for it, and every device of the table has a line (none means it was not found, and its
      # photos or tests are missing). A prefix fallback that landed on another device, or another runtime taken instead of
      # the table's (a newer one, or the iPhone Duo's iOS 27.2), fails the job here. The same lines in every job that boots
      # a simulator; only ENV_TXT differs.
      - name: The simulators used are the table's (1.4)
        if: ${{ !cancelled() && env.QUICK != 'true' }}
        env:
          ENV_TXT: shots/ui-tests/env.txt
        run: |
          set -euo pipefail
          python3 -I - "$RUNNER_TEMP/required-simulators.txt" "$ENV_TXT" <<'EOF'
          import re, sys
          table = [[p.strip() for p in line.rstrip("\n").split("|")] for line in open(sys.argv[1], encoding="utf-8") if line.strip()]
          try:
              resolved = {row[0]: row[2:] for row in (line.rstrip("\n").split("|") for line in open(sys.argv[1].replace(".txt", "-resolved.txt"), encoding="utf-8")) if len(row) == 4}
          except OSError:
              resolved = {}
          try:
              lines = open(sys.argv[2], encoding="utf-8").read().splitlines()
          except OSError as error:
              print("::error::%s could not be read (%s): the devices this job took are not known (docs/M7D_CONTRACT.md §3.2)." % (sys.argv[2], error))
              sys.exit(1)
          taken = {}
          for line in lines:
              m = re.fullmatch(r"([a-z0-9]+): (.+) \| (.+) \(([^()]*)\)", line)
              if m:
                  taken.setdefault(m.group(1), []).append(m.group(2, 3, 4))
          failed = False
          for ident, name, want in table:
              if ident not in taken:
                  print("::error::%s (%s): no line in %s, so it was not taken (docs/M7D_CONTRACT.md §3.2)." % (ident, name, sys.argv[2]))
                  failed = True
              for got, runtime, build in taken.get(ident, []):
                  if ident in resolved:
                      ok = got == name and [runtime, build] == resolved[ident]
                      where = "%s (%s)" % tuple(resolved[ident])
                  else:
                      ok = got == name and (runtime == "iOS " + want or runtime.startswith("iOS " + want + "."))
                      where = "iOS " + want
                  print("%s: %s | %s (%s): %s" % (ident, got, runtime, build, "the table's" if ok else "NOT the table's"))
                  if not ok:
                      print("::error::%s took %s on %s (%s), not the table's %s on %s (docs/M7D_CONTRACT.md §3.2)." % (ident, got, runtime, build, name, where))
                      failed = True
          sys.exit(1 if failed else 0)
          EOF

      # 1.0.1 (docs/R1_0_1.md §5.1): the UI test of the fix on the iPhone picked and built above
      # (`test-without-building`: nothing is compiled this late). YearTapUITests launches the app in
      # screenshot mode on the year page and taps the middle of 3/16 with a real (simulated finger) tap
      # or double tap — 「指でも書く」 on and off, portrait and landscape — and expects the day page. It
      # fails the job when a test fails (until 1.3 it ran after the first job's screenshots, so their
      # devices started as before; now its own job). The log and the screenshots the test keeps (before /
      # after each tap) go to shots/ui-tests/ (the artifact "ui-tests"). 1.1 fix (docs/M7A.md ずれ 46・47):
      # EraserAndBelowDayUITests (8 tests: the toolbar's eraser goes back to the pen, nothing below 24:00
      # becomes an event) runs here too; its steps are the `eraser-memo UI:` lines. The lead's review: the
      # step stops after 25 minutes (normally about 7: the boot, the 60 s wait, YearTapUITests 97 s in
      # run 41164839330 and about 3–4 min for the 8; an overloaded simulator stretches every wait of the
      # tests, each of which is bounded). 1.1.1 (docs/R1_1_1.md): HeaderAndPaperUITests (3 tests, about a
      # minute: where 「今日」 sits and that it works, an empty page at the top of the real paper area);
      # its steps are the `header-paper UI:` lines. 1.2 (docs/M7B_CONTRACT.md §7.3, §10.8): LanguageUITests
      # (3.8 min in CI-0 for 29 launches of about 8 s, now 30; which language iOS chooses and, in German, that the purchase
      # sheet reaches its links, its steps are the `l10n UI:` lines) and WeekStartUITests (the `week-start UI:` lines) run here too; the xcodebuild of the
      # step took 10.2 min in CI-0 (1.1.1's whole step took 11.9 in run 41922318959) and the step stops after 40. The tests pass their own language in their launch arguments.
      # 1.3 (docs/M7C_CONTRACT.md §10.3, §10.6): the joined pages' UI tests (SpanUITests, and the old UI tests again with
      # the joined pages on in SpanRerunUITests) mark their steps `span UI:`; the grep shows them once they exist.
      # SpanShotsUITests (the photos of the span-shots-app job) skips itself here, as BlankPaperShotsUITests does.
      # 1.4 (docs/M7D_CONTRACT.md §3.10, §6): so does DuoLayoutUITests (it runs on the iPhone Duo in duo.yml's duo-shots,
      # with TEGAKI_DEVICE=duo), so the UI tests of the gates (43 in 1.3) are counted without the skipped ones;
      # DuoHingeUITests is not even compiled here (only duo-hinge passes DUO_HINGE).
      # 1.4.1 (docs/R1_4_1_CONTRACT.md §3.5, §6.1, §6.2, §6.6, §16.2, §16.6, 0e-6, 0e-23): HeaderAndPaperUITests is rewritten
      # for 1.4.1's header (the rework's order: 「‹ 今日 ›」 and 等倍 at the writing hand's end, the date at the other, both
      # hands, its `header-paper UI:` lines), ZoomResetUITests (等倍: a week or a day one page across, a year as it opens,
      # `zoom-reset UI:`) runs here, and HeaderRoomUITests measures the iPhone 17's header (its first row in portrait and its
      # wide row in landscape; logs only, the `header room:` lines, read by the lead for D1a's gate; blank-paper measures the
      # four other devices). D1b (§4.3, §6.1): PaletteMoveUITests' iPhone test (`palette UI:`: asked for the left edge, the
      # iPhone keeps 1.4's bar at the bottom with no grip); its iPad test skips itself here (blank-paper runs it).
      # 1.4.2 (docs/R1_4_2_CONTRACT.md §6.1, §6.5): ColorPanelUITests (the pen colour panel on the iPhone's bottom bar, one launch,
      # its steps the `color-panel UI:` lines) runs here; ColorPanelPadUITests skips itself here (blank-paper's iPad step runs it).
      # The step 40 → 45 min: it took 35:24–36:18 in run #4, D0 and D1a, and ColorPanelUITests adds 1–3 min (the job's 60 stays).
      # D2 (D1b's decision (m)): LanguageUITests' testLocalizedShotsOfTheMemoPaperAndTheColourPanel takes l10n-shots' XCUI
      # photos there and skips itself here (one more skipped test, no time).
      # 1.4.3 D1b (docs/R1_4_3_CONTRACT.md §11.3, §12.1): SpanMonthYearUITests (the joined month: one finger's slide and the
      # title once, ‹ ›, a memo line across the boundary, the setting off and on, 等倍 in portrait read when turned; its steps
      # the `span-my UI:` lines, the year's part D1y's) runs here; SpanMonthYearShotsUITests (span-shots-my's photos and
      # r143-alt's samples) skips itself here. The step 45 → 55 min (open question 8 of D1b's plan): main's run 46040646988
      # met the 45 twice (its tests 36–38 min) and the three tests add about 6 (5 launches, two turns, the settings sheet
      # twice), so 55 keeps about 10 over 44.
      # 1.4.3 D1y (§11.3, §12.1; open question 7 of D1y's plan): SpanMonthYearUITests' year (two tests, four launches: one
      # finger's slide and the title once, a line across 2025|2026 and 「前の年」; 等倍 in portrait read when turned) and
      # YearTapUITests reading the canvas's probe (`--screenshot-probe`, 0g-52: its taps wait for the probe to settle,
      # about 1 s a test, and the joined path's day window). The step 55 → 60: in D1b's runs it took 41.3 and 43.5 min
      # (runs 46119423355 and 46129477127, the tests 33.6 and 36.5 of them; the month's three tests 3.3 and 4.3, its
      # slide-and-line test and its 等倍 test 35–64 s each), and the year adds about 2–3 [estimate: the year's two tests as
      # long as those two, its line waiting up to 20 s more for the year's rows; the year-tap tests about 15 s in all], so
      # about 44–47 and 60 keeps 13.
      - name: UI tests on an iPhone (the year page's tap, 1.0.1)
        timeout-minutes: 60
        run: |
          set -euo pipefail
          UDID="${{ steps.uibuild.outputs.udid }}"
          echo "UI tests on: ${{ steps.uibuild.outputs.name }} ($UDID)"
          # A freshly booted simulator stays busy for a while (and posts a system banner 15–35 s after
          # the boot, docs/M6.md §5.1). In run 41172398011 the last UI test met that load (5–10 s per
          # query) and its tap never reached the app. Boot first and let it settle.
          xcrun simctl boot "$UDID" 2>/dev/null || true
          xcrun simctl bootstatus "$UDID" -b
          sleep 60
          mkdir -p shots/ui-tests
          rm -rf build/ui-tests.xcresult
          xcodebuild \
            -project TegakiCalendar.xcodeproj \
            -scheme TegakiCalendar \
            -configuration Debug \
            -destination "platform=iOS Simulator,id=$UDID" \
            -derivedDataPath build/UITestData \
            -resultBundlePath build/ui-tests.xcresult \
            -only-testing:TegakiCalendarUITests \
            test-without-building 2>&1 | tee shots/ui-tests/ui-tests.log
          grep -E 'year-tap UI:|eraser-memo UI:|header-paper UI:|zoom-reset UI:|header room:|palette UI:|l10n UI:|week-start UI:|span UI:|span-my UI:|memo-paper UI:|color-panel UI:|Test Case .*(passed|failed|skipped)' shots/ui-tests/ui-tests.log || true

      # The screenshots YearTapUITests kept (best effort, also after a failure).
      - name: Export the UI test's screenshots
        if: always()
        continue-on-error: true
        run: |
          set -uo pipefail
          if [ -d build/ui-tests.xcresult ]; then
            mkdir -p shots/ui-tests/attachments
            xcrun xcresulttool export attachments --path build/ui-tests.xcresult --output-path shots/ui-tests/attachments || echo "::warning::xcresulttool could not export the attachments"
            ls -la shots/ui-tests/attachments || true
          else
            echo "No UI test result bundle."
          fi

      # 1.4 D1d (docs/M7D.md, "UI テストの 2 回目の写真"): the handwriting of these photos, a warning only. Attempt 2 of run
      # 44676125566 (image 20261119.0378.1) lost handwriting in 17 of its photos (PencilKit tiles not drawn: the 13 of
      # docs/M7D.md and 4 more this check finds; it also counts "slide — after", whose paper stopped about 80 pt short), and
      # every test that took them passed. tools/shots/xcui_ink.py names each photo by its test and its attachment's name
      # (manifest.json; the files are named by UUIDs) and checks it with tools/shots/ink_check.swift against its line in
      # tools/shots/ink_ref_xcui.tsv (complete photos of the image 20261104.0337.1): a summary line with the counts, a
      # warning for the photos with less ink, and shots/ui-tests/ink-xcui.tsv (one row a photo) in the artifact. Never fails
      # the job (continue-on-error, and every path exits 0). About 2 min: the job's first swiftc, then 0.1 s a photo.
      - name: The UI tests' photos' handwriting (a warning only, 1.4 D1d)
        if: ${{ !cancelled() }}
        continue-on-error: true
        timeout-minutes: 8
        run: |
          set -uo pipefail
          TOOL="$RUNNER_TEMP/xcui-ink"
          mkdir -p "$TOOL"
          if [ ! -f shots/ui-tests/attachments/manifest.json ]; then
            echo "No shots/ui-tests/attachments/manifest.json: no photo of the UI tests to check."
            exit 0
          fi
          if ! swiftc -O tools/shots/ink_check.swift -o "$TOOL/ink_check" > "$TOOL/build.log" 2>&1; then
            cat "$TOOL/build.log" || true
            echo "::warning::tools/shots/ink_check.swift did not compile: the UI tests' photos' handwriting is not checked (docs/M7D.md, D1d)."
            exit 0
          fi
          python3 -I tools/shots/xcui_ink.py check --ink "$TOOL/ink_check" --ref tools/shots/ink_ref_xcui.tsv --prefix ui-tests/ \
            --manifest shots/ui-tests/attachments --out shots/ui-tests/ink-xcui.tsv --label "UI tests" || true
          exit 0

      - name: Upload the UI tests' log and screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ui-tests
          path: shots/ui-tests
          retention-days: 7
          if-no-files-found: warn

      # 1.4 D1d (docs/M7D.md, 実行機の打ち切り): only when this job is cancelled (by hand, by its time limit, or by the runner's
      # side with nothing but "The operation was canceled.", four times on xcode-27 on 11/20), tools/ci/cancel-diag.sh prints
      # the load, the memory, the 15 busiest processes and, from the runner's own _diag folder, only its lines about a
      # cancel, a shutdown, a lost connection, a time-out or a signal (200 at most; the folder is never uploaded or printed
      # whole, nothing is written to disk: the repository is public). Not on success or failure; never fails the job. The
      # same lines at the end of every job on xcode-27 of build.yml and duo.yml.
      - name: Diagnostics of a cancelled job (1.4 D1d)
        if: cancelled()
        continue-on-error: true
        timeout-minutes: 3
        run: |
          if [ -f tools/ci/cancel-diag.sh ]; then
            bash tools/ci/cancel-diag.sh || true
          else
            echo "tools/ci/cancel-diag.sh is not here (cancelled before the checkout?)."
            uptime || true
          fi

  # 1.1 (docs/M7A_CONTRACT.md §1.4, §7.4, §8 2; K-7 of docs/M7_PLAN.md §1.3): the compatibility checks
  # on the REAL 1.0. A 1.0 / 1.0.1 device and a 1.1 device share one iCloud, so the 1.1 fixtures
  # (TegakiKit/Tests/Fixtures/compat11: K's pages, the ledger's and the screenshot mode's) are read by
  # the code of commit a21e4692109e504701b507ad9c695181fdecddfd (1.0, checked out at v10 by SHA — there
  # is no tag, M7A-8): ② the frozen copy (TegakiKit/Tests/Compat10) is checked against the files and
  # line ranges it was made from, and against what tools/compat10/freeze.py makes from them; ③ K's
  # large fixtures are made again and the committed digests.json must come out byte for byte; ④⑤
  # tools/compat10/run.sh runs Compat10Checks on 1.0's real TegakiKit (RunReal) and on the frozen copy
  # (RunFrozen) — the same N, 0 failed, N ≥ tools/compat10/EXPECTED_MIN; ⑥ 1.0's app ledger and sync
  # engine run tools/compat10/AppTests/Real10LedgerTests.swift on the simulator (only that class).
  # Runs next to the build job (no `needs`). The job id has no dot (GitHub allows only letters, digits,
  # `-` and `_`); its name is the contract's "compat-v1.0".
  # 1.3 (docs/M7C_CONTRACT.md §6.3, §10.4): the compat-span fixtures (TegakiKit/Tests/Fixtures/compat-span, what
  # the joined pages write) are read by the real old versions too: the files of shape "monday" in its MANIFEST
  # are copied into the compat11 folder (so ④⑤ and ⑥ read them; tools/compat10 is not touched) and checked to
  # be there; tools/span-compat's Probe reads every file (Monday and Sunday) on the real 1.0 (v10), <1.1.1> (v11)
  # and 1.2.3 (v123: commit 43fe366, taken out with `git archive`); and 1.2.3's app runs
  # tools/span-compat/AppTests/Real123LedgerTests.swift (its ledger and sync engine) on every file. Fixture 4 (the
  # week memo, §5.2) came with the week memo stage: two Monday files (w-2026-12-14 with a grid line written across
  # 24:00, a grid stroke centred below it and memo strokes; w-2026-12-21 with a memo stroke from the week before) and
  # one Sunday file (w-2026-12-20), their counts in tools/span-compat's Version.swift and in Real123LedgerTests.
  # The limit (§10.4: 45 → 65 min for the 1.2.3 Kit and app, back to 45 when the measured times leave room; docs/M7C.md,
  # S1 の残り, decision 7): 45 again. With 1.3's steps the job took 8.8–16.7 min in the 14 runs of 11/11–12 that ran
  # them to the end (runs 43065300839 to 43237335436; the median 13.7), its two app test steps 2.9–7.2 (1.0's) and
  # 3.2–6.8 (1.2.3's), the other steps at most 1.6 each. The slowest time of every step added up is 18.8 min, and with
  # two boots 4 min slower (as seen in the other jobs) about 27. 45 is the limit of the job before 1.3 (8 min then).
  # 1.4 (docs/M7D_CONTRACT.md §5.3, §3.9): the real 1.3 (955fe67, build 26) is a partner too: its TegakiKit at v13
  # for tools/span-compat (v13's versionExtraChecks also runs 1.3's SpanGuard.checkForSave over every file) and its
  # whole tree at v13app for tools/span-compat/AppTests/Real13LedgerTests.swift (the one-page path, the sync and the
  # joined path on every compat-span file). The limit 45 → 65 min for 1.3's Kit and app (§5.3 4): the measured
  # times go into docs/M7D.md, and back to 45 when they leave room.
  # 1.4.3 (docs/R1_4_3_CONTRACT.md §8.3, 0g-30): the new folder compat-span-143 (fixtures 8–13, the month and the year joined
  # sideways) is read by the same partners, which are not added to or changed (1.4.3 touches no data code but the canvas's
  # paper, §8.4): its Monday files go into the compat11 folder too (RunReal, RunFrozen, Real10LedgerTests; the real 1.0's
  # count must rise by 17 per file), tools/span-compat's Probe reads it on the real 1.0, <1.1.1>, 1.2.3 and 1.3 (a run of
  # its own, so compat-span's numbers stay 274/274/278/310), and the 1.2.3 and 1.3 apps' ledger tests read it
  # (TEGAKI_COMPAT_SPAN_143_FIXTURES). EXPECTED_MIN (225, 599) is not touched.
  compat-v1-0:
    name: compat-v1.0
    # 1.3 (docs/M7C_CONTRACT.md §10.6): not on r13-quick (the fast path runs the first job only). 1.4 (docs/M7D_CONTRACT.md
    # §3.10): nor on r14-quick and r14-q-*, but on r14-q-m1 (§5.3 6, §6: the mutation of Real13LedgerTests must fail here).
    # 1.4.1 and 1.4.2 (docs/R1_4_2_CONTRACT.md §6.5) the same way: not on r141-quick, r141-q-*, r142-quick, r142-q-* and
    # r142-w-*, but on the mutation branches r141-q-m1 and r142-q-m1. 1.4.3 (docs/R1_4_3_CONTRACT.md §12.1) the same way:
    # not on r143-quick, r143-q-* and r143-w-*, but on r143-q-m1.
    if: ${{ !(github.ref_name == 'r13-quick' || startsWith(github.ref_name, 'r13-q-') || github.ref_name == 'r14-quick' || (startsWith(github.ref_name, 'r14-q-') && github.ref_name != 'r14-q-m1') || github.ref_name == 'r141-quick' || (startsWith(github.ref_name, 'r141-q-') && github.ref_name != 'r141-q-m1') || github.ref_name == 'r142-quick' || (startsWith(github.ref_name, 'r142-q-') && github.ref_name != 'r142-q-m1') || startsWith(github.ref_name, 'r142-w-') || github.ref_name == 'r143-quick' || (startsWith(github.ref_name, 'r143-q-') && github.ref_name != 'r143-q-m1') || startsWith(github.ref_name, 'r143-w-')) }}
    # 1.4 (docs/M7D_CONTRACT.md §3.9, 0d-2): stays on macos-26 and Xcode 26.6 (the old versions with the Xcode they were
    # made with); only XcodeGen is pinned as in the other jobs. Since D1 1.3 (955fe67) is a partner too (§5.3), and a missing
    # Xcode 26.6 fails the job ("Select Xcode", §3.9).
    runs-on: macos-26
    timeout-minutes: 65
    env:
      HOMEBREW_NO_AUTO_UPDATE: "1"
      HOMEBREW_NO_INSTALL_CLEANUP: "1"
      NSUnbufferedIO: "YES"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Must be the repository root's v10: tools/compat10/Package.swift uses ../../v10/TegakiKit.
      - name: Check out 1.0 (a21e469) at v10
        uses: actions/checkout@v4
        with:
          ref: a21e4692109e504701b507ad9c695181fdecddfd
          path: v10

      # 1.4 (docs/M7D_CONTRACT.md §3.9): Xcode 26.6, the Xcode the old versions were made and shipped with. Until 1.4 this
      # step chose it only when it was there and otherwise went on with the image's default Xcode, unseen; now a macos-26
      # image without it (or with something else under its name: what `xcodebuild -version` says decides, not the path,
      # §3.1) fails the job, and then it is decided whether compat-v1.0 moves to xcode-27 (docs/M7D.md).
      - name: Select Xcode
        run: |
          set -euo pipefail
          XCODE=/Applications/Xcode_26.6.app
          if [ ! -d "$XCODE" ]; then
            echo "::error::No $XCODE on this image (docs/M7D_CONTRACT.md §3.9): compat-v1.0 builds the old versions with Xcode 26.6 and does not go on with another Xcode."
            exit 1
          fi
          SAYS="$(DEVELOPER_DIR="$XCODE/Contents/Developer" xcodebuild -version)"
          VERSION="$(printf '%s\n' "$SAYS" | sed -nE 's/^Xcode ([0-9.]+)$/\1/p')"
          echo "$XCODE: Xcode ${VERSION:-?} ($(printf '%s' "$SAYS" | tr '\n' ' '))"
          case "$VERSION" in
            26.6|26.6.*) ;;
            *)
              echo "::error::$XCODE says Xcode ${VERSION:-?}, not 26.6 (docs/M7D_CONTRACT.md §3.9)."
              exit 1
              ;;
          esac
          sudo xcode-select -s "$XCODE"
          xcode-select -p
          xcodebuild -version
          git -C v10 log -1 --format='v10: %H %s'

      # ② ORIGIN.sha256 (18 whole files of 1.0), ORIGIN.ranges (28 line ranges copied in part or
      # transcribed by LedgerV10 / LayoutFactsV10), FROZEN.sha256 (11 files), and the copy made again
      # from v10 by freeze.py must equal the committed one byte for byte.
      - name: The frozen copy against 1.0
        run: |
          set -euo pipefail
          (cd v10 && shasum -a 256 -c ../TegakiKit/Tests/Compat10/ORIGIN.sha256)
          tools/compat10/check-origin.sh v10
          python3 -I tools/compat10/freeze.py --check --from-dir v10

      # ③ K's large fixtures (y-2026.*, not committed) are made again next to a copy of the committed
      # ones; the committed files (K's pages, digests.json, and the ledger's / screenshot mode's once
      # committed) must come out unchanged.
      - name: The fixtures (K's large ones made again)
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/compat11"
          cp TegakiKit/Tests/Fixtures/compat11/*.json "$RUNNER_TEMP/compat11/"
          swift run --package-path TegakiKit KitChecks --write-compat-fixtures --out "$RUNNER_TEMP/compat11"
          for f in TegakiKit/Tests/Fixtures/compat11/*.json; do
            cmp "$f" "$RUNNER_TEMP/compat11/$(basename "$f")"
          done
          ls -la "$RUNNER_TEMP/compat11"

      # 1.3 (docs/M7C_CONTRACT.md §6.3, §10.4): the compat-span files of shape "monday" (MANIFEST: "<file>
      # <fixture> <monday|sunday>" after the "#" lines) go into the same folder, so RunReal, RunFrozen and
      # Real10LedgerTests read them with K's (Compat10Checks reads every *.json of the folder). The Sunday-start
      # week stays out: Real10LedgerTests lays every w- page out as a Monday week; tools/span-compat reads it.
      # Fails unless every Monday row is in the folder byte for byte and no Sunday row is.
      - name: The compat-span fixtures of the Monday shape into the compat11 folder (1.3)
        run: |
          set -euo pipefail
          SRC=TegakiKit/Tests/Fixtures/compat-span
          DEST="$RUNNER_TEMP/compat11"
          MONDAY=0
          SUNDAY=0
          while read -r FILE FIXTURE SHAPE REST; do
            case "$FILE" in ''|'#'*) continue ;; esac
            if [ -n "${REST:-}" ] || [ -z "${FIXTURE:-}" ]; then echo "::error::compat-span/MANIFEST: \"$FILE $FIXTURE $SHAPE $REST\" is not <file> <fixture> <shape>"; exit 1; fi
            case "$SHAPE" in
              monday) cp "$SRC/$FILE" "$DEST/$FILE"; MONDAY=$((MONDAY + 1)) ;;
              sunday) SUNDAY=$((SUNDAY + 1)) ;;
              *) echo "::error::compat-span/MANIFEST: $FILE has the shape \"$SHAPE\" (monday or sunday)"; exit 1 ;;
            esac
          done < "$SRC/MANIFEST"
          FAILED=0
          while read -r FILE FIXTURE SHAPE REST; do
            case "$FILE" in ''|'#'*) continue ;; esac
            if [ "$SHAPE" = monday ]; then
              cmp "$SRC/$FILE" "$DEST/$FILE" || { echo "::error::$FILE (fixture $FIXTURE, monday) is not in the compat11 folder"; FAILED=1; }
            elif [ -e "$DEST/$FILE" ]; then
              echo "::error::$FILE (fixture $FIXTURE, sunday) must not be in the compat11 folder"; FAILED=1
            fi
          done < "$SRC/MANIFEST"
          echo "compat-span: $MONDAY files of shape monday copied into the compat11 folder ($SUNDAY of shape sunday left out)"
          ls -la "$DEST"
          exit "$FAILED"

      # 1.4.3 (docs/R1_4_3_CONTRACT.md §8.3, 0g-30): the compat-span-143 files of shape "monday" go into the same folder the
      # same way (fixture 11, the Sunday-start month, stays out, as compat-span's Sunday weeks do; tools/span-compat and
      # CompatSpan143Tests read it). A name already in the folder (compat11's or compat-span's) fails: nothing is overwritten.
      - name: The compat-span-143 fixtures of the Monday shape into the compat11 folder (1.4.3)
        run: |
          set -euo pipefail
          SRC=TegakiKit/Tests/Fixtures/compat-span-143
          DEST="$RUNNER_TEMP/compat11"
          MONDAY=0
          SUNDAY=0
          while read -r FILE FIXTURE SHAPE REST; do
            case "$FILE" in ''|'#'*) continue ;; esac
            if [ -n "${REST:-}" ] || [ -z "${FIXTURE:-}" ]; then echo "::error::compat-span-143/MANIFEST: \"$FILE $FIXTURE $SHAPE $REST\" is not <file> <fixture> <shape>"; exit 1; fi
            case "$SHAPE" in
              monday)
                if [ -e "$DEST/$FILE" ]; then echo "::error::compat-span-143: $FILE is already in the compat11 folder (a name of compat11 or compat-span)"; exit 1; fi
                cp "$SRC/$FILE" "$DEST/$FILE"; MONDAY=$((MONDAY + 1)) ;;
              sunday) SUNDAY=$((SUNDAY + 1)) ;;
              *) echo "::error::compat-span-143/MANIFEST: $FILE has the shape \"$SHAPE\" (monday or sunday)"; exit 1 ;;
            esac
          done < "$SRC/MANIFEST"
          FAILED=0
          while read -r FILE FIXTURE SHAPE REST; do
            case "$FILE" in ''|'#'*) continue ;; esac
            if [ "$SHAPE" = monday ]; then
              cmp "$SRC/$FILE" "$DEST/$FILE" || { echo "::error::$FILE (fixture $FIXTURE, monday) is not in the compat11 folder"; FAILED=1; }
            elif [ -e "$DEST/$FILE" ]; then
              echo "::error::$FILE (fixture $FIXTURE, sunday) must not be in the compat11 folder"; FAILED=1
            fi
          done < "$SRC/MANIFEST"
          if [ "$MONDAY" -eq 0 ]; then echo "::error::compat-span-143: no file of shape monday"; FAILED=1; fi
          echo "compat-span-143: $MONDAY files of shape monday copied into the compat11 folder ($SUNDAY of shape sunday left out)"
          ls -la "$DEST"
          exit "$FAILED"

      # ④⑤ The copies into tools/compat10 (ignored by git), RunReal and RunFrozen, the comparison. Since 1.3 the
      # folder holds the Monday compat-span files too; the output is also kept in $RUNNER_TEMP/compat10-run.log.
      - name: The checks on the real 1.0 and on the frozen copy
        run: |
          set -euo pipefail
          tools/compat10/run.sh "$RUNNER_TEMP/compat11" 2>&1 | tee "$RUNNER_TEMP/compat10-run.log"

      # 1.3 (docs/M7C_CONTRACT.md §6.3, §10.4): the real 1.0 read the Monday compat-span files: run.sh's `real N=`
      # is at least tools/compat-span/EXPECTED_MIN, 599 = 1.2.3's 361 + the 14 Monday files × 17 checks (565 with the
      # 12 files before fixture 4, run 43065300839; 599 measured in run 44260458163 with fixture 4's two Monday files;
      # RunFrozen gave the same). tools/compat10/EXPECTED_MIN (225) is not touched. A Monday fixture added later raises
      # the number: count again from the next run's `real N=`.
      - name: The real 1.0 read the compat-span fixtures (1.3)
        run: |
          set -euo pipefail
          MIN="$(tr -d '[:space:]' < tools/compat-span/EXPECTED_MIN)"
          REAL_N="$(sed -nE 's/^compat-v1\.0: real N=([0-9]+) .*/\1/p' "$RUNNER_TEMP/compat10-run.log" | tail -1)"
          echo "compat-span: real N=${REAL_N:-?}, tools/compat-span/EXPECTED_MIN=$MIN"
          if ! printf '%s' "$MIN" | grep -Eq '^[0-9]+$'; then
            echo "::error::tools/compat-span/EXPECTED_MIN must hold one number."
            exit 1
          fi
          if [ -z "$REAL_N" ] || [ "$REAL_N" -lt "$MIN" ]; then
            echo "::error::the real 1.0 ran ${REAL_N:-no} checks, fewer than tools/compat-span/EXPECTED_MIN ($MIN): a compat-span file of the Monday shape did not reach it."
            exit 1
          fi

      # 1.4.3 (docs/R1_4_3_CONTRACT.md §8.3, 0g-30): the real 1.0 read the compat-span-143 files of the Monday shape too: run.sh's
      # `real N=` is at least tools/compat-span/EXPECTED_MIN + 17 per such file of compat-span-143/MANIFEST (Compat10Checks runs 17
      # checks on a page; 599 + 7 × 17 = 718 with D1a's 7 Monday files; measured on a Mac with the committed files: 750 = 1.4.2's
      # 631 + 7 × 17, RunFrozen the same). The number is computed here, so no EXPECTED_MIN file changes.
      - name: The real 1.0 read the compat-span-143 fixtures (1.4.3)
        run: |
          set -euo pipefail
          MIN="$(tr -d '[:space:]' < tools/compat-span/EXPECTED_MIN)"
          MONDAY="$(grep -Ec '^[^#[:space:]]+ [0-9]+ monday$' TegakiKit/Tests/Fixtures/compat-span-143/MANIFEST || true)"
          NEED=$((MIN + 17 * MONDAY))
          REAL_N="$(sed -nE 's/^compat-v1\.0: real N=([0-9]+) .*/\1/p' "$RUNNER_TEMP/compat10-run.log" | tail -1)"
          echo "compat-span-143: real N=${REAL_N:-?}, needed $NEED (EXPECTED_MIN $MIN + 17 × $MONDAY Monday files)"
          if [ "$MONDAY" -lt 1 ]; then
            echo "::error::compat-span-143/MANIFEST has no row of shape monday."
            exit 1
          fi
          if [ -z "$REAL_N" ] || [ "$REAL_N" -lt "$NEED" ]; then
            echo "::error::the real 1.0 ran ${REAL_N:-no} checks, fewer than $NEED: a compat-span-143 file of the Monday shape did not reach it (docs/R1_4_3_CONTRACT.md §8.3)."
            exit 1
          fi

      # 1.2 (docs/M7B_CONTRACT.md K-11, §7.5, §10.8): the REAL old versions read what 1.2 writes (a week
      # page that starts on a Sunday, a month page written in the Sunday order) and neither lose nor move
      # anything: tools/weekstart-compat on 1.0 (v10 above) and on the commit in
      # tools/l10n/ja-baseline-ref.txt (<1.1.1> of §1.5). tools/compat10 is not touched. A failure prints FAIL
      # lines and exits 1 (tools/weekstart-compat/README.md).
      - name: Read the <1.1.1> commit
        id: ref111
        run: |
          set -euo pipefail
          REF="$(tr -d '[:space:]' < tools/l10n/ja-baseline-ref.txt)"
          if ! printf '%s' "$REF" | grep -Eq '^[0-9a-f]{40}$'; then
            echo "::error::tools/l10n/ja-baseline-ref.txt must hold one full commit sha."
            exit 1
          fi
          echo "sha=$REF" >> "$GITHUB_OUTPUT"

      - name: Check out <1.1.1> at v11
        uses: actions/checkout@v4
        with:
          ref: ${{ steps.ref111.outputs.sha }}
          path: v11

      - name: The week start on the real 1.0 and the real <1.1.1>
        run: |
          set -euo pipefail
          git -C v11 log -1 --format='v11: %H %s'
          cp -R tools/weekstart-compat/v10/run v10/run
          swift run --package-path v10/run Probe
          cp -R tools/weekstart-compat/v11/run v11/run
          swift run --package-path v11/run Probe

      # 1.3 (docs/M7C_CONTRACT.md §6.3, §10.4): 1.2.3, the version on sale when 1.3 starts, taken out of git (the
      # checkout above is only one commit deep, so its commit is fetched first): its TegakiKit at v123 for
      # tools/span-compat, and its whole tree at v123app for its app's ledger test below.
      - name: Take out 1.2.3 (43fe366) at v123 and v123app
        run: |
          set -euo pipefail
          SHA=43fe36666a2120e8a23adf4fc76244151a395e6f
          git fetch --no-tags --depth=1 origin "$SHA"
          git log -1 --format='v123: %H %s' "$SHA"
          mkdir -p v123 v123app
          git archive "$SHA" TegakiKit | tar -x -C v123
          git archive "$SHA" | tar -x -C v123app
          ls v123/TegakiKit v123app

      # 1.4 (docs/M7D_CONTRACT.md §5.3 1): 1.3, the version on sale when 1.4 starts (build 26), taken out the same way:
      # its TegakiKit at v13 for tools/span-compat, and its whole tree at v13app for its app's ledger test below.
      - name: Take out 1.3 (955fe67) at v13 and v13app
        run: |
          set -euo pipefail
          SHA=955fe678ec9f999ac45fac1b372f246e43c02f95
          git fetch --no-tags --depth=1 origin "$SHA"
          git log -1 --format='v13: %H %s' "$SHA"
          mkdir -p v13 v13app
          git archive "$SHA" TegakiKit | tar -x -C v13
          git archive "$SHA" | tar -x -C v13app
          ls v13/TegakiKit v13app

      # 1.3 (§6.3): every compat-span file (Monday and Sunday) on the real 1.0, <1.1.1>, 1.2.3 and (since 1.4) 1.3
      # Kits: what each reads and writes back, what its layout draws and its lasso reaches, its migration, merge, erase
      # and own edit, the app export's round trip; on 1.3 also its SpanGuard.checkForSave and checkForTransfer
      # (tools/span-compat/README.md). All four run; any FAIL fails the step.
      - name: The compat-span fixtures on the real 1.0, <1.1.1>, 1.2.3 and 1.3 (span-compat)
        run: |
          set -euo pipefail
          FAILED=0
          for V in v10 v11 v123 v13; do
            tools/span-compat/run.sh "$V" "$V/TegakiKit" "$RUNNER_TEMP/span-compat" || FAILED=1
          done
          exit "$FAILED"

      # 1.4.3 (docs/R1_4_3_CONTRACT.md §8.3, 0g-30): every compat-span-143 file (Monday and Sunday) on the same four real Kits
      # (run.sh's fourth argument; the Probe takes Version.swift's `expectedDrawn143` for that folder): what each reads and
      # writes back, draws and lassoes, its migration, merge, erase and own edit, the export's round trip, on 1.3 also its
      # SpanGuard; for this folder only, every drawn stroke lies inside its cell from top to bottom on that version's own
      # layout (fixtures 12 and 13: the old row grows from the page's own ink and holds the line written where 1.4.3
      # lengthened it), and a month of shape sunday holds memo strokes only. Measured on a Mac with the committed files:
      # v10 150, v11 150, v123 150, v13 166 checks, 0 failed (compat-span's run above stays 274/274/278/310).
      - name: The compat-span-143 fixtures on the real 1.0, <1.1.1>, 1.2.3 and 1.3 (span-compat, 1.4.3)
        run: |
          set -euo pipefail
          FAILED=0
          for V in v10 v11 v123 v13; do
            tools/span-compat/run.sh "$V" "$V/TegakiKit" "$RUNNER_TEMP/span-compat" compat-span-143 || FAILED=1
          done
          exit "$FAILED"

      # 1.4 (docs/M7D_CONTRACT.md §3.3 4, 0d-28): XcodeGen 2.46.0 from its release zip, pinned by sha256, the same in every
      # job, this one on macos-26 too (until 1.3 `brew install xcodegen`, whose version was the image's formula; the old
      # trees' project.yml are generated with it below). The script fails unless `xcodegen --version` then says 2.46.0;
      # the job's later steps find it first in PATH.
      - name: Install XcodeGen
        run: |
          set -euo pipefail
          bash "$GITHUB_WORKSPACE/tools/ci/install-xcodegen.sh"

      # ⑥ 1.0's app (v10, its own project.yml) with Real10LedgerTests.swift added to its unit tests, on
      # the same 13-inch iPad the build job picks; only that class runs.
      - name: 1.0's ledger and sync on the fixtures (Real10LedgerTests)
        run: |
          set -euo pipefail
          cp tools/compat10/AppTests/Real10LedgerTests.swift v10/Tests/TegakiCalendarTests/
          (cd v10 && xcodegen generate)
          NAME="$(xcrun simctl list -j devices available | python3 -c '
          import json, sys
          devices = json.load(sys.stdin).get("devices", {})
          names = set()
          for runtime, items in devices.items():
              if "iOS" not in runtime:
                  continue
              for d in items:
                  if d.get("isAvailable") and d.get("name"):
                      names.add(d["name"])
          for prefix in ("iPad Pro 13-inch", "iPad Air 13-inch", "iPad", "iPhone"):
              matches = sorted(n for n in names if n.startswith(prefix))
              if matches:
                  print(matches[0])
                  raise SystemExit
          print("")
          ' || true)"
          if [ -z "$NAME" ]; then
            echo "::warning::No iOS simulator found in simctl output; falling back to 'iPhone 17'."
            NAME="iPhone 17"
          fi
          echo "Using simulator: $NAME"
          TEST_RUNNER_TEGAKI_COMPAT_FIXTURES="$RUNNER_TEMP/compat11" xcodebuild \
            -project v10/TegakiCalendar.xcodeproj \
            -scheme TegakiCalendar \
            -configuration Debug \
            -destination "platform=iOS Simulator,name=$NAME" \
            -derivedDataPath "$RUNNER_TEMP/v10-derived" \
            -only-testing:TegakiCalendarTests/Real10LedgerTests \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            test 2>&1 | tee "$RUNNER_TEMP/real10.log"
          grep -E 'Test Case .*(passed|failed|skipped)|Executed [0-9]+ test' "$RUNNER_TEMP/real10.log" || true

      # 1.3 (docs/M7C_CONTRACT.md §6.3, §10.4): 1.2.3's app (v123app, its own project.yml) with
      # tools/span-compat/AppTests/Real123LedgerTests.swift added to its unit tests, on the same simulator; only
      # that class runs, on every compat-span file (TEGAKI_COMPAT_SPAN_FIXTURES: the folder of this checkout).
      # 1.4.3 (docs/R1_4_3_CONTRACT.md §8.3): and on every compat-span-143 file (TEGAKI_COMPAT_SPAN_143_FIXTURES; the test
      # fails when it is not set).
      - name: 1.2.3's ledger and sync on the compat-span fixtures (Real123LedgerTests)
        run: |
          set -euo pipefail
          cp tools/span-compat/AppTests/Real123LedgerTests.swift v123app/Tests/TegakiCalendarTests/
          (cd v123app && xcodegen generate)
          NAME="$(xcrun simctl list -j devices available | python3 -c '
          import json, sys
          devices = json.load(sys.stdin).get("devices", {})
          names = set()
          for runtime, items in devices.items():
              if "iOS" not in runtime:
                  continue
              for d in items:
                  if d.get("isAvailable") and d.get("name"):
                      names.add(d["name"])
          for prefix in ("iPad Pro 13-inch", "iPad Air 13-inch", "iPad", "iPhone"):
              matches = sorted(n for n in names if n.startswith(prefix))
              if matches:
                  print(matches[0])
                  raise SystemExit
          print("")
          ' || true)"
          if [ -z "$NAME" ]; then
            echo "::warning::No iOS simulator found in simctl output; falling back to 'iPhone 17'."
            NAME="iPhone 17"
          fi
          echo "Using simulator: $NAME"
          TEST_RUNNER_TEGAKI_COMPAT_SPAN_FIXTURES="$PWD/TegakiKit/Tests/Fixtures/compat-span" \
          TEST_RUNNER_TEGAKI_COMPAT_SPAN_143_FIXTURES="$PWD/TegakiKit/Tests/Fixtures/compat-span-143" xcodebuild \
            -project v123app/TegakiCalendar.xcodeproj \
            -scheme TegakiCalendar \
            -configuration Debug \
            -destination "platform=iOS Simulator,name=$NAME" \
            -derivedDataPath "$RUNNER_TEMP/v123-derived" \
            -only-testing:TegakiCalendarTests/Real123LedgerTests \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            test 2>&1 | tee "$RUNNER_TEMP/real123.log"
          grep -E 'Test Case .*(passed|failed|skipped)|Executed [0-9]+ test' "$RUNNER_TEMP/real123.log" || true

      # 1.4 (docs/M7D_CONTRACT.md §5.3 3): 1.3's app (v13app, its own project.yml) with
      # tools/span-compat/AppTests/Real13LedgerTests.swift added to its unit tests, on the same simulator; only that
      # class runs, on every compat-span file (TEGAKI_COMPAT_SPAN_FIXTURES: the folder of this checkout).
      # 1.4.3 (docs/R1_4_3_CONTRACT.md §8.3): and on every compat-span-143 file (TEGAKI_COMPAT_SPAN_143_FIXTURES; the test
      # fails when it is not set). Still its 5 tests.
      - name: 1.3's ledger and sync on the compat-span fixtures (Real13LedgerTests)
        run: |
          set -euo pipefail
          cp tools/span-compat/AppTests/Real13LedgerTests.swift v13app/Tests/TegakiCalendarTests/
          (cd v13app && xcodegen generate)
          NAME="$(xcrun simctl list -j devices available | python3 -c '
          import json, sys
          devices = json.load(sys.stdin).get("devices", {})
          names = set()
          for runtime, items in devices.items():
              if "iOS" not in runtime:
                  continue
              for d in items:
                  if d.get("isAvailable") and d.get("name"):
                      names.add(d["name"])
          for prefix in ("iPad Pro 13-inch", "iPad Air 13-inch", "iPad", "iPhone"):
              matches = sorted(n for n in names if n.startswith(prefix))
              if matches:
                  print(matches[0])
                  raise SystemExit
          print("")
          ' || true)"
          if [ -z "$NAME" ]; then
            echo "::warning::No iOS simulator found in simctl output; falling back to 'iPhone 17'."
            NAME="iPhone 17"
          fi
          echo "Using simulator: $NAME"
          TEST_RUNNER_TEGAKI_COMPAT_SPAN_FIXTURES="$PWD/TegakiKit/Tests/Fixtures/compat-span" \
          TEST_RUNNER_TEGAKI_COMPAT_SPAN_143_FIXTURES="$PWD/TegakiKit/Tests/Fixtures/compat-span-143" xcodebuild \
            -project v13app/TegakiCalendar.xcodeproj \
            -scheme TegakiCalendar \
            -configuration Debug \
            -destination "platform=iOS Simulator,name=$NAME" \
            -derivedDataPath "$RUNNER_TEMP/v13-derived" \
            -only-testing:TegakiCalendarTests/Real13LedgerTests \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            test 2>&1 | tee "$RUNNER_TEMP/real13.log"
          grep -E 'Test Case .*(passed|failed|skipped)|Executed [0-9]+ test' "$RUNNER_TEMP/real13.log" || true
          # 1.4: a class that did not run cannot pass unseen (Real13LedgerTests has five tests).
          grep -Eq 'Executed 5 tests?, with 0 failures' "$RUNNER_TEMP/real13.log" || { echo "::error::Real13LedgerTests did not run its 5 tests with 0 failures (docs/M7D_CONTRACT.md §5.3 3)."; exit 1; }

  # 1.2 (docs/M7B_CONTRACT.md §7.5, §7.6, §4.4, §4.5, §10.7, §8 8): the other nine languages, seen by the
  # lead and the owner without being able to read them. Next to the other jobs (no `needs`). No test here;
  # a photo that fails is only a warning, so this job fails only when the app does not build (1.4, docs/M7D_CONTRACT.md
  # §3.2: or when a simulator of its table is missing or another was taken, "Required simulators"). 80 photos in
  # shots/l10n (artifact "l10n-screenshots", kept 7 days; 63 until 1.4.1), each language with its region's holidays and week
  # start (en_US, zh_*, ko_KR, es_MX and pt_BR start on a Sunday, fr_FR, de_DE and it_IT on a Monday):
  #   <language>/ipad13-portrait-{month,day}.png, iphone-portrait-{week,year}.png     36
  #   {en,de}/ipad13-portrait-sheet-{settings,holidays,paywall,week-start}.png         8
  #   {de,fr}/{ipad13,iphone}-portrait-tool-eraser.png (the toolbar's two lines)       4
  #   {fr,de}/iphone-portrait-sheet-lasso.png (the three words of the menu)            2
  #   de/iphone-portrait-sheet-paywall.png (the longest real language)                 1
  #   en/ipad13-portrait-week.png, en/iphone-portrait-month.png (Sunday first)         2
  #   ja-sunday/{ipad13,iphone}-portrait-{month,week}.png (Japanese, Sunday first)     4
  #   pseudo/{ipad13,iphone}-portrait-{month,sheet-settings,sheet-paywall}.png         6
  # and, 1.4.2 (docs/R1_4_2_CONTRACT.md §6.2, §7.3; docs/R1_4_2.md, D1b's decision (m), taken in D2), by XCUI on the
  # iPhone 17 (LanguageUITests' testLocalizedShotsOfTheMemoPaperAndTheColourPanel, the step "Localized XCUI shots"):
  #   {ja,<language>,pseudo}/iphone-portrait-sheet-settings-memo-paper.png (the row)  11
  #   {de,fr,pseudo}/iphone-portrait-sheet-memo-paper-choices.png (its own screen)     3
  #   {de,fr,pseudo}/iphone-portrait-week-color-panel.png (from the lit dot)           3
  # (ja/ is new: Japanese in Japan, as the other languages with its region's holidays and week start).
  # pseudo/ is `-NSDoubleLocalizedStrings YES`: every text from the Bundle twice, longer than any language.
  # That and `-NSShowNonLocalizedStrings YES` only reach the app's own words (Localizable): the Kit's table
  # (titles, plan texts, +n, holiday marks) neither doubles nor logs. Its lengths are for PaperFitTests and
  # L-12, its gaps for L-2 and KitStringsTests.
  # The limit: a build and XcodeGen 3 min, two boots 3.5 each (run 41922318959), the two waits 4 min, 63
  # photos of 11–15 s at most 16: about 30 min. It stays at 75 because the job's last step is the upload.
  # 1.4.2: run 45625473748 took 39 min (the shots step 36: the boots 10.5 and 5.8 min, a photo 13–22 s). The XCUI photos
  # add about 10: the UI tests' build (72 s in the ui-tests job of that run; 3 at most), the iPhone booted a second time
  # (no first boot's banner: 30 s of wait, about 1.5 min), xcodebuild's start (about 1 min), 14 launches of about 15 s
  # (LanguageUITests' launches took about 8 s in CI-0; the drags, the waits for a frame read twice and the 1 s before each
  # photo, about 4–5 min) and the log (under 1 min): about 50. The XCUI step stops after 20 minutes.
  # So the job's limit is 75 → 100, the sum of its steps' limits and the rest, as blank-paper's: the steps before the shots
  # (the build and XcodeGen, about 3; the build took 2:05 in that run), the UI tests' build 15, the shots 55, the XCUI step 20,
  # the words' count and the upload about 1: 94 at worst, 6 to spare. At 75, a slow runner whose shots ran near their 55
  # would have stopped the job inside the XCUI step, a cancelled (red) job where until 1.4.1 it was only a warning.
  # 1.4.3 (docs/R1_4_3.md, the D1a run's section, the lead's decision): the XCUI step 20 → 30 and the job 100 → 110. The
  # step's xcodebuild (its build, the boot and LanguageUITests' 17 photos) took 19 min and more: LanguageUITests ended
  # 57 s (V, run 45721608435) and 38 s (D0, 46066812567) before the 20 minutes, and in D1a's run 46102639450 the limit
  # stopped it before its last 5 photos (75 of 80). 104 at worst with the 30, 6 to spare.
  l10n-shots:
    name: Localized shots (1.2)
    # 1.3's work branches (r13-w-*) skip the two photo jobs so the macOS runners stay free for the jobs the
    # work needs; r13 and main run everything (docs/M7C.md, S1 の残り). Nor on r13-quick (§10.6).
    if: ${{ !startsWith(github.ref_name, 'r13-w-') && !(github.ref_name == 'r13-quick' || startsWith(github.ref_name, 'r13-q-') || github.ref_name == 'r14-quick' || startsWith(github.ref_name, 'r14-q-') || github.ref_name == 'r141-quick' || startsWith(github.ref_name, 'r141-q-') || github.ref_name == 'r142-quick' || startsWith(github.ref_name, 'r142-q-') || startsWith(github.ref_name, 'r142-w-') || github.ref_name == 'r143-quick' || startsWith(github.ref_name, 'r143-q-') || startsWith(github.ref_name, 'r143-w-')) }}
    # 1.4 (docs/M7D_CONTRACT.md §3.1, §3.3 1, 0d-2): the image with Xcode 27 (macos-26 and macos-15 do not get it).
    runs-on: xcode-27
    timeout-minutes: 110
    env:
      HOMEBREW_NO_AUTO_UPDATE: "1"
      HOMEBREW_NO_INSTALL_CLEANUP: "1"
      NSUnbufferedIO: "YES"
      # The Sunday photos' Japanese (see the first job).
      JA_ARGS: "-AppleLanguages (ja) -AppleLocale ja_JP"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # 1.4 (docs/M7D_CONTRACT.md §3.1, 0d-1): Xcode 27.2, chosen by what each candidate says it is, never by its path.
      # Every /Applications/Xcode_27.2*.app is read with `xcodebuild -version` (DEVELOPER_DIR set to it); one whose version is
      # 27.2 or 27.2.x and whose build ends in a digit is a release (a beta's build ends in a lower-case letter, as 27.3
      # beta's 27C5020n; the rolling-out image 20261119 gives that beta aliases named like a release, §3.1), and the newest
      # release is selected. None fails the job: until 1.3 this step chose Xcode 26.6 only when it was there and otherwise
      # went on with the image's default Xcode, unseen. Then `sudo xcodebuild -runFirstLaunch` (harmless when it has run).
      # The same lines in every job on xcode-27 (build.yml, ja-baseline.yml, store-shots.yml, testflight.yml, duo.yml).
      - name: Select Xcode 27.2
        run: |
          set -euo pipefail
          XCODE="$(python3 -I -c '
          import glob, os, re, subprocess, sys
          def key(version, build):                               # (27, 2, 0), then the build: digits as numbers
              numbers = tuple((int(p) for p in version.split("."))) + (0, 0, 0)
              return numbers[:3], tuple((0, int(t)) if t.isdigit() else (1, t) for t in re.findall(r"[0-9]+|[^0-9]+", build))
          best = None
          seen = {}
          for app in sorted(glob.glob("/Applications/Xcode_27.2*.app")):
              real = os.path.realpath(app)
              if real in seen:
                  print("%s: the same Xcode as %s" % (app, seen[real]), file=sys.stderr)
                  continue
              seen[real] = app
              env = dict(os.environ, DEVELOPER_DIR=os.path.join(real, "Contents", "Developer"))
              try:
                  out = subprocess.run(["xcodebuild", "-version"], env=env, capture_output=True, text=True, timeout=300).stdout
              except Exception as error:
                  print("%s: xcodebuild -version failed (%s)" % (app, error), file=sys.stderr)
                  continue
              version = re.search(r"^Xcode ([0-9.]+)$", out, re.M)
              build = re.search(r"^Build version ([0-9A-Za-z]+)$", out, re.M)
              version = version.group(1) if version else "?"
              build = build.group(1) if build else "?"
              release = re.fullmatch(r"27\.2(\.[0-9]+)?", version) is not None and re.search(r"[0-9]$", build) is not None
              print("%s (%s): Xcode %s, build %s%s" % (app, real, version, build, ": a release of 27.2" if release else ": not a release of 27.2"), file=sys.stderr)
              if release and (best is None or key(version, build) > best[0]):
                  best = (key(version, build), real)
          print(best[1] if best else "")
          ')"
          if [ -z "$XCODE" ]; then
            echo "::error::No release of Xcode 27.2 in /Applications (xcodebuild -version 27.2 or 27.2.x, its build ending in a digit; docs/M7D_CONTRACT.md §3.1). The job does not go on with another Xcode."
            exit 1
          fi
          echo "Selected: $XCODE"
          sudo xcode-select -s "$XCODE"
          sudo xcodebuild -runFirstLaunch
          xcode-select -p
          xcodebuild -version
          echo "runner image: ${ImageOS:-?} ${ImageVersion:-?}"

      # 1.4 (docs/M7D_CONTRACT.md §3.2, 0d-3): the simulators of the table that this job uses must be on the runner, each
      # under its exact name on its runtime (iOS 27.2; the iPad mini (A17 Pro) is on iOS 27.0 only; the iPhone Duo on the
      # Duo's iOS 27.2 runtime). One that is missing fails the job here: until 1.3 a missing device was a warning ("No
      # simulator for …; skipping") and the job stayed green, so all the 6.9-inch photos could be gone unseen. Each one's
      # UDID is an output of this step (steps.required.outputs.<id>); the table and the runtime (name and build) each one
      # resolved to go to $RUNNER_TEMP for "The simulators used are the table's" after the photos, and the UDIDs to
      # $RUNNER_TEMP/required-simulators-udids.txt, which the pickers of the later steps take first (so they boot the very
      # devices checked here). When the name is on two runtimes of that version (iOS 27.2 has two sets, the usual devices'
      # and the iPhone Duo's, §3.1), every other device is taken from the runtime with no iPhone Duo and the iPhone Duo from
      # the runtime of iPhone Duos only; a warning only when nothing tells the runtimes apart. The same lines in every job
      # that boots a simulator; only the table differs.
      - name: Required simulators (1.4)
        id: required
        env:
          # <id>|<exact name>|<runtime version> (docs/M7D_CONTRACT.md §3.2)
          REQUIRED: |
            ipad13|iPad Pro 13-inch (M5)|27.2
            iphone|iPhone 17|27.2
        run: |
          set -euo pipefail
          printf '%s\n' "$REQUIRED" | grep -v '^[[:space:]]*$' > "$RUNNER_TEMP/required-simulators.txt"
          xcrun simctl list -j > "$RUNNER_TEMP/simctl-list.json"
          python3 -I - "$RUNNER_TEMP/simctl-list.json" "$RUNNER_TEMP/required-simulators.txt" <<'EOF'
          import json, os, re, sys
          data = json.load(open(sys.argv[1], encoding="utf-8"))
          runtimes = {r.get("identifier"): r for r in data.get("runtimes", [])}
          def version(runtime):                                  # the runtime's "version" ("27.2"), else from its identifier
              v = runtimes.get(runtime, {}).get("version")
              if v:
                  return v
              m = re.search(r"iOS-([0-9]+)-([0-9]+)", runtime)
              return "%s.%s" % m.groups() if m else "?"
          devices = {runtime: [d for d in items if d.get("isAvailable") and d.get("name") and d.get("udid")]
                     for runtime, items in data.get("devices", {}).items() if "iOS" in runtime}
          def duos(runtime):                                     # 0: iPhone Duos only, 1: some, 2: none
              n = sum(d["name"].startswith("iPhone Duo") for d in devices[runtime])
              return 0 if n == len(devices[runtime]) else 1 if n else 2
          failed = False
          outputs = []
          resolved = []
          for line in open(sys.argv[2], encoding="utf-8"):
              ident, name, want = [p.strip() for p in line.rstrip("\n").split("|")]
              def wanted(runtime):
                  return version(runtime) == want or version(runtime).startswith(want + ".")
              # The runtime that suits the name first: for the iPhone Duo the one of iPhone Duos only (the Duo's own iOS 27.2
              # set), for every other device the one with no iPhone Duo (§3.1); then a runtime with some iPhone Duos.
              found = sorted((duos(runtime) if name.startswith("iPhone Duo") else 2 - duos(runtime), runtime, d["udid"])
                             for runtime, items in devices.items() if wanted(runtime) for d in items if d["name"] == name)
              if not found:
                  there = sorted({d["name"] for runtime, items in devices.items() if wanted(runtime) for d in items})
                  print("::error::%s: no available simulator \"%s\" on iOS %s (docs/M7D_CONTRACT.md §3.2). The devices of iOS %s: %s"
                        % (ident, name, want, want, ", ".join(there) or "none (no such runtime)"))
                  failed = True
                  continue
              _, runtime, udid = found[0]
              r = runtimes.get(runtime, {})
              print("%s: %s | %s (%s) %s" % (ident, name, r.get("name", runtime), r.get("buildversion", "?"), udid))
              if len(found) > 1:
                  tie = found[0][0] == found[1][0]
                  print("%s%s: \"%s\" is on %d runtimes of iOS %s (%s); %s is taken (%s)."
                        % ("::warning::" if tie else "", ident, name, len(found), want, ", ".join(f[1] for f in found), runtime,
                           "nothing tells them apart: the first by its identifier" if tie
                           else "iPhone Duos only" if name.startswith("iPhone Duo") else "no iPhone Duo"))
              outputs.append("%s=%s\n" % (ident, udid))
              resolved.append("%s|%s|%s|%s\n" % (ident, name, r.get("name", runtime), r.get("buildversion", "?")))
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as out:
              out.write("".join(outputs))
          with open(sys.argv[2].replace(".txt", "-resolved.txt"), "w", encoding="utf-8") as out:
              out.write("".join(resolved))
          with open(sys.argv[2].replace(".txt", "-udids.txt"), "w", encoding="utf-8") as out:
              out.write("".join(o.split("=", 1)[1] for o in outputs))
          sys.exit(1 if failed else 0)
          EOF

      # 1.4 (docs/M7D_CONTRACT.md §3.3 4, 0d-28): XcodeGen 2.46.0 from its release zip, pinned by sha256, the same in every
      # job (until 1.3 `brew install xcodegen`, whose version was the image's formula). The script fails unless
      # `xcodegen --version` then says 2.46.0; the job's later steps find it first in PATH.
      - name: Install XcodeGen
        run: |
          set -euo pipefail
          bash "$GITHUB_WORKSPACE/tools/ci/install-xcodegen.sh"

      - name: Generate the Xcode project
        run: |
          set -euo pipefail
          xcodegen generate

      - name: Build for the iOS Simulator
        run: |
          set -euo pipefail
          xcodebuild \
            -project TegakiCalendar.xcodeproj \
            -scheme TegakiCalendar \
            -configuration Debug \
            -destination "generic/platform=iOS Simulator" \
            -derivedDataPath build/DerivedData \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            build

      # 1.4.2 (docs/R1_4_2_CONTRACT.md §6.2, §7.3; D1b's decision (m)): the UI tests for the table's iPhone 17, built early
      # (the ui-tests job's "Build the UI tests for an iPhone" says why) in their own derived data, so the app the shots
      # step installs stays the one built above. A failure here loses only the XCUI photos (the step after the shots
      # does not run; "The words the app did not find" warns of the count): the job still fails only when the app does
      # not build.
      - name: Build the UI tests for the iPhone 17 (1.4.2)
        id: l10nuibuild
        continue-on-error: true
        timeout-minutes: 15
        run: |
          set -euo pipefail
          xcodebuild \
            -project TegakiCalendar.xcodeproj \
            -scheme TegakiCalendar \
            -configuration Debug \
            -destination "platform=iOS Simulator,id=${{ steps.required.outputs.iphone }}" \
            -derivedDataPath build/L10nUITestData \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            build-for-testing
          ls build/L10nUITestData/Build/Products/*.xctestrun

      # One device at a time, the 13-inch iPad first. The language and the region are launch arguments
      # (the app's own argument domain; nothing changes on the simulator). A first boot's system banner
      # comes 85–105 s after the boot (docs/M7B.md, C1), hence the 120 s with the app in front.
      - name: Shots (13-inch iPad and iPhone 17)
        timeout-minutes: 55
        continue-on-error: true
        run: |
          set -uo pipefail
          APP="$(find build/DerivedData -name "TegakiCalendar.app" -path "*iphonesimulator*" -not -path "*/Index.noindex/*" | head -1)"
          BUNDLE="com.syfan0.tegakicalendar"
          OUT="shots/l10n"
          LOG="$OUT/pseudo/l10n-log.txt"
          mkdir -p "$OUT/pseudo"
          : > "$LOG"
          # 1.4 (docs/M7D_CONTRACT.md §3.3 3, gate 8): this job's environment (the lines of build.yml's env.txt), then each
          # device it takes ("<id>: <name> | <runtime> (<build>)", sim_env), which "The simulators used are the table's" reads.
          {
            xcodebuild -version
            echo "Xcode path: $(xcode-select -p)"
            echo "runner image: ${ImageOS:-?} ${ImageVersion:-?}"
            echo "xcodegen: $(xcodegen --version 2>&1 | head -n 1)"
            echo "python3: $(python3 --version 2>&1)"
            xcrun simctl list runtimes
          } > "$OUT/env.txt" || echo "::warning::env.txt could not all be written"
          sim_env() {  # sim_env <device id> <udid>: "<id>: <device name> | <runtime name> (<runtime build>)"
            xcrun simctl list -j | SIM_ID="$1" SIM_UDID="$2" python3 -I -c '
          import json, os, sys
          data = json.load(sys.stdin)
          runtimes = {r.get("identifier"): r for r in data.get("runtimes", [])}
          for runtime, items in data.get("devices", {}).items():
              for d in items:
                  if d.get("udid") == os.environ["SIM_UDID"]:
                      r = runtimes.get(runtime, {})
                      print("%s: %s | %s (%s)" % (os.environ["SIM_ID"], d.get("name"), r.get("name", runtime), r.get("buildversion", "?")))
                      raise SystemExit
          print("%s: (no simulator %s)" % (os.environ["SIM_ID"], os.environ["SIM_UDID"]))
          '
          }
          if [ -z "$APP" ]; then
            echo "::warning::TegakiCalendar.app not found under build/DerivedData; no shots."
            exit 0
          fi
          # 1.4 D0b (docs/M7D_CONTRACT.md §3.5 (f); docs/M7D.md, D0b; build-and-test's 13-inch photo step says why): `shoot`
          # checks each photo's handwriting (tools/shots/ink_check.swift against tools/shots/ink_ref.tsv, whose lines of this
          # job are named <folder>/<file>) and takes a short one again with the same launch and wait, at most twice; then the
          # take with the fewest pixels short stays, with a warning (a notice when a retake is complete; no more takes again
          # after 3 such photos of a device, or 180 s of them in this step). Every result is a line of shots/l10n/ink.txt
          # (tools/shots/ink_retake.sh). INK_STALE counts per device.
          INK_LOG="$OUT/ink.txt"
          . "$GITHUB_WORKSPACE/tools/shots/ink_retake.sh"
          ink_build
          # language|region (docs/M7B_CONTRACT.md §7.5). 1.4.2: LanguageUITests' shotLanguages has the same pairs (with
          # ja|ja_JP first) for the XCUI photos of the step "Localized XCUI shots": change both together.
          LANGS="en|en_US zh-Hans|zh_CN zh-Hant|zh_TW ko|ko_KR fr|fr_FR de|de_DE it|it_IT es|es_MX pt-BR|pt_BR"
          lang_args() {  # the launch arguments of a language: it, its region, that region's holidays and week start
            local P
            for P in $LANGS; do
              if [ "${P%%|*}" = "$1" ]; then
                echo "-AppleLanguages ($1) -AppleLocale ${P##*|} --screenshot-holidays auto --screenshot-week-start auto"
              fi
            done
          }
          shoot() {  # shoot <folder> <file> <launch args…>: one shot; a failure only loses this one file
            local FOLDER="$1" FILE="$2"
            shift 2
            mkdir -p "$OUT/$FOLDER"
            xcrun simctl terminate "$UDID" "$BUNDLE" 2>/dev/null || true
            sleep 1
            xcrun simctl launch "$UDID" "$BUNDLE" --screenshot-mode --screenshot-month 2026-10 "$@" || { echo "::warning::launch failed ($FOLDER/$FILE)"; return 0; }
            sleep 9
            # `grep` without -q reads the whole list (docs/M7C.md, S1 の残り, decision 8): with -q it stops at the first match,
            # simctl, still writing the list, gets SIGPIPE, and pipefail makes the pipeline fail although the app is in
            # the list (a false warning in 0–9 of build.yml's photos and 5–14 of l10n-shots' in the runs of 11/11–12;
            # none in the prototype's span-shots, removed in S6, which read the whole list). An app not in the list, or no list, still warns.
            xcrun simctl spawn "$UDID" launchctl list 2>/dev/null | grep tegakicalendar > /dev/null || echo "::warning::The app is not running after 9 s ($FOLDER/$FILE)"
            xcrun simctl io "$UDID" screenshot "$OUT/$FOLDER/$FILE" || echo "::warning::screenshot failed ($FOLDER/$FILE)"
            ink_retake "$OUT/$FOLDER/$FILE" "$FOLDER/$FILE" 9 --screenshot-mode --screenshot-month 2026-10 "$@"
          }
          # device-id | exact first choice | prefix fallbacks (in order)
          for SPEC in "ipad13|iPad Pro 13-inch (M5)|iPad Pro 13,iPad Air 13" \
                      "iphone|iPhone 17|iPhone 17,iPhone"; do
            ID="${SPEC%%|*}"; REST="${SPEC#*|}"; EXACT="${REST%%|*}"; PREFIXES="${REST#*|}"
            FOUND="$(xcrun simctl list -j devices available | SIM_EXACT="$EXACT" SIM_PREFIXES="$PREFIXES" python3 -c '
          import json, os, re, sys
          devices = json.load(sys.stdin).get("devices", {})
          def version(runtime):                                  # "…iOS-26-5" → (26, 5)
              m = re.search(r"iOS-(\d+)-(\d+)", runtime)
              return (int(m.group(1)), int(m.group(2))) if m else (0, 0)
          try:                                                   # 1.4 (docs/M7D_CONTRACT.md §3.2): "Required simulators"
              required = set(open(os.path.join(os.environ["RUNNER_TEMP"], "required-simulators-udids.txt"), encoding="utf-8").read().split())
          except (KeyError, OSError):
              required = set()
          found = {}                                             # name → (udid, key): one Required resolved (1.4) > the newest iOS
          for runtime, items in devices.items():
              if "iOS" not in runtime:
                  continue
              for d in items:
                  if not (d.get("isAvailable") and d.get("name") and d.get("udid")):
                      continue
                  key = (d["udid"] in required, version(runtime))
                  if d["name"] not in found or key > found[d["name"]][1]:
                      found[d["name"]] = (d["udid"], key)
          exact = os.environ["SIM_EXACT"]
          if exact in found:
              print(exact + "|" + found[exact][0])
              raise SystemExit
          for prefix in os.environ["SIM_PREFIXES"].split(","):
              for name in sorted(found):
                  if name.startswith(prefix):
                      print(name + "|" + found[name][0])
                      raise SystemExit
          print("")
          ' || true)"
            if [ -z "$FOUND" ]; then echo "::error::No simulator for $ID (docs/M7D_CONTRACT.md §3.2); the job fails at \"The simulators used are the table's\"."; continue; fi
            NAME="${FOUND%%|*}"; UDID="${FOUND##*|}"
            echo "$ID: $NAME ($UDID)"
            INK_STALE=0
            sim_env "$ID" "$UDID" >> "$OUT/env.txt" || echo "::warning::no runtime line for $ID"
            xcrun simctl boot "$UDID" || true
            xcrun simctl bootstatus "$UDID" -b || { echo "::warning::$ID ($NAME) did not boot; skipping."; continue; }
            xcrun simctl ui "$UDID" appearance light || true
            xcrun simctl status_bar "$UDID" override --time "9:41" --batteryState charged --batteryLevel 100 --wifiBars 3 || true
            if ! xcrun simctl install "$UDID" "$APP"; then
              echo "::warning::install failed on $ID; skipping."
              xcrun simctl shutdown "$UDID" || true
              continue
            fi
            xcrun simctl launch "$UDID" "$BUNDLE" --screenshot-mode --screenshot-month 2026-10 --screenshot-page month || true
            sleep 120
            xcrun simctl terminate "$UDID" "$BUNDLE" 2>/dev/null || true
            if [ "$ID" = "ipad13" ]; then
              for P in $LANGS; do
                L="${P%%|*}"
                for PAGE in month day; do
                  # $(lang_args …) and $JA_ARGS are split on purpose (the values have no spaces).
                  shoot "$L" "ipad13-portrait-$PAGE.png" --screenshot-page "$PAGE" $(lang_args "$L")
                done
              done
              for L in en de; do
                for SHEET in settings holidays paywall week-start; do
                  shoot "$L" "ipad13-portrait-sheet-$SHEET.png" --screenshot-page month --screenshot-sheet "$SHEET" $(lang_args "$L")
                done
              done
              shoot en ipad13-portrait-week.png --screenshot-page week $(lang_args en)
            else
              for P in $LANGS; do
                L="${P%%|*}"
                for PAGE in week year; do
                  shoot "$L" "iphone-portrait-$PAGE.png" --screenshot-page "$PAGE" $(lang_args "$L")
                done
              done
              for L in fr de; do
                shoot "$L" iphone-portrait-sheet-lasso.png --screenshot-page month --screenshot-sheet lasso $(lang_args "$L")
              done
              shoot en iphone-portrait-month.png --screenshot-page month $(lang_args en)
              # The longest real language's purchase sheet on an iPhone (the top of it; that sending it down
              # reaches the links is LanguageUITests.testGermanPaywallReachesItsLinks, with its own photos).
              shoot de iphone-portrait-sheet-paywall.png --screenshot-page month --screenshot-sheet paywall $(lang_args de)
            fi
            for L in de fr; do
              shoot "$L" "$ID-portrait-tool-eraser.png" --screenshot-page month --screenshot-tool eraser $(lang_args "$L")
            done
            for PAGE in month week; do
              shoot ja-sunday "$ID-portrait-$PAGE.png" --screenshot-page "$PAGE" $JA_ARGS --screenshot-week-start sunday
            done
            shoot pseudo "$ID-portrait-month.png" --screenshot-page month -AppleLanguages "(en)" -NSDoubleLocalizedStrings YES
            for SHEET in settings paywall; do
              shoot pseudo "$ID-portrait-sheet-$SHEET.png" --screenshot-page month --screenshot-sheet "$SHEET" -AppleLanguages "(en)" -NSDoubleLocalizedStrings YES
            done
            # The gaps in the app's words, once per device: Foundation logs what the Bundle does not have.
            xcrun simctl terminate "$UDID" "$BUNDLE" 2>/dev/null || true
            sleep 1
            xcrun simctl launch "$UDID" "$BUNDLE" --screenshot-mode --screenshot-month 2026-10 --screenshot-page month --screenshot-sheet settings $(lang_args de) -NSShowNonLocalizedStrings YES || true
            sleep 12
            xcrun simctl terminate "$UDID" "$BUNDLE" 2>/dev/null || true
            echo "== $ID: $NAME" >> "$LOG"
            FROM="$(wc -l < "$LOG" | tr -d ' ')"
            xcrun simctl spawn "$UDID" log show --last 40m --style compact --predicate 'process == "TegakiCalendar"' >> "$LOG" 2>&1 || true
            # 1.4 D0b (docs/M7D_CONTRACT.md §3.8; docs/M7D.md, D0b): this device's part of the log, its reach (on the
            # iOS 27 simulators `log show` gives the app's NSLog lines as "<compose failure …>", and the counts of the
            # next step, whose expected value is 0, then pass without a sign) and its `l10n: holidays loaded` lines
            # (tools/ci/log-reach.sh).
            tail -n "+$((FROM + 1))" "$LOG" > "$RUNNER_TEMP/l10n-log-$ID.txt" || true
            bash tools/ci/log-reach.sh "l10n-shots $ID (log show, its part of $LOG)" "$RUNNER_TEMP/l10n-log-$ID.txt" 'l10n: holidays loaded' || true
            xcrun simctl shutdown "$UDID" || true
          done
          find "$OUT" -name '*.png' | sort

      # 1.4.2 (docs/R1_4_2_CONTRACT.md §6.2, §7.3; docs/R1_4_2.md, D1b's decision (m), taken in D2): the photos only XCUI can
      # take, on the iPhone 17 booted again (the shots step shut it down): 設定 ›「メモ欄の紙」 with its footnote, the sheet
      # dragged to the row (no new `--screenshot-settings-section`), in the ten languages and the pseudo language; in de, fr
      # and the pseudo language the row's own screen (罫線・ドット方眼・無地) and the colour panel opened by a tap on the lit
      # dot (`toolbar.swatch.<n>`, `toolbar.colorPanel`). Screenshot mode: nothing is chosen or stored. LanguageUITests'
      # testLocalizedShotsOfTheMemoPaperAndTheColourPanel writes them into shots/l10n (TEST_RUNNER_TEGAKI_L10N_SHOT_OUT) and
      # checks their words against the string catalogue (TEST_RUNNER_TEGAKI_L10N_SHOT_STRINGS); it skips itself in the
      # ui-tests job. xcodebuild's output is shots/l10n/l10n-xcui-log.txt (its `l10n UI:` lines are shown here); the app's
      # log of these launches goes into the pseudo/l10n-log.txt the next step counts (`l10n: missing`). A failed test, or
      # fewer than 17 photos, is a warning only (as every photo of this job); the step stops after 20 minutes.
      - name: Localized XCUI shots (iPhone 17, 1.4.2)
        if: ${{ !cancelled() && steps.l10nuibuild.outcome == 'success' }}
        timeout-minutes: 30
        continue-on-error: true
        run: |
          set -uo pipefail
          OUT="shots/l10n"
          LOG="$OUT/pseudo/l10n-log.txt"
          XLOG="$OUT/l10n-xcui-log.txt"
          UDID="${{ steps.required.outputs.iphone }}"
          mkdir -p "$OUT/pseudo"
          [ -f "$LOG" ] || : > "$LOG"
          xcrun simctl boot "$UDID" 2>/dev/null || true
          if ! xcrun simctl bootstatus "$UDID" -b; then
            echo "::warning::The iPhone 17 ($UDID) did not boot again: no XCUI photos (1.4.2)."
            exit 0
          fi
          xcrun simctl ui "$UDID" appearance light || true
          xcrun simctl status_bar "$UDID" override --time "9:41" --batteryState charged --batteryLevel 100 --wifiBars 3 || true
          sleep 30
          START="$(date '+%Y-%m-%d %H:%M:%S')"
          TEST_RUNNER_TEGAKI_L10N_SHOT_OUT="$PWD/$OUT" \
          TEST_RUNNER_TEGAKI_L10N_SHOT_STRINGS="$PWD/Sources/TegakiCalendar/Resources/Localizable.xcstrings" xcodebuild \
            -project TegakiCalendar.xcodeproj \
            -scheme TegakiCalendar \
            -configuration Debug \
            -destination "platform=iOS Simulator,id=$UDID" \
            -derivedDataPath build/L10nUITestData \
            -only-testing:TegakiCalendarUITests/LanguageUITests/testLocalizedShotsOfTheMemoPaperAndTheColourPanel \
            test-without-building > "$XLOG" 2>&1
          STATUS=$?
          grep -E 'l10n UI:|Test Case .*(passed|failed|skipped)' "$XLOG" || true
          if [ "$STATUS" != 0 ]; then
            tail -n 60 "$XLOG" || true
            echo "::warning::LanguageUITests' XCUI photos (1.4.2) ended with xcodebuild's status $STATUS: see l10n-xcui-log.txt in the artifact."
          fi
          SHOTS="$(find "$OUT" \( -name 'iphone-portrait-sheet-settings-memo-paper.png' -o -name 'iphone-portrait-sheet-memo-paper-choices.png' -o -name 'iphone-portrait-week-color-panel.png' \) | wc -l | tr -d ' ')"
          echo "XCUI photos: $SHOTS (17 expected)"
          [ "$SHOTS" = "17" ] || echo "::warning::$SHOTS XCUI photos of the memo paper's row and the colour panel, 17 expected (1.4.2)."
          echo "== iphone (XCUI, 1.4.2)" >> "$LOG"
          FROM="$(wc -l < "$LOG" | tr -d ' ')"
          xcrun simctl spawn "$UDID" log show --start "$START" --style compact --predicate 'process == "TegakiCalendar"' >> "$LOG" 2>&1 || true
          tail -n "+$((FROM + 1))" "$LOG" > "$RUNNER_TEMP/l10n-log-iphone-xcui.txt" || true
          bash tools/ci/log-reach.sh "l10n-shots iphone XCUI (log show, its part of $LOG)" "$RUNNER_TEMP/l10n-log-iphone-xcui.txt" 'l10n: holidays loaded' || true
          xcrun simctl shutdown "$UDID" || true

      # docs/M7B_CONTRACT.md §7.5, §8 4: 0 is the expected number of both kinds of lines.
      # 1.3 (docs/M7C.md, wave D's text decision 9): each grep that can match nothing is `{ grep … || true; }`. The
      # runner's shell is `bash -e` and the step sets pipefail, so a grep with no line (the 0 expected, or no
      # `l10n: holidays loaded`) made its assignment exit 1 and the step stopped before the summary table (run
      # 42687634949 on main). The table is now written whatever the counts; the step still never fails the job.
      # 1.3 (docs/M7C.md, wave C1's lead decision 7): also when the shots step never ran (a build that failed): the log's
      # folder is made here first, so the empty log is written and the table says 0 photos.
      - name: The words the app did not find
        if: ${{ !cancelled() }}
        continue-on-error: true
        run: |
          set -uo pipefail
          OUT="shots/l10n"
          LOG="$OUT/pseudo/l10n-log.txt"
          mkdir -p "$OUT/pseudo"
          [ -f "$LOG" ] || : > "$LOG"
          PHOTOS="$(find "$OUT" -name '*.png' | wc -l | tr -d ' ')"
          MISSING="$({ grep 'l10n: missing' "$LOG" || true; } | sed 's/.*l10n: missing //' | sort -u | wc -l | tr -d ' ')"
          NOT_LOCALIZED="$({ grep 'not found in strings table' "$LOG" || true; } | { grep -c 'TegakiCalendar.app' || true; })"
          HOLIDAYS="$({ grep -E 'l10n: holidays loaded' "$LOG" || true; } | sed 's/.*l10n: holidays loaded //' | sort -n | tail -1)"
          grep 'l10n: missing' "$LOG" | sed 's/.*l10n: missing //' | sort -u || true
          grep 'not found in strings table' "$LOG" | grep 'TegakiCalendar.app' | head -50 || true
          # 1.4.2: 63 by simctl (the shots step) and 17 by XCUI (the step before), per folder in the job's first comment.
          XCUI="$(find "$OUT" \( -name 'iphone-portrait-sheet-settings-memo-paper.png' -o -name 'iphone-portrait-sheet-memo-paper-choices.png' -o -name 'iphone-portrait-week-color-panel.png' \) | wc -l | tr -d ' ')"
          [ "$PHOTOS" = "80" ] || echo "::warning::$PHOTOS photos, 80 expected: 63 by simctl and 17 by XCUI; XCUI wrote $XCUI."
          [ "$MISSING" = "0" ] || echo "::warning::$MISSING keys the app did not find (l10n: missing)."
          [ "${NOT_LOCALIZED:-0}" = "0" ] || echo "::warning::$NOT_LOCALIZED non-localized lines of the app's bundle."
          # 1.4 D0b (docs/M7D.md, D0b): without the app's lines (on the iOS 27 simulators `log show` gives its NSLog
          # lines as "<compose failure …>") both counts above are 0, the expected value; the holidays' line is in every
          # launch's log.
          COMPOSE="$({ grep -c '<compose failure' "$LOG" || true; } | head -n 1)"
          [ -n "$HOLIDAYS" ] || echo "::warning::no \`l10n: holidays loaded\` line in $LOG (${COMPOSE:-0} lines log show could not compose): the two counts above did not reach the app's lines."
          {
            echo "### l10n-shots"
            echo ""
            echo "- photos: $PHOTOS (80 expected)"
            echo "- of which XCUI's, the memo paper's row and the colour panel (1.4.2): $XCUI (17 expected)"
            echo "- keys the app did not find (\`l10n: missing\`): $MISSING (0 expected)"
            echo "- non-localized lines of the app's bundle: ${NOT_LOCALIZED:-0} (0 expected)"
            echo "- the slowest \`l10n: holidays loaded\`: ${HOLIDAYS:-none}"
            echo "- lines \`log show\` could not compose (\`<compose failure …>\`, 1.4 D0b): ${COMPOSE:-0} (0 expected)"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload the shots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: l10n-screenshots
          path: shots/l10n
          retention-days: 7
          if-no-files-found: warn

      # 1.4 (docs/M7D_CONTRACT.md §3.2): the devices this job took are the table's ("Required simulators"): each line
      # "<id>: <name> | <runtime> (<build>)" of its env.txt has the table's name, on the runtime (name and build) that
      # "Required simulators" found for it, and every device of the table has a line (none means it was not found, and its
      # photos or tests are missing). A prefix fallback that landed on another device, or another runtime taken instead of
      # the table's (a newer one, or the iPhone Duo's iOS 27.2), fails the job here. The same lines in every job that boots
      # a simulator; only ENV_TXT differs.
      - name: The simulators used are the table's (1.4)
        if: ${{ !cancelled() && env.QUICK != 'true' }}
        env:
          ENV_TXT: shots/l10n/env.txt
        run: |
          set -euo pipefail
          python3 -I - "$RUNNER_TEMP/required-simulators.txt" "$ENV_TXT" <<'EOF'
          import re, sys
          table = [[p.strip() for p in line.rstrip("\n").split("|")] for line in open(sys.argv[1], encoding="utf-8") if line.strip()]
          try:
              resolved = {row[0]: row[2:] for row in (line.rstrip("\n").split("|") for line in open(sys.argv[1].replace(".txt", "-resolved.txt"), encoding="utf-8")) if len(row) == 4}
          except OSError:
              resolved = {}
          try:
              lines = open(sys.argv[2], encoding="utf-8").read().splitlines()
          except OSError as error:
              print("::error::%s could not be read (%s): the devices this job took are not known (docs/M7D_CONTRACT.md §3.2)." % (sys.argv[2], error))
              sys.exit(1)
          taken = {}
          for line in lines:
              m = re.fullmatch(r"([a-z0-9]+): (.+) \| (.+) \(([^()]*)\)", line)
              if m:
                  taken.setdefault(m.group(1), []).append(m.group(2, 3, 4))
          failed = False
          for ident, name, want in table:
              if ident not in taken:
                  print("::error::%s (%s): no line in %s, so it was not taken (docs/M7D_CONTRACT.md §3.2)." % (ident, name, sys.argv[2]))
                  failed = True
              for got, runtime, build in taken.get(ident, []):
                  if ident in resolved:
                      ok = got == name and [runtime, build] == resolved[ident]
                      where = "%s (%s)" % tuple(resolved[ident])
                  else:
                      ok = got == name and (runtime == "iOS " + want or runtime.startswith("iOS " + want + "."))
                      where = "iOS " + want
                  print("%s: %s | %s (%s): %s" % (ident, got, runtime, build, "the table's" if ok else "NOT the table's"))
                  if not ok:
                      print("::error::%s took %s on %s (%s), not the table's %s on %s (docs/M7D_CONTRACT.md §3.2)." % (ident, got, runtime, build, name, where))
                      failed = True
          sys.exit(1 if failed else 0)
          EOF

      # 1.4 D1d (docs/M7D.md, 実行機の打ち切り): only when this job is cancelled (by hand, by its time limit, or by the runner's
      # side with nothing but "The operation was canceled.", four times on xcode-27 on 11/20), tools/ci/cancel-diag.sh prints
      # the load, the memory, the 15 busiest processes and, from the runner's own _diag folder, only its lines about a
      # cancel, a shutdown, a lost connection, a time-out or a signal (200 at most; the folder is never uploaded or printed
      # whole, nothing is written to disk: the repository is public). Not on success or failure; never fails the job. The
      # same lines at the end of every job on xcode-27 of build.yml and duo.yml.
      - name: Diagnostics of a cancelled job (1.4 D1d)
        if: cancelled()
        continue-on-error: true
        timeout-minutes: 3
        run: |
          if [ -f tools/ci/cancel-diag.sh ]; then
            bash tools/ci/cancel-diag.sh || true
          else
            echo "tools/ci/cancel-diag.sh is not here (cancelled before the checkout?)."
            uptime || true
          fi

  # 1.1.1 (docs/R1_1_1.md): the paper with no events and no handwriting on the owner's four kinds of
  # device, portrait and landscape, toolbar out and folded, to compare before and after the fix. Its
  # own job so the other shots and the 90-minute job do not change. Best effort: never fails the run (1.4,
  # docs/M7D_CONTRACT.md §3.2: the job itself turns red when a simulator of its table is missing or another was taken;
  # the run does not, `continue-on-error` being the job's).
  # The limits, from run 41264726309: a build took 0.9 min (8 is allowed for), a device 5.8–9.6 min
  # (its boot 1.9–3.2, the 60 s wait, xcodebuild up to the first test 1.1, 10 or 13 shots of 11–15 s, and
  # at most 1 for a slow first test), so 24–36 min for the four. The shots stop after 46 min, which
  # leaves the upload inside the 55. 36 was too short: run 80 (fix-1-1-1) was stopped while booting the
  # last device, the owner's iPad Air 11-inch, and took 33 of the 43 photos.
  # 1.4 D0b (docs/M7D_CONTRACT.md §3.3 9, §3.8; docs/M7D.md, D0b): the same in D0 (run 44632524223, image
  # 20261104.0337.1): the step hit its 46 min 3.6 min after choosing the iPad Air 11-inch, with 33 of the 43 photos, and
  # the job stayed green. The devices took 11.5 (iPhone 18 Pro Max), 18.1 (13-inch) and 13.2 min (mini) against 1.3's
  # 11.9, 8.9 and 8.8 (run 44474759145); the 11-inch's 9.3 at 1.5–2 times is 14–19, so the four take about 42.8 + 19 ≈
  # 62 min. The shots stop after 70 (8 over it) and the job after 80 (the rest took 6.1 in D0, the upload 2.9 of it).
  # 1.4.1 (docs/R1_4_1_CONTRACT.md §6.6, §9.1 D1b, 0e-23): the iPad's UI test lane is a step of this job after the shots,
  # "Palette UI tests on the 13-inch iPad (1.4.1)" (20 min at most, about 7 expected), with its own upload (palette-ui, about
  # 1 min): the job 80 → 100 (70 + 20 + the rest's 6.1 + 1 for the new upload ≈ 97). Gate 1 of D1b reads that step's
  # result, whatever this job's continue-on-error.
  # 1.4.2 (docs/R1_4_2_CONTRACT.md §4.7, §7.3, 0f-30; the step decided in D1a): the memo paper's photos are a step of this job
  # after the palette UI tests, "Memo paper shots (1.4.2)" (25 min at most: two boots of 2–4 min, 1 min for each banner, 8
  # launches of about 15 s on each device, and the month's PDF from MemoPaperDrawTests, about 3), with its own upload
  # (memo-paper-shots): the job 100 → 125 (D0's run 45311803365 took 77 min: the shots 64, the palette UI tests 10.5; + 25 + 1
  # ≈ 103, with the same slack for a slow runner as before). Photos only: it never fails the job (the lead looks at them).
  # 1.4.2 D1b (docs/R1_4_2_CONTRACT.md §6.1, §6.5): the iPad's palette step also runs ColorPanelPadUITests (two tests, five launches
  # of about 30 s: the pen colour panel beside the bars and the peeks), "(1.4.1, 1.4.2)": the step 20 → 25 and the job 125 → 130.
  # 1.4.3 D1b (docs/R1_4_3.md, the second full run 46129477127; contract §12.1): on a slow runner the same code's
  # "Shots on four devices" was cut at 70 (46119423355: about 72 needed; 43.4 in 46129477127's attempt 2) and "Memo paper
  # shots (1.4.2)" at 25 (about 26–27 needed; 16.8), losing a summary line and memo-month-dots.png: the steps 70 → 80 and
  # 25 → 30, the job 130 → 140 (80 + 25 + 30 + the rest, 2.9–3.2 min measured). An ordinary run is not longer.
  blank-paper:
    name: Blank paper shots (1.1.1)
    if: ${{ !startsWith(github.ref_name, 'r13-w-') && !(github.ref_name == 'r13-quick' || startsWith(github.ref_name, 'r13-q-') || github.ref_name == 'r14-quick' || startsWith(github.ref_name, 'r14-q-') || github.ref_name == 'r141-quick' || startsWith(github.ref_name, 'r141-q-') || github.ref_name == 'r142-quick' || startsWith(github.ref_name, 'r142-q-') || startsWith(github.ref_name, 'r142-w-') || github.ref_name == 'r143-quick' || startsWith(github.ref_name, 'r143-q-') || startsWith(github.ref_name, 'r143-w-')) }}
    # 1.4 (docs/M7D_CONTRACT.md §3.1, §3.3 1, 0d-2): the image with Xcode 27 (macos-26 and macos-15 do not get it).
    runs-on: xcode-27
    timeout-minutes: 140
    continue-on-error: true
    env:
      HOMEBREW_NO_AUTO_UPDATE: "1"
      HOMEBREW_NO_INSTALL_CLEANUP: "1"
      NSUnbufferedIO: "YES"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # 1.4 (docs/M7D_CONTRACT.md §3.1, 0d-1): Xcode 27.2, chosen by what each candidate says it is, never by its path.
      # Every /Applications/Xcode_27.2*.app is read with `xcodebuild -version` (DEVELOPER_DIR set to it); one whose version is
      # 27.2 or 27.2.x and whose build ends in a digit is a release (a beta's build ends in a lower-case letter, as 27.3
      # beta's 27C5020n; the rolling-out image 20261119 gives that beta aliases named like a release, §3.1), and the newest
      # release is selected. None fails the job: until 1.3 this step chose Xcode 26.6 only when it was there and otherwise
      # went on with the image's default Xcode, unseen. Then `sudo xcodebuild -runFirstLaunch` (harmless when it has run).
      # The same lines in every job on xcode-27 (build.yml, ja-baseline.yml, store-shots.yml, testflight.yml, duo.yml).
      - name: Select Xcode 27.2
        run: |
          set -euo pipefail
          XCODE="$(python3 -I -c '
          import glob, os, re, subprocess, sys
          def key(version, build):                               # (27, 2, 0), then the build: digits as numbers
              numbers = tuple((int(p) for p in version.split("."))) + (0, 0, 0)
              return numbers[:3], tuple((0, int(t)) if t.isdigit() else (1, t) for t in re.findall(r"[0-9]+|[^0-9]+", build))
          best = None
          seen = {}
          for app in sorted(glob.glob("/Applications/Xcode_27.2*.app")):
              real = os.path.realpath(app)
              if real in seen:
                  print("%s: the same Xcode as %s" % (app, seen[real]), file=sys.stderr)
                  continue
              seen[real] = app
              env = dict(os.environ, DEVELOPER_DIR=os.path.join(real, "Contents", "Developer"))
              try:
                  out = subprocess.run(["xcodebuild", "-version"], env=env, capture_output=True, text=True, timeout=300).stdout
              except Exception as error:
                  print("%s: xcodebuild -version failed (%s)" % (app, error), file=sys.stderr)
                  continue
              version = re.search(r"^Xcode ([0-9.]+)$", out, re.M)
              build = re.search(r"^Build version ([0-9A-Za-z]+)$", out, re.M)
              version = version.group(1) if version else "?"
              build = build.group(1) if build else "?"
              release = re.fullmatch(r"27\.2(\.[0-9]+)?", version) is not None and re.search(r"[0-9]$", build) is not None
              print("%s (%s): Xcode %s, build %s%s" % (app, real, version, build, ": a release of 27.2" if release else ": not a release of 27.2"), file=sys.stderr)
              if release and (best is None or key(version, build) > best[0]):
                  best = (key(version, build), real)
          print(best[1] if best else "")
          ')"
          if [ -z "$XCODE" ]; then
            echo "::error::No release of Xcode 27.2 in /Applications (xcodebuild -version 27.2 or 27.2.x, its build ending in a digit; docs/M7D_CONTRACT.md §3.1). The job does not go on with another Xcode."
            exit 1
          fi
          echo "Selected: $XCODE"
          sudo xcode-select -s "$XCODE"
          sudo xcodebuild -runFirstLaunch
          xcode-select -p
          xcodebuild -version
          echo "runner image: ${ImageOS:-?} ${ImageVersion:-?}"

      # 1.4 (docs/M7D_CONTRACT.md §3.2, 0d-3): the simulators of the table that this job uses must be on the runner, each
      # under its exact name on its runtime (iOS 27.2; the iPad mini (A17 Pro) is on iOS 27.0 only; the iPhone Duo on the
      # Duo's iOS 27.2 runtime). One that is missing fails the job here: until 1.3 a missing device was a warning ("No
      # simulator for …; skipping") and the job stayed green, so all the 6.9-inch photos could be gone unseen. Each one's
      # UDID is an output of this step (steps.required.outputs.<id>); the table and the runtime (name and build) each one
      # resolved to go to $RUNNER_TEMP for "The simulators used are the table's" after the photos, and the UDIDs to
      # $RUNNER_TEMP/required-simulators-udids.txt, which the pickers of the later steps take first (so they boot the very
      # devices checked here). When the name is on two runtimes of that version (iOS 27.2 has two sets, the usual devices'
      # and the iPhone Duo's, §3.1), every other device is taken from the runtime with no iPhone Duo and the iPhone Duo from
      # the runtime of iPhone Duos only; a warning only when nothing tells the runtimes apart. The same lines in every job
      # that boots a simulator; only the table differs.
      - name: Required simulators (1.4)
        id: required
        env:
          # <id>|<exact name>|<runtime version> (docs/M7D_CONTRACT.md §3.2)
          REQUIRED: |
            iphone69|iPhone 18 Pro Max|27.2
            ipad13|iPad Pro 13-inch (M5)|27.2
            ipadmini|iPad mini (A17 Pro)|27.0
            ipad11|iPad Air 11-inch (M4)|27.2
        run: |
          set -euo pipefail
          printf '%s\n' "$REQUIRED" | grep -v '^[[:space:]]*$' > "$RUNNER_TEMP/required-simulators.txt"
          xcrun simctl list -j > "$RUNNER_TEMP/simctl-list.json"
          python3 -I - "$RUNNER_TEMP/simctl-list.json" "$RUNNER_TEMP/required-simulators.txt" <<'EOF'
          import json, os, re, sys
          data = json.load(open(sys.argv[1], encoding="utf-8"))
          runtimes = {r.get("identifier"): r for r in data.get("runtimes", [])}
          def version(runtime):                                  # the runtime's "version" ("27.2"), else from its identifier
              v = runtimes.get(runtime, {}).get("version")
              if v:
                  return v
              m = re.search(r"iOS-([0-9]+)-([0-9]+)", runtime)
              return "%s.%s" % m.groups() if m else "?"
          devices = {runtime: [d for d in items if d.get("isAvailable") and d.get("name") and d.get("udid")]
                     for runtime, items in data.get("devices", {}).items() if "iOS" in runtime}
          def duos(runtime):                                     # 0: iPhone Duos only, 1: some, 2: none
              n = sum(d["name"].startswith("iPhone Duo") for d in devices[runtime])
              return 0 if n == len(devices[runtime]) else 1 if n else 2
          failed = False
          outputs = []
          resolved = []
          for line in open(sys.argv[2], encoding="utf-8"):
              ident, name, want = [p.strip() for p in line.rstrip("\n").split("|")]
              def wanted(runtime):
                  return version(runtime) == want or version(runtime).startswith(want + ".")
              # The runtime that suits the name first: for the iPhone Duo the one of iPhone Duos only (the Duo's own iOS 27.2
              # set), for every other device the one with no iPhone Duo (§3.1); then a runtime with some iPhone Duos.
              found = sorted((duos(runtime) if name.startswith("iPhone Duo") else 2 - duos(runtime), runtime, d["udid"])
                             for runtime, items in devices.items() if wanted(runtime) for d in items if d["name"] == name)
              if not found:
                  there = sorted({d["name"] for runtime, items in devices.items() if wanted(runtime) for d in items})
                  print("::error::%s: no available simulator \"%s\" on iOS %s (docs/M7D_CONTRACT.md §3.2). The devices of iOS %s: %s"
                        % (ident, name, want, want, ", ".join(there) or "none (no such runtime)"))
                  failed = True
                  continue
              _, runtime, udid = found[0]
              r = runtimes.get(runtime, {})
              print("%s: %s | %s (%s) %s" % (ident, name, r.get("name", runtime), r.get("buildversion", "?"), udid))
              if len(found) > 1:
                  tie = found[0][0] == found[1][0]
                  print("%s%s: \"%s\" is on %d runtimes of iOS %s (%s); %s is taken (%s)."
                        % ("::warning::" if tie else "", ident, name, len(found), want, ", ".join(f[1] for f in found), runtime,
                           "nothing tells them apart: the first by its identifier" if tie
                           else "iPhone Duos only" if name.startswith("iPhone Duo") else "no iPhone Duo"))
              outputs.append("%s=%s\n" % (ident, udid))
              resolved.append("%s|%s|%s|%s\n" % (ident, name, r.get("name", runtime), r.get("buildversion", "?")))
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as out:
              out.write("".join(outputs))
          with open(sys.argv[2].replace(".txt", "-resolved.txt"), "w", encoding="utf-8") as out:
              out.write("".join(resolved))
          with open(sys.argv[2].replace(".txt", "-udids.txt"), "w", encoding="utf-8") as out:
              out.write("".join(o.split("=", 1)[1] for o in outputs))
          sys.exit(1 if failed else 0)
          EOF

      # 1.4 (docs/M7D_CONTRACT.md §3.3 4, 0d-28): XcodeGen 2.46.0 from its release zip, pinned by sha256, the same in every
      # job (until 1.3 `brew install xcodegen`, whose version was the image's formula). The script fails unless
      # `xcodegen --version` then says 2.46.0; the job's later steps find it first in PATH.
      - name: Install XcodeGen
        run: |
          set -euo pipefail
          bash "$GITHUB_WORKSPACE/tools/ci/install-xcodegen.sh"

      - name: Generate the Xcode project
        run: |
          set -euo pipefail
          xcodegen generate

      # Built once, before anything boots: the products run on all four devices (one platform, one
      # architecture; TARGETED_DEVICE_FAMILY is 1,2). 1.4 (docs/M7D_CONTRACT.md §3.2): the destination is the table's
      # 13-inch iPad by its UDID ("Required simulators"), like the other steps, no longer by its name.
      - name: Build the UI tests
        run: |
          set -euo pipefail
          xcodebuild \
            -project TegakiCalendar.xcodeproj \
            -scheme TegakiCalendar \
            -configuration Debug \
            -destination "platform=iOS Simulator,id=${{ steps.required.outputs.ipad13 }}" \
            -derivedDataPath build/BlankData \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            build-for-testing

      # One device at a time, the iPhone and the 13-inch iPad first: if the limit stops the step, the
      # photos of the two questions still open are already taken (Upload always runs). The test writes
      # <id>-<portrait|landscape>-<expanded|collapsed>-<page>.png (4 × 8, the iPhone's week 4, the year that
      # grew 4, the iPads' month after 「ツールバーをいつも出す」 3: 43) and one `blank UI:` line for each,
      # shown here once (a test prints a line and NSLogs it). ipad11 is the
      # owner's iPad Air 11-inch (820 × 1180); the first job's ipad11 photos stay the iPad Pro 11-inch.
      # If no PNG arrived, the attachments are taken out of the result bundle instead.
      # 1.4.1 (docs/R1_4_1_CONTRACT.md §3.5, §6.1, §6.6, 0e-6, 0e-23): the same xcodebuild also runs HeaderRoomUITests on each
      # device (one launch: the iPads' wide row in portrait, the iPhone's first row in portrait and its wide row in landscape),
      # whose `header room:` lines (the header's frames and the title's room, logs only) are shown here once each; the lead
      # reads D1a's gate from them (the ja day title's room ≥ 115 pt on ipadmini, ipad11 = the Air 11 and ipad13 in portrait).
      # It writes no photo, so the 43 do not change; about half a minute a device.
      - name: Shots on four devices
        timeout-minutes: 80
        continue-on-error: true
        run: |
          set -uo pipefail
          mkdir -p shots/blank
          # 1.4 (docs/M7D_CONTRACT.md §3.3 3, gate 8): this job's environment (the lines of build.yml's env.txt), then each
          # device it takes ("<id>: <name> | <runtime> (<build>)", sim_env), which "The simulators used are the table's" reads.
          {
            xcodebuild -version
            echo "Xcode path: $(xcode-select -p)"
            echo "runner image: ${ImageOS:-?} ${ImageVersion:-?}"
            echo "xcodegen: $(xcodegen --version 2>&1 | head -n 1)"
            echo "python3: $(python3 --version 2>&1)"
            xcrun simctl list runtimes
          } > shots/blank/env.txt || echo "::warning::env.txt could not all be written"
          sim_env() {  # sim_env <device id> <udid>: "<id>: <device name> | <runtime name> (<runtime build>)"
            xcrun simctl list -j | SIM_ID="$1" SIM_UDID="$2" python3 -I -c '
          import json, os, sys
          data = json.load(sys.stdin)
          runtimes = {r.get("identifier"): r for r in data.get("runtimes", [])}
          for runtime, items in data.get("devices", {}).items():
              for d in items:
                  if d.get("udid") == os.environ["SIM_UDID"]:
                      r = runtimes.get(runtime, {})
                      print("%s: %s | %s (%s)" % (os.environ["SIM_ID"], d.get("name"), r.get("name", runtime), r.get("buildversion", "?")))
                      raise SystemExit
          print("%s: (no simulator %s)" % (os.environ["SIM_ID"], os.environ["SIM_UDID"]))
          '
          }
          # device-id | exact first choice | prefix fallbacks (in order)
          for SPEC in "iphone69|iPhone 18 Pro Max|iPhone 18 Pro Max,iPhone 17 Pro Max" \
                      "ipad13|iPad Pro 13-inch (M5)|iPad Pro 13" \
                      "ipadmini|iPad mini (A17 Pro)|iPad mini" \
                      "ipad11|iPad Air 11-inch (M4)|iPad Air 11,iPad Pro 11"; do
            ID="${SPEC%%|*}"; REST="${SPEC#*|}"; EXACT="${REST%%|*}"; PREFIXES="${REST#*|}"
            FOUND="$(xcrun simctl list -j devices available | SIM_EXACT="$EXACT" SIM_PREFIXES="$PREFIXES" python3 -c '
          import json, os, re, sys
          devices = json.load(sys.stdin).get("devices", {})
          def version(runtime):                                  # "…iOS-26-5" → (26, 5)
              m = re.search(r"iOS-(\d+)-(\d+)", runtime)
              return (int(m.group(1)), int(m.group(2))) if m else (0, 0)
          try:                                                   # 1.4 (docs/M7D_CONTRACT.md §3.2): "Required simulators"
              required = set(open(os.path.join(os.environ["RUNNER_TEMP"], "required-simulators-udids.txt"), encoding="utf-8").read().split())
          except (KeyError, OSError):
              required = set()
          found = {}                                             # name → (udid, key): one Required resolved (1.4) > the newest iOS
          for runtime, items in devices.items():
              if "iOS" not in runtime:
                  continue
              for d in items:
                  if not (d.get("isAvailable") and d.get("name") and d.get("udid")):
                      continue
                  key = (d["udid"] in required, version(runtime))
                  if d["name"] not in found or key > found[d["name"]][1]:
                      found[d["name"]] = (d["udid"], key)
          exact = os.environ["SIM_EXACT"]
          if exact in found:
              print(exact + "|" + found[exact][0])
              raise SystemExit
          for prefix in os.environ["SIM_PREFIXES"].split(","):
              for name in sorted(found):
                  if name.startswith(prefix):
                      print(name + "|" + found[name][0])
                      raise SystemExit
          print("")
          ' || true)"
            if [ -z "$FOUND" ]; then echo "::error::No simulator for $ID (docs/M7D_CONTRACT.md §3.2); the job fails at \"The simulators used are the table's\"."; continue; fi
            NAME="${FOUND%%|*}"; UDID="${FOUND##*|}"
            echo "$ID: $NAME ($UDID)"
            sim_env "$ID" "$UDID" >> shots/blank/env.txt || echo "::warning::no runtime line for $ID"
            xcrun simctl boot "$UDID" || true
            xcrun simctl bootstatus "$UDID" -b || { echo "::warning::$ID ($NAME) did not boot; skipping."; continue; }
            xcrun simctl ui "$UDID" appearance light || true
            xcrun simctl status_bar "$UDID" override --time "9:41" --batteryState charged --batteryLevel 100 --wifiBars 3 || true
            sleep 60    # the banner of a freshly booted simulator, docs/M6.md §5.1
            TEST_RUNNER_TEGAKI_SHOT_OUT="$PWD/shots/blank" TEST_RUNNER_TEGAKI_SHOT_DEVICE="$ID" xcodebuild \
              -project TegakiCalendar.xcodeproj \
              -scheme TegakiCalendar \
              -configuration Debug \
              -destination "platform=iOS Simulator,id=$UDID" \
              -derivedDataPath build/BlankData \
              -resultBundlePath "build/blank-$ID.xcresult" \
              -only-testing:TegakiCalendarUITests/BlankPaperShotsUITests \
              -only-testing:TegakiCalendarUITests/HeaderRoomUITests \
              test-without-building 2>&1 | tee "shots/blank/$ID-log.txt" || true
            grep 'blank UI:' "shots/blank/$ID-log.txt" | awk '{ i = index($0, "blank UI:"); if (i > 1) $0 = substr($0, i); if (!seen[$0]++) print }' || true
            grep 'header room:' "shots/blank/$ID-log.txt" | awk '{ i = index($0, "header room:"); if (i > 1) $0 = substr($0, i); if (!seen[$0]++) print }' || true
            SHOTS="$(find shots/blank -name "$ID-*.png" | wc -l | tr -d ' ')"
            echo "$ID: $SHOTS shots"
            if [ "$SHOTS" = "0" ]; then
              echo "::warning::No PNG from $ID; taking the attachments out of its result bundle."
              mkdir -p "shots/blank/attachments-$ID"
              xcrun xcresulttool export attachments --path "build/blank-$ID.xcresult" --output-path "shots/blank/attachments-$ID" || echo "::warning::xcresulttool could not export the attachments of $ID"
            fi
            xcrun simctl shutdown "$UDID" || true
          done
          ls -la shots/blank

      # 1.4.1 (docs/R1_4_1_CONTRACT.md §4.3–§4.11, §6.1, §6.6, §9.1 D1b, 0e-23): the iPad's UI test lane, which no run had
      # before (ui-tests is an iPhone's). On the table's 13-inch iPad ("Required simulators"; booted again after the photos,
      # 60 s for its banner), PaletteMoveUITests alone with TEST_RUNNER_TEGAKI_PALETTE_UI=1 (it skips itself everywhere
      # else): the open toolbar's grip dragged with a finger to the right, the top, the left and the bottom edge, ↶ after a
      # move, the paper area changed once per drop, 「ペン」's top − 16 the canvas's bottom on the bottom edge. Its
      # `palette UI:` lines and the app's `toolbar: paperArea=` / `toolbar: palette=` lines (out of the result bundle,
      # tools/ci/xcresult-app-output.sh) are shown here; the log, the app's output and the test's screenshots go to the
      # artifact palette-ui (not blank-paper's, whose 43 photos do not change). Unlike the photos this step fails when the
      # test fails or did not run on the iPad (skipped, missing): gate 1 of D1b reads this step's result, whatever the job's
      # continue-on-error. The limit: the boot 2–4 min, 1 for the banner, about 1 to the first test, the test about 2 (one
      # launch, one stroke, ↶, four drags each waited for at most 10 s and 1.5 s more): 20.
      # 1.4.1's second rework (docs/R1_4_1_CONTRACT.md §17.4, §17.5): the same class also has testTheMoveButtonMovesTheBar (the
      # 「動かす」 button before 「しまう」: three taps with a choice of edges and one drag, about 1.5 min more, inside the 20), and
      # the step passes only when both tests passed on the iPad.
      # 1.4.1's third rework (docs/R1_4_1_CONTRACT.md §18.3, §18.5): and testThePeekedBarHasTheMoveButton (the folded bar peeked
      # from the round button has 「動かす」 and no grip; 「右へ移す」 opens it on the right to stay; 「しまう」 folds it to the
      # bottom right corner: one launch, about 1 min more, inside the 20); the step passes only when all three passed.
      # 1.4.2 D1b (docs/R1_4_2_CONTRACT.md §3.8, §6.1, §6.5): and ColorPanelPadUITests (TEST_RUNNER_TEGAKI_PALETTE_UI=1 too): the pen
      # colour panel opens beside the upright bars, under the top bar and from the peeks at the bottom and on the left, and a colour
      # chosen there leaves the peek; its steps are the `color-panel UI:` lines. The step passes only when the three tests of
      # PaletteMoveUITests and the two of ColorPanelPadUITests passed (gate 1 of D1b reads it); 20 → 25 min.
      - name: Palette UI tests on the 13-inch iPad (1.4.1, 1.4.2)
        if: ${{ !cancelled() }}
        timeout-minutes: 25
        run: |
          set -uo pipefail
          OUT="$PWD/shots/palette-ui"
          mkdir -p "$OUT/attachments"
          UDID="${{ steps.required.outputs.ipad13 }}"
          if [ -z "$UDID" ]; then echo "::error::No 13-inch iPad from \"Required simulators\" (docs/M7D_CONTRACT.md §3.2)."; exit 1; fi
          echo "ipad13: $UDID"
          xcrun simctl boot "$UDID" 2>/dev/null || true
          if ! xcrun simctl bootstatus "$UDID" -b > /dev/null; then echo "::error::The 13-inch iPad did not boot."; exit 1; fi
          xcrun simctl ui "$UDID" appearance light || true
          xcrun simctl status_bar "$UDID" override --time "9:41" --batteryState charged --batteryLevel 100 --wifiBars 3 || true
          sleep 60    # the banner of a freshly booted simulator, docs/M6.md §5.1
          STATUS=0
          TEST_RUNNER_TEGAKI_PALETTE_UI=1 xcodebuild \
            -project TegakiCalendar.xcodeproj \
            -scheme TegakiCalendar \
            -configuration Debug \
            -destination "platform=iOS Simulator,id=$UDID" \
            -derivedDataPath build/BlankData \
            -resultBundlePath build/palette-ui.xcresult \
            -only-testing:TegakiCalendarUITests/PaletteMoveUITests \
            -only-testing:TegakiCalendarUITests/ColorPanelPadUITests \
            test-without-building > "$OUT/palette-ui-log.txt" 2>&1 || STATUS=$?
          grep 'palette UI:' "$OUT/palette-ui-log.txt" | awk '{ i = index($0, "palette UI:"); if (i > 1) $0 = substr($0, i); if (!seen[$0]++) print }' || true
          grep 'color-panel UI:' "$OUT/palette-ui-log.txt" | awk '{ i = index($0, "color-panel UI:"); if (i > 1) $0 = substr($0, i); if (!seen[$0]++) print }' || true
          grep -E 'Test Case .*(passed|failed|skipped)|error:|Executed ' "$OUT/palette-ui-log.txt" | tail -n 30 || true
          bash tools/ci/xcresult-app-output.sh "$OUT/palette-ui-app-output.txt" build/palette-ui.xcresult || true
          { grep -h -E 'toolbar: (paperArea|palette)=' "$OUT/palette-ui-app-output.txt" 2>/dev/null || true; } \
            | awk '{ i = index($0, "toolbar: "); if (i > 1) $0 = substr($0, i); print }' | head -n 80
          xcrun xcresulttool export attachments --path build/palette-ui.xcresult --output-path "$OUT/attachments" > /dev/null 2>&1 \
            || echo "::warning::xcresulttool could not export the palette UI tests' screenshots"
          xcrun simctl shutdown "$UDID" || true
          for TEST in PaletteMoveUITests.testTheGripMovesTheBarToEveryEdge PaletteMoveUITests.testTheMoveButtonMovesTheBar \
                      PaletteMoveUITests.testThePeekedBarHasTheMoveButton \
                      ColorPanelPadUITests.testThePanelOpensBesideTheBar ColorPanelPadUITests.testThePanelOpensFromThePeeks; do
            if ! grep -qE "${TEST%%.*}[ .]${TEST#*.}.*passed" "$OUT/palette-ui-log.txt"; then
              echo "::error::$TEST did not pass on the 13-inch iPad (status $STATUS; shots/palette-ui/palette-ui-log.txt in the artifact palette-ui)."
              exit 1
            fi
          done
          if [ "$STATUS" != 0 ]; then echo "::error::The palette UI tests ended with $STATUS (shots/palette-ui/palette-ui-log.txt)."; exit 1; fi
          echo "PaletteMoveUITests and ColorPanelPadUITests passed on the 13-inch iPad."

      # 1.4.2 (docs/R1_4_2_CONTRACT.md §4.7, §7.3, 0f-30): the memo paper's photos, in the artifact memo-paper-shots (not
      # blank-paper's 43, not J-4's screenshots: neither changes). On the table's 6.9-inch iPhone and 13-inch iPad ("Required
      # simulators"; booted again after the steps above, 60 s for the banner), MemoPaperShotsUITests alone with
      # TEST_RUNNER_TEGAKI_MEMO_SHOT_OUT and TEST_RUNNER_TEGAKI_MEMO_SHOT_DEVICE (it skips itself everywhere else): for
      # 「ドット方眼」 and 「無地」 (`--screenshot-memo-paper dots|plain`) the month's memo area, the day's right column and free
      # memo, the joined weeks' memo and the joined days' boundary, 2 × 2 × 4 = 16 photos
      # (<device>-<dots|plain>-<photo>.png), each with one `memo-paper shots:` line. Then, on the 13-inch iPad, the unit test
      # MemoPaperDrawTests.testPDFFollowsThePattern writes the month's PDF with dots (memo-month-dots.pdf, the 17th; `sips`
      # makes a PNG of it) and its `memo dots:` lines (the PDF's bytes of the three patterns). Photos only: the step never
      # fails the job (continue-on-error); a count other than 16 + 1 is a warning, and the lead looks at the photos.
      - name: Memo paper shots (1.4.2)
        if: ${{ !cancelled() }}
        timeout-minutes: 30
        continue-on-error: true
        run: |
          set -uo pipefail
          OUT="$PWD/shots/memo-paper"
          mkdir -p "$OUT"
          for SPEC in "iphone69|${{ steps.required.outputs.iphone69 }}" "ipad13|${{ steps.required.outputs.ipad13 }}"; do
            ID="${SPEC%%|*}"; UDID="${SPEC#*|}"
            if [ -z "$UDID" ]; then echo "::warning::No $ID from \"Required simulators\"; no memo paper photos of it."; continue; fi
            echo "$ID: $UDID"
            xcrun simctl boot "$UDID" 2>/dev/null || true
            xcrun simctl bootstatus "$UDID" -b > /dev/null || { echo "::warning::$ID did not boot; skipping."; continue; }
            xcrun simctl ui "$UDID" appearance light || true
            xcrun simctl status_bar "$UDID" override --time "9:41" --batteryState charged --batteryLevel 100 --wifiBars 3 || true
            sleep 60    # the banner of a freshly booted simulator, docs/M6.md §5.1
            TEST_RUNNER_TEGAKI_MEMO_SHOT_OUT="$OUT" TEST_RUNNER_TEGAKI_MEMO_SHOT_DEVICE="$ID" xcodebuild \
              -project TegakiCalendar.xcodeproj \
              -scheme TegakiCalendar \
              -configuration Debug \
              -destination "platform=iOS Simulator,id=$UDID" \
              -derivedDataPath build/BlankData \
              -resultBundlePath "build/memo-paper-$ID.xcresult" \
              -only-testing:TegakiCalendarUITests/MemoPaperShotsUITests \
              test-without-building > "$OUT/$ID-log.txt" 2>&1 || echo "::warning::MemoPaperShotsUITests did not pass on $ID ($OUT/$ID-log.txt)."
            grep 'memo-paper shots:' "$OUT/$ID-log.txt" | awk '{ i = index($0, "memo-paper shots:"); if (i > 1) $0 = substr($0, i); if (!seen[$0]++) print }' || true
            grep -E 'Test Case .*(passed|failed|skipped)|error:|Executed ' "$OUT/$ID-log.txt" | tail -n 10 || true
            echo "$ID: $(find "$OUT" -name "$ID-*.png" | wc -l | tr -d ' ') photos"
            if [ "$ID" = "ipad13" ]; then
              TEST_RUNNER_TEGAKI_MEMO_SHOT_OUT="$OUT" xcodebuild \
                -project TegakiCalendar.xcodeproj \
                -scheme TegakiCalendar \
                -configuration Debug \
                -destination "platform=iOS Simulator,id=$UDID" \
                -derivedDataPath build/BlankData \
                -resultBundlePath build/memo-paper-pdf.xcresult \
                -only-testing:TegakiCalendarTests/MemoPaperDrawTests/testPDFFollowsThePattern \
                -testLanguage ja \
                -testRegion JP \
                test-without-building > "$OUT/pdf-test-log.txt" 2>&1 || echo "::warning::The memo paper's PDF test did not pass ($OUT/pdf-test-log.txt)."
              grep 'memo dots:' "$OUT/pdf-test-log.txt" | awk '{ i = index($0, "memo dots:"); if (i > 1) $0 = substr($0, i); if (!seen[$0]++) print }' || true
              if [ -s "$OUT/memo-month-dots.pdf" ]; then
                sips -s format png -Z 2400 "$OUT/memo-month-dots.pdf" --out "$OUT/memo-month-dots.png" > /dev/null \
                  || echo "::warning::sips could not make a PNG of memo-month-dots.pdf."
              else
                echo "::warning::No memo-month-dots.pdf."
              fi
            fi
            xcrun simctl shutdown "$UDID" || true
          done
          PHOTOS="$(find "$OUT" -maxdepth 1 \( -name '*-dots-*.png' -o -name '*-plain-*.png' \) | wc -l | tr -d ' ')"
          PDFS="$(find "$OUT" -maxdepth 1 -name 'memo-month-dots.pdf' | wc -l | tr -d ' ')"
          echo "memo-paper-shots: $PHOTOS photos (16 expected) and $PDFS PDF (1 expected)"
          if [ "$PHOTOS" != 16 ] || [ "$PDFS" != 1 ]; then
            echo "::warning::memo-paper-shots has $PHOTOS photos and $PDFS PDF, not 16 and 1 (docs/R1_4_2_CONTRACT.md §7.3)."
          fi
          ls -la "$OUT"

      - name: Upload the shots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: blank-paper
          path: shots/blank
          retention-days: 7
          if-no-files-found: warn

      # 1.4.1 (§6.6): the palette UI tests' log, the app's output and the test's screenshots (kept 7 days).
      - name: Upload the palette UI tests' log (1.4.1)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: palette-ui
          path: shots/palette-ui
          retention-days: 7
          if-no-files-found: warn

      # 1.4.2 (§7.3): the memo paper's 16 photos, the month's PDF with dots and its PNG, and the two devices' logs (kept 7 days).
      - name: Upload the memo paper shots (1.4.2)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: memo-paper-shots
          path: shots/memo-paper
          retention-days: 7
          if-no-files-found: warn

      # 1.4 (docs/M7D_CONTRACT.md §3.2): the devices this job took are the table's ("Required simulators"): each line
      # "<id>: <name> | <runtime> (<build>)" of its env.txt has the table's name, on the runtime (name and build) that
      # "Required simulators" found for it, and every device of the table has a line (none means it was not found, and its
      # photos or tests are missing). A prefix fallback that landed on another device, or another runtime taken instead of
      # the table's (a newer one, or the iPhone Duo's iOS 27.2), fails the job here. The same lines in every job that boots
      # a simulator; only ENV_TXT differs.
      - name: The simulators used are the table's (1.4)
        if: ${{ !cancelled() && env.QUICK != 'true' }}
        env:
          ENV_TXT: shots/blank/env.txt
        run: |
          set -euo pipefail
          python3 -I - "$RUNNER_TEMP/required-simulators.txt" "$ENV_TXT" <<'EOF'
          import re, sys
          table = [[p.strip() for p in line.rstrip("\n").split("|")] for line in open(sys.argv[1], encoding="utf-8") if line.strip()]
          try:
              resolved = {row[0]: row[2:] for row in (line.rstrip("\n").split("|") for line in open(sys.argv[1].replace(".txt", "-resolved.txt"), encoding="utf-8")) if len(row) == 4}
          except OSError:
              resolved = {}
          try:
              lines = open(sys.argv[2], encoding="utf-8").read().splitlines()
          except OSError as error:
              print("::error::%s could not be read (%s): the devices this job took are not known (docs/M7D_CONTRACT.md §3.2)." % (sys.argv[2], error))
              sys.exit(1)
          taken = {}
          for line in lines:
              m = re.fullmatch(r"([a-z0-9]+): (.+) \| (.+) \(([^()]*)\)", line)
              if m:
                  taken.setdefault(m.group(1), []).append(m.group(2, 3, 4))
          failed = False
          for ident, name, want in table:
              if ident not in taken:
                  print("::error::%s (%s): no line in %s, so it was not taken (docs/M7D_CONTRACT.md §3.2)." % (ident, name, sys.argv[2]))
                  failed = True
              for got, runtime, build in taken.get(ident, []):
                  if ident in resolved:
                      ok = got == name and [runtime, build] == resolved[ident]
                      where = "%s (%s)" % tuple(resolved[ident])
                  else:
                      ok = got == name and (runtime == "iOS " + want or runtime.startswith("iOS " + want + "."))
                      where = "iOS " + want
                  print("%s: %s | %s (%s): %s" % (ident, got, runtime, build, "the table's" if ok else "NOT the table's"))
                  if not ok:
                      print("::error::%s took %s on %s (%s), not the table's %s on %s (docs/M7D_CONTRACT.md §3.2)." % (ident, got, runtime, build, name, where))
                      failed = True
          sys.exit(1 if failed else 0)
          EOF

      # 1.4 D1d (docs/M7D.md, 実行機の打ち切り): only when this job is cancelled (by hand, by its time limit, or by the runner's
      # side with nothing but "The operation was canceled.", four times on xcode-27 on 11/20), tools/ci/cancel-diag.sh prints
      # the load, the memory, the 15 busiest processes and, from the runner's own _diag folder, only its lines about a
      # cancel, a shutdown, a lost connection, a time-out or a signal (200 at most; the folder is never uploaded or printed
      # whole, nothing is written to disk: the repository is public). Not on success or failure; never fails the job. The
      # same lines at the end of every job on xcode-27 of build.yml and duo.yml.
      - name: Diagnostics of a cancelled job (1.4 D1d)
        if: cancelled()
        continue-on-error: true
        timeout-minutes: 3
        run: |
          if [ -f tools/ci/cancel-diag.sh ]; then
            bash tools/ci/cancel-diag.sh || true
          else
            echo "tools/ci/cancel-diag.sh is not here (cancelled before the checkout?)."
            uptime || true
          fi

  # 1.3 (docs/M7C_CONTRACT.md §10.5 (2); the wave C plan §3.3, §7.6 with DECISIONS C3-m1, C3-m3, C3-m4 and C3-M4; docs/M7C.md,
  # wave C1's lead decisions and the plan of wave C2): the joined pages photographed from the NORMAL app (the prototype's job,
  # span-shots (1.3 prototype), went with S6; tag r13-proto-1). The Debug app and its two test bundles are built for testing once
  # (build/SpanAppData); then, one device at a time (the owner's iPad Air 11-inch, the iPad mini, the iPad Pro 13-inch and the
  # iPhone 17, which stays booted for the steps after it), SpanShotsUITests (Tests/TegakiCalendarUITests/SpanShotsUITests.swift)
  # takes:
  #   - the bands: week and day, the focus page's left boundary in the middle (`--screenshot-offset-x -0.5`, the crossing demo
  #     there) and the overview, portrait on every device and landscape on the iPhone (C3-m1: no iPad landscape band), and
  #     the week starting on Sunday on the iPad Air 11-inch (<device>-<orientation>-<week|day>-<boundary|overview>.png);
  #   - the pairs before and after a shift (C3-M4; the iPad Air 11-inch and the iPhone, week and day, one launch each:
  #     `--screenshot-span-shift`, "before" while span.state says hold=on and reads the same twice, `span.release` tapped,
  #     "after" once shifts=1 has settled; <device>-portrait-shift-<kind>-before|after.png);
  #   - the old versions' margins (C3-m4; wave D's text decision 11): `--screenshot-single-page` (one page holding the halves
  #     of the strokes drawn across its left boundary, as 1.2.3 shows it) and its control (the same without it, 1.2.3's
  #     demo), week and day, portrait and landscape on the three iPads, the iPhone's portrait day and landscape week and day
  #     (<device>-<orientation>-margin-<kind>-single|control.png);
  #   - the week memo below 24:00 (§5.2, §11.2; the week memo plan PLAN_W §7.3, outside J-4; the iPad Air 11-inch and the
  #     iPhone, portrait, `--screenshot-week-memo --screenshot-offset 0,1500`): one page (the setting off) and the band with
  #     the focus page's left boundary in the middle (<device>-portrait-week-memo-single|band.png). Each photo's paper must
  #     be 7,920 lu tall (the probe's `ph`: the 24 hours and the memo's 6,000), and the gates step fails unless there are 4.
  # XCUIScreenshot cuts a screen turned with XCUIDevice (blank-paper's landscape photos of run 43584152837: a third of the
  # screen, sideways), so the test asks this job for those photos: it writes a request into $RUNNER_TEMP, and `watch_photos`
  # answers with `simctl io screenshot`, stood up with `sips -r 270` as the first job's iPhone landscape photos are (1.4
  # D0b: as there, only a PNG taller than wide; the iOS 27.2 simulator writes it in landscape already).
  # The test's lines for the job are in shots/span-app/lines/<device>.txt (not read from xcodebuild's output, where an app's
  # log line can cut one, as in the prototype's span-shots job, removed in S6). Then the neighbour ink's PDF (ScreenPathsSpanTests'
  # testPDFDrawsNeighborInkWithoutPrefixedNamesInThePage writes it with TEST_RUNNER_TEGAKI_SPAN_SHOT_OUT; `sips` makes a
  # PNG of it), and the gates: tools/shots/shift_pair.swift on each pair with the rows above the canvas left out (the status
  # bar, the heading, the sticky heading and the all-day band, C3-m3 (b)), no pixel differing strongly, or else
  # tools/shots/shift_subpixel.swift finds the strong pixels explained by a re-drawing less than a pixel away (a shift places
  # the band again by a page width that is rarely a whole number of pixels; run 43596500507), at most 100 left, with a
  # warning, or the job fails; and once more with only the status bar left out (a warning only: a version-paired viewport
  # that slips is testViewportIsPairedWithTheWindowVersion's to find); tools/shots/span_margin.swift counts the pixels of the desk beside
  # the page that are not the desk's colour (#ecebe6 ± 8; the canvas's rows, the bottom toolbar outside them), every control
  # must count 0 or the job fails, and each single photo gives a line
  # `span margin: <device> <kind> <orientation> left=<n> right=<n> cols=… frame=… side=left control=<l>,<r> photo=…` (the
  # crossing demo overflows on the left only, ScreenshotModeSpanTests). Artifact "span-shots-app" (kept 7 days).
  # On r13 and the integration branches r13-s5c* only (C3-m1): testLanguages on the iPhone 17, 10 languages × 6 photos
  # (設定 › ページ, the guide's cards of the week and the day for one and two fingers, and N-8, whose 20 s toast the test
  # waits for by its text in the string catalogue), with the app's `l10n: missing` keys; artifact
  # "span-shots-app-languages" (kept 7 days, uploaded separately so a slow run that reaches the limit there keeps the
  # first one). The job's summary has the margins, the pairs, the photos per language and the missing keys.
  # Not on r13-quick and r13-q-* (§10.6); it runs on r13-w-*, r13-s5c*, r13 and everywhere else. No `needs`. The limits
  # (estimates until the first runs measure them): XcodeGen and the build about 8 min, a device about 6–8 (its boot 1–3,
  # the 60 s for the system banner, 13–16 launches of about 10 s), the PDF 2, the gates 3 (two swiftc), the languages about
  # 12 (60 launches): about 50 of the 75 on r13, 38 elsewhere. Each step has its own limit. Measured (docs/M7C.md): the
  # four devices took 30–42 min on r13-w-* but 48 and 51 min in runs with every job (r13 43655539165, r13-s5c3
  # 43689057415, whose first attempt hit the old 50), so that step has 65 and the job 90. The week memo adds 2 launches
  # on each of 2 devices (each waits at most 45 s for its path; SpanShotsUITests.weekMemo), about 2–4 min; the four
  # devices took 44.8 min in r13-w-s5w-screen 44260458163 just before it. Its first runs are measured in docs/M7C.md; past
  # 60 min the limit is looked at again.
  # 1.4 D0b (docs/M7D_CONTRACT.md §3.3 9, §3.8; docs/M7D.md, D0b): the four devices' step 65 → 80 and the job 90 → 110.
  # 1.3's step took 45.8 min (run 44474759145). In D0 (run 44632524223) the iPad Air 11-inch kept 1.3's pace (9:47 from
  # choosing it to "Running tests", 9:21 in 1.3) until XCUITest's "Setting device orientation to Portrait" hung; the
  # other jobs on xcode-27 took 1.11–1.19 times 1.3's (l10n-shots, ui-tests) and blank-paper about 1.5. At 1.2 the step
  # is 55 min, and one watchdog stop with its one more run (the step below) adds about 25: 10 of silence, 1 to end
  # xcodebuild, 5 to boot the device again, 1 for the banner, 8 for the four tests, so 80. The job: 80 + 1.3's other
  # steps (20.1 min, the languages 15.5 of it) × 1.2 ≈ 104, so 110.
  # 1.4.1 (docs/R1_4_1_CONTRACT.md §6.6, §7.4, §9.1 D1b, 0e-23, 0e-24): the same xcodebuild also runs PaletteShotsUITests on
  # each device (it skips itself on the iPad Air 11-inch): 1.4.1's new photos outside J-4 — the 13-inch iPad's month and week
  # with the open toolbar on the top, the left and the right, its month with the left hand and with a drag's look, its
  # landscape month with the bar on the left; the iPad mini's portrait month on the left and its landscape week on the right
  # (and scrolled); the iPhone 17's week with the left hand in portrait and landscape. The landscape ones through
  # `watch_photos` (XCUIDevice's turn, `simctl io screenshot`; iPadOS ignores --screenshot-landscape). 14 launches of about
  # 12 s, 3–4 min in all: the four devices' step 80 → 85 and the job 110 → 115. The photos go to shots/span-app/palette, the
  # artifact palette-shots (left out of span-shots-app's, whose 64 photos do not change), and their `palette shot:` lines to
  # shots/span-app/palette/lines-<id>.txt (not to lines/, which the gates read).
  # 1.4.2 D1b (docs/R1_4_2_CONTRACT.md §3.9, §7.3, 0f-30): PaletteShotsUITests adds the pen colour panel's photos (9 launches) and,
  # last on the 13-inch iPad and the iPhone 17, a second xcodebuild with the simulator in dark mode for the 2 dark photos (about
  # 1.5 min each with its build of the runner): the four devices' step 85 → 90 and the job 115 → 120. Their lines go to the same
  # lines-<id>.txt; the dark run's app output to <id>-dark-app-output.txt (not the gates' <id>-app-output.txt).
  # 1.4.3 D1b (docs/R1_4_3.md, the second full run 46129477127; contract §12.1): the same code's photo step took 60.3 min
  # (46119423355) and 82.6 (46129477127 attempt 2), and V's attempt 1 (45721608435) hit the 90-minute limit 30 s after the
  # four devices' tests had passed (docs/R1_4_2.md:1083; about 92 needed). This job has no continue-on-error, so a cut fails
  # the run: the four devices' step 90 → 100 and the job 120 → 135 (the rest of the job 19.2–24.8 min, so ≥ 10 under it).
  span-shots-app:
    name: span-shots (1.3 app)
    if: ${{ !(github.ref_name == 'r13-quick' || startsWith(github.ref_name, 'r13-q-') || github.ref_name == 'r14-quick' || startsWith(github.ref_name, 'r14-q-') || github.ref_name == 'r141-quick' || startsWith(github.ref_name, 'r141-q-') || github.ref_name == 'r142-quick' || startsWith(github.ref_name, 'r142-q-') || startsWith(github.ref_name, 'r142-w-') || github.ref_name == 'r143-quick' || startsWith(github.ref_name, 'r143-q-') || startsWith(github.ref_name, 'r143-w-')) }}
    # 1.4 (docs/M7D_CONTRACT.md §3.1, §3.3 1, 0d-2): the image with Xcode 27 (macos-26 and macos-15 do not get it).
    runs-on: xcode-27
    timeout-minutes: 135
    env:
      HOMEBREW_NO_AUTO_UPDATE: "1"
      HOMEBREW_NO_INSTALL_CLEANUP: "1"
      NSUnbufferedIO: "YES"

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        timeout-minutes: 5

      # 1.4 (docs/M7D_CONTRACT.md §3.1, 0d-1): Xcode 27.2, chosen by what each candidate says it is, never by its path.
      # Every /Applications/Xcode_27.2*.app is read with `xcodebuild -version` (DEVELOPER_DIR set to it); one whose version is
      # 27.2 or 27.2.x and whose build ends in a digit is a release (a beta's build ends in a lower-case letter, as 27.3
      # beta's 27C5020n; the rolling-out image 20261119 gives that beta aliases named like a release, §3.1), and the newest
      # release is selected. None fails the job: until 1.3 this step chose Xcode 26.6 only when it was there and otherwise
      # went on with the image's default Xcode, unseen. Then `sudo xcodebuild -runFirstLaunch` (harmless when it has run).
      # The same lines in every job on xcode-27 (build.yml, ja-baseline.yml, store-shots.yml, testflight.yml, duo.yml).
      - name: Select Xcode 27.2
        # 1.4: 5 → 10 for -runFirstLaunch.
        timeout-minutes: 10
        run: |
          set -euo pipefail
          XCODE="$(python3 -I -c '
          import glob, os, re, subprocess, sys
          def key(version, build):                               # (27, 2, 0), then the build: digits as numbers
              numbers = tuple((int(p) for p in version.split("."))) + (0, 0, 0)
              return numbers[:3], tuple((0, int(t)) if t.isdigit() else (1, t) for t in re.findall(r"[0-9]+|[^0-9]+", build))
          best = None
          seen = {}
          for app in sorted(glob.glob("/Applications/Xcode_27.2*.app")):
              real = os.path.realpath(app)
              if real in seen:
                  print("%s: the same Xcode as %s" % (app, seen[real]), file=sys.stderr)
                  continue
              seen[real] = app
              env = dict(os.environ, DEVELOPER_DIR=os.path.join(real, "Contents", "Developer"))
              try:
                  out = subprocess.run(["xcodebuild", "-version"], env=env, capture_output=True, text=True, timeout=300).stdout
              except Exception as error:
                  print("%s: xcodebuild -version failed (%s)" % (app, error), file=sys.stderr)
                  continue
              version = re.search(r"^Xcode ([0-9.]+)$", out, re.M)
              build = re.search(r"^Build version ([0-9A-Za-z]+)$", out, re.M)
              version = version.group(1) if version else "?"
              build = build.group(1) if build else "?"
              release = re.fullmatch(r"27\.2(\.[0-9]+)?", version) is not None and re.search(r"[0-9]$", build) is not None
              print("%s (%s): Xcode %s, build %s%s" % (app, real, version, build, ": a release of 27.2" if release else ": not a release of 27.2"), file=sys.stderr)
              if release and (best is None or key(version, build) > best[0]):
                  best = (key(version, build), real)
          print(best[1] if best else "")
          ')"
          if [ -z "$XCODE" ]; then
            echo "::error::No release of Xcode 27.2 in /Applications (xcodebuild -version 27.2 or 27.2.x, its build ending in a digit; docs/M7D_CONTRACT.md §3.1). The job does not go on with another Xcode."
            exit 1
          fi
          echo "Selected: $XCODE"
          sudo xcode-select -s "$XCODE"
          sudo xcodebuild -runFirstLaunch
          xcode-select -p
          xcodebuild -version
          echo "runner image: ${ImageOS:-?} ${ImageVersion:-?}"

      # 1.4 (docs/M7D_CONTRACT.md §3.2, 0d-3): the simulators of the table that this job uses must be on the runner, each
      # under its exact name on its runtime (iOS 27.2; the iPad mini (A17 Pro) is on iOS 27.0 only; the iPhone Duo on the
      # Duo's iOS 27.2 runtime). One that is missing fails the job here: until 1.3 a missing device was a warning ("No
      # simulator for …; skipping") and the job stayed green, so all the 6.9-inch photos could be gone unseen. Each one's
      # UDID is an output of this step (steps.required.outputs.<id>); the table and the runtime (name and build) each one
      # resolved to go to $RUNNER_TEMP for "The simulators used are the table's" after the photos, and the UDIDs to
      # $RUNNER_TEMP/required-simulators-udids.txt, which the pickers of the later steps take first (so they boot the very
      # devices checked here). When the name is on two runtimes of that version (iOS 27.2 has two sets, the usual devices'
      # and the iPhone Duo's, §3.1), every other device is taken from the runtime with no iPhone Duo and the iPhone Duo from
      # the runtime of iPhone Duos only; a warning only when nothing tells the runtimes apart. The same lines in every job
      # that boots a simulator; only the table differs.
      - name: Required simulators (1.4)
        id: required
        timeout-minutes: 5
        env:
          # <id>|<exact name>|<runtime version> (docs/M7D_CONTRACT.md §3.2)
          REQUIRED: |
            ipad11|iPad Air 11-inch (M4)|27.2
            ipadmini|iPad mini (A17 Pro)|27.0
            ipad13|iPad Pro 13-inch (M5)|27.2
            iphone|iPhone 17|27.2
        run: |
          set -euo pipefail
          printf '%s\n' "$REQUIRED" | grep -v '^[[:space:]]*$' > "$RUNNER_TEMP/required-simulators.txt"
          xcrun simctl list -j > "$RUNNER_TEMP/simctl-list.json"
          python3 -I - "$RUNNER_TEMP/simctl-list.json" "$RUNNER_TEMP/required-simulators.txt" <<'EOF'
          import json, os, re, sys
          data = json.load(open(sys.argv[1], encoding="utf-8"))
          runtimes = {r.get("identifier"): r for r in data.get("runtimes", [])}
          def version(runtime):                                  # the runtime's "version" ("27.2"), else from its identifier
              v = runtimes.get(runtime, {}).get("version")
              if v:
                  return v
              m = re.search(r"iOS-([0-9]+)-([0-9]+)", runtime)
              return "%s.%s" % m.groups() if m else "?"
          devices = {runtime: [d for d in items if d.get("isAvailable") and d.get("name") and d.get("udid")]
                     for runtime, items in data.get("devices", {}).items() if "iOS" in runtime}
          def duos(runtime):                                     # 0: iPhone Duos only, 1: some, 2: none
              n = sum(d["name"].startswith("iPhone Duo") for d in devices[runtime])
              return 0 if n == len(devices[runtime]) else 1 if n else 2
          failed = False
          outputs = []
          resolved = []
          for line in open(sys.argv[2], encoding="utf-8"):
              ident, name, want = [p.strip() for p in line.rstrip("\n").split("|")]
              def wanted(runtime):
                  return version(runtime) == want or version(runtime).startswith(want + ".")
              # The runtime that suits the name first: for the iPhone Duo the one of iPhone Duos only (the Duo's own iOS 27.2
              # set), for every other device the one with no iPhone Duo (§3.1); then a runtime with some iPhone Duos.
              found = sorted((duos(runtime) if name.startswith("iPhone Duo") else 2 - duos(runtime), runtime, d["udid"])
                             for runtime, items in devices.items() if wanted(runtime) for d in items if d["name"] == name)
              if not found:
                  there = sorted({d["name"] for runtime, items in devices.items() if wanted(runtime) for d in items})
                  print("::error::%s: no available simulator \"%s\" on iOS %s (docs/M7D_CONTRACT.md §3.2). The devices of iOS %s: %s"
                        % (ident, name, want, want, ", ".join(there) or "none (no such runtime)"))
                  failed = True
                  continue
              _, runtime, udid = found[0]
              r = runtimes.get(runtime, {})
              print("%s: %s | %s (%s) %s" % (ident, name, r.get("name", runtime), r.get("buildversion", "?"), udid))
              if len(found) > 1:
                  tie = found[0][0] == found[1][0]
                  print("%s%s: \"%s\" is on %d runtimes of iOS %s (%s); %s is taken (%s)."
                        % ("::warning::" if tie else "", ident, name, len(found), want, ", ".join(f[1] for f in found), runtime,
                           "nothing tells them apart: the first by its identifier" if tie
                           else "iPhone Duos only" if name.startswith("iPhone Duo") else "no iPhone Duo"))
              outputs.append("%s=%s\n" % (ident, udid))
              resolved.append("%s|%s|%s|%s\n" % (ident, name, r.get("name", runtime), r.get("buildversion", "?")))
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as out:
              out.write("".join(outputs))
          with open(sys.argv[2].replace(".txt", "-resolved.txt"), "w", encoding="utf-8") as out:
              out.write("".join(resolved))
          with open(sys.argv[2].replace(".txt", "-udids.txt"), "w", encoding="utf-8") as out:
              out.write("".join(o.split("=", 1)[1] for o in outputs))
          sys.exit(1 if failed else 0)
          EOF

      # 1.4 (docs/M7D_CONTRACT.md §3.3 4, 0d-28): XcodeGen 2.46.0 from its release zip, pinned by sha256, the same in every
      # job (until 1.3 `brew install xcodegen`, whose version was the image's formula). The script fails unless
      # `xcodegen --version` then says 2.46.0; the job's later steps find it first in PATH.
      - name: Install XcodeGen
        timeout-minutes: 10
        run: |
          set -euo pipefail
          bash "$GITHUB_WORKSPACE/tools/ci/install-xcodegen.sh"

      - name: Generate the Xcode project
        timeout-minutes: 5
        run: |
          set -euo pipefail
          xcodegen generate

      # Built for testing once, before anything boots: the products run on all four devices (one platform; the generic
      # destination builds every simulator architecture).
      - name: Build the app and its tests (Debug, for testing)
        timeout-minutes: 25
        run: |
          set -euo pipefail
          xcodebuild \
            -project TegakiCalendar.xcodeproj \
            -scheme TegakiCalendar \
            -configuration Debug \
            -destination "generic/platform=iOS Simulator" \
            -derivedDataPath build/SpanAppData \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            build-for-testing
          ls build/SpanAppData/Build/Products/*.xctestrun

      # One device at a time (blank-paper's way): boot, 60 s for the system banner of a freshly booted simulator (docs/M6.md
      # §5.1; the margins and the pairs, which a banner would spoil, come after the bands), SpanShotsUITests' four tests
      # (testLanguages has its own step), the app's log. The step fails when a device is missing or its tests fail, after
      # the other devices have had their turn.
      - name: Shots on four devices (SpanShotsUITests)
        id: devices
        timeout-minutes: 100
        run: |
          set -uo pipefail
          OUT="$PWD/shots/span-app"
          REQUESTS="$RUNNER_TEMP/span-photo-requests"
          mkdir -p "$OUT/lines" "$REQUESTS"
          # 1.4 (docs/M7D_CONTRACT.md §3.3 3, gate 8): this job's environment (the lines of build.yml's env.txt), then each
          # device it takes ("<id>: <name> | <runtime> (<build>)", sim_env), which "The simulators used are the table's" reads.
          {
            xcodebuild -version
            echo "Xcode path: $(xcode-select -p)"
            echo "runner image: ${ImageOS:-?} ${ImageVersion:-?}"
            echo "xcodegen: $(xcodegen --version 2>&1 | head -n 1)"
            echo "python3: $(python3 --version 2>&1)"
            xcrun simctl list runtimes
          } > "$OUT/env.txt" || echo "::warning::env.txt could not all be written"
          sim_env() {  # sim_env <device id> <udid>: "<id>: <device name> | <runtime name> (<runtime build>)"
            xcrun simctl list -j | SIM_ID="$1" SIM_UDID="$2" python3 -I -c '
          import json, os, sys
          data = json.load(sys.stdin)
          runtimes = {r.get("identifier"): r for r in data.get("runtimes", [])}
          for runtime, items in data.get("devices", {}).items():
              for d in items:
                  if d.get("udid") == os.environ["SIM_UDID"]:
                      r = runtimes.get(runtime, {})
                      print("%s: %s | %s (%s)" % (os.environ["SIM_ID"], d.get("name"), r.get("name", runtime), r.get("buildversion", "?")))
                      raise SystemExit
          print("%s: (no simulator %s)" % (os.environ["SIM_ID"], os.environ["SIM_UDID"]))
          '
          }
          FAILED=0
          # The photos of a turned screen (SpanShotsUITests.simulatorPhoto): a request <name>.request holds the file (under
          # $OUT) and the turn; the answer <name>.request.done ("ok" or "failed") is written whole, then renamed.
          watch_photos() {  # watch_photos <udid>: answers the requests until it is stopped
            local REQ FILE TURN ANSWER
            while :; do
              for REQ in "$REQUESTS"/*.request; do
                [ -f "$REQ" ] || continue
                FILE="$(sed -n 1p "$REQ")"
                TURN="$(sed -n 2p "$REQ")"
                rm -f "$REQ"
                ANSWER=failed
                if [ -n "$FILE" ] && mkdir -p "$(dirname "$OUT/$FILE")" && xcrun simctl io "$1" screenshot "$OUT/$FILE" > /dev/null 2>&1; then
                  ANSWER=ok
                  # 1.4 D0b (docs/M7D.md, D0b; the rule of docs/M7D_CONTRACT.md §3.5 (g)): the iOS 27.2 simulator writes a
                  # turned screen's photo in landscape already (D0, run 44632524223: turned by the test's 270° the iPad Air
                  # 11-inch's landscape margin photos came out 1640x2360, and span_margin cannot count them), so the photo
                  # is turned only when the PNG is taller than wide (until iOS 26 it always was); a PNG whose size cannot be
                  # read is a failed photo, as a failed turn was. The test's request (SpanShotsUITests.swift, frozen in
                  # TESTS_1_3) still says 270.
                  if [ -n "$TURN" ]; then
                    TURN_SIZE="$(sips -g pixelWidth -g pixelHeight "$OUT/$FILE" 2>/dev/null | awk '/pixelWidth/ { w = $2 } /pixelHeight/ { h = $2 } END { print w + 0, h + 0 }' || true)"
                    case "$TURN_SIZE" in
                      ''|"0 "*|*" 0") ANSWER=failed ;;
                      *) if [ "${TURN_SIZE#* }" -gt "${TURN_SIZE% *}" ] && ! sips -r "$TURN" "$OUT/$FILE" > /dev/null 2>&1; then ANSWER=failed; fi ;;
                    esac
                  fi
                fi
                echo "the photo $FILE for the test: $ANSWER"
                echo "$ANSWER" > "$REQ.done.part"
                mv "$REQ.done.part" "$REQ.done"
              done
              sleep 0.3
            done
          }
          # device-id | exact first choice | prefix fallbacks (in order)
          for SPEC in "ipad11|iPad Air 11-inch (M4)|iPad Air 11,iPad Pro 11" \
                      "ipadmini|iPad mini (A17 Pro)|iPad mini" \
                      "ipad13|iPad Pro 13-inch (M5)|iPad Pro 13,iPad Air 13" \
                      "iphone|iPhone 17|iPhone 17,iPhone"; do
            ID="${SPEC%%|*}"; REST="${SPEC#*|}"; EXACT="${REST%%|*}"; PREFIXES="${REST#*|}"
            FOUND="$(xcrun simctl list -j devices available | SIM_EXACT="$EXACT" SIM_PREFIXES="$PREFIXES" python3 -I -c '
          import json, os, re, sys
          devices = json.load(sys.stdin).get("devices", {})
          def version(runtime):                                  # "…iOS-26-5" → (26, 5)
              m = re.search(r"iOS-(\d+)-(\d+)", runtime)
              return (int(m.group(1)), int(m.group(2))) if m else (0, 0)
          try:                                                   # 1.4 (docs/M7D_CONTRACT.md §3.2): "Required simulators"
              required = set(open(os.path.join(os.environ["RUNNER_TEMP"], "required-simulators-udids.txt"), encoding="utf-8").read().split())
          except (KeyError, OSError):
              required = set()
          found = {}                                             # name → (udid, key): one Required resolved (1.4) > the newest iOS
          for runtime, items in devices.items():
              if "iOS" not in runtime:
                  continue
              for d in items:
                  if not (d.get("isAvailable") and d.get("name") and d.get("udid")):
                      continue
                  key = (d["udid"] in required, version(runtime))
                  if d["name"] not in found or key > found[d["name"]][1]:
                      found[d["name"]] = (d["udid"], key)
          exact = os.environ["SIM_EXACT"]
          if exact in found:
              print(exact + "|" + found[exact][0])
              raise SystemExit
          for prefix in os.environ["SIM_PREFIXES"].split(","):
              for name in sorted(found):
                  if name.startswith(prefix):
                      print(name + "|" + found[name][0])
                      raise SystemExit
          print("")
          ' || true)"
            if [ -z "$FOUND" ]; then echo "::error::No simulator for $ID."; FAILED=1; continue; fi
            NAME="${FOUND%%|*}"; UDID="${FOUND##*|}"
            echo "$ID: $NAME ($UDID)"
            sim_env "$ID" "$UDID" >> "$OUT/env.txt" || echo "::warning::no runtime line for $ID"
            STARTED="$(date +%s)"
            xcrun simctl boot "$UDID" 2>/dev/null || true
            if ! xcrun simctl bootstatus "$UDID" -b > /dev/null; then echo "::error::$ID ($NAME) did not boot."; FAILED=1; continue; fi
            xcrun simctl ui "$UDID" appearance light || true
            xcrun simctl status_bar "$UDID" override --time "9:41" --batteryState charged --batteryLevel 100 --wifiBars 3 || true
            sleep 60
            # 1.4 D0b (docs/M7D_CONTRACT.md §3.8; docs/M7D.md, D0b; D0 run 44632524223): on the iPad Air 11-inch
            # XCUITest's "Setting device orientation to Portrait" (SpanShotsUITests.swift:184) wrote nothing for 32 min
            # and then failed "Failed to get list of active applications: Accessibility error kAXErrorIPCTimeout"; the
            # job was cancelled 25 min into that silence. In 1.3's run (44474759145) the longest silence between
            # XCUITest's activity lines was 10.3 s. So xcodebuild is stopped when its log has not grown for STALL s
            # (TERM, KILL 60 s later), and the watchdog's line (<id>-watchdog.txt, with the last activity line) makes
            # that the simulator's failure below.
            STALL=600
            watchdog() {  # watchdog <pid> <log> <file>: ends <pid> when <log> has not grown for $STALL s, writing <file>
              local SIZE SEEN=-1 QUIET=0
              while kill -0 "$1" 2>/dev/null; do
                sleep 15
                SIZE="$(wc -c < "$2" 2>/dev/null | tr -d ' ' || echo 0)"
                if [ "$SIZE" != "$SEEN" ]; then SEEN="$SIZE"; QUIET=0; continue; fi
                QUIET=$(( QUIET + 15 ))
                if [ "$QUIET" -ge "$STALL" ]; then
                  echo "watchdog: no output for $QUIET s after \"$(grep -E '^ +t = ' "$2" | tail -n 1 | sed -E 's/^ +//')\"" > "$3"
                  kill -TERM "$1" 2>/dev/null || true
                  sleep 60
                  kill -KILL "$1" 2>/dev/null || true
                  return 0
                fi
              done
            }
            run_shots() {  # run_shots <result bundle suffix>: the four tests on $UDID, the photo watcher and the watchdog beside them
              watch_photos "$UDID" &
              WATCHER=$!
              STATUS=0
              TEST_RUNNER_TEGAKI_SPAN_SHOT_OUT="$OUT" TEST_RUNNER_TEGAKI_SPAN_SHOT_DEVICE="$ID" \
              TEST_RUNNER_TEGAKI_SPAN_SHOT_REQUESTS="$REQUESTS" xcodebuild \
                -project TegakiCalendar.xcodeproj \
                -scheme TegakiCalendar \
                -configuration Debug \
                -destination "platform=iOS Simulator,id=$UDID" \
                -derivedDataPath build/SpanAppData \
                -resultBundlePath "build/span-app-$ID$1.xcresult" \
                -only-testing:TegakiCalendarUITests/SpanShotsUITests/testBands \
                -only-testing:TegakiCalendarUITests/SpanShotsUITests/testOldVersionMargins \
                -only-testing:TegakiCalendarUITests/SpanShotsUITests/testShiftPairs \
                -only-testing:TegakiCalendarUITests/SpanShotsUITests/testWeekMemo \
                -only-testing:TegakiCalendarUITests/PaletteShotsUITests \
                test-without-building > "$OUT/$ID-tests.log" 2>&1 &
              TESTS=$!
              watchdog "$TESTS" "$OUT/$ID-tests.log" "$OUT/$ID-watchdog$1.txt" &
              DOG=$!
              wait "$TESTS" || STATUS=$?
              kill "$DOG" "$WATCHER" 2>/dev/null || true
              wait "$DOG" 2>/dev/null || true
              wait "$WATCHER" 2>/dev/null || true
              # A run the watchdog stopped is a failure even if xcodebuild ended with 0 on its TERM (143: TERM's status).
              if [ -s "$OUT/$ID-watchdog$1.txt" ] && [ "$STATUS" = 0 ]; then STATUS=143; fi
            }
            run_shots ""
            # The simulator, not the app (docs/M7C.md, FLAKE-1): in runs with every job a launch has timed out
            # (ipad13, r13-w-ui1 43681366335) and the background assertion has timed out (iphone, r13 43699389888). Only
            # then the device's tests run once more; any other failure stands. The first log is kept as <id>-tests-first.log.
            # 1.4 D0b (docs/M7D_CONTRACT.md §3.8; docs/M7D.md, D0b): the simulator's accessibility that stops answering
            # ("Failed to get list of active applications: Accessibility error kAXErrorIPCTimeout", D0's iPad Air
            # 11-inch; kAXErrorIPC takes the other IPC errors too) and the watchdog's stop above are the simulator's as
            # well (WEDGED); for them the device is shut down and booted again, with the 60 s for the banner, before its
            # one more run.
            SIMULATOR='Timed out while acquiring background assertion|Failed to get background assertion|Timed out while launching|Failed to launch app|Lost connection to the test manager|Test runner never began executing|kAXErrorIPC|Failed to get list of active applications'
            WEDGED='kAXErrorIPC|Failed to get list of active applications'
            if [ "$STATUS" != 0 ] && { [ -s "$OUT/$ID-watchdog.txt" ] || grep -qE "$SIMULATOR" "$OUT/$ID-tests.log"; }; then
              WHY="$(cat "$OUT/$ID-watchdog.txt" 2>/dev/null || grep -oE "$SIMULATOR" "$OUT/$ID-tests.log" | head -n 1)"
              echo "::warning::$ID: $WHY; the device's tests run once more."
              mv "$OUT/$ID-tests.log" "$OUT/$ID-tests-first.log"
              if [ -s "$OUT/$ID-watchdog.txt" ] || grep -qE "$WEDGED" "$OUT/$ID-tests-first.log"; then
                xcrun simctl shutdown "$UDID" || true
                xcrun simctl boot "$UDID" 2>/dev/null || true
                if ! xcrun simctl bootstatus "$UDID" -b > /dev/null; then echo "::warning::$ID ($NAME) did not boot again."; fi
                xcrun simctl ui "$UDID" appearance light || true
                xcrun simctl status_bar "$UDID" override --time "9:41" --batteryState charged --batteryLevel 100 --wifiBars 3 || true
                sleep 60
              fi
              run_shots "-again"
              if [ -s "$OUT/$ID-watchdog-again.txt" ]; then echo "::error::$ID: $(cat "$OUT/$ID-watchdog-again.txt") (the one more run)."; fi
            fi
            grep -E "Test Case .*(passed|failed|skipped)|error:|Executed " "$OUT/$ID-tests.log" | tail -n 30 || true
            if [ "$STATUS" != 0 ]; then echo "::error::SpanShotsUITests on $ID ended with $STATUS (shots/span-app/$ID-tests.log)."; FAILED=1; fi
            # 1.4.2 (docs/R1_4_2_CONTRACT.md §3.9, §7.3, 0f-30): the dark photos, last on this device: the simulator in dark mode,
            # PaletteShotsUITests' testDarkPalettePhotos alone (TEST_RUNNER_TEGAKI_PALETTE_DARK=1; it skips itself otherwise, and
            # testPalettePhotos skips itself here), then light again at once. Photos only: a failure is a warning. The watchdog
            # stands beside it as beside run_shots (a simulator that stops answering would else hold the step to its limit);
            # its stop is a warning too (<id>-dark-watchdog.txt), never FAILED.
            if [ "$ID" = "ipad13" ] || [ "$ID" = "iphone" ]; then
              xcrun simctl ui "$UDID" appearance dark || true
              sleep 5
              DARK_STATUS=0
              TEST_RUNNER_TEGAKI_SPAN_SHOT_OUT="$OUT" TEST_RUNNER_TEGAKI_SPAN_SHOT_DEVICE="$ID" TEST_RUNNER_TEGAKI_PALETTE_DARK=1 xcodebuild \
                -project TegakiCalendar.xcodeproj \
                -scheme TegakiCalendar \
                -configuration Debug \
                -destination "platform=iOS Simulator,id=$UDID" \
                -derivedDataPath build/SpanAppData \
                -resultBundlePath "build/span-app-$ID-dark.xcresult" \
                -only-testing:TegakiCalendarUITests/PaletteShotsUITests/testDarkPalettePhotos \
                test-without-building > "$OUT/$ID-dark-tests.log" 2>&1 &
              DARKPID=$!
              watchdog "$DARKPID" "$OUT/$ID-dark-tests.log" "$OUT/$ID-dark-watchdog.txt" &
              DARKDOG=$!
              wait "$DARKPID" || DARK_STATUS=$?
              kill "$DARKDOG" 2>/dev/null || true
              wait "$DARKDOG" 2>/dev/null || true
              xcrun simctl ui "$UDID" appearance light || true
              grep -E "Test Case .*(passed|failed|skipped)|error:|Executed " "$OUT/$ID-dark-tests.log" | tail -n 5 || true
              if [ -s "$OUT/$ID-dark-watchdog.txt" ]; then echo "::warning::$ID: $(cat "$OUT/$ID-dark-watchdog.txt") (the dark palette photos, stopped)."; fi
              if [ "$DARK_STATUS" != 0 ]; then echo "::warning::$ID: the dark palette photos ended with $DARK_STATUS (shots/span-app/$ID-dark-tests.log)."; fi
              bash tools/ci/xcresult-app-output.sh "$OUT/$ID-dark-app-output.txt" "build/span-app-$ID-dark.xcresult" || true
            fi
            echo "$ID: $(find "$OUT" -maxdepth 1 -name "$ID-*.png" | wc -l | tr -d ' ') photos, $(( $(date +%s) - STARTED )) s with the boot"
            MINUTES=$(( ($(date +%s) - STARTED) / 60 + 2 ))
            xcrun simctl spawn "$UDID" log show --last "${MINUTES}m" --style compact --predicate 'process == "TegakiCalendar"' > "$OUT/$ID-log.txt" 2>&1 || true
            # 1.4 D0b (docs/M7D_CONTRACT.md §3.3 3, §3.8; docs/M7D.md, D0b): on the iOS 27 simulators `log show` gives
            # the app's NSLog lines as "<compose failure …>" (D0, run 44632524223: no `toolbar: paperArea=` line on any
            # device), so the log's reach is printed and warned (tools/ci/log-reach.sh), and the stdout and stderr
            # XCTest kept of the app the tests launched are taken out of the result bundles into <id>-app-output.txt
            # (tools/ci/xcresult-app-output.sh, best effort; NSLog writes its lines there too). Gate 3 reads
            # shots/span-app/lines/<id>.txt (frame=, the state).
            bash tools/ci/log-reach.sh "span-shots $ID (log show)" "$OUT/$ID-log.txt" 'toolbar: paperArea=' || true
            bash tools/ci/xcresult-app-output.sh "$OUT/$ID-app-output.txt" "build/span-app-$ID.xcresult" "build/span-app-$ID-again.xcresult" || true
            bash tools/ci/log-reach.sh "span-shots $ID (the app's output)" "$OUT/$ID-app-output.txt" 'toolbar: paperArea=' || true
            grep -h -E 'span shot: ' "$OUT/$ID-log.txt" "$OUT/$ID-app-output.txt" 2>/dev/null | awk '{ i = index($0, "span shot: "); if (i > 1) $0 = substr($0, i); print }' || true
            # 1.4.1 (§7.4): PaletteShotsUITests' lines (the photos are the lead's to compare; `ok=no` is a warning only) and the
            # app's `toolbar: palette=` lines (once each).
            if [ -s "$OUT/palette/lines-$ID.txt" ]; then
              cat "$OUT/palette/lines-$ID.txt"
              if grep -q ' ok=no' "$OUT/palette/lines-$ID.txt"; then echo "::warning::$ID: a palette photo does not show the edge it asked for (shots/span-app/palette/lines-$ID.txt)."; fi
            fi
            { grep -h -E 'toolbar: palette=' "$OUT/$ID-app-output.txt" 2>/dev/null || true; } | awk '{ i = index($0, "toolbar: palette="); if (i > 1) $0 = substr($0, i); if (!seen[$0]++) print }' | head -n 20
            find "$HOME/Library/Logs/DiagnosticReports" -name 'TegakiCalendar*' -mmin -15 -exec cp {} "$OUT/" \; 2>/dev/null || true
            if [ "$ID" = "iphone" ]; then
              echo "iphone=$UDID" >> "$GITHUB_OUTPUT"
            else
              xcrun simctl shutdown "$UDID" || true
            fi
          done
          ls -la "$OUT"
          exit "$FAILED"

      # 1.4 (docs/M7D_CONTRACT.md §3.2): the devices this job took are the table's ("Required simulators"): each line
      # "<id>: <name> | <runtime> (<build>)" of its env.txt has the table's name, on the runtime (name and build) that
      # "Required simulators" found for it, and every device of the table has a line (none means it was not found, and its
      # photos or tests are missing). A prefix fallback that landed on another device, or another runtime taken instead of
      # the table's (a newer one, or the iPhone Duo's iOS 27.2), fails the job here. The same lines in every job that boots
      # a simulator; only ENV_TXT differs.
      - name: The simulators used are the table's (1.4)
        if: ${{ !cancelled() && env.QUICK != 'true' }}
        timeout-minutes: 3
        env:
          ENV_TXT: shots/span-app/env.txt
        run: |
          set -euo pipefail
          python3 -I - "$RUNNER_TEMP/required-simulators.txt" "$ENV_TXT" <<'EOF'
          import re, sys
          table = [[p.strip() for p in line.rstrip("\n").split("|")] for line in open(sys.argv[1], encoding="utf-8") if line.strip()]
          try:
              resolved = {row[0]: row[2:] for row in (line.rstrip("\n").split("|") for line in open(sys.argv[1].replace(".txt", "-resolved.txt"), encoding="utf-8")) if len(row) == 4}
          except OSError:
              resolved = {}
          try:
              lines = open(sys.argv[2], encoding="utf-8").read().splitlines()
          except OSError as error:
              print("::error::%s could not be read (%s): the devices this job took are not known (docs/M7D_CONTRACT.md §3.2)." % (sys.argv[2], error))
              sys.exit(1)
          taken = {}
          for line in lines:
              m = re.fullmatch(r"([a-z0-9]+): (.+) \| (.+) \(([^()]*)\)", line)
              if m:
                  taken.setdefault(m.group(1), []).append(m.group(2, 3, 4))
          failed = False
          for ident, name, want in table:
              if ident not in taken:
                  print("::error::%s (%s): no line in %s, so it was not taken (docs/M7D_CONTRACT.md §3.2)." % (ident, name, sys.argv[2]))
                  failed = True
              for got, runtime, build in taken.get(ident, []):
                  if ident in resolved:
                      ok = got == name and [runtime, build] == resolved[ident]
                      where = "%s (%s)" % tuple(resolved[ident])
                  else:
                      ok = got == name and (runtime == "iOS " + want or runtime.startswith("iOS " + want + "."))
                      where = "iOS " + want
                  print("%s: %s | %s (%s): %s" % (ident, got, runtime, build, "the table's" if ok else "NOT the table's"))
                  if not ok:
                      print("::error::%s took %s on %s (%s), not the table's %s on %s (docs/M7D_CONTRACT.md §3.2)." % (ident, got, runtime, build, name, where))
                      failed = True
          sys.exit(1 if failed else 0)
          EOF

      # The neighbour ink's PDF (§3.11): the unit test writes the PDF of a joined week whose crossing stroke belongs to the
      # page before (TEGAKI_SPAN_SHOT_OUT), on the iPhone booted above; `sips` makes a PNG of its page (2,400 px).
      - name: The neighbour ink's PDF (ScreenPathsSpanTests)
        if: ${{ !cancelled() && steps.devices.outputs.iphone != '' }}
        timeout-minutes: 10
        run: |
          set -uo pipefail
          OUT="$PWD/shots/span-app"
          UDID="${{ steps.devices.outputs.iphone }}"
          mkdir -p "$OUT"
          rm -f "$OUT/span-pdf-neighbor-ink.pdf" "$OUT/span-pdf-neighbor-ink.png"
          STATUS=0
          TEST_RUNNER_TEGAKI_SPAN_SHOT_OUT="$OUT" xcodebuild \
            -project TegakiCalendar.xcodeproj \
            -scheme TegakiCalendar \
            -configuration Debug \
            -destination "platform=iOS Simulator,id=$UDID" \
            -derivedDataPath build/SpanAppData \
            -resultBundlePath build/span-app-pdf.xcresult \
            -only-testing:TegakiCalendarTests/ScreenPathsSpanTests/testPDFDrawsNeighborInkWithoutPrefixedNamesInThePage \
            -testLanguage ja \
            -testRegion JP \
            test-without-building > "$OUT/pdf-test.log" 2>&1 || STATUS=$?
          grep -E "Test Case .*(passed|failed|skipped)|error:|Executed " "$OUT/pdf-test.log" | tail -n 20 || true
          if [ "$STATUS" != 0 ]; then echo "::error::The neighbour ink's PDF test ended with $STATUS (shots/span-app/pdf-test.log)."; exit 1; fi
          if [ ! -s "$OUT/span-pdf-neighbor-ink.pdf" ]; then echo "::error::The test passed but wrote no span-pdf-neighbor-ink.pdf."; exit 1; fi
          if ! sips -s format png -Z 2400 "$OUT/span-pdf-neighbor-ink.pdf" --out "$OUT/span-pdf-neighbor-ink.png" > /dev/null; then
            echo "::error::sips could not make a PNG of span-pdf-neighbor-ink.pdf."
            exit 1
          fi
          sips -g pixelWidth -g pixelHeight "$OUT/span-pdf-neighbor-ink.png" | tail -n 2 || true

      # The gates (see the job's comment). The tools are built here (a job's first swiftc for macOS spends about 2 min on the
      # SDK's modules). The pairs and the margins come from the test's lines; their counts are checked against the plan's
      # (4 pairs, 30 margin photos), so a test that took fewer fails here too, and so are the week memo's photos (4: the
      # iPad Air 11-inch and the iPhone 17, single and band; PLAN_W §7.3).
      - name: The shift pairs and the old versions' margins (gates)
        if: ${{ !cancelled() }}
        timeout-minutes: 12
        run: |
          set -uo pipefail
          OUT="shots/span-app"
          TOOLS="$RUNNER_TEMP/shot-tools"
          LINES="$RUNNER_TEMP/span-app-lines.txt"
          RECORDS="$RUNNER_TEMP/span-margin-records.txt"
          mkdir -p "$TOOLS" "$OUT"
          FAILED=0
          if ! swiftc -O tools/shots/shift_pair.swift -o "$TOOLS/shift_pair"; then echo "::error::tools/shots/shift_pair.swift did not compile."; FAILED=1; fi
          if ! swiftc -O tools/shots/span_margin.swift -o "$TOOLS/span_margin"; then echo "::error::tools/shots/span_margin.swift did not compile."; FAILED=1; fi
          if ! swiftc -O tools/shots/shift_subpixel.swift -o "$TOOLS/shift_subpixel"; then echo "::error::tools/shots/shift_subpixel.swift did not compile."; FAILED=1; fi
          # S6: shift_pair's self-test (it ran in the prototype's job span-shots until S6, C5-R3).
          S=0
          SELF="$("$TOOLS/shift_pair" --self-test)" || S=$?
          echo "shift_pair: $(printf '%s\n' "$SELF" | tail -n 1)"
          if [ "$S" != 0 ]; then printf '%s\n' "$SELF"; echo "::error::tools/shots/shift_pair.swift's self-test failed."; FAILED=1; fi
          S=0
          SELF="$("$TOOLS/shift_subpixel" --self-test)" || S=$?
          echo "shift_subpixel: $(printf '%s\n' "$SELF" | tail -n 1)"
          if [ "$S" != 0 ]; then printf '%s\n' "$SELF"; echo "::error::tools/shots/shift_subpixel.swift's self-test failed."; FAILED=1; fi
          # The margin counts below are all 0 when the old version's paper cuts the stroke, so a span_margin that always
          # answered 0 would pass unseen: its self-test (a stroke 20 px into the margin is counted, among 43 cases) is
          # the positive check (final critic C2F-1).
          S=0
          SELF="$("$TOOLS/span_margin" --self-test)" || S=$?
          echo "span_margin: $(printf '%s\n' "$SELF" | tail -n 1)"
          if [ "$S" != 0 ]; then printf '%s\n' "$SELF"; echo "::error::tools/shots/span_margin.swift's self-test failed."; FAILED=1; fi
          : > "$LINES"
          for F in "$OUT"/lines/*.txt; do
            [ -f "$F" ] && cat "$F" >> "$LINES"
          done
          set -f   # the lines are split on spaces below; none of their words is a pattern
          value() {  # value <key> <line>: the value of <key>=… in the line, or nothing
            local T
            for T in $2; do
              case "$T" in "$1"=*) echo "${T#*=}"; return 0 ;; esac
            done
            echo ""
          }
          # The pairs before and after a shift. shift_pair first (no strong pixel below the all-day band); when it finds some,
          # shift_subpixel tells a re-drawing less than a pixel away (a shift places the band again by a page width that is
          # rarely a whole number of pixels, run 43596500507) from a move: at most $RESIDUAL pixels it cannot explain (6, 31
          # and 26 in that run: glyph stems drawn again) pass with a warning, more fail.
          RESIDUAL=100
          : > "$OUT/shift-pairs.txt"
          PAIRS=0
          while IFS= read -r LINE; do
            DEVICE="$(value device "$LINE")"; KIND="$(value kind "$LINE")"
            BEFORE="$(value before "$LINE")"; AFTER="$(value after "$LINE")"
            STRICT="$(value strict "$LINE")"; LOOSE="$(value loose "$LINE")"
            BAND="$(value band "$LINE")"; TITLE="$(value title "$LINE")"; RELEASED="$(value released "$LINE")"
            PAIRS=$((PAIRS + 1))
            S=0
            RESULT="$("$TOOLS/shift_pair" "$OUT/$BEFORE" "$OUT/$AFTER" --exclude-rows "$STRICT" --max-strong 0)" || S=$?
            echo "shift pair $DEVICE $KIND below the all-day band (rows $STRICT left out; released by $RELEASED): $RESULT" | tee -a "$OUT/shift-pairs.txt"
            if [ "$S" != 0 ]; then
              # Strong pixels: a re-drawing at another sub-pixel phase (tools/shots/shift_subpixel.swift's comment), or a move.
              S=0
              RESULT="$("$TOOLS/shift_subpixel" "$OUT/$BEFORE" "$OUT/$AFTER" --exclude-rows "$STRICT" --max-residual "$RESIDUAL")" || S=$?
              echo "shift pair $DEVICE $KIND below the all-day band, sub-pixel: $RESULT" | tee -a "$OUT/shift-pairs.txt"
              if [ "$S" != 0 ]; then
                echo "::error::the shift pair $DEVICE $KIND differs below the all-day band by more than a sub-pixel re-drawing: $RESULT"
                FAILED=1
              else
                echo "::warning::the shift pair $DEVICE $KIND differs below the all-day band only by a re-drawing less than a pixel away (strong pixels at the edges of lines, boxes and text; at most $RESIDUAL left): $RESULT"
              fi
            fi
            S=0
            RESULT="$("$TOOLS/shift_pair" "$OUT/$BEFORE" "$OUT/$AFTER" --exclude-rows "$LOOSE" --max-strong 0)" || S=$?
            echo "shift pair $DEVICE $KIND with the heading (rows $LOOSE left out): $RESULT" | tee -a "$OUT/shift-pairs.txt"
            if [ "$S" != 0 ]; then
              S=0
              RESULT="$("$TOOLS/shift_subpixel" "$OUT/$BEFORE" "$OUT/$AFTER" --exclude-rows "$LOOSE" --max-residual "$RESIDUAL")" || S=$?
              echo "shift pair $DEVICE $KIND with the heading, sub-pixel: $RESULT" | tee -a "$OUT/shift-pairs.txt"
              if [ "$S" != 0 ]; then echo "::warning::the shift pair $DEVICE $KIND differs in the heading or the all-day band (a warning only, C3-m3): $RESULT"; fi
            fi
            if [ "$BAND" != same ]; then echo "::warning::the shift pair $DEVICE $KIND: the canvas moved with the shift (the all-day band's lanes packed anew?)."; fi
            if [ "$TITLE" != same ]; then echo "::warning::the shift pair $DEVICE $KIND: the page's title changed with the shift."; fi
          done < <(grep '^span shift pair: ' "$LINES" || true)
          if [ "$PAIRS" != 4 ]; then echo "::error::$PAIRS shift pairs, 4 expected (the iPad Air 11-inch and the iPhone 17, week and day)."; FAILED=1; fi
          # The old versions' margins: each photo counted, then each single photo's line with its control's count.
          : > "$RECORDS"
          SHOTS=0
          while IFS= read -r LINE; do
            DEVICE="$(value device "$LINE")"; KIND="$(value kind "$LINE")"; ORIENT="$(value orientation "$LINE")"
            VARIANT="$(value variant "$LINE")"; FILE="$(value file "$LINE")"; FRAME="$(value frame "$LINE")"
            HOW="$(value photo "$LINE")"; TURNED="$(value turned "$LINE")"
            SHOTS=$((SHOTS + 1))
            S=0
            RESULT="$("$TOOLS/span_margin" "$OUT/$FILE" --window "$(value window "$LINE")" --frame "$FRAME" \
              --zoom "$(value zoom "$LINE")" --ox "$(value ox "$LINE")" --paper "$(value paper "$LINE")")" || S=$?
            echo "$FILE: $RESULT"
            if [ "$S" != 0 ]; then echo "::error::the margins of $FILE could not be counted: $RESULT"; FAILED=1; continue; fi
            echo "$DEVICE $KIND $ORIENT $VARIANT $(value left "$RESULT") $(value right "$RESULT") $(value cols "$RESULT") $FRAME ${TURNED:--} ${HOW:--}" >> "$RECORDS"
          done < <(grep '^span margin shot: ' "$LINES" || true)
          : > "$OUT/span-margin.txt"
          while read -r DEVICE KIND ORIENT VARIANT LEFT RIGHT COLS FRAME TURNED HOW; do
            [ "$VARIANT" = single ] || continue
            CONTROL="$(awk -v d="$DEVICE" -v k="$KIND" -v o="$ORIENT" '$1 == d && $2 == k && $3 == o && $4 == "control" { print $5 " " $6; exit }' "$RECORDS")"
            CL="${CONTROL%% *}"; CR="${CONTROL##* }"
            NOTE=""
            if [ "$TURNED" = no ]; then NOTE=" (the screen did not turn: a portrait count)"; fi
            echo "span margin: $DEVICE $KIND $ORIENT left=$LEFT right=$RIGHT cols=$COLS frame=$FRAME side=left control=${CL:-?},${CR:-?} photo=$HOW$NOTE" | tee -a "$OUT/span-margin.txt"
            if [ -z "$CONTROL" ]; then
              echo "::error::no control photo for $DEVICE $KIND $ORIENT."
              FAILED=1
            elif [ "$CL" != 0 ] || [ "$CR" != 0 ]; then
              echo "::error::the control of $DEVICE $KIND $ORIENT counts left=$CL right=$CR, not 0: then a count does not tell the strokes from the screen (C3-m4)."
              FAILED=1
            fi
            if [ "$RIGHT" != 0 ]; then echo "::warning::$DEVICE $KIND $ORIENT: $RIGHT pixels in the right margin; the crossing demo overflows on the left only (ScreenshotModeSpanTests)."; fi
          done < "$RECORDS"
          if [ "$SHOTS" != 30 ]; then echo "::error::$SHOTS margin photos, 30 expected (the three iPads 8 each, the iPhone 6)."; FAILED=1; fi
          MEMO="$({ find "$OUT" -maxdepth 1 -name '*-portrait-week-memo-*.png' 2>/dev/null || true; } | wc -l | tr -d ' ')"
          echo "week memo photos: $MEMO"
          if [ "$MEMO" != 4 ]; then echo "::error::$MEMO week memo photos, 4 expected (the iPad Air 11-inch and the iPhone 17, single and band)."; FAILED=1; fi
          exit "$FAILED"

      # 1.4 D1d (docs/M7D.md, "D1 の残りに足す"): the handwriting of the photos above (shots/span-app, not its lang/ folder),
      # a warning only, as in ui-tests: tools/shots/xcui_ink.py and tools/shots/ink_check.swift against the
      # "span-shots-app/" lines of tools/shots/ink_ref_xcui.tsv (run 44676125566 attempt 1, image 20261104.0337.1), with
      # shots/span-app/ink-xcui.tsv in the artifact. Never fails the job. After the gates' three swiftc, this one is short.
      - name: The span shots' handwriting (a warning only, 1.4 D1d)
        if: ${{ !cancelled() }}
        continue-on-error: true
        timeout-minutes: 6
        run: |
          set -uo pipefail
          TOOL="$RUNNER_TEMP/xcui-ink"
          mkdir -p "$TOOL"
          if ! ls shots/span-app/*.png > /dev/null 2>&1; then
            echo "No photo in shots/span-app to check."
            exit 0
          fi
          if ! swiftc -O tools/shots/ink_check.swift -o "$TOOL/ink_check" > "$TOOL/build.log" 2>&1; then
            cat "$TOOL/build.log" || true
            echo "::warning::tools/shots/ink_check.swift did not compile: the span shots' handwriting is not checked (docs/M7D.md, D1d)."
            exit 0
          fi
          python3 -I tools/shots/xcui_ink.py check --ink "$TOOL/ink_check" --ref tools/shots/ink_ref_xcui.tsv \
            --prefix span-shots-app/ --folder shots/span-app --out shots/span-app/ink-xcui.tsv --label "span-shots-app" || true
          exit 0

      # overwrite: a re-run of this job (gh run rerun --failed) replaces the photos of the attempt before.
      - name: Upload the span shots of the app
        if: always()
        timeout-minutes: 15
        uses: actions/upload-artifact@v4
        with:
          name: span-shots-app
          # 1.4.1 (§7.4): the palette photos are an artifact of their own (palette-shots, below).
          path: |
            shots/span-app
            !shots/span-app/palette
          retention-days: 7
          if-no-files-found: warn
          overwrite: true

      # 1.4.1 (docs/R1_4_1_CONTRACT.md §7.4, 0e-24): PaletteShotsUITests' photos and lines (kept 7 days; outside J-4 and
      # ja-baseline.yml, §7.1). The lead compares them by eye and shows them on the confirmation page.
      - name: Upload the palette photos (1.4.1)
        if: always()
        timeout-minutes: 10
        uses: actions/upload-artifact@v4
        with:
          name: palette-shots
          path: shots/span-app/palette
          retention-days: 7
          if-no-files-found: warn
          overwrite: true

      # C3-m1: on r13 and the integration branches only. The languages of l10n-shots and Japanese, each with its region's
      # holidays and week start; the N-8 text from the string catalogue (TEGAKI_SPAN_SHOT_STRINGS). Fails when the test fails.
      # 1.4 (docs/M7D_CONTRACT.md §3.6): on r14 too, so D0's run on r14 has the artifact span-shots-app-languages that the
      # map of the SDK's differences compares with run 44474759145's. 1.4.1 and 1.4.2 (docs/R1_4_2_CONTRACT.md §6.5): on r141
      # and r142 too. 1.4.3 (docs/R1_4_3_CONTRACT.md §12.1): on r143 too.
      - name: Language photos (iPhone 17; r13, r13-s5c*, r14, r141, r142 and r143 only)
        id: languages
        if: ${{ !cancelled() && steps.devices.outputs.iphone != '' && (github.ref_name == 'r13' || startsWith(github.ref_name, 'r13-s5c') || github.ref_name == 'r14' || github.ref_name == 'r141' || github.ref_name == 'r142' || github.ref_name == 'r143') }}
        timeout-minutes: 25
        run: |
          set -uo pipefail
          OUT="$PWD/shots/span-app"
          UDID="${{ steps.devices.outputs.iphone }}"
          mkdir -p "$OUT/lang"
          STARTED="$(date +%s)"
          STATUS=0
          TEST_RUNNER_TEGAKI_SPAN_SHOT_OUT="$OUT" TEST_RUNNER_TEGAKI_SPAN_SHOT_DEVICE=iphone TEST_RUNNER_TEGAKI_SPAN_SHOT_LANGUAGES=1 \
          TEST_RUNNER_TEGAKI_SPAN_SHOT_STRINGS="$PWD/Sources/TegakiCalendar/Resources/Localizable.xcstrings" xcodebuild \
            -project TegakiCalendar.xcodeproj \
            -scheme TegakiCalendar \
            -configuration Debug \
            -destination "platform=iOS Simulator,id=$UDID" \
            -derivedDataPath build/SpanAppData \
            -resultBundlePath build/span-app-languages.xcresult \
            -only-testing:TegakiCalendarUITests/SpanShotsUITests/testLanguages \
            test-without-building > "$OUT/lang/languages-tests.log" 2>&1 || STATUS=$?
          grep -E "Test Case .*(passed|failed|skipped)|error:|Executed " "$OUT/lang/languages-tests.log" | tail -n 30 || true
          MINUTES=$(( ($(date +%s) - STARTED) / 60 + 2 ))
          xcrun simctl spawn "$UDID" log show --last "${MINUTES}m" --style compact --predicate 'process == "TegakiCalendar"' > "$OUT/lang/languages-log.txt" 2>&1 || true
          # 1.4 D0b (docs/M7D.md, D0b): the log's reach, and the app's stdout and stderr out of the result bundle, as in
          # "Shots on four devices (SpanShotsUITests)"; the keys the app did not find are read from both.
          bash tools/ci/log-reach.sh "language photos (log show)" "$OUT/lang/languages-log.txt" 'l10n: ui=' || true
          bash tools/ci/xcresult-app-output.sh "$OUT/lang/languages-app-output.txt" build/span-app-languages.xcresult || true
          bash tools/ci/log-reach.sh "language photos (the app's output)" "$OUT/lang/languages-app-output.txt" 'l10n: ui=' || true
          MISSING="$({ grep -h 'l10n: missing' "$OUT/lang/languages-log.txt" "$OUT/lang/languages-app-output.txt" 2>/dev/null || true; } | sed 's/.*l10n: missing //' | sort -u | wc -l | tr -d ' ')"
          { grep -h 'l10n: missing' "$OUT/lang/languages-log.txt" "$OUT/lang/languages-app-output.txt" 2>/dev/null || true; } | sed 's/.*l10n: missing //' | sort -u
          echo "$MISSING" > "$OUT/lang/l10n-missing.txt"
          echo "keys the app did not find (l10n: missing): $MISSING"
          if [ "$MISSING" != 0 ]; then echo "::warning::$MISSING keys the app did not find in the language photos (l10n: missing)."; fi
          for L in ja en zh-Hans zh-Hant ko fr de es it pt-BR; do
            N="$({ find "$OUT/lang/$L" -name '*.png' 2>/dev/null || true; } | wc -l | tr -d ' ')"
            echo "$L: $N photos"
            if [ "$N" != 6 ]; then echo "::warning::$L: $N photos, 6 expected."; fi
          done
          if [ "$STATUS" != 0 ]; then echo "::error::testLanguages ended with $STATUS (shots/span-app/lang/languages-tests.log)."; exit 1; fi

      - name: Upload the language photos
        if: ${{ always() && steps.languages.outcome != 'skipped' }}
        timeout-minutes: 10
        uses: actions/upload-artifact@v4
        with:
          name: span-shots-app-languages
          path: shots/span-app/lang
          retention-days: 7
          if-no-files-found: warn
          overwrite: true

      # The job's summary (GITHUB_STEP_SUMMARY): the margins' lines as a table, the pairs, the photos per language and the
      # missing keys. Writes what there is; never fails.
      - name: Summary
        if: always()
        timeout-minutes: 3
        continue-on-error: true
        run: |
          set -uo pipefail
          OUT="shots/span-app"
          SUMMARY="${GITHUB_STEP_SUMMARY:-/dev/null}"
          count() {  # count <folder> <pattern>: the PNGs
            { find "$1" -maxdepth 1 -name "$2" 2>/dev/null || true; } | wc -l | tr -d ' '
          }
          {
            echo "### span-shots (1.3 app)"
            echo ""
            BANDS=$(( $(count "$OUT" '*-boundary.png') + $(count "$OUT" '*-overview.png') + $(count "$OUT" '*-sunday.png') ))
            echo "Photos: bands $BANDS (21 expected), pairs $(count "$OUT" '*-shift-*.png') (8), margins $(count "$OUT" '*-margin-*.png') (30), week memo $(count "$OUT" '*-portrait-week-memo-*.png') (4), the neighbour ink's PDF $(count "$OUT" 'span-pdf-neighbor-ink.png') (1)."
            echo ""
            echo "1.4.1's and 1.4.2's palette photos (artifact palette-shots): $(count "$OUT/palette" '*.png') (33 expected: the 13-inch iPad 21, the iPad mini 5, the iPhone 17 7; 1.4.1's 22 + 1.4.2's 11: the colour panel 6 + 1 + 1, the dots 1, dark 2); \`ok=no\` lines: $({ cat "$OUT"/palette/lines-*.txt 2>/dev/null || true; } | grep -c ' ok=no' || true)."
            echo ""
            echo "#### The old versions' margins (pixels beside the page that are not the desk; the control must be 0,0)"
            echo ""
            echo "| device | page | orientation | left | right | control | columns | canvas (pt) | photo |"
            echo "| --- | --- | --- | --- | --- | --- | --- | --- | --- |"
            if [ -s "$OUT/span-margin.txt" ]; then
              awk '{ v["device"] = $3; v["kind"] = $4; v["orientation"] = $5
                     for (i = 6; i <= NF; i++) { n = index($i, "="); if (n > 1) v[substr($i, 1, n - 1)] = substr($i, n + 1) }
                     printf "| %s | %s | %s | %s | %s | %s | %s | %s | %s |\n", v["device"], v["kind"], v["orientation"], v["left"], v["right"], v["control"], v["cols"], v["frame"], v["photo"] }' "$OUT/span-margin.txt"
            else
              echo "| (none) | | | | | | | | |"
            fi
            echo ""
            echo "#### Shift pairs"
            echo ""
            if [ -s "$OUT/shift-pairs.txt" ]; then sed 's/^/- /' "$OUT/shift-pairs.txt"; else echo "- (none)"; fi
            echo ""
            echo "#### Languages (r13, r13-s5c*, r14, r141, r142 and r143 only)"
            echo ""
            if [ -d "$OUT/lang" ]; then
              echo "| language | photos (6 expected) |"
              echo "| --- | --- |"
              for L in ja en zh-Hans zh-Hant ko fr de es it pt-BR; do
                echo "| $L | $(count "$OUT/lang/$L" '*.png') |"
              done
              echo ""
              echo "- keys the app did not find (\`l10n: missing\`): $(cat "$OUT/lang/l10n-missing.txt" 2>/dev/null || echo '?') (0 expected)"
              echo "- **To look at by eye**: stage 2's notice N-8 in the 10 photos \`<language>/iphone-portrait-stage-two.png\` (artifact span-shots-app-languages) must end with the string table's last word, not with \"…\": XCUITest reads the whole label even when the toast cuts the text (review C2-SHOTS-1; StageTwoNoticeSpanTests measures the lines). The test's lines with the toast's frame:"
              grep -h 'iphone-portrait-stage-two' "$OUT"/lines/*.txt 2>/dev/null | sed 's/^/  - /' || true
            else
              echo "- not taken on this branch"
            fi
          } >> "$SUMMARY"

      # 1.4 D1d (docs/M7D.md, 実行機の打ち切り): only when this job is cancelled (by hand, by its time limit, or by the runner's
      # side with nothing but "The operation was canceled.", four times on xcode-27 on 11/20), tools/ci/cancel-diag.sh prints
      # the load, the memory, the 15 busiest processes and, from the runner's own _diag folder, only its lines about a
      # cancel, a shutdown, a lost connection, a time-out or a signal (200 at most; the folder is never uploaded or printed
      # whole, nothing is written to disk: the repository is public). Not on success or failure; never fails the job. The
      # same lines at the end of every job on xcode-27 of build.yml and duo.yml.
      - name: Diagnostics of a cancelled job (1.4 D1d)
        if: cancelled()
        continue-on-error: true
        timeout-minutes: 3
        run: |
          if [ -f tools/ci/cancel-diag.sh ]; then
            bash tools/ci/cancel-diag.sh || true
          else
            echo "tools/ci/cancel-diag.sh is not here (cancelled before the checkout?)."
            uptime || true
          fi

  # 1.4.3 D1b (docs/R1_4_3_CONTRACT.md §12.1, §12.3, §12.4, §6.5, 0g-31, 0g-40): a seventh job, span-shots-my ("span-shots-my
  # (1.4.3 months)", the name kept with the years), photographs the joined months and, since D1y, the joined years of the
  # normal app, outside J-4 and ja-baseline.yml (§12.2). SpanMonthYearShotsUITests' ten tests of this job (testMonthBands,
  # testMonthFit, testMonthShiftPair, testMonthOldVersion, testMonthGuides, testMonthDots, and D1y's testYearBands,
  # testYearFit, testYearOldVersion, testYearGuides; its testMonthForms and testMonthZoom are the sample branch r143-alt's,
  # §12.5, and do not run here) on the four devices of "Required simulators" by their UDIDs (iphone69 is the
  # iPhone 18 Pro Max), one at a time: booted, light, the status bar at 9:41, 60 s for the banner (docs/M6.md §5.1), the tests
  # with span-shots-app's photo watcher (a turned screen is `simctl io screenshot`, the protocol the tests hold:
  # SpanMonthYearShotsUITests.simulatorPhoto) and its watchdog, and one more run after a new boot when the simulator failed.
  # 46 photos. The month's 24, all in the month 2026-10 of the plain demo (`--screenshot-span on`; §12.4's 26 less the three
  # "before 等倍", which are the turned overviews): portrait the overview and the focus month's left boundary in the middle
  # with the crossing sample (`--screenshot-offset-x -0.5 --screenshot-span-crossing all`) on the four devices (8); turned
  # the overview (3) and 等倍 (`--screenshot-zoom fit`, 3) on the 13-inch iPad, the iPad Air 11-inch and the 6.9-inch
  # iPhone; the iPad Air 11-inch's pair before and after a shift (`--screenshot-span-shift`, 2); the old versions' one page
  # (`--screenshot-single-page --screenshot-span-crossing all`) of the 6.9-inch iPhone and the 13-inch iPad (2); the guide's
  # month card for one finger in ja, de, fr and the doubled pseudo-language, and ja's for two fingers (「指でも書く」 on, an
  # iPhone's default; review CI-1), on the 6.9-inch iPhone (5); the memo paper's dots
  # at the boundary on the 13-inch iPad (`--screenshot-memo-paper dots`, 1). The year's 22 (D1y; §12.4, §5.3, §5.4), all on
  # the year page of 2026 (`--screenshot-page year`) of the same demo: portrait the overview and 2026's left boundary in the
  # middle with the crossing sample (the 20th's two lines from 2025's December into 2026) on the four devices (8); turned
  # the overview on the 13-inch iPad, the iPad Air 11-inch and the 6.9-inch iPhone (3; the iPhone's is the cap of 3 years,
  # P-B6 イ, opened two rows above today's row); 等倍 portrait on the four devices (4; the iPhone's open = fit) and turned on
  # the same three (3); the old versions' one page of the 6.9-inch iPhone and the 13-inch iPad (2); the guide's year card in
  # ja for one finger and for two on the 6.9-inch iPhone (2). Before the bands of each orientation the one page's month, and
  # the one page's year, at the same place (`--screenshot-span off`) is launched without a photo (7 launches each; 59
  # launches in all, the month's 30 and the year's 29), and each band's line `span-my paper:` sets its canvas frame beside
  # that one page's (gate 3, §12.3: the same paper area; a difference fails the test and this job's gate step; 22 lines, 11
  # a kind). Then the joined month's PDF (PDFMonthYearTests, the memo strokes coming into a month from its neighbours:
  # `span-my-pdf-month.pdf`, and its PNG by `sips`) on the iPhone booted last; no PDF of a year (§12.4 has none).
  # Into the artifact span-shots-my (7 days): the photos, photos.txt (each name expected with its pixel size or "missing",
  # any other PNG, and the line "span-shots-my: N photos (46 expected) and M PDFs (1 expected)"), lines.txt (the tests'
  # `span-my shots:` lines: the window, the canvas's frame, the probe's zoom, ox, oy, the paper's top in lu, one page across
  # in pt, span.state and the probe; `span cap:` the window's pages and top; `span-my one page:` and `span-my paper:`;
  # `span-my shift pair:`), shift-pair.txt (tools/shots/shift_pair.swift without the rows above the canvas: the status bar,
  # the heading and the sticky month row with its label, open question 17; shift_subpixel when it finds strong pixels),
  # paper-area.txt (each device's `toolbar: paperArea=` values of the app's output, for gate 3's sets), env.txt (the commit,
  # Xcode, the image, the runtimes and the four devices) and each device's test log and app output. The photos are the
  # lead's to look at (§12.4, §14.1 D1b, D1y): the photos' step is continue-on-error (a warning), the shift pair and the
  # counts are warnings; only a joined month or year whose paper area is not the one page's (`same=no`) fails the job
  # (§12.3: stop).
  # Not on the quick lanes (the same `if:` as span-shots-app). No new data or test is frozen here.
  # The run's length and the limits (two rules of §12.1). macOS runs 5 jobs at once and the run had 6: with a seventh
  # queued at once two would wait, and one of the long ones waiting (Build and test 100, Blank paper 97, span-shots-app
  # 108 min in V's run 45721608435) would make the run about 40 min longer. So this job `needs` compat-v1.0: it is queued
  # only after the six have had their runners. compat-v1.0 is the shortest (17–25 min in 1.4.2's runs) and the one that
  # waited in 3 of 1.4.2's 4 runs with every job (45721608435, 45311803365, 45625473748; span-shots-app in 45562716942):
  # then it starts when the UI tests end (37–48 min, about 6 more with SpanMonthYearUITests) and this job about 60 min into
  # the run; otherwise this job takes the next free runner, at about 40 [estimate: a free runner goes to the job queued
  # first]. compat-v1.0 rarely fails (its simulator steps are two app test classes); when it does, this job is skipped and
  # `gh run rerun --failed` runs it after compat-v1.0. A needs on ui-tests would run these photos again with every rerun
  # of a flaky UI test. D1y: in 1.4.3's runs since (D1a's 46102639450, D1b's 46119423355 and 46129477127) the UI tests
  # waited instead and took compat-v1.0's runner at its end (15–22 min), so this job takes the next free runner: Localized
  # shots' at 52 in both D1b runs (the UI tests' at 54 in D1a's; in V's this job would have started at 62, in D0's
  # 46066812567 at 45). In both D1b runs a runner freed by a cancel started it sooner (at 20 and 48).
  # The job's time. D1b's runs measured the month alone (46119423355 and 46129477127's attempt 1): the job 72.8 and 58.9
  # min, its photos' step 68.4 and 53.8 (the four first boots with the banner 40.5 and 31.1 of it, 4.5–12.6 min each, the
  # iPad mini on iOS 27.0 and the iPad Air 11-inch the longest; the tests 17.1 and 13.7, 34 and 27 s a launch; xcodebuild's
  # start, the app output and the shutdowns 9–11), the setup and the build 2.7–3.4, the PDF 0.7–2.1, the gates and the
  # upload under 1. D1y's 29 launches are the month's kinds of test on the same devices (no boot and no xcodebuild more):
  # about 13–19 more [estimate: each year test as long as the month's of its kind on its device in those runs, 13–16, and
  # up to a fifth more for the year's pages]. So the photos' step is about 67–88 min and the job about 72–93. One device's
  # one more run adds about 22–39 (10 of silence, 1 to end xcodebuild, 5–13 to boot again with the banner, 1.5–3 for
  # xcodebuild's start, its month's and year's tests 4–11.5, the 6.9-inch iPhone's the longest). The photos' step stops at
  # 140 (110 until D1y; its part 67–88, 89–127 with one more run) and the job at 160 (140 until D1y; ≥ 25 over the slowest
  # with one more run, 134, and ≥ 10 after a step stopped at 140 with the build before it and the PDF, the gates and the
  # upload after it). The run: this job starts at about 45–62 (above; 53 the middle) and ends at about 118–155 min against
  # V's 105–108 [estimate], 10–50 longer, about 28–31 at the middle (the month alone about 11–14). At the middle that is
  # §12.1's edge of 30, so the levers stay the lead's, by a run's measure (open question 6 of D1y's plan, in this order):
  # (a) the four portrait one page's years' probe launches (about 2 min; gate 3 then sets those photos'
  # `toolbar: paperArea=` beside blank-paper's one page's year of the same run; the three turned stay), (b) the 6.9-inch
  # iPhone's portrait year at 等倍 (open = fit there, its overview's look; under 1 min), (c) the year's ja two-finger card
  # (under 1 min); then D1b's for the month: its one page's probe launches (7, about 4 min) and the guides' de and fr (2
  # launches). About 8 min together: the four first boots (31–41 min of the step) and the wait for a runner are the larger
  # parts. Each lever takes photos or launches out of SpanMonthYearShotsUITests and this job's counts together.
  span-shots-my:
    name: span-shots-my (1.4.3 months)
    needs: compat-v1-0
    if: ${{ !(github.ref_name == 'r13-quick' || startsWith(github.ref_name, 'r13-q-') || github.ref_name == 'r14-quick' || startsWith(github.ref_name, 'r14-q-') || github.ref_name == 'r141-quick' || startsWith(github.ref_name, 'r141-q-') || github.ref_name == 'r142-quick' || startsWith(github.ref_name, 'r142-q-') || startsWith(github.ref_name, 'r142-w-') || github.ref_name == 'r143-quick' || startsWith(github.ref_name, 'r143-q-') || startsWith(github.ref_name, 'r143-w-')) }}
    # 1.4 (docs/M7D_CONTRACT.md §3.1, §3.3 1, 0d-2): the image with Xcode 27 (macos-26 and macos-15 do not get it).
    runs-on: xcode-27
    timeout-minutes: 160
    env:
      HOMEBREW_NO_AUTO_UPDATE: "1"
      HOMEBREW_NO_INSTALL_CLEANUP: "1"
      NSUnbufferedIO: "YES"

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        timeout-minutes: 5

      # 1.4 (docs/M7D_CONTRACT.md §3.1, 0d-1): Xcode 27.2, chosen by what each candidate says it is, never by its path.
      # Every /Applications/Xcode_27.2*.app is read with `xcodebuild -version` (DEVELOPER_DIR set to it); one whose version is
      # 27.2 or 27.2.x and whose build ends in a digit is a release (a beta's build ends in a lower-case letter, as 27.3
      # beta's 27C5020n; the rolling-out image 20261119 gives that beta aliases named like a release, §3.1), and the newest
      # release is selected. None fails the job: until 1.3 this step chose Xcode 26.6 only when it was there and otherwise
      # went on with the image's default Xcode, unseen. Then `sudo xcodebuild -runFirstLaunch` (harmless when it has run).
      # The same lines in every job on xcode-27 (build.yml, ja-baseline.yml, store-shots.yml, testflight.yml, duo.yml).
      - name: Select Xcode 27.2
        # 1.4: 5 → 10 for -runFirstLaunch.
        timeout-minutes: 10
        run: |
          set -euo pipefail
          XCODE="$(python3 -I -c '
          import glob, os, re, subprocess, sys
          def key(version, build):                               # (27, 2, 0), then the build: digits as numbers
              numbers = tuple((int(p) for p in version.split("."))) + (0, 0, 0)
              return numbers[:3], tuple((0, int(t)) if t.isdigit() else (1, t) for t in re.findall(r"[0-9]+|[^0-9]+", build))
          best = None
          seen = {}
          for app in sorted(glob.glob("/Applications/Xcode_27.2*.app")):
              real = os.path.realpath(app)
              if real in seen:
                  print("%s: the same Xcode as %s" % (app, seen[real]), file=sys.stderr)
                  continue
              seen[real] = app
              env = dict(os.environ, DEVELOPER_DIR=os.path.join(real, "Contents", "Developer"))
              try:
                  out = subprocess.run(["xcodebuild", "-version"], env=env, capture_output=True, text=True, timeout=300).stdout
              except Exception as error:
                  print("%s: xcodebuild -version failed (%s)" % (app, error), file=sys.stderr)
                  continue
              version = re.search(r"^Xcode ([0-9.]+)$", out, re.M)
              build = re.search(r"^Build version ([0-9A-Za-z]+)$", out, re.M)
              version = version.group(1) if version else "?"
              build = build.group(1) if build else "?"
              release = re.fullmatch(r"27\.2(\.[0-9]+)?", version) is not None and re.search(r"[0-9]$", build) is not None
              print("%s (%s): Xcode %s, build %s%s" % (app, real, version, build, ": a release of 27.2" if release else ": not a release of 27.2"), file=sys.stderr)
              if release and (best is None or key(version, build) > best[0]):
                  best = (key(version, build), real)
          print(best[1] if best else "")
          ')"
          if [ -z "$XCODE" ]; then
            echo "::error::No release of Xcode 27.2 in /Applications (xcodebuild -version 27.2 or 27.2.x, its build ending in a digit; docs/M7D_CONTRACT.md §3.1). The job does not go on with another Xcode."
            exit 1
          fi
          echo "Selected: $XCODE"
          sudo xcode-select -s "$XCODE"
          sudo xcodebuild -runFirstLaunch
          xcode-select -p
          xcodebuild -version
          echo "runner image: ${ImageOS:-?} ${ImageVersion:-?}"

      # 1.4 (docs/M7D_CONTRACT.md §3.2, 0d-3): the simulators of the table that this job uses must be on the runner, each
      # under its exact name on its runtime (iOS 27.2; the iPad mini (A17 Pro) is on iOS 27.0 only; the iPhone Duo on the
      # Duo's iOS 27.2 runtime). One that is missing fails the job here: until 1.3 a missing device was a warning ("No
      # simulator for …; skipping") and the job stayed green, so all the 6.9-inch photos could be gone unseen. Each one's
      # UDID is an output of this step (steps.required.outputs.<id>); the table and the runtime (name and build) each one
      # resolved to go to $RUNNER_TEMP for "The simulators used are the table's" after the photos, and the UDIDs to
      # $RUNNER_TEMP/required-simulators-udids.txt, which the pickers of the later steps take first (so they boot the very
      # devices checked here). When the name is on two runtimes of that version (iOS 27.2 has two sets, the usual devices'
      # and the iPhone Duo's, §3.1), every other device is taken from the runtime with no iPhone Duo and the iPhone Duo from
      # the runtime of iPhone Duos only; a warning only when nothing tells the runtimes apart. The same lines in every job
      # that boots a simulator; only the table differs.
      - name: Required simulators (1.4)
        id: required
        timeout-minutes: 5
        env:
          # <id>|<exact name>|<runtime version> (docs/M7D_CONTRACT.md §3.2)
          REQUIRED: |
            ipad13|iPad Pro 13-inch (M5)|27.2
            ipad11|iPad Air 11-inch (M4)|27.2
            ipadmini|iPad mini (A17 Pro)|27.0
            iphone69|iPhone 18 Pro Max|27.2
        run: |
          set -euo pipefail
          printf '%s\n' "$REQUIRED" | grep -v '^[[:space:]]*$' > "$RUNNER_TEMP/required-simulators.txt"
          xcrun simctl list -j > "$RUNNER_TEMP/simctl-list.json"
          python3 -I - "$RUNNER_TEMP/simctl-list.json" "$RUNNER_TEMP/required-simulators.txt" <<'EOF'
          import json, os, re, sys
          data = json.load(open(sys.argv[1], encoding="utf-8"))
          runtimes = {r.get("identifier"): r for r in data.get("runtimes", [])}
          def version(runtime):                                  # the runtime's "version" ("27.2"), else from its identifier
              v = runtimes.get(runtime, {}).get("version")
              if v:
                  return v
              m = re.search(r"iOS-([0-9]+)-([0-9]+)", runtime)
              return "%s.%s" % m.groups() if m else "?"
          devices = {runtime: [d for d in items if d.get("isAvailable") and d.get("name") and d.get("udid")]
                     for runtime, items in data.get("devices", {}).items() if "iOS" in runtime}
          def duos(runtime):                                     # 0: iPhone Duos only, 1: some, 2: none
              n = sum(d["name"].startswith("iPhone Duo") for d in devices[runtime])
              return 0 if n == len(devices[runtime]) else 1 if n else 2
          failed = False
          outputs = []
          resolved = []
          for line in open(sys.argv[2], encoding="utf-8"):
              ident, name, want = [p.strip() for p in line.rstrip("\n").split("|")]
              def wanted(runtime):
                  return version(runtime) == want or version(runtime).startswith(want + ".")
              # The runtime that suits the name first: for the iPhone Duo the one of iPhone Duos only (the Duo's own iOS 27.2
              # set), for every other device the one with no iPhone Duo (§3.1); then a runtime with some iPhone Duos.
              found = sorted((duos(runtime) if name.startswith("iPhone Duo") else 2 - duos(runtime), runtime, d["udid"])
                             for runtime, items in devices.items() if wanted(runtime) for d in items if d["name"] == name)
              if not found:
                  there = sorted({d["name"] for runtime, items in devices.items() if wanted(runtime) for d in items})
                  print("::error::%s: no available simulator \"%s\" on iOS %s (docs/M7D_CONTRACT.md §3.2). The devices of iOS %s: %s"
                        % (ident, name, want, want, ", ".join(there) or "none (no such runtime)"))
                  failed = True
                  continue
              _, runtime, udid = found[0]
              r = runtimes.get(runtime, {})
              print("%s: %s | %s (%s) %s" % (ident, name, r.get("name", runtime), r.get("buildversion", "?"), udid))
              if len(found) > 1:
                  tie = found[0][0] == found[1][0]
                  print("%s%s: \"%s\" is on %d runtimes of iOS %s (%s); %s is taken (%s)."
                        % ("::warning::" if tie else "", ident, name, len(found), want, ", ".join(f[1] for f in found), runtime,
                           "nothing tells them apart: the first by its identifier" if tie
                           else "iPhone Duos only" if name.startswith("iPhone Duo") else "no iPhone Duo"))
              outputs.append("%s=%s\n" % (ident, udid))
              resolved.append("%s|%s|%s|%s\n" % (ident, name, r.get("name", runtime), r.get("buildversion", "?")))
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as out:
              out.write("".join(outputs))
          with open(sys.argv[2].replace(".txt", "-resolved.txt"), "w", encoding="utf-8") as out:
              out.write("".join(resolved))
          with open(sys.argv[2].replace(".txt", "-udids.txt"), "w", encoding="utf-8") as out:
              out.write("".join(o.split("=", 1)[1] for o in outputs))
          sys.exit(1 if failed else 0)
          EOF

      # 1.4 (docs/M7D_CONTRACT.md §3.3 4, 0d-28): XcodeGen 2.46.0 from its release zip, pinned by sha256, the same in every
      # job (until 1.3 `brew install xcodegen`, whose version was the image's formula). The script fails unless
      # `xcodegen --version` then says 2.46.0; the job's later steps find it first in PATH.
      - name: Install XcodeGen
        timeout-minutes: 10
        run: |
          set -euo pipefail
          bash "$GITHUB_WORKSPACE/tools/ci/install-xcodegen.sh"

      - name: Generate the Xcode project
        timeout-minutes: 5
        run: |
          set -euo pipefail
          xcodegen generate

      # Built for testing once, before anything boots: the products run on all four devices (one platform; the generic
      # destination builds every simulator architecture), the PDF's unit test too.
      - name: Build the app and its tests (Debug, for testing)
        timeout-minutes: 25
        run: |
          set -euo pipefail
          xcodebuild \
            -project TegakiCalendar.xcodeproj \
            -scheme TegakiCalendar \
            -configuration Debug \
            -destination "generic/platform=iOS Simulator" \
            -derivedDataPath build/SpanMyData \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            build-for-testing
          ls build/SpanMyData/Build/Products/*.xctestrun

      # One device at a time by the UDID "Required simulators" found (see the job's comment). A device's line in env.txt
      # ("<id>: <name> | <runtime> (<build>)", for "The simulators used are the table's"), its photos, its tests' log
      # (<id>-tests.log; -again after one more run), its app output out of the result bundles (<id>-app-output.txt; NSLog's
      # lines, `log show` cannot compose them on iOS 27), the app's `toolbar: paperArea=` values (paper-area-<id>.txt) and a
      # crash report if any. The iPhone 18 Pro Max goes last and stays booted for the PDF. Photos only: a failed test is a
      # warning (continue-on-error); the counts and the paper areas are read by the step after the PDF. D1y: the year's four
      # tests in the same xcodebuild of each device, after the month's (one boot and one test run a device, as before); the
      # step 110 → 140 (the job's comment: about 67–88, 89–127 with one more run).
      - name: The joined months' photos on four devices (SpanMonthYearShotsUITests)
        id: devices
        timeout-minutes: 140
        continue-on-error: true
        run: |
          set -uo pipefail
          OUT="$PWD/shots/span-my"
          REQUESTS="$RUNNER_TEMP/span-my-photo-requests"
          TOOLS="$RUNNER_TEMP/span-my-tools"
          mkdir -p "$OUT/lines" "$REQUESTS" "$TOOLS"
          {
            echo "commit: $GITHUB_SHA ($GITHUB_REF_NAME), run $GITHUB_RUN_ID attempt $GITHUB_RUN_ATTEMPT"
            xcodebuild -version
            echo "Xcode path: $(xcode-select -p)"
            echo "runner image: ${ImageOS:-?} ${ImageVersion:-?}"
            echo "xcodegen: $(xcodegen --version 2>&1 | head -n 1)"
            echo "python3: $(python3 --version 2>&1)"
            xcrun simctl list runtimes
          } > "$OUT/env.txt" 2>&1 || echo "::warning::env.txt could not all be written"
          # The gates' tools, built in the background while the devices boot (a job's first swiftc for macOS spends about
          # 2 min on the SDK's modules); the gate step builds them itself when they are not there.
          ( swiftc -O tools/shots/shift_pair.swift -o "$TOOLS/shift_pair" && swiftc -O tools/shots/shift_subpixel.swift -o "$TOOLS/shift_subpixel" ) \
            > "$TOOLS/build.log" 2>&1 &
          TOOLS_PID=$!
          sim_env() {  # sim_env <device id> <udid>: "<id>: <device name> | <runtime name> (<runtime build>)"
            xcrun simctl list -j | SIM_ID="$1" SIM_UDID="$2" python3 -I -c '
          import json, os, sys
          data = json.load(sys.stdin)
          runtimes = {r.get("identifier"): r for r in data.get("runtimes", [])}
          for runtime, items in data.get("devices", {}).items():
              for d in items:
                  if d.get("udid") == os.environ["SIM_UDID"]:
                      r = runtimes.get(runtime, {})
                      print("%s: %s | %s (%s)" % (os.environ["SIM_ID"], d.get("name"), r.get("name", runtime), r.get("buildversion", "?")))
                      raise SystemExit
          print("%s: (no simulator %s)" % (os.environ["SIM_ID"], os.environ["SIM_UDID"]))
          '
          }
          boot_device() {  # boot_device <udid>: boots it, light, the status bar at 9:41, 60 s for the banner (docs/M6.md §5.1)
            xcrun simctl boot "$1" 2>/dev/null || true
            xcrun simctl bootstatus "$1" -b > /dev/null || return 1
            xcrun simctl ui "$1" appearance light || true
            xcrun simctl status_bar "$1" override --time "9:41" --batteryState charged --batteryLevel 100 --wifiBars 3 || true
            sleep 60
          }
          # The photos of a turned screen (SpanMonthYearShotsUITests.simulatorPhoto): a request <name>.request holds the file
          # (under $OUT) and the turn; the answer <name>.request.done ("ok" or "failed") is written whole, then renamed.
          watch_photos() {  # watch_photos <udid>: answers the requests until it is stopped
            local REQ FILE TURN ANSWER TURN_SIZE
            while :; do
              for REQ in "$REQUESTS"/*.request; do
                [ -f "$REQ" ] || continue
                FILE="$(sed -n 1p "$REQ")"
                TURN="$(sed -n 2p "$REQ")"
                rm -f "$REQ"
                ANSWER=failed
                if [ -n "$FILE" ] && mkdir -p "$(dirname "$OUT/$FILE")" && xcrun simctl io "$1" screenshot "$OUT/$FILE" > /dev/null 2>&1; then
                  ANSWER=ok
                  # The iOS 27.2 simulator writes a turned screen in landscape already: turned only when taller than wide
                  # (span-shots-app's rule); a PNG whose size cannot be read is a failed photo.
                  if [ -n "$TURN" ]; then
                    TURN_SIZE="$(sips -g pixelWidth -g pixelHeight "$OUT/$FILE" 2>/dev/null | awk '/pixelWidth/ { w = $2 } /pixelHeight/ { h = $2 } END { print w + 0, h + 0 }' || true)"
                    case "$TURN_SIZE" in
                      ''|"0 "*|*" 0") ANSWER=failed ;;
                      *) if [ "${TURN_SIZE#* }" -gt "${TURN_SIZE% *}" ] && ! sips -r "$TURN" "$OUT/$FILE" > /dev/null 2>&1; then ANSWER=failed; fi ;;
                    esac
                  fi
                fi
                echo "the photo $FILE for the test: $ANSWER"
                echo "$ANSWER" > "$REQ.done.part"
                mv "$REQ.done.part" "$REQ.done"
              done
              sleep 0.3
            done
          }
          # span-shots-app's watchdog (docs/M7D.md, D0b): xcodebuild is stopped when its log has not grown for STALL s.
          STALL=600
          watchdog() {  # watchdog <pid> <log> <file>: ends <pid> when <log> has not grown for $STALL s, writing <file>
            local SIZE SEEN=-1 QUIET=0
            while kill -0 "$1" 2>/dev/null; do
              sleep 15
              SIZE="$(wc -c < "$2" 2>/dev/null | tr -d ' ' || echo 0)"
              if [ "$SIZE" != "$SEEN" ]; then SEEN="$SIZE"; QUIET=0; continue; fi
              QUIET=$(( QUIET + 15 ))
              if [ "$QUIET" -ge "$STALL" ]; then
                echo "watchdog: no output for $QUIET s after \"$(grep -E '^ +t = ' "$2" | tail -n 1 | sed -E 's/^ +//')\"" > "$3"
                kill -TERM "$1" 2>/dev/null || true
                sleep 60
                kill -KILL "$1" 2>/dev/null || true
                return 0
              fi
            done
          }
          run_photos() {  # run_photos <suffix>: the ten tests on $UDID, the photo watcher and the watchdog beside them
            watch_photos "$UDID" &
            WATCHER=$!
            STATUS=0
            TEST_RUNNER_TEGAKI_SPAN_MY_SHOT_OUT="$OUT" TEST_RUNNER_TEGAKI_SPAN_MY_SHOT_DEVICE="$ID" \
            TEST_RUNNER_TEGAKI_SPAN_MY_SHOT_REQUESTS="$REQUESTS" xcodebuild \
              -project TegakiCalendar.xcodeproj \
              -scheme TegakiCalendar \
              -configuration Debug \
              -destination "platform=iOS Simulator,id=$UDID" \
              -derivedDataPath build/SpanMyData \
              -resultBundlePath "build/span-my-$ID$1.xcresult" \
              -only-testing:TegakiCalendarUITests/SpanMonthYearShotsUITests/testMonthBands \
              -only-testing:TegakiCalendarUITests/SpanMonthYearShotsUITests/testMonthFit \
              -only-testing:TegakiCalendarUITests/SpanMonthYearShotsUITests/testMonthShiftPair \
              -only-testing:TegakiCalendarUITests/SpanMonthYearShotsUITests/testMonthOldVersion \
              -only-testing:TegakiCalendarUITests/SpanMonthYearShotsUITests/testMonthGuides \
              -only-testing:TegakiCalendarUITests/SpanMonthYearShotsUITests/testMonthDots \
              -only-testing:TegakiCalendarUITests/SpanMonthYearShotsUITests/testYearBands \
              -only-testing:TegakiCalendarUITests/SpanMonthYearShotsUITests/testYearFit \
              -only-testing:TegakiCalendarUITests/SpanMonthYearShotsUITests/testYearOldVersion \
              -only-testing:TegakiCalendarUITests/SpanMonthYearShotsUITests/testYearGuides \
              test-without-building > "$OUT/$ID-tests$1.log" 2>&1 &
            TESTS=$!
            watchdog "$TESTS" "$OUT/$ID-tests$1.log" "$OUT/$ID-watchdog$1.txt" &
            DOG=$!
            wait "$TESTS" || STATUS=$?
            kill "$DOG" "$WATCHER" 2>/dev/null || true
            wait "$DOG" 2>/dev/null || true
            wait "$WATCHER" 2>/dev/null || true
            # A run the watchdog stopped is a failure even if xcodebuild ended with 0 on its TERM (143: TERM's status).
            if [ -s "$OUT/$ID-watchdog$1.txt" ] && [ "$STATUS" = 0 ]; then STATUS=143; fi
          }
          # The simulator's failures (span-shots-app's list, docs/M7C.md FLAKE-1 and docs/M7D.md D0b): the device's photos
          # once more after a new boot; any other failure stands (a warning here).
          SIMULATOR='Timed out while acquiring background assertion|Failed to get background assertion|Timed out while launching|Failed to launch app|Lost connection to the test manager|Test runner never began executing|kAXErrorIPC|Failed to get list of active applications'
          FAILED=0
          for SPEC in "ipad13|${{ steps.required.outputs.ipad13 }}" "ipad11|${{ steps.required.outputs.ipad11 }}" \
                      "ipadmini|${{ steps.required.outputs.ipadmini }}" "iphone69|${{ steps.required.outputs.iphone69 }}"; do
            ID="${SPEC%%|*}"; UDID="${SPEC#*|}"
            if [ -z "$UDID" ]; then echo "::warning::No $ID from \"Required simulators\"; no photos of it."; FAILED=1; continue; fi
            echo "$ID: $UDID"
            sim_env "$ID" "$UDID" >> "$OUT/env.txt" || echo "::warning::no runtime line for $ID"
            STARTED="$(date +%s)"
            if ! boot_device "$UDID"; then echo "::warning::$ID did not boot; no photos of it."; FAILED=1; continue; fi
            echo "$ID: booted, $(( $(date +%s) - STARTED )) s with the banner's 60"
            run_photos ""
            LOG="$OUT/$ID-tests.log"
            if [ "$STATUS" != 0 ] && { [ -s "$OUT/$ID-watchdog.txt" ] || grep -qE "$SIMULATOR" "$LOG"; }; then
              WHY="$(cat "$OUT/$ID-watchdog.txt" 2>/dev/null || grep -oE "$SIMULATOR" "$LOG" | head -n 1)"
              echo "::warning::$ID: $WHY; the device's photos are taken once more after a new boot."
              mkdir -p "$OUT/lines-first"
              [ -f "$OUT/lines/$ID.txt" ] && mv "$OUT/lines/$ID.txt" "$OUT/lines-first/$ID.txt"
              xcrun simctl shutdown "$UDID" || true
              boot_device "$UDID" || echo "::warning::$ID did not boot again."
              run_photos "-again"
              LOG="$OUT/$ID-tests-again.log"
              if [ -s "$OUT/$ID-watchdog-again.txt" ]; then echo "::warning::$ID: $(cat "$OUT/$ID-watchdog-again.txt") (the one more run)."; fi
            fi
            grep -E 'Test Case .*(passed|failed|skipped)|error:|Executed ' "$LOG" | tail -n 24 || true   # D1y: ten tests now (16 lines until D1y)
            if [ "$STATUS" != 0 ]; then echo "::warning::SpanMonthYearShotsUITests ended with $STATUS on $ID (span-shots-my/${LOG##*/})."; FAILED=1; fi
            if [ -s "$OUT/lines/$ID.txt" ]; then cut -c1-400 "$OUT/lines/$ID.txt"; fi
            bash tools/ci/xcresult-app-output.sh "$OUT/$ID-app-output.txt" "build/span-my-$ID.xcresult" "build/span-my-$ID-again.xcresult" || true
            { grep -h -o 'toolbar: paperArea=[^ ]* mode=[a-z]*' "$OUT/$ID-app-output.txt" 2>/dev/null || true; } | sort | uniq -c > "$OUT/paper-area-$ID.txt"
            echo "$ID: the app's paper areas (count, value):"; cat "$OUT/paper-area-$ID.txt"
            find "$HOME/Library/Logs/DiagnosticReports" -name 'TegakiCalendar*' -mmin -20 -exec cp {} "$OUT/" \; 2>/dev/null || true
            echo "$ID: $(find "$OUT" -maxdepth 1 -name "$ID-*.png" | wc -l | tr -d ' ') photos, $(( $(date +%s) - STARTED )) s with the boot"
            if [ "$ID" = "iphone69" ]; then
              echo "iphone69=$UDID" >> "$GITHUB_OUTPUT"
            else
              xcrun simctl shutdown "$UDID" || true
            fi
          done
          wait "$TOOLS_PID" || { echo "::warning::the gates' tools did not build in the background (the gate step builds them):"; cat "$TOOLS/build.log" || true; }
          ls -la "$OUT"
          exit "$FAILED"

      # 1.4 (docs/M7D_CONTRACT.md §3.2): the devices this job took are the table's ("Required simulators"): each line
      # "<id>: <name> | <runtime> (<build>)" of its env.txt has the table's name, on the runtime (name and build) that
      # "Required simulators" found for it, and every device of the table has a line (none means it was not found, and its
      # photos or tests are missing). A prefix fallback that landed on another device, or another runtime taken instead of
      # the table's (a newer one, or the iPhone Duo's iOS 27.2), fails the job here. The same lines in every job that boots
      # a simulator; only ENV_TXT differs.
      - name: The simulators used are the table's (1.4)
        if: ${{ !cancelled() && env.QUICK != 'true' }}
        timeout-minutes: 3
        env:
          ENV_TXT: shots/span-my/env.txt
        run: |
          set -euo pipefail
          python3 -I - "$RUNNER_TEMP/required-simulators.txt" "$ENV_TXT" <<'EOF'
          import re, sys
          table = [[p.strip() for p in line.rstrip("\n").split("|")] for line in open(sys.argv[1], encoding="utf-8") if line.strip()]
          try:
              resolved = {row[0]: row[2:] for row in (line.rstrip("\n").split("|") for line in open(sys.argv[1].replace(".txt", "-resolved.txt"), encoding="utf-8")) if len(row) == 4}
          except OSError:
              resolved = {}
          try:
              lines = open(sys.argv[2], encoding="utf-8").read().splitlines()
          except OSError as error:
              print("::error::%s could not be read (%s): the devices this job took are not known (docs/M7D_CONTRACT.md §3.2)." % (sys.argv[2], error))
              sys.exit(1)
          taken = {}
          for line in lines:
              m = re.fullmatch(r"([a-z0-9]+): (.+) \| (.+) \(([^()]*)\)", line)
              if m:
                  taken.setdefault(m.group(1), []).append(m.group(2, 3, 4))
          failed = False
          for ident, name, want in table:
              if ident not in taken:
                  print("::error::%s (%s): no line in %s, so it was not taken (docs/M7D_CONTRACT.md §3.2)." % (ident, name, sys.argv[2]))
                  failed = True
              for got, runtime, build in taken.get(ident, []):
                  if ident in resolved:
                      ok = got == name and [runtime, build] == resolved[ident]
                      where = "%s (%s)" % tuple(resolved[ident])
                  else:
                      ok = got == name and (runtime == "iOS " + want or runtime.startswith("iOS " + want + "."))
                      where = "iOS " + want
                  print("%s: %s | %s (%s): %s" % (ident, got, runtime, build, "the table's" if ok else "NOT the table's"))
                  if not ok:
                      print("::error::%s took %s on %s (%s), not the table's %s on %s (docs/M7D_CONTRACT.md §3.2)." % (ident, got, runtime, build, name, where))
                      failed = True
          sys.exit(1 if failed else 0)
          EOF

      # The joined month's PDF (§4.7, §12.4): PDFMonthYearTests writes the PDF of a joined November whose neighbours' memo
      # strokes come into it (TEGAKI_SPAN_MY_SHOT_OUT, `span-my-pdf-month.pdf`), on the iPhone 18 Pro Max booted last; `sips`
      # makes a PNG of its page (2,400 px). A warning when it is not there (the lead looks at it; the unit test itself runs
      # in Build and test).
      - name: The joined month's PDF (PDFMonthYearTests)
        if: ${{ !cancelled() && steps.devices.outputs.iphone69 != '' }}
        timeout-minutes: 10
        continue-on-error: true
        run: |
          set -uo pipefail
          OUT="$PWD/shots/span-my"
          UDID="${{ steps.devices.outputs.iphone69 }}"
          mkdir -p "$OUT"
          rm -f "$OUT/span-my-pdf-month.pdf" "$OUT/span-my-pdf-month.png"
          STATUS=0
          TEST_RUNNER_TEGAKI_SPAN_MY_SHOT_OUT="$OUT" xcodebuild \
            -project TegakiCalendar.xcodeproj \
            -scheme TegakiCalendar \
            -configuration Debug \
            -destination "platform=iOS Simulator,id=$UDID" \
            -derivedDataPath build/SpanMyData \
            -resultBundlePath build/span-my-pdf.xcresult \
            -only-testing:TegakiCalendarTests/PDFMonthYearTests/testAJoinedMonthsPDFDrawsTheMemoStrokesComingInFromItsNeighbours \
            -testLanguage ja \
            -testRegion JP \
            test-without-building > "$OUT/pdf-test.log" 2>&1 || STATUS=$?
          grep -E "Test Case .*(passed|failed|skipped)|error:|Executed " "$OUT/pdf-test.log" | tail -n 20 || true
          xcrun simctl shutdown "$UDID" || true
          if [ "$STATUS" != 0 ]; then echo "::warning::The joined month's PDF test ended with $STATUS (span-shots-my/pdf-test.log)."; exit 1; fi
          if [ ! -s "$OUT/span-my-pdf-month.pdf" ]; then echo "::warning::The test passed but wrote no span-my-pdf-month.pdf."; exit 1; fi
          if ! sips -s format png -Z 2400 "$OUT/span-my-pdf-month.pdf" --out "$OUT/span-my-pdf-month.png" > /dev/null; then
            echo "::warning::sips could not make a PNG of span-my-pdf-month.pdf."
            exit 1
          fi
          sips -g pixelWidth -g pixelHeight "$OUT/span-my-pdf-month.png" | tail -n 2 || true

      # The counts, the shift pair and the paper areas (see the job's comment). The photos expected are built per kind: the
      # kinds are the same as SpanKinds.joined (Sources/TegakiCalendar/Span/SpanKinds.swift) less the week and the day, whose
      # photos are span-shots-app's: the month and, since D1y, the year (§12.4: 24 + 22 = 46 photos, PHOTOS; each kind's 11
      # bands set beside its one page, BANDS). The fallback of §14.1 (the year not joined) takes `year` out of the list below,
      # PHOTOS back to 24 and the year's four tests out of the photos' step's `-only-testing`. A missing or extra photo, a
      # turned photo not wider than tall, the shift pair's strong pixels and a missing paper line are warnings; a joined month
      # or year whose canvas is not the one page's at the same place (`span-my paper:` … `same=no`) fails the step and the job
      # (gate 3, §12.3: stop and look).
      - name: The joined months' counts, shift pair and paper areas
        if: ${{ !cancelled() }}
        timeout-minutes: 10
        run: |
          set -uo pipefail
          OUT="shots/span-my"
          TOOLS="$RUNNER_TEMP/span-my-tools"
          mkdir -p "$OUT" "$TOOLS"
          FAILED=0
          DEVICES="ipad13 ipad11 ipadmini iphone69"
          : > "$OUT/lines.txt"
          for ID in $DEVICES; do
            if [ -f "$OUT/lines/$ID.txt" ]; then cat "$OUT/lines/$ID.txt" >> "$OUT/lines.txt"; fi
          done
          : > "$OUT/paper-area.txt"
          for ID in $DEVICES; do
            if [ -f "$OUT/paper-area-$ID.txt" ]; then sed "s/^ */$ID /" "$OUT/paper-area-$ID.txt" >> "$OUT/paper-area.txt"; fi
          done
          EXPECTED=""
          BANDS=0
          for KIND in month year; do   # the same kinds as SpanKinds.joined, less the week and the day (span-shots-app's)
            case "$KIND" in
              month)
                for ID in $DEVICES; do EXPECTED="$EXPECTED $ID-portrait-month-overview $ID-portrait-month-boundary"; done
                for ID in ipad13 ipad11 iphone69; do EXPECTED="$EXPECTED $ID-landscape-month-overview $ID-landscape-month-fit"; done
                EXPECTED="$EXPECTED ipad11-portrait-month-shift-before ipad11-portrait-month-shift-after"
                EXPECTED="$EXPECTED ipad13-portrait-month-single iphone69-portrait-month-single"
                for L in ja de fr pseudo; do EXPECTED="$EXPECTED iphone69-portrait-month-guide-$L"; done
                EXPECTED="$EXPECTED iphone69-portrait-month-guide-ja-two"
                EXPECTED="$EXPECTED ipad13-portrait-month-dots"
                BANDS=$(( BANDS + 11 ))   # the 8 portrait bands and the 3 turned overviews
                ;;
              year)   # D1y (§12.4, §5.3, §5.4): the year page of 2026; no PDF of a year
                for ID in $DEVICES; do EXPECTED="$EXPECTED $ID-portrait-year-overview $ID-portrait-year-boundary"; done
                for ID in ipad13 ipad11 iphone69; do EXPECTED="$EXPECTED $ID-landscape-year-overview $ID-landscape-year-fit"; done
                for ID in $DEVICES; do EXPECTED="$EXPECTED $ID-portrait-year-fit"; done
                EXPECTED="$EXPECTED ipad13-portrait-year-single iphone69-portrait-year-single"
                EXPECTED="$EXPECTED iphone69-portrait-year-guide-ja iphone69-portrait-year-guide-ja-two"
                BANDS=$(( BANDS + 11 ))   # the 8 portrait bands and the 3 turned overviews
                ;;
            esac
          done
          PHOTOS=46
          PDFS=1
          : > "$OUT/photos.txt"
          WANT=0
          FOUND=0
          for NAME in $EXPECTED; do
            WANT=$(( WANT + 1 ))
            if [ -f "$OUT/$NAME.png" ]; then
              FOUND=$(( FOUND + 1 ))
              SIZE="$(sips -g pixelWidth -g pixelHeight "$OUT/$NAME.png" 2>/dev/null | awk '/pixelWidth/ { w = $2 } /pixelHeight/ { h = $2 } END { print w + 0, h + 0 }' || true)"
              W="${SIZE% *}"; H="${SIZE#* }"
              echo "$NAME.png ${W:-0}x${H:-0}" >> "$OUT/photos.txt"
              case "$NAME" in
                *-portrait-*) if [ "${W:-0}" -ge "${H:-0}" ]; then echo "::warning::$NAME.png is ${W}x${H}, not taller than wide."; fi ;;
                *-landscape-*) if [ "${W:-0}" -le "${H:-0}" ]; then echo "::warning::$NAME.png is ${W}x${H}, not wider than tall."; fi ;;
              esac
            else
              echo "$NAME.png missing" >> "$OUT/photos.txt"
            fi
          done
          if [ "$WANT" != "$PHOTOS" ]; then echo "::warning::the list of the photos expected has $WANT names, not $PHOTOS (this step's EXPECTED)."; fi
          for PNG in "$OUT"/*.png; do
            [ -f "$PNG" ] || continue
            B="$(basename "$PNG" .png)"
            case " $EXPECTED span-my-pdf-month " in *" $B "*) ;; *) echo "$B.png (not expected)" >> "$OUT/photos.txt" ;; esac
          done
          PDF=0
          if [ -s "$OUT/span-my-pdf-month.pdf" ]; then PDF=1; echo "span-my-pdf-month.pdf (PNG: $([ -s "$OUT/span-my-pdf-month.png" ] && echo yes || echo no))" >> "$OUT/photos.txt"; fi
          echo "span-shots-my: $FOUND photos ($PHOTOS expected) and $PDF PDFs ($PDFS expected)" >> "$OUT/photos.txt"
          cat "$OUT/photos.txt"
          if [ "$FOUND" != "$PHOTOS" ]; then echo "::warning::span-shots-my has $FOUND of the $PHOTOS photos expected (shots/span-my/photos.txt)."; fi
          if [ "$PDF" != "$PDFS" ]; then echo "::warning::span-shots-my has no joined month's PDF (span-my-pdf-month.pdf)."; fi
          set -f   # the lines are split on spaces below; none of their words is a pattern
          value() {  # value <key> <line>: the value of <key>=… in the line, or nothing
            local T
            for T in $2; do
              case "$T" in "$1"=*) echo "${T#*=}"; return 0 ;; esac
            done
            echo ""
          }
          # The shift pair (§3.5's y correction): shift_pair without the rows above the canvas, then, when it finds strong
          # pixels, shift_subpixel (a re-drawing less than a pixel away, span-shots-app's rule, at most 100 left); warnings only.
          if [ ! -x "$TOOLS/shift_pair" ] || [ ! -x "$TOOLS/shift_subpixel" ]; then
            swiftc -O tools/shots/shift_pair.swift -o "$TOOLS/shift_pair" || echo "::warning::tools/shots/shift_pair.swift did not compile."
            swiftc -O tools/shots/shift_subpixel.swift -o "$TOOLS/shift_subpixel" || echo "::warning::tools/shots/shift_subpixel.swift did not compile."
          fi
          : > "$OUT/shift-pair.txt"
          PAIRS=0
          while IFS= read -r LINE; do
            PAIRS=$(( PAIRS + 1 ))
            DEVICE="$(value device "$LINE")"; BEFORE="$(value before "$LINE")"; AFTER="$(value after "$LINE")"
            STRICT="$(value strict "$LINE")"; LOOSE="$(value loose "$LINE")"; BAND="$(value band "$LINE")"; TITLE="$(value title "$LINE")"
            if [ ! -x "$TOOLS/shift_pair" ] || [ ! -f "$OUT/$BEFORE" ] || [ ! -f "$OUT/$AFTER" ]; then
              echo "shift pair $DEVICE month: not compared (a tool or a photo is missing)" | tee -a "$OUT/shift-pair.txt"
              continue
            fi
            S=0
            RESULT="$("$TOOLS/shift_pair" "$OUT/$BEFORE" "$OUT/$AFTER" --exclude-rows "$STRICT" --max-strong 0)" || S=$?
            echo "shift pair $DEVICE month below the heading (rows $STRICT left out): $RESULT" | tee -a "$OUT/shift-pair.txt"
            if [ "$S" != 0 ] && [ -x "$TOOLS/shift_subpixel" ]; then
              S=0
              RESULT="$("$TOOLS/shift_subpixel" "$OUT/$BEFORE" "$OUT/$AFTER" --exclude-rows "$STRICT" --max-residual 100)" || S=$?
              echo "shift pair $DEVICE month below the heading, sub-pixel: $RESULT" | tee -a "$OUT/shift-pair.txt"
              if [ "$S" != 0 ]; then
                echo "::warning::the month's shift pair on $DEVICE differs below the heading by more than a sub-pixel re-drawing: $RESULT"
              else
                echo "::warning::the month's shift pair on $DEVICE differs below the heading only by a re-drawing less than a pixel away: $RESULT"
              fi
            fi
            S=0
            RESULT="$("$TOOLS/shift_pair" "$OUT/$BEFORE" "$OUT/$AFTER" --exclude-rows "$LOOSE" --max-strong 0)" || S=$?
            echo "shift pair $DEVICE month with the heading (rows $LOOSE left out): $RESULT" | tee -a "$OUT/shift-pair.txt"
            if [ "$S" != 0 ]; then echo "::warning::the month's shift pair on $DEVICE differs in the heading (its sticky label may: open question 17): $RESULT"; fi
            if [ "$BAND" != same ]; then echo "::warning::the month's shift pair on $DEVICE: the canvas moved with the shift."; fi
            if [ "$TITLE" != same ]; then echo "::warning::the month's shift pair on $DEVICE: the page's title changed with the shift."; fi
          done < <(grep '^span-my shift pair: ' "$OUT/lines.txt" || true)
          if [ "$PAIRS" != 1 ]; then echo "::warning::$PAIRS shift pairs of the month, 1 expected (the iPad Air 11-inch)."; fi
          # Gate 3 (§12.3): each band beside the one page's month at the same place.
          : > "$OUT/paper.txt"
          PAPERS=0
          DIFFER=0
          while IFS= read -r LINE; do
            PAPERS=$(( PAPERS + 1 ))
            echo "$LINE" >> "$OUT/paper.txt"
            if [ "$(value same "$LINE")" != yes ]; then
              DIFFER=$(( DIFFER + 1 ))
              case "$(value kind "$LINE")" in *-year-*) K=year ;; *) K=month ;; esac
              echo "::error::$(value kind "$LINE"): the joined $K's canvas $(value joined "$LINE") is not the one page's $(value one "$LINE") at the same place (gate 3, docs/R1_4_3_CONTRACT.md §12.3: stop)."
              FAILED=1
            fi
          done < <(grep '^span-my paper: ' "$OUT/lines.txt" || true)
          echo "paper areas: $PAPERS bands set beside the one page's month or year ($BANDS expected), $DIFFER different" | tee -a "$OUT/paper.txt"
          if [ "$PAPERS" != "$BANDS" ]; then echo "::warning::$PAPERS paper lines, $BANDS expected (each kind's 8 portrait bands and 3 turned overviews)."; fi
          echo "the app's paper areas (device, count, value):"
          cat "$OUT/paper-area.txt"
          exit "$FAILED"

      # overwrite: a re-run of this job (gh run rerun --failed) replaces the photos of the attempt before.
      - name: Upload the photos of the joined months
        if: always()
        timeout-minutes: 15
        uses: actions/upload-artifact@v4
        with:
          name: span-shots-my
          path: shots/span-my
          retention-days: 7
          if-no-files-found: warn
          overwrite: true

      # The job's summary (GITHUB_STEP_SUMMARY): the counts, the shift pair and the paper areas. Writes what there is; never fails.
      - name: Summary
        if: always()
        timeout-minutes: 3
        continue-on-error: true
        run: |
          set -uo pipefail
          OUT="shots/span-my"
          SUMMARY="${GITHUB_STEP_SUMMARY:-/dev/null}"
          {
            echo "### span-shots-my (1.4.3 months and years)"
            echo ""
            echo "- $(grep '^span-shots-my: ' "$OUT/photos.txt" 2>/dev/null || echo 'span-shots-my: no photos.txt')"
            echo "- missing: $(grep -c ' missing$' "$OUT/photos.txt" 2>/dev/null || true); not expected: $(grep -c '(not expected)' "$OUT/photos.txt" 2>/dev/null || true)"
            echo "- $(tail -n 1 "$OUT/paper.txt" 2>/dev/null || echo 'paper areas: not read')"
            echo ""
            echo "#### Shift pair (the iPad Air 11-inch's month)"
            echo ""
            if [ -s "$OUT/shift-pair.txt" ]; then sed 's/^/- /' "$OUT/shift-pair.txt"; else echo "- (none)"; fi
            echo ""
            echo "- **To look at by eye** (§12.4, §14.1 D1b and D1y): the handwriting, the month and year labels, the boundary lines and the guide's cards in the photos (artifact span-shots-my)."
          } >> "$SUMMARY"

      # 1.4 D1d (docs/M7D.md, 実行機の打ち切り): only when this job is cancelled (by hand, by its time limit, or by the runner's
      # side with nothing but "The operation was canceled.", four times on xcode-27 on 11/20), tools/ci/cancel-diag.sh prints
      # the load, the memory, the 15 busiest processes and, from the runner's own _diag folder, only its lines about a
      # cancel, a shutdown, a lost connection, a time-out or a signal (200 at most; the folder is never uploaded or printed
      # whole, nothing is written to disk: the repository is public). Not on success or failure; never fails the job. The
      # same lines at the end of every job on xcode-27 of build.yml and duo.yml.
      - name: Diagnostics of a cancelled job (1.4 D1d)
        if: cancelled()
        continue-on-error: true
        timeout-minutes: 3
        run: |
          if [ -f tools/ci/cancel-diag.sh ]; then
            bash tools/ci/cancel-diag.sh || true
          else
            echo "tools/ci/cancel-diag.sh is not here (cancelled before the checkout?)."
            uptime || true
          fi
