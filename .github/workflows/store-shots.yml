# The App Store's photos of 1.2 in the other languages (docs/M7B_CONTRACT.md §6.6, §7.5, §7.6, §10.7, §11.2).
# One job per set of the matrix: it builds the app and shoots the 13-inch iPad (01-month, 02-week, 03-day,
# 04-year) and the 6.9-inch iPhone (01-week, 02-month, 03-day, 04-year), converts the photos to JPEG (no
# alpha) and compares each one's pixels with Apple's accepted sizes, as "Store listing set" in build.yml does.
# Artifact: store-<set>/{ipad13,iphone69}/0{1..4}-*.jpg, kept 30 days. The purchase screen is not shot: a
# listing photo must not show prices (docs/M7_PLAN.md §1.1, docs/M6.md §4.6).
#
# Each photo shows what a new user of that storefront sees: the screen's language, the region's holidays and
# week start (`auto`), and the handwriting of a listing (`--screenshot-store-ink`, only here: build.yml and
# ja-baseline.yml do not pass it, so J-4 and the fixtures never see it; docs/M7B.md FIX4). The sets and the
# storefronts they go to:
#   en (en_US): en-US, en-CA            en-GB (en_GB): en-GB, en-AU        zh-Hans (zh_CN), zh-Hant (zh_TW),
#   ko (ko_KR)                          fr (fr_FR): fr-FR, fr-CA (fr-CA's region starts on a Sunday; same photo)
#   de (de_DE), it (it_IT)              es (es_MX): es-MX                  es-ES (es_ES): es-ES
#   pt-BR (pt_BR): pt-BR, pt-PT
# en and es are two sets each because the regions differ in the week start and the holidays, not in the words.
# ja's photos stay as they are in App Store Connect; nothing here touches Connect.
#
# 1.3 (docs/M7C_CONTRACT.md §8.5, D26): every set also shoots the joined week with the crossing demo at its head
# (`--screenshot-span on --screenshot-offset-x -0.5`: the focus page's left boundary in the middle; the store ink
# draws the demo's two strokes across it, docs/M7C.md C-args decision 15) as store/<device>/00-span.jpg, and ja
# (ja_JP) is a set too, for that photo only: its other four stay as they are in Connect. 1.3 is not on main, so
# the lead starts this with `gh workflow run store-shots.yml --ref r13` (the dispatch reads the file of that ref).
#
# When it runs: on a push to the branch `store-shots` (the lead pushes m7b under that name, for example
# `git push origin m7b:store-shots`: workflow_dispatch only starts a workflow that is on the default branch,
# and 1.2 reaches main only after the owner's check, 0-40). build.yml ignores this branch.
#
# A first boot's system banner (docs/M6.md §5.1; about 85–105 s after the boot on the 13-inch, docs/M7B.md C1)
# must not be in a listing photo: every device waits 120 s with the app in front before the first shot and
# shoots its four pages again at the end, like the other devices in build.yml.
#
# The status bar (the iPad's has a date): the device boots twice, the second time in the set's language and
# region, and its bar's time is fixed at 9:41 (docs/M7B.md FIX4, FIX5); the iPad's date stays the day of the shoot
# (simctl did not set it from an ISO date). Only here: build.yml and
# ja-baseline.yml keep their bar, whose date J-4 does not look at beyond comparing two runs of one day.
#
# 1.4 (docs/M7D_CONTRACT.md §3.3, §3.10, D0): the image `xcode-27` and Xcode 27.2, chosen as in build.yml (§3.1); the
# 6.9-inch iPhone is the iPhone 18 Pro Max (§3.2: prefix fallbacks iPhone 18 Pro Max, iPhone 17 Pro Max; the image has no
# iPhone 17 Pro Max), and a simulator of the table that is missing fails the job ("Required simulators", and "The
# simulators used are the table's" after the photos) instead of a warning; XcodeGen is 2.46.0 from its release zip,
# pinned by sha256 (§3.3 4); shots/env.txt holds the job's environment, the devices taken and the iPhone 18 Pro Max's
# pixels, in an artifact of its own (env-store-<set>), so store-<set> keeps only the device folders. The iPhone Duo's set and
# the input `sets` come with D2 (§7); the photos in App Store Connect now are not taken again (§7.4).
name: store-shots

on:
  push:
    branches:
      - store-shots
  workflow_dispatch:

concurrency:
  group: store-shots-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  store-shots:
    name: store-shots (${{ matrix.set.id }})
    # 1.4 (docs/M7D_CONTRACT.md §3.1, §3.3 1, 0d-2): the image with Xcode 27 (macos-26 and macos-15 do not get it).
    runs-on: xcode-27
    # A build and XcodeGen about 3 min, four boots up to 3.5 each (run 41922318959; a device boots twice, for its
    # language, and the second is shorter), the two waits 4 min, 16 shots of 11–15 s at most 4 min: at most about
    # 25 min. A job cut by this limit would not reach the upload.
    # A slow runner took 8 minutes for a boot (fr, 2026-11-06) and ran out of the step's 30; the two boots of
    # each device (FIX4) made it longer.
    timeout-minutes: 70
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        set:
          - { id: en, language: en, locale: en_US }
          - { id: en-GB, language: en-GB, locale: en_GB }
          - { id: zh-Hans, language: zh-Hans, locale: zh_CN }
          - { id: zh-Hant, language: zh-Hant, locale: zh_TW }
          - { id: ko, language: ko, locale: ko_KR }
          - { id: fr, language: fr, locale: fr_FR }
          - { id: de, language: de, locale: de_DE }
          - { id: it, language: it, locale: it_IT }
          - { id: es, language: es, locale: es_MX }
          - { id: es-ES, language: es-ES, locale: es_ES }
          - { id: pt-BR, language: pt-BR, locale: pt_BR }
          - { id: ja, language: ja, locale: ja_JP }
    env:
      HOMEBREW_NO_AUTO_UPDATE: "1"
      HOMEBREW_NO_INSTALL_CLEANUP: "1"
      NSUnbufferedIO: "YES"
      SET_LANGUAGE: ${{ matrix.set.language }}
      SET_LOCALE: ${{ matrix.set.locale }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      # 1.4 (docs/M7D_CONTRACT.md §3.1, 0d-1): Xcode 27.2, chosen by what each candidate says it is, never by its path.
      # Every /Applications/Xcode_27.2*.app is read with `xcodebuild -version` (DEVELOPER_DIR set to it); one whose version is
      # 27.2 or 27.2.x and whose build ends in a digit is a release (a beta's build ends in a lower-case letter, as 27.3
      # beta's 27C5020n; the rolling-out image 20261119 gives that beta aliases named like a release, §3.1), and the newest
      # release is selected. None fails the job: until 1.3 this step chose Xcode 26.6 only when it was there and otherwise
      # went on with the image's default Xcode, unseen. Then `sudo xcodebuild -runFirstLaunch` (harmless when it has run).
      # The same lines in every job on xcode-27 (build.yml, ja-baseline.yml, store-shots.yml, testflight.yml, duo.yml).
      - name: Select Xcode 27.2
        run: |
          set -euo pipefail
          XCODE="$(python3 -I -c '
          import glob, os, re, subprocess, sys
          def key(version, build):                               # (27, 2, 0), then the build: digits as numbers
              numbers = tuple((int(p) for p in version.split("."))) + (0, 0, 0)
              return numbers[:3], tuple((0, int(t)) if t.isdigit() else (1, t) for t in re.findall(r"[0-9]+|[^0-9]+", build))
          best = None
          seen = {}
          for app in sorted(glob.glob("/Applications/Xcode_27.2*.app")):
              real = os.path.realpath(app)
              if real in seen:
                  print("%s: the same Xcode as %s" % (app, seen[real]), file=sys.stderr)
                  continue
              seen[real] = app
              env = dict(os.environ, DEVELOPER_DIR=os.path.join(real, "Contents", "Developer"))
              try:
                  out = subprocess.run(["xcodebuild", "-version"], env=env, capture_output=True, text=True, timeout=300).stdout
              except Exception as error:
                  print("%s: xcodebuild -version failed (%s)" % (app, error), file=sys.stderr)
                  continue
              version = re.search(r"^Xcode ([0-9.]+)$", out, re.M)
              build = re.search(r"^Build version ([0-9A-Za-z]+)$", out, re.M)
              version = version.group(1) if version else "?"
              build = build.group(1) if build else "?"
              release = re.fullmatch(r"27\.2(\.[0-9]+)?", version) is not None and re.search(r"[0-9]$", build) is not None
              print("%s (%s): Xcode %s, build %s%s" % (app, real, version, build, ": a release of 27.2" if release else ": not a release of 27.2"), file=sys.stderr)
              if release and (best is None or key(version, build) > best[0]):
                  best = (key(version, build), real)
          print(best[1] if best else "")
          ')"
          if [ -z "$XCODE" ]; then
            echo "::error::No release of Xcode 27.2 in /Applications (xcodebuild -version 27.2 or 27.2.x, its build ending in a digit; docs/M7D_CONTRACT.md §3.1). The job does not go on with another Xcode."
            exit 1
          fi
          echo "Selected: $XCODE"
          sudo xcode-select -s "$XCODE"
          sudo xcodebuild -runFirstLaunch
          xcode-select -p
          xcodebuild -version
          echo "runner image: ${ImageOS:-?} ${ImageVersion:-?}"

      # 1.4 (docs/M7D_CONTRACT.md §3.2, 0d-3): the simulators of the table that this job uses must be on the runner, each
      # under its exact name on its runtime (iOS 27.2; the iPad mini (A17 Pro) is on iOS 27.0 only; the iPhone Duo on the
      # Duo's iOS 27.2 runtime). One that is missing fails the job here: until 1.3 a missing device was a warning ("No
      # simulator for …; skipping") and the job stayed green, so all the 6.9-inch photos could be gone unseen. Each one's
      # UDID is an output of this step (steps.required.outputs.<id>); the table and the runtime (name and build) each one
      # resolved to go to $RUNNER_TEMP for "The simulators used are the table's" after the photos, and the UDIDs to
      # $RUNNER_TEMP/required-simulators-udids.txt, which the pickers of the later steps take first (so they boot the very
      # devices checked here). When the name is on two runtimes of that version (iOS 27.2 has two sets, the usual devices'
      # and the iPhone Duo's, §3.1), every other device is taken from the runtime with no iPhone Duo and the iPhone Duo from
      # the runtime of iPhone Duos only; a warning only when nothing tells the runtimes apart. The same lines in every job
      # that boots a simulator; only the table differs.
      - name: Required simulators (1.4)
        id: required
        env:
          # <id>|<exact name>|<runtime version> (docs/M7D_CONTRACT.md §3.2)
          REQUIRED: |
            ipad13|iPad Pro 13-inch (M5)|27.2
            iphone69|iPhone 18 Pro Max|27.2
        run: |
          set -euo pipefail
          printf '%s\n' "$REQUIRED" | grep -v '^[[:space:]]*$' > "$RUNNER_TEMP/required-simulators.txt"
          xcrun simctl list -j > "$RUNNER_TEMP/simctl-list.json"
          python3 -I - "$RUNNER_TEMP/simctl-list.json" "$RUNNER_TEMP/required-simulators.txt" <<'EOF'
          import json, os, re, sys
          data = json.load(open(sys.argv[1], encoding="utf-8"))
          runtimes = {r.get("identifier"): r for r in data.get("runtimes", [])}
          def version(runtime):                                  # the runtime's "version" ("27.2"), else from its identifier
              v = runtimes.get(runtime, {}).get("version")
              if v:
                  return v
              m = re.search(r"iOS-([0-9]+)-([0-9]+)", runtime)
              return "%s.%s" % m.groups() if m else "?"
          devices = {runtime: [d for d in items if d.get("isAvailable") and d.get("name") and d.get("udid")]
                     for runtime, items in data.get("devices", {}).items() if "iOS" in runtime}
          def duos(runtime):                                     # 0: iPhone Duos only, 1: some, 2: none
              n = sum(d["name"].startswith("iPhone Duo") for d in devices[runtime])
              return 0 if n == len(devices[runtime]) else 1 if n else 2
          failed = False
          outputs = []
          resolved = []
          for line in open(sys.argv[2], encoding="utf-8"):
              ident, name, want = [p.strip() for p in line.rstrip("\n").split("|")]
              def wanted(runtime):
                  return version(runtime) == want or version(runtime).startswith(want + ".")
              # The runtime that suits the name first: for the iPhone Duo the one of iPhone Duos only (the Duo's own iOS 27.2
              # set), for every other device the one with no iPhone Duo (§3.1); then a runtime with some iPhone Duos.
              found = sorted((duos(runtime) if name.startswith("iPhone Duo") else 2 - duos(runtime), runtime, d["udid"])
                             for runtime, items in devices.items() if wanted(runtime) for d in items if d["name"] == name)
              if not found:
                  there = sorted({d["name"] for runtime, items in devices.items() if wanted(runtime) for d in items})
                  print("::error::%s: no available simulator \"%s\" on iOS %s (docs/M7D_CONTRACT.md §3.2). The devices of iOS %s: %s"
                        % (ident, name, want, want, ", ".join(there) or "none (no such runtime)"))
                  failed = True
                  continue
              _, runtime, udid = found[0]
              r = runtimes.get(runtime, {})
              print("%s: %s | %s (%s) %s" % (ident, name, r.get("name", runtime), r.get("buildversion", "?"), udid))
              if len(found) > 1:
                  tie = found[0][0] == found[1][0]
                  print("%s%s: \"%s\" is on %d runtimes of iOS %s (%s); %s is taken (%s)."
                        % ("::warning::" if tie else "", ident, name, len(found), want, ", ".join(f[1] for f in found), runtime,
                           "nothing tells them apart: the first by its identifier" if tie
                           else "iPhone Duos only" if name.startswith("iPhone Duo") else "no iPhone Duo"))
              outputs.append("%s=%s\n" % (ident, udid))
              resolved.append("%s|%s|%s|%s\n" % (ident, name, r.get("name", runtime), r.get("buildversion", "?")))
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as out:
              out.write("".join(outputs))
          with open(sys.argv[2].replace(".txt", "-resolved.txt"), "w", encoding="utf-8") as out:
              out.write("".join(resolved))
          with open(sys.argv[2].replace(".txt", "-udids.txt"), "w", encoding="utf-8") as out:
              out.write("".join(o.split("=", 1)[1] for o in outputs))
          sys.exit(1 if failed else 0)
          EOF

      # 1.4 (docs/M7D_CONTRACT.md §3.3 4, 0d-28): XcodeGen 2.46.0 from its release zip, pinned by sha256, the same in every
      # job (until 1.3 `brew install xcodegen`, whose version was the image's formula). The script fails unless
      # `xcodegen --version` then says 2.46.0; the job's later steps find it first in PATH.
      - name: Install XcodeGen
        run: |
          set -euo pipefail
          bash "$GITHUB_WORKSPACE/tools/ci/install-xcodegen.sh"

      - name: Generate the Xcode project
        run: |
          set -euo pipefail
          xcodegen generate

      - name: Build for the iOS Simulator
        run: |
          set -euo pipefail
          xcodebuild \
            -project TegakiCalendar.xcodeproj \
            -scheme TegakiCalendar \
            -configuration Debug \
            -destination "generic/platform=iOS Simulator" \
            -derivedDataPath build/DerivedData \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            build

      - name: Shots (13-inch iPad and 6.9-inch iPhone)
        timeout-minutes: 45
        continue-on-error: true
        run: |
          set -uo pipefail
          APP="$(find build/DerivedData -name "TegakiCalendar.app" -path "*iphonesimulator*" -not -path "*/Index.noindex/*" | head -1)"
          BUNDLE="com.syfan0.tegakicalendar"
          mkdir -p shots shots/store
          # 1.4 (docs/M7D_CONTRACT.md §3.3 3, gate 8): this job's environment (the lines of build.yml's env.txt), then each
          # device it takes ("<id>: <name> | <runtime> (<build>)", sim_env), which "The simulators used are the table's" reads.
          {
            xcodebuild -version
            echo "Xcode path: $(xcode-select -p)"
            echo "runner image: ${ImageOS:-?} ${ImageVersion:-?}"
            echo "xcodegen: $(xcodegen --version 2>&1 | head -n 1)"
            echo "python3: $(python3 --version 2>&1)"
            xcrun simctl list runtimes
          } > shots/env.txt || echo "::warning::env.txt could not all be written"
          sim_env() {  # sim_env <device id> <udid>: "<id>: <device name> | <runtime name> (<runtime build>)"
            xcrun simctl list -j | SIM_ID="$1" SIM_UDID="$2" python3 -I -c '
          import json, os, sys
          data = json.load(sys.stdin)
          runtimes = {r.get("identifier"): r for r in data.get("runtimes", [])}
          for runtime, items in data.get("devices", {}).items():
              for d in items:
                  if d.get("udid") == os.environ["SIM_UDID"]:
                      r = runtimes.get(runtime, {})
                      print("%s: %s | %s (%s)" % (os.environ["SIM_ID"], d.get("name"), r.get("name", runtime), r.get("buildversion", "?")))
                      raise SystemExit
          print("%s: (no simulator %s)" % (os.environ["SIM_ID"], os.environ["SIM_UDID"]))
          '
          }
          if [ -z "$APP" ]; then
            echo "::warning::TegakiCalendar.app not found under build/DerivedData; no shots."
            exit 0
          fi
          # The photos' day and the status bar's 9:41 in this runner's time zone at that date (the runners are
          # on UTC, GitHub says; the simulator takes the host's zone, and an ISO date in another zone would shift
          # the bar's time or date). `date` writes +0000, ISO 8601 with a colon is +00:00.
          STAMP="$(date -j -f "%Y-%m-%d %H:%M:%S" "2026-10-07 09:41:00" "+%Y-%m-%dT%H:%M:%S%z" 2>/dev/null || echo "2026-10-07T09:41:00+0000")"
          STATUS_TIME="${STAMP:0:22}:${STAMP:22:2}"
          echo "runner: $(date) TZ=${TZ:-unset}; the status bar's time: $STATUS_TIME"
          # The ISO time came out as "9:41 AM" on the ko and zh-Hant iPads (run 42077397646): the AM in English.
          # The 12-hour regions' iPads get their own words as plain text first (not checked: look at the photos).
          case "$SET_LOCALE" in
            ko_KR) STATUS_TEXT="오전 9:41" ;;
            zh_TW) STATUS_TEXT="上午9:41" ;;
            es_MX) STATUS_TEXT="9:41 a.m." ;;
            *) STATUS_TEXT="" ;;
          esac
          shoot() {  # shoot <page> [<file tag> <more arguments>…]: one photo; a failure only loses this one file
            local PAGE="$1" TAG="${2:-$1}"
            shift; [ $# -gt 0 ] && shift
            xcrun simctl terminate "$UDID" "$BUNDLE" 2>/dev/null || true
            sleep 1
            # ${@+"$@"}: no more arguments is not an unbound variable under set -u in bash 3.2.
            xcrun simctl launch "$UDID" "$BUNDLE" --screenshot-mode --screenshot-month 2026-10 --screenshot-page "$PAGE" \
              --screenshot-holidays auto --screenshot-week-start auto --screenshot-store-ink ${@+"$@"} \
              -AppleLanguages "($SET_LANGUAGE)" -AppleLocale "$SET_LOCALE" || { echo "::warning::launch failed ($ID, $TAG)"; return 0; }
            sleep 9
            # `grep` without -q reads the whole list (docs/M7C.md, S1 の残り, decision 8): with -q it stops at the first match,
            # simctl, still writing the list, gets SIGPIPE, and pipefail makes the pipeline fail although the app is in
            # the list (a false warning in 0–9 of build.yml's photos and 5–14 of l10n-shots' in the runs of 11/11–12;
            # none in the prototype's span-shots, removed in S6, which read the whole list). An app not in the list, or no list, still warns.
            xcrun simctl spawn "$UDID" launchctl list 2>/dev/null | grep tegakicalendar > /dev/null || echo "::warning::The app is not running after 9 s ($ID, $TAG)"
            xcrun simctl io "$UDID" screenshot "shots/$ID-portrait-$TAG.png" || echo "::warning::screenshot failed ($ID, $TAG)"
          }
          # device-id | exact first choice | prefix fallbacks (in order). As in build.yml, on "iPad Air 13-inch"
          # the pixels are still accepted; on "iPhone 17 Pro" they are 6.3-inch and the next step warns.
          # 1.4 (docs/M7D_CONTRACT.md §3.2): iphone69 is the iPhone 18 Pro Max, the same list as build.yml's; a device other
          # than the table's fails the job at "The simulators used are the table's".
          for SPEC in "ipad13|iPad Pro 13-inch (M5)|iPad Pro 13,iPad Air 13" \
                      "iphone69|iPhone 18 Pro Max|iPhone 18 Pro Max,iPhone 17 Pro Max"; do
            ID="${SPEC%%|*}"; REST="${SPEC#*|}"; EXACT="${REST%%|*}"; PREFIXES="${REST#*|}"
            FOUND="$(xcrun simctl list -j devices available | SIM_EXACT="$EXACT" SIM_PREFIXES="$PREFIXES" python3 -c '
          import json, os, re, sys
          devices = json.load(sys.stdin).get("devices", {})
          def version(runtime):                                  # "…iOS-26-5" → (26, 5)
              m = re.search(r"iOS-(\d+)-(\d+)", runtime)
              return (int(m.group(1)), int(m.group(2))) if m else (0, 0)
          try:                                                   # 1.4 (docs/M7D_CONTRACT.md §3.2): "Required simulators"
              required = set(open(os.path.join(os.environ["RUNNER_TEMP"], "required-simulators-udids.txt"), encoding="utf-8").read().split())
          except (KeyError, OSError):
              required = set()
          found = {}                                             # name → (udid, key): one Required resolved (1.4) > the newest iOS
          for runtime, items in devices.items():
              if "iOS" not in runtime:
                  continue
              for d in items:
                  if not (d.get("isAvailable") and d.get("name") and d.get("udid")):
                      continue
                  key = (d["udid"] in required, version(runtime))
                  if d["name"] not in found or key > found[d["name"]][1]:
                      found[d["name"]] = (d["udid"], key)
          exact = os.environ["SIM_EXACT"]
          if exact in found:
              print(exact + "|" + found[exact][0])
              raise SystemExit
          for prefix in os.environ["SIM_PREFIXES"].split(","):
              for name in sorted(found):
                  if name.startswith(prefix):
                      print(name + "|" + found[name][0])
                      raise SystemExit
          print("")
          ' || true)"
            if [ -z "$FOUND" ]; then echo "::error::No simulator for $ID (docs/M7D_CONTRACT.md §3.2); the job fails at \"The simulators used are the table's\"."; continue; fi
            NAME="${FOUND%%|*}"; UDID="${FOUND##*|}"
            echo "$ID: $NAME ($UDID)"
            sim_env "$ID" "$UDID" >> shots/env.txt || echo "::warning::no runtime line for $ID"
            xcrun simctl boot "$UDID" || true
            xcrun simctl bootstatus "$UDID" -b || { echo "::warning::$ID ($NAME) did not boot; skipping."; continue; }
            # The whole device in the set's language and region, so the status bar is too (the launch's
            # -AppleLanguages reaches only the app). They count from the next boot. A failure of defaults or of
            # status_bar does not stop the photos; a device that does not boot again is skipped, as on the first boot.
            xcrun simctl spawn "$UDID" defaults write -g AppleLanguages -array "$SET_LANGUAGE" || echo "::warning::$ID: the device's language was not set."
            xcrun simctl spawn "$UDID" defaults write -g AppleLocale -string "$SET_LOCALE" || echo "::warning::$ID: the device's region was not set."
            xcrun simctl shutdown "$UDID" || true
            xcrun simctl boot "$UDID" || true
            xcrun simctl bootstatus "$UDID" -b || { echo "::warning::$ID ($NAME) did not boot again; skipping."; continue; }
            xcrun simctl ui "$UDID" appearance light || true
            # The status bar's time. simctl's help says an ISO date string also sets the date "on relevant
            # devices"; on the iPad of run 42077397646 (2026-11-06) it set the time, in the set's own form (09:41,
            # 9:41 AM), and left the date at the day of the shoot. The iPhone's bar has no AM/PM in any region and a
            # Wi-Fi iPad no cellular bars, so the region's words go to the iPad and full cellular bars (the iPhones
            # showed four grey dots) to the iPhone, in a call before the time's: an override adds what it is given
            # (if it replaced instead, the time's call, last, still wins). Each later time line is the way back.
            if [ "$ID" = iphone69 ]; then
              xcrun simctl status_bar "$UDID" override --dataNetwork wifi --cellularMode active --cellularBars 4 --operatorName "" \
                || echo "::warning::$ID: the cellular bars were not set."
            fi
            TEXT=""
            if [ "$ID" = ipad13 ]; then TEXT="$STATUS_TEXT"; fi
            { [ -n "$TEXT" ] && xcrun simctl status_bar "$UDID" override --time "$TEXT" --batteryState charged --batteryLevel 100 --wifiBars 3; } \
              || xcrun simctl status_bar "$UDID" override --time "$STATUS_TIME" --batteryState charged --batteryLevel 100 --wifiBars 3 \
              || xcrun simctl status_bar "$UDID" override --time "9:41" --batteryState charged --batteryLevel 100 --wifiBars 3 \
              || true
            if ! xcrun simctl install "$UDID" "$APP"; then
              echo "::warning::install failed on $ID; skipping."
              xcrun simctl shutdown "$UDID" || true
              continue
            fi
            xcrun simctl launch "$UDID" "$BUNDLE" --screenshot-mode --screenshot-month 2026-10 --screenshot-page month || true
            sleep 120
            xcrun simctl terminate "$UDID" "$BUNDLE" 2>/dev/null || true
            for ROUND in first retake; do   # the retake is the file that is kept (see the head of this file)
              for PAGE in month week day year span; do
                if [ "$PAGE" = span ]; then
                  shoot week span --screenshot-span on --screenshot-offset-x -0.5
                else
                  shoot "$PAGE"
                fi
              done
            done
            if [ "$ID" = iphone69 ]; then
              # 1.4 (docs/M7D_CONTRACT.md §3.2): the iPhone 18 Pro Max's pixels go into env.txt, as in build.yml.
              PIXELS="$(sips -g pixelWidth -g pixelHeight "shots/$ID-portrait-month.png" 2>/dev/null | awk '/pixel(Width|Height)/ { printf "%s%s", (n++ ? "x" : ""), $2 }' || true)"
              echo "iphone69 pixels: ${PIXELS:-no photo} ($ID-portrait-month.png)" >> shots/env.txt || true
            fi
            xcrun simctl terminate "$UDID" "$BUNDLE" 2>/dev/null || true
            xcrun simctl shutdown "$UDID" || true
          done
          ls -la shots

      # The same conversion and the same sizes as "Store listing set" in build.yml (docs/M6_CONTRACT.md §4.1).
      - name: Store listing set (JPEG, App Store sizes)
        if: always()
        continue-on-error: true
        run: |
          set -uo pipefail
          mkdir -p shots/store/ipad13 shots/store/iphone69
          accepted() {  # accepted <device>: Apple's accepted portrait pixel sizes (docs/M6_CONTRACT.md §4.1)
            case "$1" in
              ipad13)   echo "2064x2752 2048x2732" ;;
              iphone69) echo "1320x2868 1290x2796 1260x2736" ;;
              *)        echo "" ;;
            esac
          }
          store() {  # store <device> <NN-name> <source shot without .png>: convert, then check the size
            local DEV="$1" NAME="$2" SRC="shots/$3.png" OUT="shots/store/$1/$2.jpg" W H SIZE
            if [ ! -f "$SRC" ]; then echo "::warning::store/$DEV/$NAME.jpg: source $SRC is missing; skipped."; return 0; fi
            if ! sips -s format jpeg -s formatOptions 100 "$SRC" --out "$OUT" > /dev/null; then echo "::warning::store/$DEV/$NAME.jpg: sips could not convert $SRC."; return 0; fi
            W="$(sips -g pixelWidth "$OUT" | awk '/pixelWidth/ {print $2}')"
            H="$(sips -g pixelHeight "$OUT" | awk '/pixelHeight/ {print $2}')"
            SIZE="${W}x${H}"
            case " $(accepted "$DEV") " in
              *" $SIZE "*) echo "store/$DEV/$NAME.jpg: ${SIZE} (accepted for $DEV)" ;;
              *) echo "::warning::store/$DEV/$NAME.jpg is ${SIZE}, not one of the accepted sizes for $DEV ($(accepted "$DEV"))." ;;
            esac
          }
          store ipad13   00-span  ipad13-portrait-span
          store ipad13   01-month ipad13-portrait-month
          store ipad13   02-week  ipad13-portrait-week
          store ipad13   03-day   ipad13-portrait-day
          store ipad13   04-year  ipad13-portrait-year
          store iphone69 00-span  iphone69-portrait-span
          store iphone69 01-week  iphone69-portrait-week
          store iphone69 02-month iphone69-portrait-month
          store iphone69 03-day   iphone69-portrait-day
          store iphone69 04-year  iphone69-portrait-year
          ls -la shots/store/*

      - name: Upload the photos
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: store-${{ matrix.set.id }}
          path: shots/store
          retention-days: 30
          if-no-files-found: warn
          overwrite: true

      # 1.4 (docs/M7D_CONTRACT.md §3.3 3, gate 8): the job's env.txt as an artifact of its own, beside store-<set>, so that
      # one keeps only the device folders that go to App Store Connect (as until 1.3).
      - name: Upload the environment
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: env-store-${{ matrix.set.id }}
          path: shots/env.txt
          retention-days: 30
          if-no-files-found: warn
          overwrite: true

      # 1.4 (docs/M7D_CONTRACT.md §3.2): the devices this job took are the table's ("Required simulators"): each line
      # "<id>: <name> | <runtime> (<build>)" of its env.txt has the table's name, on the runtime (name and build) that
      # "Required simulators" found for it, and every device of the table has a line (none means it was not found, and its
      # photos or tests are missing). A prefix fallback that landed on another device, or another runtime taken instead of
      # the table's (a newer one, or the iPhone Duo's iOS 27.2), fails the job here. The same lines in every job that boots
      # a simulator; only ENV_TXT differs.
      - name: The simulators used are the table's (1.4)
        if: ${{ !cancelled() && env.QUICK != 'true' }}
        env:
          ENV_TXT: shots/env.txt
        run: |
          set -euo pipefail
          python3 -I - "$RUNNER_TEMP/required-simulators.txt" "$ENV_TXT" <<'EOF'
          import re, sys
          table = [[p.strip() for p in line.rstrip("\n").split("|")] for line in open(sys.argv[1], encoding="utf-8") if line.strip()]
          try:
              resolved = {row[0]: row[2:] for row in (line.rstrip("\n").split("|") for line in open(sys.argv[1].replace(".txt", "-resolved.txt"), encoding="utf-8")) if len(row) == 4}
          except OSError:
              resolved = {}
          try:
              lines = open(sys.argv[2], encoding="utf-8").read().splitlines()
          except OSError as error:
              print("::error::%s could not be read (%s): the devices this job took are not known (docs/M7D_CONTRACT.md §3.2)." % (sys.argv[2], error))
              sys.exit(1)
          taken = {}
          for line in lines:
              m = re.fullmatch(r"([a-z0-9]+): (.+) \| (.+) \(([^()]*)\)", line)
              if m:
                  taken.setdefault(m.group(1), []).append(m.group(2, 3, 4))
          failed = False
          for ident, name, want in table:
              if ident not in taken:
                  print("::error::%s (%s): no line in %s, so it was not taken (docs/M7D_CONTRACT.md §3.2)." % (ident, name, sys.argv[2]))
                  failed = True
              for got, runtime, build in taken.get(ident, []):
                  if ident in resolved:
                      ok = got == name and [runtime, build] == resolved[ident]
                      where = "%s (%s)" % tuple(resolved[ident])
                  else:
                      ok = got == name and (runtime == "iOS " + want or runtime.startswith("iOS " + want + "."))
                      where = "iOS " + want
                  print("%s: %s | %s (%s): %s" % (ident, got, runtime, build, "the table's" if ok else "NOT the table's"))
                  if not ok:
                      print("::error::%s took %s on %s (%s), not the table's %s on %s (docs/M7D_CONTRACT.md §3.2)." % (ident, got, runtime, build, name, where))
                      failed = True
          sys.exit(1 if failed else 0)
          EOF
