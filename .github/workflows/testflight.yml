# Signs the app and uploads it to TestFlight (docs/M2_CONTRACT.md §8, docs/DESIGN.md §8.3).
#
# Manual only (workflow_dispatch). It needs seven repository secrets, made once after the Apple
# Developer Program enrollment (docs/APPLE_ENROLLMENT.md):
#
#   BUILD_CERTIFICATE_BASE64          Apple Distribution certificate + private key (.p12), base64
#   P12_PASSWORD                      password of that .p12
#   BUILD_PROVISION_PROFILE_BASE64    App Store provisioning profile (.mobileprovision), base64
#   KEYCHAIN_PASSWORD                 any password for the temporary keychain made on the runner
#   APP_STORE_CONNECT_API_KEY_ID      App Store Connect API key id (10 characters)
#   APP_STORE_CONNECT_ISSUER_ID       App Store Connect issuer id (UUID)
#   APP_STORE_CONNECT_API_KEY_BASE64  the AuthKey_<id>.p8 file, base64
#
# The team id, profile name and profile UUID are read from the provisioning profile itself, so no
# further secret is needed. The build number is the workflow run number (unique per upload).
name: testflight

on:
  workflow_dispatch:
    inputs:
      marketing_version:
        description: "表示用バージョン（空なら project.yml の MARKETING_VERSION）"
        required: false
        default: ""

concurrency:
  group: testflight
  cancel-in-progress: false

jobs:
  upload:
    name: Archive, sign and upload to TestFlight
    runs-on: macos-26
    timeout-minutes: 90
    env:
      HOMEBREW_NO_AUTO_UPDATE: "1"
      HOMEBREW_NO_INSTALL_CLEANUP: "1"
      NSUnbufferedIO: "YES"

    steps:
      # Fail at once, in plain Japanese, when any secret is missing (before anything is built).
      - name: Check the secrets
        env:
          BUILD_CERTIFICATE_BASE64: ${{ secrets.BUILD_CERTIFICATE_BASE64 }}
          P12_PASSWORD: ${{ secrets.P12_PASSWORD }}
          BUILD_PROVISION_PROFILE_BASE64: ${{ secrets.BUILD_PROVISION_PROFILE_BASE64 }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
          APP_STORE_CONNECT_API_KEY_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_ID }}
          APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          APP_STORE_CONNECT_API_KEY_BASE64: ${{ secrets.APP_STORE_CONNECT_API_KEY_BASE64 }}
        run: |
          set -euo pipefail
          missing=""
          for name in BUILD_CERTIFICATE_BASE64 P12_PASSWORD BUILD_PROVISION_PROFILE_BASE64 KEYCHAIN_PASSWORD \
                      APP_STORE_CONNECT_API_KEY_ID APP_STORE_CONNECT_ISSUER_ID APP_STORE_CONNECT_API_KEY_BASE64; do
            if [ -z "${!name:-}" ]; then
              missing="$missing $name"
            fi
          done
          if [ -n "$missing" ]; then
            echo "::error::TestFlight への配信に必要な Secrets が設定されていません:$missing"
            echo ""
            echo "GitHub のリポジトリ → Settings → Secrets and variables → Actions で次を登録してください。"
            echo "  BUILD_CERTIFICATE_BASE64         Apple Distribution の証明書（秘密鍵つき .p12）を base64 にしたもの"
            echo "  P12_PASSWORD                     その .p12 のパスワード"
            echo "  BUILD_PROVISION_PROFILE_BASE64   App Store 用プロビジョニングプロファイル（.mobileprovision）を base64 にしたもの"
            echo "  KEYCHAIN_PASSWORD                一時キーチェーン用の任意のパスワード"
            echo "  APP_STORE_CONNECT_API_KEY_ID     App Store Connect API キーの ID（10 文字）"
            echo "  APP_STORE_CONNECT_ISSUER_ID      App Store Connect の Issuer ID"
            echo "  APP_STORE_CONNECT_API_KEY_BASE64 AuthKey_<ID>.p8 を base64 にしたもの"
            echo "手順は docs/APPLE_ENROLLMENT.md を参照。Apple Developer Program の承認後に登録できます。"
            exit 1
          fi
          echo "Secrets: すべて設定されています。"

      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Xcode
        run: |
          set -euo pipefail
          if [ -d /Applications/Xcode_26.6.app ]; then
            sudo xcode-select -s /Applications/Xcode_26.6.app
          fi
          xcode-select -p
          xcodebuild -version

      - name: Install XcodeGen
        run: |
          set -euo pipefail
          brew install xcodegen
          xcodegen --version

      - name: Generate the Xcode project
        run: |
          set -euo pipefail
          xcodegen generate
          xcodebuild -project TegakiCalendar.xcodeproj -list

      # Certificate → a temporary keychain; profile → ~/Library/MobileDevice/Provisioning Profiles.
      # Team id / profile name / UUID are read out of the profile for the archive step.
      - name: Install the signing certificate and the provisioning profile
        id: signing
        env:
          BUILD_CERTIFICATE_BASE64: ${{ secrets.BUILD_CERTIFICATE_BASE64 }}
          P12_PASSWORD: ${{ secrets.P12_PASSWORD }}
          BUILD_PROVISION_PROFILE_BASE64: ${{ secrets.BUILD_PROVISION_PROFILE_BASE64 }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
        run: |
          set -euo pipefail
          CERT_PATH="$RUNNER_TEMP/build_certificate.p12"
          PROFILE_PATH="$RUNNER_TEMP/build_profile.mobileprovision"
          KEYCHAIN_PATH="$RUNNER_TEMP/app-signing.keychain-db"

          echo -n "$BUILD_CERTIFICATE_BASE64" | base64 --decode -o "$CERT_PATH"
          echo -n "$BUILD_PROVISION_PROFILE_BASE64" | base64 --decode -o "$PROFILE_PATH"

          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security import "$CERT_PATH" -P "$P12_PASSWORD" -A -t cert -f pkcs12 -k "$KEYCHAIN_PATH"
          security set-key-partition-list -S apple-tool:,apple: -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security list-keychain -d user -s "$KEYCHAIN_PATH"

          PROFILES_DIR="$HOME/Library/MobileDevice/Provisioning Profiles"
          mkdir -p "$PROFILES_DIR"
          PLIST="$RUNNER_TEMP/profile.plist"
          security cms -D -i "$PROFILE_PATH" > "$PLIST"
          PROFILE_UUID="$(/usr/libexec/PlistBuddy -c 'Print :UUID' "$PLIST")"
          PROFILE_NAME="$(/usr/libexec/PlistBuddy -c 'Print :Name' "$PLIST")"
          TEAM_ID="$(/usr/libexec/PlistBuddy -c 'Print :TeamIdentifier:0' "$PLIST")"
          PROFILE_APP_ID="$(/usr/libexec/PlistBuddy -c 'Print :Entitlements:application-identifier' "$PLIST")"
          cp "$PROFILE_PATH" "$PROFILES_DIR/$PROFILE_UUID.mobileprovision"

          echo "Profile: $PROFILE_NAME ($PROFILE_UUID), team $TEAM_ID, app id $PROFILE_APP_ID"
          case "$PROFILE_APP_ID" in
            "$TEAM_ID.com.syfan0.tegakicalendar") ;;
            *)
              echo "::error::プロビジョニングプロファイルの App ID（$PROFILE_APP_ID）が com.syfan0.tegakicalendar ではありません。"
              exit 1
              ;;
          esac

          # Identity name as the keychain knows it (e.g. "Apple Distribution: NAME (TEAMID)").
          IDENTITY="$(security find-identity -v -p codesigning "$KEYCHAIN_PATH" | sed -n 's/.*"\(.*\)".*/\1/p' | head -n 1)"
          if [ -z "$IDENTITY" ]; then
            echo "::error::.p12 の中に署名用の証明書（Apple Distribution）が見つかりません。"
            exit 1
          fi
          echo "Identity: $IDENTITY"

          {
            echo "team_id=$TEAM_ID"
            echo "profile_name=$PROFILE_NAME"
            echo "profile_uuid=$PROFILE_UUID"
            echo "identity=$IDENTITY"
            echo "keychain_path=$KEYCHAIN_PATH"
          } >> "$GITHUB_OUTPUT"

      - name: Archive (signed)
        env:
          TEAM_ID: ${{ steps.signing.outputs.team_id }}
          PROFILE_NAME: ${{ steps.signing.outputs.profile_name }}
          IDENTITY: ${{ steps.signing.outputs.identity }}
          MARKETING_VERSION_INPUT: ${{ github.event.inputs.marketing_version }}
        run: |
          set -euo pipefail
          # Plain string, not an array: /bin/bash on macOS is 3.2, where "${EMPTY[@]}" trips `set -u`.
          EXTRA=""
          if [ -n "${MARKETING_VERSION_INPUT:-}" ]; then
            EXTRA="MARKETING_VERSION=$MARKETING_VERSION_INPUT"
          fi
          # shellcheck disable=SC2086
          xcodebuild \
            -project TegakiCalendar.xcodeproj \
            -scheme TegakiCalendar \
            -configuration Release \
            -destination "generic/platform=iOS" \
            -archivePath "$RUNNER_TEMP/TegakiCalendar.xcarchive" \
            -derivedDataPath build/DerivedData \
            CODE_SIGN_STYLE=Manual \
            DEVELOPMENT_TEAM="$TEAM_ID" \
            CODE_SIGN_IDENTITY="$IDENTITY" \
            PROVISIONING_PROFILE_SPECIFIER="$PROFILE_NAME" \
            CURRENT_PROJECT_VERSION="${{ github.run_number }}" \
            $EXTRA \
            archive

      - name: Export the .ipa
        env:
          TEAM_ID: ${{ steps.signing.outputs.team_id }}
          PROFILE_NAME: ${{ steps.signing.outputs.profile_name }}
        run: |
          set -euo pipefail
          EXPORT_DIR="$RUNNER_TEMP/export"
          OPTIONS="$RUNNER_TEMP/ExportOptions.plist"
          cat > "$OPTIONS" <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key><string>app-store-connect</string>
            <key>destination</key><string>export</string>
            <key>signingStyle</key><string>manual</string>
            <key>teamID</key><string>$TEAM_ID</string>
            <key>uploadSymbols</key><true/>
            <key>provisioningProfiles</key>
            <dict>
              <key>com.syfan0.tegakicalendar</key><string>$PROFILE_NAME</string>
            </dict>
          </dict>
          </plist>
          EOF
          xcodebuild \
            -exportArchive \
            -archivePath "$RUNNER_TEMP/TegakiCalendar.xcarchive" \
            -exportOptionsPlist "$OPTIONS" \
            -exportPath "$EXPORT_DIR"
          ls -la "$EXPORT_DIR"
          IPA="$(ls "$EXPORT_DIR"/*.ipa | head -n 1)"
          if [ -z "$IPA" ]; then
            echo "::error::.ipa が書き出されませんでした。"
            exit 1
          fi
          echo "ipa_path=$IPA" >> "$GITHUB_ENV"

      # altool reads the key from ~/private_keys/AuthKey_<KEY_ID>.p8.
      - name: Upload to TestFlight (altool)
        env:
          APP_STORE_CONNECT_API_KEY_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_ID }}
          APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          APP_STORE_CONNECT_API_KEY_BASE64: ${{ secrets.APP_STORE_CONNECT_API_KEY_BASE64 }}
        run: |
          set -euo pipefail
          mkdir -p "$HOME/private_keys"
          echo -n "$APP_STORE_CONNECT_API_KEY_BASE64" | base64 --decode -o "$HOME/private_keys/AuthKey_$APP_STORE_CONNECT_API_KEY_ID.p8"
          xcrun altool --validate-app --type ios --file "$ipa_path" \
            --apiKey "$APP_STORE_CONNECT_API_KEY_ID" --apiIssuer "$APP_STORE_CONNECT_ISSUER_ID"
          xcrun altool --upload-app --type ios --file "$ipa_path" \
            --apiKey "$APP_STORE_CONNECT_API_KEY_ID" --apiIssuer "$APP_STORE_CONNECT_ISSUER_ID"
          echo "TestFlight へアップロードしました（ビルド番号 ${{ github.run_number }}）。App Store Connect で処理が終わるまで数分かかります。"

      - name: Clean up the keychain and keys
        if: always()
        env:
          KEYCHAIN_PATH: ${{ steps.signing.outputs.keychain_path }}
        run: |
          set +e
          if [ -n "${KEYCHAIN_PATH:-}" ] && [ -f "$KEYCHAIN_PATH" ]; then
            security delete-keychain "$KEYCHAIN_PATH"
          fi
          rm -rf "$HOME/private_keys" "$RUNNER_TEMP/build_certificate.p12" "$RUNNER_TEMP/build_profile.mobileprovision" "$RUNNER_TEMP/profile.plist"
          exit 0
