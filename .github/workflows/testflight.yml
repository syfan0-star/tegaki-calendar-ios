# Signs the app and uploads it to TestFlight (docs/M2_CONTRACT.md §8, docs/DESIGN.md §8.3).
#
# Manual only (workflow_dispatch). It needs seven repository secrets, made once after the Apple
# Developer Program enrollment (docs/APPLE_ENROLLMENT.md):
#
#   BUILD_CERTIFICATE_BASE64          Apple Distribution certificate + private key (.p12), base64
#   P12_PASSWORD                      password of that .p12
#   BUILD_PROVISION_PROFILE_BASE64    App Store provisioning profile (.mobileprovision), base64
#   KEYCHAIN_PASSWORD                 any password for the temporary keychain made on the runner
#   APP_STORE_CONNECT_API_KEY_ID      App Store Connect API key id (10 characters)
#   APP_STORE_CONNECT_ISSUER_ID       App Store Connect issuer id (UUID)
#   APP_STORE_CONNECT_API_KEY_BASE64  the AuthKey_<id>.p8 file, base64
#
# The team id, profile name and profile UUID are read from the provisioning profile itself, so no
# further secret is needed. The build number is the workflow run number (unique per upload).
#
# 1.2.2 (docs/R1_2_2.md §4, §6.4): the app has the Declared Age Range entitlement, so the profile must
# carry it too ("Check the profile for Declared Age Range"); the signed archive is checked for the
# entitlement and for the weak link of DeclaredAgeRange ("Check the archive"). The input `age_force`
# ("1" only) makes the one check build of §6.4 (AGE_FORCE: Apple's flag is taken as set, so Apple's
# age range sheet comes up on any account on iOS / iPadOS 26.2 or later). That build is never submitted.
#
# 1.3 (docs/M7C_CONTRACT.md §8.1, §8.2, §11.1): every build may be submitted, so "Every word of the app in ten
# languages" fails the build before anything is built while a word of the app lacks one of the ten languages. S6
# (§11.1 4) took out the prototype build of 「横につなげる」 (the input `span_prototype`, its check against 43fe366
# and the check of its archive; the build of 11/12 came from the tag r13-proto-1, which keeps them).
#
# 1.4 (docs/M7D_CONTRACT.md §3.3, §3.4, D0): the runner is the image `xcode-27` and the Xcode 27.2, chosen as in build.yml
# (§3.1: by `xcodebuild -version`, a release build, or the job fails), so the archive is built with the iOS 27.2 SDK that
# App Store Connect will require from April 2027 (ITMS-90725); XcodeGen is 2.46.0 from its release zip, pinned by sha256
# (§3.3 4). "Check the archive" also reads the app's Info.plist: DTSDKName must be iphoneos27.2, MinimumOSVersion 17.0 and
# UIDeviceFamily 1, 2, and DTXcode, DTXcodeBuild and DTPlatformVersion go to the log (a build ending in a lower-case
# letter is a beta's and fails). D0's build is uploaded but not given to testers (0d-6).
name: testflight

on:
  workflow_dispatch:
    inputs:
      marketing_version:
        description: "表示用バージョン（空なら project.yml の MARKETING_VERSION）"
        required: false
        default: ""
      # 1.2.2 (docs/R1_2_2.md §6.4): the check build only. Empty for every other build.
      age_force:
        description: "年齢の確かめ用（1 のときだけ。審査に出さない）"
        required: false
        default: ""

concurrency:
  group: testflight
  cancel-in-progress: false

jobs:
  upload:
    name: Archive, sign and upload to TestFlight
    # 1.4 (docs/M7D_CONTRACT.md §3.1, §3.3 1, 0d-2): the image with Xcode 27 (macos-26 and macos-15 do not get it).
    runs-on: xcode-27
    timeout-minutes: 90
    env:
      HOMEBREW_NO_AUTO_UPDATE: "1"
      HOMEBREW_NO_INSTALL_CLEANUP: "1"
      NSUnbufferedIO: "YES"

    steps:
      # Fail at once, in plain Japanese, when any secret is missing (before anything is built).
      - name: Check the secrets
        env:
          BUILD_CERTIFICATE_BASE64: ${{ secrets.BUILD_CERTIFICATE_BASE64 }}
          P12_PASSWORD: ${{ secrets.P12_PASSWORD }}
          BUILD_PROVISION_PROFILE_BASE64: ${{ secrets.BUILD_PROVISION_PROFILE_BASE64 }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
          APP_STORE_CONNECT_API_KEY_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_ID }}
          APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          APP_STORE_CONNECT_API_KEY_BASE64: ${{ secrets.APP_STORE_CONNECT_API_KEY_BASE64 }}
        run: |
          set -euo pipefail
          missing=""
          for name in BUILD_CERTIFICATE_BASE64 P12_PASSWORD BUILD_PROVISION_PROFILE_BASE64 KEYCHAIN_PASSWORD \
                      APP_STORE_CONNECT_API_KEY_ID APP_STORE_CONNECT_ISSUER_ID APP_STORE_CONNECT_API_KEY_BASE64; do
            if [ -z "${!name:-}" ]; then
              missing="$missing $name"
            fi
          done
          if [ -n "$missing" ]; then
            echo "::error::TestFlight への配信に必要な Secrets が設定されていません:$missing"
            echo ""
            echo "GitHub のリポジトリ → Settings → Secrets and variables → Actions で次を登録してください。"
            echo "  BUILD_CERTIFICATE_BASE64         Apple Distribution の証明書（秘密鍵つき .p12）を base64 にしたもの"
            echo "  P12_PASSWORD                     その .p12 のパスワード"
            echo "  BUILD_PROVISION_PROFILE_BASE64   App Store 用プロビジョニングプロファイル（.mobileprovision）を base64 にしたもの"
            echo "  KEYCHAIN_PASSWORD                一時キーチェーン用の任意のパスワード"
            echo "  APP_STORE_CONNECT_API_KEY_ID     App Store Connect API キーの ID（10 文字）"
            echo "  APP_STORE_CONNECT_ISSUER_ID      App Store Connect の Issuer ID"
            echo "  APP_STORE_CONNECT_API_KEY_BASE64 AuthKey_<ID>.p8 を base64 にしたもの"
            echo "手順は docs/APPLE_ENROLLMENT.md を参照。Apple Developer Program の承認後に登録できます。"
            exit 1
          fi
          echo "Secrets: すべて設定されています。"

      - name: Checkout
        uses: actions/checkout@v4

      # 1.3 (docs/M7C_CONTRACT.md §8.1, §8.2, §11.1): every build is one that may be submitted, so every word of the
      # app's table has the ten languages (the new words of §8.1 were ja only until X translated them; since S6 build.py
      # takes no ja-only key of the app, and this step stays as the archive's own check of the table it builds).
      - name: Every word of the app in ten languages
        run: |
          set -euo pipefail
          python3 -I - <<'EOF'
          import json, sys
          languages = {"ja", "en", "zh-Hans", "zh-Hant", "ko", "fr", "de", "es", "it", "pt-BR"}
          with open("Sources/TegakiCalendar/Resources/Localizable.xcstrings", encoding="utf-8") as f:
              table = json.load(f)["strings"]
          short = sorted((key, sorted(languages - set(entry.get("localizations", {}))))
                         for key, entry in table.items())
          short = [(key, missing) for key, missing in short if missing]
          for key, missing in short:
              print(f"{key}: no {' '.join(missing)}")
          if short:
              print(f"::error::訳の無い文が {len(short)} 個あります（docs/M7C_CONTRACT.md §8.2 の X の訳の前）。このビルドは審査に出せません。")
              sys.exit(1)
          print(f"{len(table)} keys: every one has the ten languages")
          EOF

      # 1.4 (docs/M7D_CONTRACT.md §3.1, 0d-1): Xcode 27.2, chosen by what each candidate says it is, never by its path.
      # Every /Applications/Xcode_27.2*.app is read with `xcodebuild -version` (DEVELOPER_DIR set to it); one whose version is
      # 27.2 or 27.2.x and whose build ends in a digit is a release (a beta's build ends in a lower-case letter, as 27.3
      # beta's 27C5020n; the rolling-out image 20261119 gives that beta aliases named like a release, §3.1), and the newest
      # release is selected. None fails the job: until 1.3 this step chose Xcode 26.6 only when it was there and otherwise
      # went on with the image's default Xcode, unseen. Then `sudo xcodebuild -runFirstLaunch` (harmless when it has run).
      # The same lines in every job on xcode-27 (build.yml, ja-baseline.yml, store-shots.yml, testflight.yml, duo.yml).
      - name: Select Xcode 27.2
        run: |
          set -euo pipefail
          XCODE="$(python3 -I -c '
          import glob, os, re, subprocess, sys
          def key(version, build):                               # (27, 2, 0), then the build: digits as numbers
              numbers = tuple((int(p) for p in version.split("."))) + (0, 0, 0)
              return numbers[:3], tuple((0, int(t)) if t.isdigit() else (1, t) for t in re.findall(r"[0-9]+|[^0-9]+", build))
          best = None
          seen = {}
          for app in sorted(glob.glob("/Applications/Xcode_27.2*.app")):
              real = os.path.realpath(app)
              if real in seen:
                  print("%s: the same Xcode as %s" % (app, seen[real]), file=sys.stderr)
                  continue
              seen[real] = app
              env = dict(os.environ, DEVELOPER_DIR=os.path.join(real, "Contents", "Developer"))
              try:
                  out = subprocess.run(["xcodebuild", "-version"], env=env, capture_output=True, text=True, timeout=300).stdout
              except Exception as error:
                  print("%s: xcodebuild -version failed (%s)" % (app, error), file=sys.stderr)
                  continue
              version = re.search(r"^Xcode ([0-9.]+)$", out, re.M)
              build = re.search(r"^Build version ([0-9A-Za-z]+)$", out, re.M)
              version = version.group(1) if version else "?"
              build = build.group(1) if build else "?"
              release = re.fullmatch(r"27\.2(\.[0-9]+)?", version) is not None and re.search(r"[0-9]$", build) is not None
              print("%s (%s): Xcode %s, build %s%s" % (app, real, version, build, ": a release of 27.2" if release else ": not a release of 27.2"), file=sys.stderr)
              if release and (best is None or key(version, build) > best[0]):
                  best = (key(version, build), real)
          print(best[1] if best else "")
          ')"
          if [ -z "$XCODE" ]; then
            echo "::error::No release of Xcode 27.2 in /Applications (xcodebuild -version 27.2 or 27.2.x, its build ending in a digit; docs/M7D_CONTRACT.md §3.1). The job does not go on with another Xcode."
            exit 1
          fi
          echo "Selected: $XCODE"
          sudo xcode-select -s "$XCODE"
          sudo xcodebuild -runFirstLaunch
          xcode-select -p
          xcodebuild -version
          echo "runner image: ${ImageOS:-?} ${ImageVersion:-?}"

      # 1.4 (docs/M7D_CONTRACT.md §3.3 4, 0d-28): XcodeGen 2.46.0 from its release zip, pinned by sha256, the same in every
      # job (until 1.3 `brew install xcodegen`, whose version was the image's formula). The script fails unless
      # `xcodegen --version` then says 2.46.0; the job's later steps find it first in PATH.
      - name: Install XcodeGen
        run: |
          set -euo pipefail
          bash "$GITHUB_WORKSPACE/tools/ci/install-xcodegen.sh"

      - name: Generate the Xcode project
        run: |
          set -euo pipefail
          xcodegen generate
          xcodebuild -project TegakiCalendar.xcodeproj -list

      # Certificate → a temporary keychain; profile → ~/Library/MobileDevice/Provisioning Profiles.
      # Team id / profile name / UUID are read out of the profile for the archive step.
      - name: Install the signing certificate and the provisioning profile
        id: signing
        env:
          BUILD_CERTIFICATE_BASE64: ${{ secrets.BUILD_CERTIFICATE_BASE64 }}
          P12_PASSWORD: ${{ secrets.P12_PASSWORD }}
          BUILD_PROVISION_PROFILE_BASE64: ${{ secrets.BUILD_PROVISION_PROFILE_BASE64 }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
        run: |
          set -euo pipefail
          CERT_PATH="$RUNNER_TEMP/build_certificate.p12"
          PROFILE_PATH="$RUNNER_TEMP/build_profile.mobileprovision"
          KEYCHAIN_PATH="$RUNNER_TEMP/app-signing.keychain-db"

          echo -n "$BUILD_CERTIFICATE_BASE64" | base64 --decode -o "$CERT_PATH"
          echo -n "$BUILD_PROVISION_PROFILE_BASE64" | base64 --decode -o "$PROFILE_PATH"

          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security import "$CERT_PATH" -P "$P12_PASSWORD" -A -t cert -f pkcs12 -k "$KEYCHAIN_PATH"
          security set-key-partition-list -S apple-tool:,apple: -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security list-keychain -d user -s "$KEYCHAIN_PATH"

          PROFILES_DIR="$HOME/Library/MobileDevice/Provisioning Profiles"
          mkdir -p "$PROFILES_DIR"
          PLIST="$RUNNER_TEMP/profile.plist"
          security cms -D -i "$PROFILE_PATH" > "$PLIST"
          PROFILE_UUID="$(/usr/libexec/PlistBuddy -c 'Print :UUID' "$PLIST")"
          PROFILE_NAME="$(/usr/libexec/PlistBuddy -c 'Print :Name' "$PLIST")"
          TEAM_ID="$(/usr/libexec/PlistBuddy -c 'Print :TeamIdentifier:0' "$PLIST")"
          PROFILE_APP_ID="$(/usr/libexec/PlistBuddy -c 'Print :Entitlements:application-identifier' "$PLIST")"
          cp "$PROFILE_PATH" "$PROFILES_DIR/$PROFILE_UUID.mobileprovision"

          echo "Profile: $PROFILE_NAME ($PROFILE_UUID), team $TEAM_ID, app id $PROFILE_APP_ID"
          case "$PROFILE_APP_ID" in
            "$TEAM_ID.com.syfan0.tegakicalendar") ;;
            *)
              echo "::error::プロビジョニングプロファイルの App ID（$PROFILE_APP_ID）が com.syfan0.tegakicalendar ではありません。"
              exit 1
              ;;
          esac

          # Identity name as the keychain knows it (e.g. "Apple Distribution: NAME (TEAMID)").
          IDENTITY="$(security find-identity -v -p codesigning "$KEYCHAIN_PATH" | sed -n 's/.*"\(.*\)".*/\1/p' | head -n 1)"
          if [ -z "$IDENTITY" ]; then
            echo "::error::.p12 の中に署名用の証明書（Apple Distribution）が見つかりません。"
            exit 1
          fi
          echo "Identity: $IDENTITY"

          {
            echo "team_id=$TEAM_ID"
            echo "profile_name=$PROFILE_NAME"
            echo "profile_uuid=$PROFILE_UUID"
            echo "identity=$IDENTITY"
            echo "keychain_path=$KEYCHAIN_PATH"
          } >> "$GITHUB_OUTPUT"

      # 1.2.2 (docs/R1_2_2.md §4): the app now has the Declared Age Range entitlement; the profile must too.
      - name: Check the profile for Declared Age Range
        run: |
          set -euo pipefail
          PLIST="$RUNNER_TEMP/profile.plist"
          WANT="$(/usr/libexec/PlistBuddy -c 'Print :com.apple.developer.declared-age-range' Support/TegakiCalendar.entitlements 2>/dev/null || echo missing)"
          HAVE="$(/usr/libexec/PlistBuddy -c 'Print :Entitlements:com.apple.developer.declared-age-range' "$PLIST" 2>/dev/null || echo missing)"
          echo "declared-age-range: app $WANT, profile $HAVE"
          if [ "$WANT" = "true" ] && [ "$HAVE" != "true" ]; then
            echo "::error::プロビジョニングプロファイルに Declared Age Range（年齢区分）の権限がありません。docs/R1_2_2.md §4 の 2〜6 でプロファイルを作り直し、BUILD_PROVISION_PROFILE_BASE64 を差し替えてください。"
            exit 1
          fi

      - name: Archive (signed)
        env:
          TEAM_ID: ${{ steps.signing.outputs.team_id }}
          PROFILE_NAME: ${{ steps.signing.outputs.profile_name }}
          IDENTITY: ${{ steps.signing.outputs.identity }}
          MARKETING_VERSION_INPUT: ${{ github.event.inputs.marketing_version }}
          AGE_FORCE_INPUT: ${{ github.event.inputs.age_force }}
        run: |
          set -euo pipefail
          # Plain string, not an array: /bin/bash on macOS is 3.2, where "${EMPTY[@]}" trips `set -u`.
          EXTRA=""
          if [ -n "${MARKETING_VERSION_INPUT:-}" ]; then
            EXTRA="MARKETING_VERSION=$MARKETING_VERSION_INPUT"
          fi
          # 1.2.2 (docs/R1_2_2.md §6.4): the check build. One quoted word (it has a space), and nothing at
          # all when empty: ${AGE:+"$AGE"} works with `set -u` on bash 3.2.
          AGE=""
          if [ "${AGE_FORCE_INPUT:-}" = "1" ]; then
            AGE='SWIFT_ACTIVE_COMPILATION_CONDITIONS=$(inherited) AGE_FORCE'
            echo "AGE_FORCE: on (not for App Review)"
          fi
          # shellcheck disable=SC2086
          xcodebuild \
            -project TegakiCalendar.xcodeproj \
            -scheme TegakiCalendar \
            -configuration Release \
            -destination "generic/platform=iOS" \
            -archivePath "$RUNNER_TEMP/TegakiCalendar.xcarchive" \
            -derivedDataPath build/DerivedData \
            CODE_SIGN_STYLE=Manual \
            DEVELOPMENT_TEAM="$TEAM_ID" \
            CODE_SIGN_IDENTITY="$IDENTITY" \
            PROVISIONING_PROFILE_SPECIFIER="$PROFILE_NAME" \
            CURRENT_PROJECT_VERSION="${{ github.run_number }}" \
            $EXTRA \
            ${AGE:+"$AGE"} \
            archive

      # 1.2.2 (docs/R1_2_2.md §4, §3.8): the signed app carries the entitlement, and iOS 17–18 can still launch it.
      # 1.4 (docs/M7D_CONTRACT.md §3.4): and it is built with the iOS 27.2 SDK (DTSDKName iphoneos27.2: with Xcode 26.6 it
      # was iphoneos26.5, the SDK of ITMS-90725's notice for 1.2.4), for iOS 17.0 and later (MinimumOSVersion 17.0: else
      # the people on iOS 17 would get no update) and for the iPhone and the iPad (UIDeviceFamily 1, 2). The Xcode that
      # built it (DTXcode, DTXcodeBuild; 27B52 expected) and the SDK's platform version (DTPlatformVersion) are logged for
      # docs/M7D.md; a DTXcodeBuild that ends in a lower-case letter is a beta's, and fails. Read with PlistBuddy as above.
      - name: Check the archive (entitlement, weak link, SDK, minimum iOS)
        run: |
          set -euo pipefail
          APP="$RUNNER_TEMP/TegakiCalendar.xcarchive/Products/Applications/TegakiCalendar.app"
          codesign -d --entitlements - --xml "$APP" > "$RUNNER_TEMP/entitlements.xml" 2>/dev/null
          # PlistBuddy, not `plutil -extract`: plutil reads every '.' as a key separator (docs/R1_2_2.md §4).
          ENT="$(/usr/libexec/PlistBuddy -c 'Print :com.apple.developer.declared-age-range' "$RUNNER_TEMP/entitlements.xml" 2>/dev/null || echo missing)"
          if otool -l "$APP/TegakiCalendar" | grep -B2 'DeclaredAgeRange.framework' | grep -q LC_LOAD_WEAK_DYLIB; then LINK=weak; else LINK=strong-or-missing; fi
          echo "archive: declared-age-range $ENT, DeclaredAgeRange $LINK"
          [ "$ENT" = "true" ] || { echo "::error::署名したアプリに年齢区分の権限が入っていません。"; exit 1; }
          [ "$LINK" = "weak" ] || { echo "::error::DeclaredAgeRange が弱いリンクになっていません（iOS 17〜18 で起動できなくなる）。project.yml の OTHER_LDFLAGS を見てください。"; exit 1; }
          # 1.4 (§3.4): the SDK, the minimum iOS, the device family and the Xcode, from the app's Info.plist.
          INFO="$APP/Info.plist"
          plist() {  # plist <key>: its value, or "missing"
            /usr/libexec/PlistBuddy -c "Print :$1" "$INFO" 2>/dev/null || echo missing
          }
          SDK="$(plist DTSDKName)"
          MIN_OS="$(plist MinimumOSVersion)"
          # An array of numbers ("Array {", one per line, "}") → "1, 2".
          FAMILY="$(plist UIDeviceFamily | { grep -oE '[0-9]+' || true; } | paste -sd, - | sed 's/,/, /g')"
          DT_XCODE="$(plist DTXcode)"
          DT_XCODE_BUILD="$(plist DTXcodeBuild)"
          DT_PLATFORM="$(plist DTPlatformVersion)"
          echo "archive: DTSDKName $SDK, MinimumOSVersion $MIN_OS, UIDeviceFamily ${FAMILY:-missing}, DTXcode $DT_XCODE, DTXcodeBuild $DT_XCODE_BUILD, DTPlatformVersion $DT_PLATFORM"
          [ "$SDK" = "iphoneos27.2" ] || { echo "::error::iOS 27.2 SDK で作っていません（DTSDKName が $SDK。docs/M7D_CONTRACT.md §3.4）。"; exit 1; }
          [ "$MIN_OS" = "17.0" ] || { echo "::error::配る先が iOS 17.0 ではありません（MinimumOSVersion が $MIN_OS）。iOS 17 の人が更新を受けられなくなります（docs/M7D_CONTRACT.md §3.4）。"; exit 1; }
          [ "$FAMILY" = "1, 2" ] || { echo "::error::UIDeviceFamily が 1, 2（iPhone と iPad）ではありません（${FAMILY:-missing}。docs/M7D_CONTRACT.md §3.4）。"; exit 1; }
          case "$DT_XCODE_BUILD" in
            *[0-9]) ;;
            *) echo "::error::正式版でない Xcode（DTXcodeBuild が $DT_XCODE_BUILD。最後が数字でなければ beta）で作っています。審査に出せません（docs/M7D_CONTRACT.md §3.1、§3.4）。"; exit 1 ;;
          esac

      - name: Export the .ipa
        env:
          TEAM_ID: ${{ steps.signing.outputs.team_id }}
          PROFILE_NAME: ${{ steps.signing.outputs.profile_name }}
        run: |
          set -euo pipefail
          EXPORT_DIR="$RUNNER_TEMP/export"
          OPTIONS="$RUNNER_TEMP/ExportOptions.plist"
          cat > "$OPTIONS" <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key><string>app-store-connect</string>
            <key>destination</key><string>export</string>
            <key>signingStyle</key><string>manual</string>
            <key>teamID</key><string>$TEAM_ID</string>
            <key>uploadSymbols</key><true/>
            <key>provisioningProfiles</key>
            <dict>
              <key>com.syfan0.tegakicalendar</key><string>$PROFILE_NAME</string>
            </dict>
          </dict>
          </plist>
          EOF
          xcodebuild \
            -exportArchive \
            -archivePath "$RUNNER_TEMP/TegakiCalendar.xcarchive" \
            -exportOptionsPlist "$OPTIONS" \
            -exportPath "$EXPORT_DIR"
          ls -la "$EXPORT_DIR"
          IPA="$(ls "$EXPORT_DIR"/*.ipa | head -n 1)"
          if [ -z "$IPA" ]; then
            echo "::error::.ipa が書き出されませんでした。"
            exit 1
          fi
          echo "ipa_path=$IPA" >> "$GITHUB_ENV"

      # altool reads the key from ~/private_keys/AuthKey_<KEY_ID>.p8.
      - name: Upload to TestFlight (altool)
        env:
          APP_STORE_CONNECT_API_KEY_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_ID }}
          APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          APP_STORE_CONNECT_API_KEY_BASE64: ${{ secrets.APP_STORE_CONNECT_API_KEY_BASE64 }}
        run: |
          set -euo pipefail
          mkdir -p "$HOME/private_keys"
          echo -n "$APP_STORE_CONNECT_API_KEY_BASE64" | base64 --decode -o "$HOME/private_keys/AuthKey_$APP_STORE_CONNECT_API_KEY_ID.p8"
          xcrun altool --validate-app --type ios --file "$ipa_path" \
            --apiKey "$APP_STORE_CONNECT_API_KEY_ID" --apiIssuer "$APP_STORE_CONNECT_ISSUER_ID"
          xcrun altool --upload-app --type ios --file "$ipa_path" \
            --apiKey "$APP_STORE_CONNECT_API_KEY_ID" --apiIssuer "$APP_STORE_CONNECT_ISSUER_ID"
          echo "TestFlight へアップロードしました（ビルド番号 ${{ github.run_number }}）。App Store Connect で処理が終わるまで数分かかります。"

      - name: Clean up the keychain and keys
        if: always()
        env:
          KEYCHAIN_PATH: ${{ steps.signing.outputs.keychain_path }}
        run: |
          set +e
          if [ -n "${KEYCHAIN_PATH:-}" ] && [ -f "$KEYCHAIN_PATH" ]; then
            security delete-keychain "$KEYCHAIN_PATH"
          fi
          rm -rf "$HOME/private_keys" "$RUNNER_TEMP/build_certificate.p12" "$RUNNER_TEMP/build_profile.mobileprovision" "$RUNNER_TEMP/profile.plist"
          exit 0
