# Signs the app and uploads it to TestFlight (docs/M2_CONTRACT.md §8, docs/DESIGN.md §8.3).
#
# Manual only (workflow_dispatch). It needs seven repository secrets, made once after the Apple
# Developer Program enrollment (docs/APPLE_ENROLLMENT.md):
#
#   BUILD_CERTIFICATE_BASE64          Apple Distribution certificate + private key (.p12), base64
#   P12_PASSWORD                      password of that .p12
#   BUILD_PROVISION_PROFILE_BASE64    App Store provisioning profile (.mobileprovision), base64
#   KEYCHAIN_PASSWORD                 any password for the temporary keychain made on the runner
#   APP_STORE_CONNECT_API_KEY_ID      App Store Connect API key id (10 characters)
#   APP_STORE_CONNECT_ISSUER_ID       App Store Connect issuer id (UUID)
#   APP_STORE_CONNECT_API_KEY_BASE64  the AuthKey_<id>.p8 file, base64
#
# The team id, profile name and profile UUID are read from the provisioning profile itself, so no
# further secret is needed. The build number is the workflow run number (unique per upload).
#
# 1.2.2 (docs/R1_2_2.md §4, §6.4): the app has the Declared Age Range entitlement, so the profile must
# carry it too ("Check the profile for Declared Age Range"); the signed archive is checked for the
# entitlement and for the weak link of DeclaredAgeRange ("Check the archive"). The input `age_force`
# ("1" only) makes the one check build of §6.4 (AGE_FORCE: Apple's flag is taken as set, so Apple's
# age range sheet comes up on any account on iOS / iPadOS 26.2 or later). That build is never submitted.
#
# 1.3 (docs/M7C_CONTRACT.md §4.6, §10.6, §12.2 S3; D12): the input `span_prototype` ("1" only) makes the prototype
# build of 「横につなげる」 (SPAN_PROTOTYPE added to SWIFT_ACTIVE_COMPILATION_CONDITIONS on the archive's command
# line; project.yml never has it). Before anything is built, "The prototype build against 43fe366" fails unless the
# 18 frozen data files pass `shasum -c` with 43fe366's own DATA_1_1.sha256, 1.2.3's tests are 43fe366's bytes,
# project.yml has no SPAN_PROTOTYPE and tools/span/prototype_gate.py accepts the app's sources (only the new
# Span/SpanPrototype*.swift inside `#if SPAN_PROTOTYPE`, the entry in Views/SettingsScreen.swift inside it, new keys
# of the string tables). "Check the prototype archive" looks for the prototype in the signed app and writes the
# version and the build number (the run number) into the run's summary, for docs/M7C.md: that build is never
# submitted, and the build of 1.3 that is submitted must not be it. The prototype is version 1.3 (§4.6): with
# span_prototype "1" the input marketing_version must be "1.3", and the archive's version is checked. Not together
# with `age_force`. Without the input every step runs as before (the two steps are skipped, and the archive's command
# line is the same).
name: testflight

on:
  workflow_dispatch:
    inputs:
      marketing_version:
        description: "表示用バージョン（空なら project.yml の MARKETING_VERSION）"
        required: false
        default: ""
      # 1.2.2 (docs/R1_2_2.md §6.4): the check build only. Empty for every other build.
      age_force:
        description: "年齢の確かめ用（1 のときだけ。審査に出さない）"
        required: false
        default: ""
      # 1.3 (docs/M7C_CONTRACT.md §4.6): the prototype build only (TestFlight's internal testing). Empty for every other build.
      span_prototype:
        description: "横につなげる試作（1 のときだけ。審査に出さない）"
        required: false
        default: ""

concurrency:
  group: testflight
  cancel-in-progress: false

jobs:
  upload:
    name: Archive, sign and upload to TestFlight
    runs-on: macos-26
    timeout-minutes: 90
    env:
      HOMEBREW_NO_AUTO_UPDATE: "1"
      HOMEBREW_NO_INSTALL_CLEANUP: "1"
      NSUnbufferedIO: "YES"

    steps:
      # Fail at once, in plain Japanese, when any secret is missing (before anything is built).
      - name: Check the secrets
        env:
          BUILD_CERTIFICATE_BASE64: ${{ secrets.BUILD_CERTIFICATE_BASE64 }}
          P12_PASSWORD: ${{ secrets.P12_PASSWORD }}
          BUILD_PROVISION_PROFILE_BASE64: ${{ secrets.BUILD_PROVISION_PROFILE_BASE64 }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
          APP_STORE_CONNECT_API_KEY_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_ID }}
          APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          APP_STORE_CONNECT_API_KEY_BASE64: ${{ secrets.APP_STORE_CONNECT_API_KEY_BASE64 }}
        run: |
          set -euo pipefail
          missing=""
          for name in BUILD_CERTIFICATE_BASE64 P12_PASSWORD BUILD_PROVISION_PROFILE_BASE64 KEYCHAIN_PASSWORD \
                      APP_STORE_CONNECT_API_KEY_ID APP_STORE_CONNECT_ISSUER_ID APP_STORE_CONNECT_API_KEY_BASE64; do
            if [ -z "${!name:-}" ]; then
              missing="$missing $name"
            fi
          done
          if [ -n "$missing" ]; then
            echo "::error::TestFlight への配信に必要な Secrets が設定されていません:$missing"
            echo ""
            echo "GitHub のリポジトリ → Settings → Secrets and variables → Actions で次を登録してください。"
            echo "  BUILD_CERTIFICATE_BASE64         Apple Distribution の証明書（秘密鍵つき .p12）を base64 にしたもの"
            echo "  P12_PASSWORD                     その .p12 のパスワード"
            echo "  BUILD_PROVISION_PROFILE_BASE64   App Store 用プロビジョニングプロファイル（.mobileprovision）を base64 にしたもの"
            echo "  KEYCHAIN_PASSWORD                一時キーチェーン用の任意のパスワード"
            echo "  APP_STORE_CONNECT_API_KEY_ID     App Store Connect API キーの ID（10 文字）"
            echo "  APP_STORE_CONNECT_ISSUER_ID      App Store Connect の Issuer ID"
            echo "  APP_STORE_CONNECT_API_KEY_BASE64 AuthKey_<ID>.p8 を base64 にしたもの"
            echo "手順は docs/APPLE_ENROLLMENT.md を参照。Apple Developer Program の承認後に登録できます。"
            exit 1
          fi
          echo "Secrets: すべて設定されています。"

      - name: Checkout
        uses: actions/checkout@v4

      # 1.3 (docs/M7C_CONTRACT.md §4.6, §12.2 S3 (1) (2); D12): only with span_prototype "1". The checkout is one commit
      # deep, so 43fe366 is fetched for its tree. §4.6: the prototype is version 1.3 — project.yml still says 1.2.3 (the
      # photos of J-4 show the version row, so it stays until S3), and 1.2.3 is released, so a build of it would only
      # fail at the upload after the archive. The input marketing_version must be 1.3; nothing is built otherwise.
      - name: The prototype build against 43fe366 (1.3)
        if: ${{ github.event.inputs.span_prototype == '1' }}
        env:
          AGE_FORCE_INPUT: ${{ github.event.inputs.age_force }}
          MARKETING_VERSION_INPUT: ${{ github.event.inputs.marketing_version }}
        run: |
          set -euo pipefail
          BASE=43fe36666a2120e8a23adf4fc76244151a395e6f
          if [ "${AGE_FORCE_INPUT:-}" = "1" ]; then
            echo "::error::試作（span_prototype）と年齢の確かめ用（age_force）は一緒に作れません。1 つずつ作ってください。"
            exit 1
          fi
          if [ "${MARKETING_VERSION_INPUT:-}" != "1.3" ]; then
            echo "::error::試作のビルドは版 1.3 です（docs/M7C_CONTRACT.md §4.6）。入力 marketing_version に 1.3 を入れてください（今は「${MARKETING_VERSION_INPUT:-}」）。"
            exit 1
          fi
          git fetch --no-tags --depth=1 origin "$BASE"
          echo "the prototype build of $(git rev-parse HEAD) ($(git log -1 --format=%s HEAD))"
          echo "against $(git log -1 --format='%H %s' "$BASE")"
          # (1) The 18 files of the handwriting's data are 43fe366's bytes, by 43fe366's own table.
          if ! git show "$BASE:tools/compat10/DATA_1_1.sha256" | shasum -a 256 -c; then
            echo "::error::凍結の表のファイルが 43fe366 と違います。試作のビルドまで（S3 まで）表のファイルは変えません（docs/M7C_CONTRACT.md §6.4、D12）。"
            exit 1
          fi
          # 1.2.3's tests of the one-page path are 43fe366's bytes.
          shasum -a 256 -c tools/span/TESTS_1_2_3.sha256
          if grep -n 'SPAN_PROTOTYPE' project.yml; then
            echo "::error::project.yml に SPAN_PROTOTYPE があります（docs/M7C_CONTRACT.md §4.6）。"
            exit 1
          fi
          # (2) The app's sources differ from 43fe366 only by the prototype's files, its entry and its keys.
          python3 -I tools/span/prototype_gate.py --base "$BASE"

      - name: Select Xcode
        run: |
          set -euo pipefail
          if [ -d /Applications/Xcode_26.6.app ]; then
            sudo xcode-select -s /Applications/Xcode_26.6.app
          fi
          xcode-select -p
          xcodebuild -version

      - name: Install XcodeGen
        run: |
          set -euo pipefail
          brew install xcodegen
          xcodegen --version

      - name: Generate the Xcode project
        run: |
          set -euo pipefail
          xcodegen generate
          xcodebuild -project TegakiCalendar.xcodeproj -list

      # Certificate → a temporary keychain; profile → ~/Library/MobileDevice/Provisioning Profiles.
      # Team id / profile name / UUID are read out of the profile for the archive step.
      - name: Install the signing certificate and the provisioning profile
        id: signing
        env:
          BUILD_CERTIFICATE_BASE64: ${{ secrets.BUILD_CERTIFICATE_BASE64 }}
          P12_PASSWORD: ${{ secrets.P12_PASSWORD }}
          BUILD_PROVISION_PROFILE_BASE64: ${{ secrets.BUILD_PROVISION_PROFILE_BASE64 }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
        run: |
          set -euo pipefail
          CERT_PATH="$RUNNER_TEMP/build_certificate.p12"
          PROFILE_PATH="$RUNNER_TEMP/build_profile.mobileprovision"
          KEYCHAIN_PATH="$RUNNER_TEMP/app-signing.keychain-db"

          echo -n "$BUILD_CERTIFICATE_BASE64" | base64 --decode -o "$CERT_PATH"
          echo -n "$BUILD_PROVISION_PROFILE_BASE64" | base64 --decode -o "$PROFILE_PATH"

          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security import "$CERT_PATH" -P "$P12_PASSWORD" -A -t cert -f pkcs12 -k "$KEYCHAIN_PATH"
          security set-key-partition-list -S apple-tool:,apple: -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security list-keychain -d user -s "$KEYCHAIN_PATH"

          PROFILES_DIR="$HOME/Library/MobileDevice/Provisioning Profiles"
          mkdir -p "$PROFILES_DIR"
          PLIST="$RUNNER_TEMP/profile.plist"
          security cms -D -i "$PROFILE_PATH" > "$PLIST"
          PROFILE_UUID="$(/usr/libexec/PlistBuddy -c 'Print :UUID' "$PLIST")"
          PROFILE_NAME="$(/usr/libexec/PlistBuddy -c 'Print :Name' "$PLIST")"
          TEAM_ID="$(/usr/libexec/PlistBuddy -c 'Print :TeamIdentifier:0' "$PLIST")"
          PROFILE_APP_ID="$(/usr/libexec/PlistBuddy -c 'Print :Entitlements:application-identifier' "$PLIST")"
          cp "$PROFILE_PATH" "$PROFILES_DIR/$PROFILE_UUID.mobileprovision"

          echo "Profile: $PROFILE_NAME ($PROFILE_UUID), team $TEAM_ID, app id $PROFILE_APP_ID"
          case "$PROFILE_APP_ID" in
            "$TEAM_ID.com.syfan0.tegakicalendar") ;;
            *)
              echo "::error::プロビジョニングプロファイルの App ID（$PROFILE_APP_ID）が com.syfan0.tegakicalendar ではありません。"
              exit 1
              ;;
          esac

          # Identity name as the keychain knows it (e.g. "Apple Distribution: NAME (TEAMID)").
          IDENTITY="$(security find-identity -v -p codesigning "$KEYCHAIN_PATH" | sed -n 's/.*"\(.*\)".*/\1/p' | head -n 1)"
          if [ -z "$IDENTITY" ]; then
            echo "::error::.p12 の中に署名用の証明書（Apple Distribution）が見つかりません。"
            exit 1
          fi
          echo "Identity: $IDENTITY"

          {
            echo "team_id=$TEAM_ID"
            echo "profile_name=$PROFILE_NAME"
            echo "profile_uuid=$PROFILE_UUID"
            echo "identity=$IDENTITY"
            echo "keychain_path=$KEYCHAIN_PATH"
          } >> "$GITHUB_OUTPUT"

      # 1.2.2 (docs/R1_2_2.md §4): the app now has the Declared Age Range entitlement; the profile must too.
      - name: Check the profile for Declared Age Range
        run: |
          set -euo pipefail
          PLIST="$RUNNER_TEMP/profile.plist"
          WANT="$(/usr/libexec/PlistBuddy -c 'Print :com.apple.developer.declared-age-range' Support/TegakiCalendar.entitlements 2>/dev/null || echo missing)"
          HAVE="$(/usr/libexec/PlistBuddy -c 'Print :Entitlements:com.apple.developer.declared-age-range' "$PLIST" 2>/dev/null || echo missing)"
          echo "declared-age-range: app $WANT, profile $HAVE"
          if [ "$WANT" = "true" ] && [ "$HAVE" != "true" ]; then
            echo "::error::プロビジョニングプロファイルに Declared Age Range（年齢区分）の権限がありません。docs/R1_2_2.md §4 の 2〜6 でプロファイルを作り直し、BUILD_PROVISION_PROFILE_BASE64 を差し替えてください。"
            exit 1
          fi

      - name: Archive (signed)
        env:
          TEAM_ID: ${{ steps.signing.outputs.team_id }}
          PROFILE_NAME: ${{ steps.signing.outputs.profile_name }}
          IDENTITY: ${{ steps.signing.outputs.identity }}
          MARKETING_VERSION_INPUT: ${{ github.event.inputs.marketing_version }}
          AGE_FORCE_INPUT: ${{ github.event.inputs.age_force }}
          SPAN_PROTOTYPE_INPUT: ${{ github.event.inputs.span_prototype }}
        run: |
          set -euo pipefail
          # Plain string, not an array: /bin/bash on macOS is 3.2, where "${EMPTY[@]}" trips `set -u`.
          EXTRA=""
          if [ -n "${MARKETING_VERSION_INPUT:-}" ]; then
            EXTRA="MARKETING_VERSION=$MARKETING_VERSION_INPUT"
          fi
          # 1.2.2 (docs/R1_2_2.md §6.4): the check build. One quoted word (it has a space), and nothing at
          # all when empty: ${AGE:+"$AGE"} works with `set -u` on bash 3.2.
          AGE=""
          if [ "${AGE_FORCE_INPUT:-}" = "1" ]; then
            AGE='SWIFT_ACTIVE_COMPILATION_CONDITIONS=$(inherited) AGE_FORCE'
            echo "AGE_FORCE: on (not for App Review)"
          fi
          # 1.3 (docs/M7C_CONTRACT.md §4.6, D12): the prototype build, the same way (one quoted word, nothing when empty).
          SPAN=""
          if [ "${SPAN_PROTOTYPE_INPUT:-}" = "1" ]; then
            if [ -n "$AGE" ]; then
              echo "::error::span_prototype と age_force は一緒に使えません。"
              exit 1
            fi
            SPAN='SWIFT_ACTIVE_COMPILATION_CONDITIONS=$(inherited) SPAN_PROTOTYPE'
            echo "SPAN_PROTOTYPE: on (the prototype build; not for App Review)"
          fi
          # shellcheck disable=SC2086
          xcodebuild \
            -project TegakiCalendar.xcodeproj \
            -scheme TegakiCalendar \
            -configuration Release \
            -destination "generic/platform=iOS" \
            -archivePath "$RUNNER_TEMP/TegakiCalendar.xcarchive" \
            -derivedDataPath build/DerivedData \
            CODE_SIGN_STYLE=Manual \
            DEVELOPMENT_TEAM="$TEAM_ID" \
            CODE_SIGN_IDENTITY="$IDENTITY" \
            PROVISIONING_PROFILE_SPECIFIER="$PROFILE_NAME" \
            CURRENT_PROJECT_VERSION="${{ github.run_number }}" \
            $EXTRA \
            ${AGE:+"$AGE"} \
            ${SPAN:+"$SPAN"} \
            archive

      # 1.2.2 (docs/R1_2_2.md §4, §3.8): the signed app carries the entitlement, and iOS 17–18 can still launch it.
      - name: Check the archive (entitlement, weak link)
        run: |
          set -euo pipefail
          APP="$RUNNER_TEMP/TegakiCalendar.xcarchive/Products/Applications/TegakiCalendar.app"
          codesign -d --entitlements - --xml "$APP" > "$RUNNER_TEMP/entitlements.xml" 2>/dev/null
          # PlistBuddy, not `plutil -extract`: plutil reads every '.' as a key separator (docs/R1_2_2.md §4).
          ENT="$(/usr/libexec/PlistBuddy -c 'Print :com.apple.developer.declared-age-range' "$RUNNER_TEMP/entitlements.xml" 2>/dev/null || echo missing)"
          if otool -l "$APP/TegakiCalendar" | grep -B2 'DeclaredAgeRange.framework' | grep -q LC_LOAD_WEAK_DYLIB; then LINK=weak; else LINK=strong-or-missing; fi
          echo "archive: declared-age-range $ENT, DeclaredAgeRange $LINK"
          [ "$ENT" = "true" ] || { echo "::error::署名したアプリに年齢区分の権限が入っていません。"; exit 1; }
          [ "$LINK" = "weak" ] || { echo "::error::DeclaredAgeRange が弱いリンクになっていません（iOS 17〜18 で起動できなくなる）。project.yml の OTHER_LDFLAGS を見てください。"; exit 1; }

      # 1.3 (docs/M7C_CONTRACT.md §4.6, §12.2 S3): only with span_prototype "1". The prototype's types
      # (Span/SpanPrototype*.swift) are in the signed app only when SPAN_PROTOTYPE reached the compiler; the version
      # and the build number (the run number) go into the run's summary for docs/M7C.md (the build that is submitted
      # as 1.3 must not be this one, and this one expires only after the next normal build is VALID).
      - name: Check the prototype archive (1.3)
        if: ${{ github.event.inputs.span_prototype == '1' }}
        env:
          RUN_NUMBER: ${{ github.run_number }}
        run: |
          set -euo pipefail
          APP="$RUNNER_TEMP/TegakiCalendar.xcarchive/Products/Applications/TegakiCalendar.app"
          VERSION="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' "$APP/Info.plist")"
          BUILD="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleVersion' "$APP/Info.plist")"
          if LC_ALL=C grep -q -a 'SpanPrototype' "$APP/TegakiCalendar"; then PROTO=in; else PROTO=missing; fi
          echo "prototype archive: version $VERSION, build $BUILD, SpanPrototype $PROTO"
          [ "$VERSION" = "1.3" ] || { echo "::error::試作の版が $VERSION です。1.3 のはずです（docs/M7C_CONTRACT.md §4.6）。"; exit 1; }
          [ "$BUILD" = "$RUN_NUMBER" ] || { echo "::error::ビルド番号 $BUILD が run の番号 $RUN_NUMBER と違います。"; exit 1; }
          [ "$PROTO" = "in" ] || { echo "::error::署名したアプリに試作（SpanPrototype）が入っていません。SPAN_PROTOTYPE が効いていません。"; exit 1; }
          {
            echo "### 試作のビルド（1.3、span_prototype）"
            echo ""
            echo "- 版 **$VERSION**、ビルド **$BUILD**（この run の番号）。TestFlight の内部テストだけ。審査に出さない。"
            echo "- commit \`$(git rev-parse HEAD)\`"
            echo "- 43fe366 の DATA_1_1.sha256 で凍結の 18 ファイル OK・TESTS_1_2_3 OK・tools/span/prototype_gate.py OK・アーカイブに SpanPrototype あり"
            echo "- docs/M7C.md にビルドの番号を書く。提出する 1.3 のビルドはこの番号でないこと。期限切れにするのは次のふつうのビルドが VALID になってから（§4.6）。"
          } >> "$GITHUB_STEP_SUMMARY"
          echo "::notice::試作のビルド: 版 $VERSION ビルド $BUILD"

      - name: Export the .ipa
        env:
          TEAM_ID: ${{ steps.signing.outputs.team_id }}
          PROFILE_NAME: ${{ steps.signing.outputs.profile_name }}
        run: |
          set -euo pipefail
          EXPORT_DIR="$RUNNER_TEMP/export"
          OPTIONS="$RUNNER_TEMP/ExportOptions.plist"
          cat > "$OPTIONS" <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key><string>app-store-connect</string>
            <key>destination</key><string>export</string>
            <key>signingStyle</key><string>manual</string>
            <key>teamID</key><string>$TEAM_ID</string>
            <key>uploadSymbols</key><true/>
            <key>provisioningProfiles</key>
            <dict>
              <key>com.syfan0.tegakicalendar</key><string>$PROFILE_NAME</string>
            </dict>
          </dict>
          </plist>
          EOF
          xcodebuild \
            -exportArchive \
            -archivePath "$RUNNER_TEMP/TegakiCalendar.xcarchive" \
            -exportOptionsPlist "$OPTIONS" \
            -exportPath "$EXPORT_DIR"
          ls -la "$EXPORT_DIR"
          IPA="$(ls "$EXPORT_DIR"/*.ipa | head -n 1)"
          if [ -z "$IPA" ]; then
            echo "::error::.ipa が書き出されませんでした。"
            exit 1
          fi
          echo "ipa_path=$IPA" >> "$GITHUB_ENV"

      # altool reads the key from ~/private_keys/AuthKey_<KEY_ID>.p8.
      - name: Upload to TestFlight (altool)
        env:
          APP_STORE_CONNECT_API_KEY_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_ID }}
          APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          APP_STORE_CONNECT_API_KEY_BASE64: ${{ secrets.APP_STORE_CONNECT_API_KEY_BASE64 }}
        run: |
          set -euo pipefail
          mkdir -p "$HOME/private_keys"
          echo -n "$APP_STORE_CONNECT_API_KEY_BASE64" | base64 --decode -o "$HOME/private_keys/AuthKey_$APP_STORE_CONNECT_API_KEY_ID.p8"
          xcrun altool --validate-app --type ios --file "$ipa_path" \
            --apiKey "$APP_STORE_CONNECT_API_KEY_ID" --apiIssuer "$APP_STORE_CONNECT_ISSUER_ID"
          xcrun altool --upload-app --type ios --file "$ipa_path" \
            --apiKey "$APP_STORE_CONNECT_API_KEY_ID" --apiIssuer "$APP_STORE_CONNECT_ISSUER_ID"
          echo "TestFlight へアップロードしました（ビルド番号 ${{ github.run_number }}）。App Store Connect で処理が終わるまで数分かかります。"

      - name: Clean up the keychain and keys
        if: always()
        env:
          KEYCHAIN_PATH: ${{ steps.signing.outputs.keychain_path }}
        run: |
          set +e
          if [ -n "${KEYCHAIN_PATH:-}" ] && [ -f "$KEYCHAIN_PATH" ]; then
            security delete-keychain "$KEYCHAIN_PATH"
          fi
          rm -rf "$HOME/private_keys" "$RUNNER_TEMP/build_certificate.p12" "$RUNNER_TEMP/build_profile.mobileprovision" "$RUNNER_TEMP/profile.plist"
          exit 0
