# J-4 (docs/M7D_CONTRACT.md §3.5 for 1.4; made for 1.2, docs/M7B_CONTRACT.md §1.3, §1.5, §7.5, 0-32; for 1.3,
# docs/M7C_CONTRACT.md §10.5): the Japanese screenshots of the reference commit, taken the way its own build.yml takes
# them, as the reference for the pixel comparison of the new version's photos (tools/l10n/compare_shots.swift, run by the
# lead on a Mac).
#
# The job reads the commit in tools/l10n/ja-baseline-ref-1.4.txt (one full sha: 955fe67, 1.3 as released, build 26),
# checks it out into baseline/, generates its Xcode project, builds the app for the Simulator and takes the photos
# with the photo steps of 955fe67's build.yml, copied with their comments, in its order: the 13-inch iPad (4 pages,
# 3 zoomed, read-only, the 5 shots of 1.1, the pinch hint of 1.1.1, the 11 sheets), its app log and l10n lines, the
# iPhone, the 6.9-inch iPhone, the iPad mini and the 11-inch iPad, and the "Store listing set". Every `simctl launch`
# ends with JA_ARGS; the 13-inch step and the other devices' step write env.txt (`xcodebuild -version`, since 1.4 the
# Xcode's path, the runner image, the runtimes, XcodeGen and Python, and each device's simulator runtime), the same
# lines as build.yml, so the lead can `diff` the two env.txt before comparing. No tests run (no unit tests, no UI tests,
# no blank-paper job).
# Artifact: ja-baseline-<the first 7 characters of the sha>, kept 30 days, with the file names of build.yml's
# `screenshots` (but no fixtures/ or ui-tests/).
#
# 1.3 (§10.5, 0c-35): the reference moved from <1.1.1> (tools/l10n/ja-baseline-ref.txt, which stays as it is: the
# compat-v1.0 job's tools/weekstart-compat reads it) to 43fe366 in a file of its own (tools/l10n/ja-baseline-ref-1.3.txt,
# kept as the record of 1.3; 1.4 does not read it), and the photo steps were copied again from 43fe366's build.yml.
#
# 1.4 (docs/M7D_CONTRACT.md §3.5, 0d-4): the reference is 955fe67, photographed with Xcode 27.2 on the image xcode-27,
# so J-4 compares the photos of two codes taken with the same tools (what the new SDK alone changes is §3.6's map, D0's
# gate 7, against 1.3's run 44474759145). The photo steps were copied again from 955fe67's build.yml (7895d40's is the
# same file); after the copy only these changed, in the same words as 1.4's build.yml: (a) the runner and the choice of
# the Xcode ("Select Xcode 27.2"), (b) the devices' list (§3.2: iphone69 is the iPhone 18 Pro Max), (c) the checks of
# the required devices ("Required simulators" with build-and-test's table; in "Pick a simulator" the name must be the
# table's; "Resolve the simulator UDID" and the other devices' picker take the device "Required simulators" resolved
# first, and the newest iOS when nothing is booted, as here; a missing device is an error; "The simulators used are the
# table's" at the end), (d) the lines of env.txt (§3.3 3, and §3.2's pixels of the iPhone 18 Pro Max) and (e) XcodeGen from
# tools/ci/install-xcodegen.sh, read from the pushed commit at $GITHUB_WORKSPACE (955fe67 does not have it). The two
# additions of 1.3 that this file noted before (the 11 sheets' wait with tools/shots/screen_ready.swift, read from the
# pushed commit, and the other devices' check that reads launchctl's whole list) are 955fe67's build.yml's own lines,
# so the copy has them as they are; so has the pinch hint's second take. Some `if:` hold `env.QUICK != 'true'`
# (build.yml's quick lane): QUICK is never set here, so they hold. Only the photo that docs/M7D.md lists beforehand may
# differ between 1.4's photos and this reference (ipad13-portrait-sheet-info.png, the version).
# 1.4 D0b (docs/M7D_CONTRACT.md §3.5 (f), (g); docs/M7D.md, D0b), in the same words as 1.4's build.yml: (f) each photo's
# demo handwriting is checked (tools/shots/ink_check.swift against tools/shots/ink_ref.tsv, with tools/shots/ink_retake.sh,
# all three read from the pushed commit) and a photo whose handwriting is short is taken again with the same launch and
# wait, at most twice, the take with the fewest pixels short staying (the sheets are checked only; every result is a line
# of shots/ink.txt), and (g) the iPhone's landscape photos are turned by 270° only when the PNG is taller than wide (the
# iOS 27.2 simulator writes them in landscape already). A complete photo is taken as before.
#
# Known (docs/M7B.md, C1): the 13-inch iPad is booted just before its photos (the unit tests run on
# another simulator), and in 2 of 3 runs of 1.0.1 the system banner "Ready for Apple Intelligence"
# (about 85–105 s after the boot) landed in its week or day photo: a comparison then shows strong
# differences in the top 240 rows of that photo and of store/ipad13/02-week or 03-day. Since FIX3
# (docs/M7B.md) the 13-inch step and build.yml's wait 120 s with the app in front before the first photo,
# for that banner and for the shaders of a first launch (a month photo without its handwriting). If a
# banner still shows, take the photos again.
#
# The photo steps must stay the same as build.yml's (`run` for `run`; added here: the working directory baseline/).
# build.yml's photo steps of 1.4 are compared with this reference: a photo step changed there changes its photos, and the
# change must be one that docs/M7D.md lists; a change of these steps is made in both files in the same words.
#
# When it runs: `gh workflow run ja-baseline.yml --ref <branch>` (workflow_dispatch: the workflow is on the default
# branch, and the run uses the branch's copy), or a push to the branch `ja-baseline`. Run it on the same UTC day as
# the CI run whose `screenshots` it is compared with (a newer Xcode or simulator runtime on the runner image changes
# the pixels, and the iPads' status bar shows the date); 1.4 (§3.5, §3.8): the result counts only when the two env.txt
# have the same Xcode and runtime lines (an image being rolled out, 20261119, can come between: then take this again).
# How to compare: docs/M7B.md, section C1 (基準 = ja-baseline-955fe67, 新 = the `screenshots` of 1.4's CI run).
name: ja-baseline

on:
  push:
    branches:
      - ja-baseline
  workflow_dispatch:

concurrency:
  group: ja-baseline-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  ja-baseline:
    name: ja-baseline (1.3's photos with JA_ARGS and Xcode 27.2, for 1.4)
    # 1.4 (docs/M7D_CONTRACT.md §3.1, §3.5 (a), 0d-2): the image with Xcode 27, as build.yml.
    runs-on: xcode-27
    # In nine runs of 1.1 (2026-10-31 and 11-01) build.yml's photo steps took 36–45 min. With 1.2's and 1.2.3's
    # photo steps the whole job took 48.4, 52.7 and 49.8 min (runs 42013415033, 42040741655, 42121207729) and, after
    # 43fe366's steps were copied for 1.3, 61.6 min (run 43068016348: the boot 7.8 min, the 13-inch photos
    # 7.7 + 5.5, the other devices 35.2). No tests run here. 90 leaves room for a slow boot or a slow device; a job
    # cut by its limit would not reach the upload, and J-4's baseline would have to be taken again the same UTC day.
    # 1.4: kept at 90 (955fe67's steps add at most two late pinch hints; the new image's first boot is slower, §3.8).
    # 1.4 D0b (docs/M7D_CONTRACT.md §3.3 9, §3.8; docs/M7D.md, D0b): 90 → 130. On the image of D0's first build-and-test
    # (run 44632524223, 20261119.0378.1) the same photo steps took 16.6 min for the 13-inch (photos, sheets and log;
    # 10.3 in 1.3's run 44474759145) and 17.5–20.4 min for each other device (8.0–12.1), with a `simctl boot` of
    # 4.7–10.6 min, and the first boot of the 13-inch took 12–15. Here that is about 6 (to the build) + 13 (the first
    # boot) + 16.6 + 75 (the four devices) + 3 (the store set and the upload) ≈ 114 min; 130 keeps about 16 over it, so
    # a slow image still reaches the upload (build.yml's build-and-test: 110 → 160 in the same commit).
    timeout-minutes: 130
    env:
      HOMEBREW_NO_AUTO_UPDATE: "1"
      HOMEBREW_NO_INSTALL_CLEANUP: "1"
      NSUnbufferedIO: "YES"
      # J-4: every screenshot launch ends with these, as in build.yml since 1.2 (the runner's simulator is
      # English; without them the kanji fall back to PingFang SC and the dates are English). Expanded
      # unquoted on purpose: four words, none with a space.
      JA_ARGS: "-AppleLanguages (ja) -AppleLocale ja_JP"
    defaults:
      run:
        working-directory: baseline

    steps:
      # The pushed commit: tools/l10n/ja-baseline-ref-1.4.txt, tools/ci/install-xcodegen.sh and tools/shots/screen_ready.swift
      # are read from it (1.4 D0b: also tools/shots/ink_check.swift, ink_ref.tsv and ink_retake.sh).
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Read the reference commit
        id: ref
        working-directory: .
        run: |
          set -euo pipefail
          FILE=tools/l10n/ja-baseline-ref-1.4.txt
          LINES="$(grep -c . "$FILE" || true)"
          REF="$(tr -d '[:space:]' < "$FILE")"
          if [ "$LINES" != "1" ] || ! printf '%s' "$REF" | grep -Eq '^[0-9a-f]{40}$'; then
            echo "::error::$FILE must hold exactly one full commit sha (40 lowercase hex digits)."
            exit 1
          fi
          echo "J-4 reference commit: $REF"
          echo "sha=$REF" >> "$GITHUB_OUTPUT"
          echo "short=${REF:0:7}" >> "$GITHUB_OUTPUT"

      # The app is built and photographed from that commit, in baseline/ (where every `run` step below runs).
      - name: Check out the reference commit at baseline
        uses: actions/checkout@v4
        with:
          ref: ${{ steps.ref.outputs.sha }}
          path: baseline
          persist-credentials: false

      - name: Show the reference commit
        env:
          REF: ${{ steps.ref.outputs.sha }}
        run: |
          set -euo pipefail
          HEAD_SHA="$(git rev-parse HEAD)"
          if [ "$HEAD_SHA" != "$REF" ]; then
            echo "::error::baseline/ is at $HEAD_SHA, not $REF."
            exit 1
          fi
          git log -1 --format='baseline: %H %s'
          grep -E 'MARKETING_VERSION|CURRENT_PROJECT_VERSION' project.yml || true

      # ---- From here to the "Store listing set", the steps of the reference commit's build.yml, in its order ----
      # 1.4 (docs/M7D_CONTRACT.md §3.1, 0d-1): Xcode 27.2, chosen by what each candidate says it is, never by its path.
      # Every /Applications/Xcode_27.2*.app is read with `xcodebuild -version` (DEVELOPER_DIR set to it); one whose version is
      # 27.2 or 27.2.x and whose build ends in a digit is a release (a beta's build ends in a lower-case letter, as 27.3
      # beta's 27C5020n; the rolling-out image 20261119 gives that beta aliases named like a release, §3.1), and the newest
      # release is selected. None fails the job: until 1.3 this step chose Xcode 26.6 only when it was there and otherwise
      # went on with the image's default Xcode, unseen. Then `sudo xcodebuild -runFirstLaunch` (harmless when it has run).
      # The same lines in every job on xcode-27 (build.yml, ja-baseline.yml, store-shots.yml, testflight.yml, duo.yml).
      - name: Select Xcode 27.2
        run: |
          set -euo pipefail
          XCODE="$(python3 -I -c '
          import glob, os, re, subprocess, sys
          def key(version, build):                               # (27, 2, 0), then the build: digits as numbers
              numbers = tuple((int(p) for p in version.split("."))) + (0, 0, 0)
              return numbers[:3], tuple((0, int(t)) if t.isdigit() else (1, t) for t in re.findall(r"[0-9]+|[^0-9]+", build))
          best = None
          seen = {}
          for app in sorted(glob.glob("/Applications/Xcode_27.2*.app")):
              real = os.path.realpath(app)
              if real in seen:
                  print("%s: the same Xcode as %s" % (app, seen[real]), file=sys.stderr)
                  continue
              seen[real] = app
              env = dict(os.environ, DEVELOPER_DIR=os.path.join(real, "Contents", "Developer"))
              try:
                  out = subprocess.run(["xcodebuild", "-version"], env=env, capture_output=True, text=True, timeout=300).stdout
              except Exception as error:
                  print("%s: xcodebuild -version failed (%s)" % (app, error), file=sys.stderr)
                  continue
              version = re.search(r"^Xcode ([0-9.]+)$", out, re.M)
              build = re.search(r"^Build version ([0-9A-Za-z]+)$", out, re.M)
              version = version.group(1) if version else "?"
              build = build.group(1) if build else "?"
              release = re.fullmatch(r"27\.2(\.[0-9]+)?", version) is not None and re.search(r"[0-9]$", build) is not None
              print("%s (%s): Xcode %s, build %s%s" % (app, real, version, build, ": a release of 27.2" if release else ": not a release of 27.2"), file=sys.stderr)
              if release and (best is None or key(version, build) > best[0]):
                  best = (key(version, build), real)
          print(best[1] if best else "")
          ')"
          if [ -z "$XCODE" ]; then
            echo "::error::No release of Xcode 27.2 in /Applications (xcodebuild -version 27.2 or 27.2.x, its build ending in a digit; docs/M7D_CONTRACT.md §3.1). The job does not go on with another Xcode."
            exit 1
          fi
          echo "Selected: $XCODE"
          sudo xcode-select -s "$XCODE"
          sudo xcodebuild -runFirstLaunch
          xcode-select -p
          xcodebuild -version
          echo "runner image: ${ImageOS:-?} ${ImageVersion:-?}"

      # 1.4 (docs/M7D_CONTRACT.md §3.2, 0d-3): the simulators of the table that this job uses must be on the runner, each
      # under its exact name on its runtime (iOS 27.2; the iPad mini (A17 Pro) is on iOS 27.0 only; the iPhone Duo on the
      # Duo's iOS 27.2 runtime). One that is missing fails the job here: until 1.3 a missing device was a warning ("No
      # simulator for …; skipping") and the job stayed green, so all the 6.9-inch photos could be gone unseen. Each one's
      # UDID is an output of this step (steps.required.outputs.<id>); the table and the runtime (name and build) each one
      # resolved to go to $RUNNER_TEMP for "The simulators used are the table's" after the photos, and the UDIDs to
      # $RUNNER_TEMP/required-simulators-udids.txt, which the pickers of the later steps take first (so they boot the very
      # devices checked here). When the name is on two runtimes of that version (iOS 27.2 has two sets, the usual devices'
      # and the iPhone Duo's, §3.1), every other device is taken from the runtime with no iPhone Duo and the iPhone Duo from
      # the runtime of iPhone Duos only; a warning only when nothing tells the runtimes apart. The same lines in every job
      # that boots a simulator; only the table differs.
      - name: Required simulators (1.4)
        id: required
        env:
          # <id>|<exact name>|<runtime version> (docs/M7D_CONTRACT.md §3.2)
          REQUIRED: |
            ipad13|iPad Pro 13-inch (M5)|27.2
            iphone|iPhone 17|27.2
            iphone69|iPhone 18 Pro Max|27.2
            ipadmini|iPad mini (A17 Pro)|27.0
            ipad11|iPad Pro 11-inch (M5)|27.2
        run: |
          set -euo pipefail
          printf '%s\n' "$REQUIRED" | grep -v '^[[:space:]]*$' > "$RUNNER_TEMP/required-simulators.txt"
          xcrun simctl list -j > "$RUNNER_TEMP/simctl-list.json"
          python3 -I - "$RUNNER_TEMP/simctl-list.json" "$RUNNER_TEMP/required-simulators.txt" <<'EOF'
          import json, os, re, sys
          data = json.load(open(sys.argv[1], encoding="utf-8"))
          runtimes = {r.get("identifier"): r for r in data.get("runtimes", [])}
          def version(runtime):                                  # the runtime's "version" ("27.2"), else from its identifier
              v = runtimes.get(runtime, {}).get("version")
              if v:
                  return v
              m = re.search(r"iOS-([0-9]+)-([0-9]+)", runtime)
              return "%s.%s" % m.groups() if m else "?"
          devices = {runtime: [d for d in items if d.get("isAvailable") and d.get("name") and d.get("udid")]
                     for runtime, items in data.get("devices", {}).items() if "iOS" in runtime}
          def duos(runtime):                                     # 0: iPhone Duos only, 1: some, 2: none
              n = sum(d["name"].startswith("iPhone Duo") for d in devices[runtime])
              return 0 if n == len(devices[runtime]) else 1 if n else 2
          failed = False
          outputs = []
          resolved = []
          for line in open(sys.argv[2], encoding="utf-8"):
              ident, name, want = [p.strip() for p in line.rstrip("\n").split("|")]
              def wanted(runtime):
                  return version(runtime) == want or version(runtime).startswith(want + ".")
              # The runtime that suits the name first: for the iPhone Duo the one of iPhone Duos only (the Duo's own iOS 27.2
              # set), for every other device the one with no iPhone Duo (§3.1); then a runtime with some iPhone Duos.
              found = sorted((duos(runtime) if name.startswith("iPhone Duo") else 2 - duos(runtime), runtime, d["udid"])
                             for runtime, items in devices.items() if wanted(runtime) for d in items if d["name"] == name)
              if not found:
                  there = sorted({d["name"] for runtime, items in devices.items() if wanted(runtime) for d in items})
                  print("::error::%s: no available simulator \"%s\" on iOS %s (docs/M7D_CONTRACT.md §3.2). The devices of iOS %s: %s"
                        % (ident, name, want, want, ", ".join(there) or "none (no such runtime)"))
                  failed = True
                  continue
              _, runtime, udid = found[0]
              r = runtimes.get(runtime, {})
              print("%s: %s | %s (%s) %s" % (ident, name, r.get("name", runtime), r.get("buildversion", "?"), udid))
              if len(found) > 1:
                  tie = found[0][0] == found[1][0]
                  print("%s%s: \"%s\" is on %d runtimes of iOS %s (%s); %s is taken (%s)."
                        % ("::warning::" if tie else "", ident, name, len(found), want, ", ".join(f[1] for f in found), runtime,
                           "nothing tells them apart: the first by its identifier" if tie
                           else "iPhone Duos only" if name.startswith("iPhone Duo") else "no iPhone Duo"))
              outputs.append("%s=%s\n" % (ident, udid))
              resolved.append("%s|%s|%s|%s\n" % (ident, name, r.get("name", runtime), r.get("buildversion", "?")))
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as out:
              out.write("".join(outputs))
          with open(sys.argv[2].replace(".txt", "-resolved.txt"), "w", encoding="utf-8") as out:
              out.write("".join(resolved))
          with open(sys.argv[2].replace(".txt", "-udids.txt"), "w", encoding="utf-8") as out:
              out.write("".join(o.split("=", 1)[1] for o in outputs))
          sys.exit(1 if failed else 0)
          EOF

      # 1.4 (docs/M7D_CONTRACT.md §3.3 4, 0d-28): XcodeGen 2.46.0 from its release zip, pinned by sha256, the same in every
      # job (until 1.3 `brew install xcodegen`, whose version was the image's formula). The script fails unless
      # `xcodegen --version` then says 2.46.0; the job's later steps find it first in PATH.
      - name: Install XcodeGen
        run: |
          set -euo pipefail
          bash "$GITHUB_WORKSPACE/tools/ci/install-xcodegen.sh"

      - name: Generate the Xcode project
        run: |
          set -euo pipefail
          xcodegen generate
          xcodebuild -project TegakiCalendar.xcodeproj -list

      - name: Build for the iOS Simulator
        run: |
          set -euo pipefail
          xcodebuild \
            -project TegakiCalendar.xcodeproj \
            -scheme TegakiCalendar \
            -configuration Debug \
            -destination "generic/platform=iOS Simulator" \
            -derivedDataPath build/DerivedData \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            build

      # The primary simulator (unit tests, 4 pages, 6 sheets): the first name, in sorted order, that
      # starts with "iPad Pro 13-inch", else "iPad Air 13-inch", else any iPad, else any iPhone
      # (docs/M4B_CONTRACT.md §6.1: the runner has no "iPad Pro 13-inch (M4)", so the choice is by
      # prefix and deterministic). Until 1.3 the literal "iPhone 17" was the last resort (the step never failed);
      # 1.4 (docs/M7D_CONTRACT.md §3.2): the name chosen must be the table's "iPad Pro 13-inch (M5)", or the step fails.
      - name: Pick a simulator (13-inch iPad preferred)
        id: simulator
        run: |
          set -euo pipefail
          xcrun simctl list devices available
          NAME="$(xcrun simctl list -j devices available | python3 -c '
          import json, sys
          devices = json.load(sys.stdin).get("devices", {})
          names = set()
          for runtime, items in devices.items():
              if "iOS" not in runtime:
                  continue
              for d in items:
                  if d.get("isAvailable") and d.get("name"):
                      names.add(d["name"])
          for prefix in ("iPad Pro 13-inch", "iPad Air 13-inch", "iPad", "iPhone"):
              matches = sorted(n for n in names if n.startswith(prefix))
              if matches:
                  print(matches[0])
                  raise SystemExit
          print("")
          ' || true)"
          echo "Using simulator: ${NAME:-none}"
          if [ "$NAME" != "iPad Pro 13-inch (M5)" ]; then
            echo "::error::The primary simulator must be the table's \"iPad Pro 13-inch (M5)\", not \"${NAME:-none}\" (docs/M7D_CONTRACT.md §3.2)."
            exit 1
          fi
          echo "name=$NAME" >> "$GITHUB_OUTPUT"

      # ---- Screenshots of the running app (best effort; never fails the job) ----
      # 1.2 (docs/M7B_CONTRACT.md §1.3 J-4, §7.5, 0-25): every launch of these steps ends with $JA_ARGS and
      # the steps write shots/env.txt. (In this file: the steps of 955fe67's build.yml with 1.4's changes (a)–(e) in the
      # words of 1.4's build.yml, copied for J-4 of 1.4; see the head of this file.)
      # The app is launched with "--screenshot-mode" (Sources/TegakiCalendar/Support/ScreenshotMode.swift):
      # no onboarding, no EventKit, deterministic demo events for 2026-10 and a few preloaded ink
      # strokes. Since M3a it is launched once per page ("--screenshot-page month|week|day|year",
      # docs/M3A_CONTRACT.md §9), terminated between launches; since M3b four more times on the month
      # page with "--screenshot-sheet create|edit|lasso|settings" (docs/M3B_CONTRACT.md §5, §7), which
      # opens the create / edit sheet, the lasso selection with its menu, or the settings screen half a
      # second after the canvas appeared; since M4 two more sheets, "sync" (the settings screen with the
      # demo sync engine: 「同期済み」 and 「最後に同期」) and "import" (the finished web import,
      # docs/M4_CONTRACT.md §6.6); since M5 a seventh, "paywall" (the subscription sheet of
      # docs/M5_CONTRACT.md §4.1 over the month page), and "--screenshot-readonly" (the demo store starts
      # unsubscribed: the 「閲覧専用」 badge in the header, the toast of §3.3 for 20 s, docs/M5_CONTRACT.md
      # §7.5); since M6 an eighth sheet, "export" (the export sheet of docs/M6_CONTRACT.md §3.2 in its
      # choose state — two actions with a one-line note each — over the month page, 0-6).
      # In screenshot mode the sync engine is an inert demo over an in-memory fake and the store
      # is an inert demo client (no StoreKit, no UserDefaults), so nothing here needs an iCloud account
      # or App Store Connect. simctl cannot tap or rotate the device; since
      # M4b (docs/M4B_CONTRACT.md §6.4) only the iPhone turns with "--screenshot-landscape" (the app
      # asks the window scene for landscape; iPadOS ignores that request for an app that supports
      # multitasking, so the iPad shots are portrait only).
      # The steps run even when the unit tests failed (the app was still built); the upload always runs.
      - name: Resolve the simulator UDID
        id: simudid
        if: ${{ !cancelled() && steps.simulator.outcome == 'success' && env.QUICK != 'true' }}
        continue-on-error: true
        run: |
          set -euo pipefail
          NAME="${{ steps.simulator.outputs.name }}"
          UDID="$(xcrun simctl list -j devices available | SIM_NAME="$NAME" python3 -c '
          import json, os, re, sys
          name = os.environ["SIM_NAME"]
          devices = json.load(sys.stdin).get("devices", {})
          def version(runtime):                                  # "…iOS-27-2" → (27, 2)
              m = re.search(r"iOS-(\d+)-(\d+)", runtime)
              return (int(m.group(1)), int(m.group(2))) if m else (0, 0)
          try:                                                   # 1.4 (docs/M7D_CONTRACT.md §3.2): "Required simulators"
              required = set(open(os.path.join(os.environ["RUNNER_TEMP"], "required-simulators-udids.txt"), encoding="utf-8").read().split())
          except (KeyError, OSError):
              required = set()
          found = ""
          best = None
          for runtime, items in devices.items():
              if "iOS" not in runtime:
                  continue
              for d in items:
                  if d.get("isAvailable") and d.get("name") == name and d.get("udid"):
                      # 1.4 (docs/M7D_CONTRACT.md §3.2): the device "Required simulators" resolved; else the one xcodebuild
                      # already booted for the tests; else the newest iOS (ja-baseline.yml boots nothing first, and the name is
                      # on iOS 27.0 and 27.2).
                      key = (d["udid"] in required, d.get("state") == "Booted", version(runtime))
                      if best is None or key > best:
                          best, found = key, d["udid"]
          print(found)
          ')"
          if [ -z "$UDID" ]; then
            echo "::warning::No simulator UDID found for '$NAME'; skipping screenshots."
            exit 1
          fi
          echo "Simulator: $NAME ($UDID)"
          echo "udid=$UDID" >> "$GITHUB_OUTPUT"

      - name: Boot the simulator
        if: ${{ !cancelled() && steps.simudid.outcome == 'success' }}
        continue-on-error: true
        run: |
          set -euo pipefail
          UDID="${{ steps.simudid.outputs.udid }}"
          xcrun simctl boot "$UDID" || true
          xcrun simctl bootstatus "$UDID" -b
          xcrun simctl ui "$UDID" appearance light
          # A fixed status bar, so two runs produce the same pixels.
          xcrun simctl status_bar "$UDID" override --time "9:41" --batteryState charged --batteryLevel 100 --wifiBars 3 || true

      - name: Install the app on the simulator
        if: ${{ !cancelled() && steps.simudid.outcome == 'success' }}
        continue-on-error: true
        run: |
          set -euo pipefail
          UDID="${{ steps.simudid.outputs.udid }}"
          APP="$(find build/DerivedData -name "TegakiCalendar.app" -path "*iphonesimulator*" -not -path "*/Index.noindex/*" | head -1)"
          if [ -z "$APP" ]; then
            echo "::warning::TegakiCalendar.app not found under build/DerivedData; skipping screenshots."
            exit 1
          fi
          echo "App bundle: $APP"
          xcrun simctl install "$UDID" "$APP"

      # File names since M4b: ipad13-portrait-<page>.png (docs/M4B_CONTRACT.md §6.2; M4 and earlier
      # wrote ipad-portrait-<page>.png, the mapping is in docs/M4B.md). Since M4c the 4 pages open at
      # the overview (the whole page fits the paper area, docs/M4C_CONTRACT.md D1) and three more shots
      # open the month, the week and the year at twice the overview with a paper point (lu) at the top
      # left ("--screenshot-zoom 2 --screenshot-offset x,y", §2.4: the photo shares the canvas's zoom
      # path with a pinch; the year's offset is clamped to the paper's right edge on purpose). Since M5
      # one more: the month page in read-only mode (docs/M5_CONTRACT.md §7.5: the orange 「閲覧専用」 badge
      # left of 「＋予定」 (1024 pt ≥ 980, so with its text), the 20 s toast, undo/redo greyed). Since 1.1
      # (docs/M7A_CONTRACT.md §7.4, §8 6) five more: the toolbar folded into the dock button at the
      # bottom left and at the bottom right ("--screenshot-toolbar collapsed|collapsed-right"), the eraser
      # chosen from the toolbar (its hint ends in 「（消すとペンに戻ります）」; the 「しまう」 button at the
      # right end), and the grown month memo and the day's free memo below 24:00 ("--screenshot-grown")
      # scrolled to their strokes ("--screenshot-offset 0,1700" and "0,2300": 1.1.1 opens the two areas
      # to 6,000 lu, so the end of the paper is blank; the red wave is at y ≈ 2,063, the black at ≈ 2,700).
      # 1.1.1 (docs/R1_1_1.md): the one-time pinch hint ("--screenshot-pinch-hint", 20 s).
      # 1.3 (docs/M7C.md, wave C1's lead decision 6): screenshot mode shows the hint's toast from half a second after the
      # canvas appeared for 20 s. In run 43570477701 a slow simulator wrote this photo 56 s after its launch (the launch
      # 12 s late, `simctl io` 32 s), after the toast, and J-4 saw it missing. So the hint's photo is kept when it was written
      # at most 20 s after its launch (the canvas appears a few seconds after the launch, so the toast is still up then;
      # here the last loop, `hint_shot` in the step of the other devices) and taken once more otherwise; a second late one stays, with a warning. A photo taken in time is the same as
      # before (same arguments and waits; the app's toast is not changed, J-4). ja-baseline.yml kept its one take until
      # 1.4, whose copy of these steps (955fe67's) takes the hint the same way.
      - name: Screenshots (13-inch iPad, portrait, 4 pages + 3 zoomed + read-only + 5 of 1.1 + the hint)
        if: ${{ !cancelled() && steps.simudid.outcome == 'success' }}
        continue-on-error: true
        run: |
          set -euo pipefail
          UDID="${{ steps.simudid.outputs.udid }}"
          BUNDLE="com.syfan0.tegakicalendar"
          mkdir -p shots
          # J-4 (docs/M7B_CONTRACT.md §1.3, §7.5): the Xcode and the simulator runtimes the photos were drawn
          # with. build.yml and ja-baseline.yml write the same lines (keep them the same), so a `diff` of the
          # two env.txt tells whether two runs drew with the same Xcode and runtimes. No UDIDs (they differ
          # from one runner image to the next).
          sim_env() {  # sim_env <device id> <udid>: "<id>: <device name> | <runtime name> (<runtime build>)"
            xcrun simctl list -j | SIM_ID="$1" SIM_UDID="$2" python3 -I -c '
          import json, os, sys
          data = json.load(sys.stdin)
          runtimes = {r.get("identifier"): r for r in data.get("runtimes", [])}
          for runtime, items in data.get("devices", {}).items():
              for d in items:
                  if d.get("udid") == os.environ["SIM_UDID"]:
                      r = runtimes.get(runtime, {})
                      print("%s: %s | %s (%s)" % (os.environ["SIM_ID"], d.get("name"), r.get("name", runtime), r.get("buildversion", "?")))
                      raise SystemExit
          print("%s: (no simulator %s)" % (os.environ["SIM_ID"], os.environ["SIM_UDID"]))
          '
          }
          xcodebuild -version > shots/env.txt || echo "::warning::xcodebuild -version failed"
          # 1.4 (docs/M7D_CONTRACT.md §3.3 3): the Xcode's path, the runner image (§3.8: an image being rolled out has another
          # Xcode and other runtimes), the simulator runtimes, XcodeGen and Python, so two env.txt tell those apart too.
          {
            echo "Xcode path: $(xcode-select -p)"
            echo "runner image: ${ImageOS:-?} ${ImageVersion:-?}"
            echo "xcodegen: $(xcodegen --version 2>&1 | head -n 1)"
            echo "python3: $(python3 --version 2>&1)"
            xcrun simctl list runtimes
          } >> shots/env.txt || echo "::warning::env.txt: the lines of 1.4 could not all be written"
          sim_env ipad13 "$UDID" >> shots/env.txt || echo "::warning::no runtime line for ipad13"
          cat shots/env.txt || true
          # 1.4 D0b (docs/M7D_CONTRACT.md §3.5 (f); docs/M7D.md, D0b): in D0 (run 44632524223) photos of the image 20261119
          # lacked part of their demo handwriting (whole PencilKit tiles not shown). Each photo is checked with
          # tools/shots/ink_check.swift (built here, during the 120 s wait) against its line in tools/shots/ink_ref.tsv; a
          # photo whose handwriting is short is taken again with the same launch and wait (ink_retake), at most twice, and then
          # the take with the fewest pixels short stays, with a warning (no more takes again after 3 such photos of a device,
          # or 300 s of them in a step). A complete photo is kept as before (same arguments and waits). Every result is a
          # line of shots/ink.txt (tools/shots/ink_retake.sh). Same lines in both workflows.
          . "$GITHUB_WORKSPACE/tools/shots/ink_retake.sh"
          ink_build
          # docs/M7B.md (FIX3), docs/M7B_CONTRACT.md §12.6: a first launch after the install compiles PencilKit's
          # 34 Metal shaders (the next launches none). In run 42013415033 that took until 19 s after the launch,
          # so the month photo of 8 s had no handwriting. And a freshly booted simulator posts the banner "Ready
          # for Apple Intelligence" once, about 85–105 s after the boot (docs/M7B.md, C1), which that run caught
          # on the week photo. 120 s with the app in front outlasts both. Same lines in the other workflow.
          xcrun simctl launch "$UDID" "$BUNDLE" --screenshot-mode --screenshot-month 2026-10 --screenshot-page month $JA_ARGS || true
          sleep 120
          xcrun simctl terminate "$UDID" "$BUNDLE" 2>/dev/null || true
          for PAGE in month week day year; do
            xcrun simctl terminate "$UDID" "$BUNDLE" 2>/dev/null || true
            sleep 1
            xcrun simctl launch "$UDID" "$BUNDLE" --screenshot-mode --screenshot-month 2026-10 --screenshot-page "$PAGE" $JA_ARGS
            sleep 8
            pgrep -fl "TegakiCalendar.app/TegakiCalendar" || echo "::warning::The app is not running after 8 s ($PAGE page; crashed?)"
            xcrun simctl io "$UDID" screenshot "shots/ipad13-portrait-$PAGE.png"
            ink_retake "shots/ipad13-portrait-$PAGE.png" "ipad13-portrait-$PAGE.png" 8 --screenshot-mode --screenshot-month 2026-10 --screenshot-page "$PAGE" $JA_ARGS
          done
          # page|offset: month lu (400, 200) → the Wed–Sat columns from the second half of the 10/5 week;
          # week (300, 700) → Tue–Sat from 8:45 (the band's lanes grow past zoom 0.818, §1.6);
          # year (1000, 300) → clamped to the right edge: May's end to December.
          for SPEC in "month|400,200" "week|300,700" "year|1000,300"; do
            PAGE="${SPEC%%|*}"; OFFSET="${SPEC##*|}"
            xcrun simctl terminate "$UDID" "$BUNDLE" 2>/dev/null || true
            sleep 1
            xcrun simctl launch "$UDID" "$BUNDLE" --screenshot-mode --screenshot-month 2026-10 --screenshot-page "$PAGE" --screenshot-zoom 2 --screenshot-offset "$OFFSET" $JA_ARGS
            sleep 8
            pgrep -fl "TegakiCalendar.app/TegakiCalendar" || echo "::warning::The app is not running after 8 s ($PAGE page, zoom 2; crashed?)"
            xcrun simctl io "$UDID" screenshot "shots/ipad13-portrait-$PAGE-zoom2.png"
            ink_retake "shots/ipad13-portrait-$PAGE-zoom2.png" "ipad13-portrait-$PAGE-zoom2.png" 8 --screenshot-mode --screenshot-month 2026-10 --screenshot-page "$PAGE" --screenshot-zoom 2 --screenshot-offset "$OFFSET" $JA_ARGS
          done
          xcrun simctl terminate "$UDID" "$BUNDLE" 2>/dev/null || true
          sleep 1
          xcrun simctl launch "$UDID" "$BUNDLE" --screenshot-mode --screenshot-month 2026-10 --screenshot-page month --screenshot-readonly $JA_ARGS
          sleep 8
          pgrep -fl "TegakiCalendar.app/TegakiCalendar" || echo "::warning::The app is not running after 8 s (month page, read only; crashed?)"
          xcrun simctl io "$UDID" screenshot "shots/ipad13-portrait-readonly.png"
          ink_retake shots/ipad13-portrait-readonly.png ipad13-portrait-readonly.png 8 --screenshot-mode --screenshot-month 2026-10 --screenshot-page month --screenshot-readonly $JA_ARGS
          for SPEC in "toolbar-collapsed|--screenshot-page month --screenshot-toolbar collapsed" \
                      "toolbar-collapsed-right|--screenshot-page month --screenshot-toolbar collapsed-right" \
                      "tool-eraser|--screenshot-page month --screenshot-tool eraser" \
                      "month-memo|--screenshot-page month --screenshot-grown --screenshot-offset 0,1700" \
                      "day-extra|--screenshot-page day --screenshot-grown --screenshot-offset 0,2300"; do
            SHOT="${SPEC%%|*}"; ARGS="${SPEC#*|}"
            xcrun simctl terminate "$UDID" "$BUNDLE" 2>/dev/null || true
            sleep 1
            # $ARGS (and $JA_ARGS) is split on purpose (the values have no spaces).
            xcrun simctl launch "$UDID" "$BUNDLE" --screenshot-mode --screenshot-month 2026-10 $ARGS $JA_ARGS
            sleep 8
            pgrep -fl "TegakiCalendar.app/TegakiCalendar" || echo "::warning::The app is not running after 8 s ($SHOT; crashed?)"
            xcrun simctl io "$UDID" screenshot "shots/ipad13-portrait-$SHOT.png"
            ink_retake "shots/ipad13-portrait-$SHOT.png" "ipad13-portrait-$SHOT.png" 8 --screenshot-mode --screenshot-month 2026-10 $ARGS $JA_ARGS
          done
          # The pinch hint, last as before (the comment above the step: kept when written within the toast's 20 s).
          # 1.4 D0b (§3.5 (f)): and with its handwriting complete (ink_hint); after 2 takes the better one stays (in time
          # first, then fewer pixels short; two late complete takes: the second, as before).
          HINT_SECONDS=20
          for TAKE in 1 2; do
            xcrun simctl terminate "$UDID" "$BUNDLE" 2>/dev/null || true
            sleep 1
            LAUNCHED="$(date +%s)"
            xcrun simctl launch "$UDID" "$BUNDLE" --screenshot-mode --screenshot-month 2026-10 --screenshot-page month --screenshot-pinch-hint $JA_ARGS
            sleep 8
            pgrep -fl "TegakiCalendar.app/TegakiCalendar" || echo "::warning::The app is not running after 8 s (pinch-hint; crashed?)"
            xcrun simctl io "$UDID" screenshot "shots/ipad13-portrait-pinch-hint.png"
            TOOK=$(( $(date +%s) - LAUNCHED ))
            if ink_hint shots/ipad13-portrait-pinch-hint.png ipad13-portrait-pinch-hint.png "$TAKE" "$TOOK" "$HINT_SECONDS"; then
              echo "pinch hint (ipad13): written ${TOOK} s after the launch (take $TAKE), inside the toast's ${HINT_SECONDS} s"
              break
            fi
            if [ "$TOOK" -le "$HINT_SECONDS" ]; then
              echo "pinch hint (ipad13): written ${TOOK} s after the launch (take $TAKE), inside the toast's ${HINT_SECONDS} s, its handwriting short"
            else
              echo "pinch hint (ipad13): written ${TOOK} s after the launch (take $TAKE), after the toast's ${HINT_SECONDS} s"
            fi
            if [ "$TAKE" = 2 ]; then
              echo "::warning::ipad13-portrait-pinch-hint.png was written more than ${HINT_SECONDS} s after its launch, or with its handwriting short, twice; the toast or some handwriting may be missing from it (J-4)."
            fi
          done
          ls -la shots

      # Since 1.1 (docs/M7A_CONTRACT.md §7.3) a ninth sheet, "info": the settings scrolled to 「情報」 with
      # the demo stroke counts (「いちばん線の多いページ」 and 「今年の年のページ」). Since 1.2 (docs/M7B_CONTRACT.md
      # §7.4, §10.7, §7.6) a tenth, "holidays" (the picker of the holidays), and an eleventh, "week-start" (the
      # settings with the question of switching the week start). ja-baseline.yml does not shoot these two.
      # (1.3: it does, its reference being 43fe366.)
      # 1.3 (docs/M7C_CONTRACT.md §10.5; docs/M7C.md, S3's J-4 and its hand-off to S5): the photo of a sheet is no
      # longer only the frame of a fixed 9 s after the launch. In run 43149906124 that frame of `--screenshot-sheet
      # holidays` held the settings still sliding in, not yet at their place (the picker opens from them 0.4 s after
      # they appear). The frame of 9 s is still taken, and kept once tools/shots/screen_ready.swift finds the screen
      # ready: still (at most 1 pixel in 2,000 differs strongly from a frame taken at 8 s), and unlike the screens shown
      # before it — the month page without a sheet (ipad13-portrait-month.png, the step above) for every sheet, and the
      # settings (ipad13-portrait-sheet-settings.png, taken before them in this loop) for the four opened from them
      # (sync, info, holidays, week-start). Otherwise the next frame, a second later, is compared with that one, up to
      # 30 s after the launch and at least twice (in run 43310108102 one frame took 25 s: the simulator was slow); then
      # the last frame stays, with a warning. Every comparison is one line. So no photo is taken earlier than before, and a
      # screen that has settled is photographed as before (each sheet of the runs 43136565762 and 43149906124 and of the
      # reference run 43158921131 differs from that month page by at least 47,648 pixels, the four from those settings by
      # at least 44,318; the same screen of two runs by 0). The same lines in ja-baseline.yml (J-4). If the tool does not
      # compile, every sheet is the frame of 9 s, with a warning.
      # 1.3's review of the week memo (docs/M7C.md, the lead's decision 1 of the week memo's integration): in run
      # 44296486095 the frame of 9 s of `--screenshot-sheet holidays` held the settings, still, a few pixels from their
      # place, the picker not yet open, and was kept (32,648 pixels from the settings' photo). The tool now counts only
      # the pixels with no like pixel within 3 pixels (that frame: 1,220, not unlike; a settled sheet: at least 23,816 from
      # the settings, 37,015 from the month page), so such a frame is not kept and the step waits for the expected screen
      # (the loop below, unchanged). The frame of 9 s stays the first one taken, so no photo is earlier than before. The
      # tool is read from the commit a run is on, so ja-baseline.yml (which runs on r13) waits the same way once this
      # change is on r13.
      - name: Screenshots (13-inch iPad, portrait, 11 sheets on the month page)
        if: ${{ !cancelled() && steps.simudid.outcome == 'success' }}
        continue-on-error: true
        run: |
          set -euo pipefail
          UDID="${{ steps.simudid.outputs.udid }}"
          BUNDLE="com.syfan0.tegakicalendar"
          mkdir -p shots
          # 1.3: the wait for the screen (above), built from the commit that runs the workflow: in the background before
          # the boot when a step started that build (build.yml's "Build the sheets' screen check in the background"),
          # else here.
          READY="$RUNNER_TEMP/screen_ready"
          BACKGROUND="$RUNNER_TEMP/screen_ready.build"
          if [ -f "$BACKGROUND/pid" ]; then
            BUILD_WAIT=0
            while [ ! -f "$BACKGROUND/status" ] && kill -0 "$(cat "$BACKGROUND/pid")" 2>/dev/null && [ "$BUILD_WAIT" -lt 300 ]; do
              sleep 1
              BUILD_WAIT=$((BUILD_WAIT + 1))
            done
            if [ "$(cat "$BACKGROUND/status" 2>/dev/null || true)" = "0" ] && [ -x "$BACKGROUND/screen_ready" ]; then
              cp "$BACKGROUND/screen_ready" "$READY"
              echo "tools/shots/screen_ready.swift was built in the background (waited for it ${BUILD_WAIT} s here)."
            else
              echo "::warning::the background build of tools/shots/screen_ready.swift did not end well; it is built here."
              cat "$BACKGROUND/log" 2>/dev/null || true
            fi
          fi
          if [ ! -x "$READY" ] && ! swiftc -O "$GITHUB_WORKSPACE/tools/shots/screen_ready.swift" -o "$READY"; then
            echo "::warning::tools/shots/screen_ready.swift did not compile; every sheet is taken 9 s after its launch, as before 1.3."
            READY=""
          fi
          EARLIER="$RUNNER_TEMP/sheet-earlier.png"
          for SHEET in create edit lasso settings sync import paywall export info holidays week-start; do
            SHOT="shots/ipad13-portrait-sheet-$SHEET.png"
            UNLIKE="shots/ipad13-portrait-month.png"
            case "$SHEET" in
              sync|info|holidays|week-start) UNLIKE="$UNLIKE shots/ipad13-portrait-sheet-settings.png" ;;
            esac
            xcrun simctl terminate "$UDID" "$BUNDLE" 2>/dev/null || true
            sleep 1
            xcrun simctl launch "$UDID" "$BUNDLE" --screenshot-mode --screenshot-month 2026-10 --screenshot-page month --screenshot-sheet "$SHEET" $JA_ARGS
            LAUNCHED="$(date +%s)"
            rm -f "$EARLIER"
            sleep 8
            [ -z "$READY" ] || xcrun simctl io "$UDID" screenshot "$EARLIER" > /dev/null 2>&1 || true
            sleep 1
            pgrep -fl "TegakiCalendar.app/TegakiCalendar" || echo "::warning::The app is not running after 9 s (sheet $SHEET; crashed?)"
            xcrun simctl io "$UDID" screenshot "$SHOT"
            [ -n "$READY" ] || continue
            TRIES=0
            while :; do
              STATUS=0
              # $UNLIKE is split on purpose (paths without spaces).
              LINE="$("$READY" "$SHOT" "$EARLIER" $UNLIKE)" || STATUS=$?
              WAITED=$(( $(date +%s) - LAUNCHED ))
              echo "sheet $SHEET, ${WAITED} s after the launch: $LINE"
              [ "$STATUS" != 0 ] || break
              if [ "$STATUS" != 1 ] || { [ "$WAITED" -ge 30 ] && [ "$TRIES" -ge 2 ]; }; then
                echo "::warning::sheet $SHEET: the screen was not ready ${WAITED} s after the launch; its last frame is kept."
                break
              fi
              TRIES=$((TRIES + 1))
              cp "$SHOT" "$EARLIER"
              sleep 1
              if ! xcrun simctl io "$UDID" screenshot "$SHOT" > /dev/null 2>&1; then
                echo "::warning::sheet $SHEET: a later frame could not be taken, the one before is kept"
                cp "$EARLIER" "$SHOT"
                break
              fi
            done
          done
          # 1.4 D0b (docs/M7D_CONTRACT.md §3.5 (f); docs/M7D.md, D0b): the sheets' handwriting is checked and written into
          # shots/ink.txt, but a sheet is not taken again (its frame is screen_ready's); of the 11 only the lasso's has a line
          # in tools/shots/ink_ref.tsv. Same lines in both workflows.
          . "$GITHUB_WORKSPACE/tools/shots/ink_retake.sh"
          ink_build
          for SHEET in create edit lasso settings sync import paywall export info holidays week-start; do
            ink_read "shots/ipad13-portrait-sheet-$SHEET.png" "ipad13-portrait-sheet-$SHEET.png" 1
            [ "$INK_STATUS" != 1 ] || echo "::warning::ipad13-portrait-sheet-$SHEET.png: its handwriting is short ($INK_SHORT px); a sheet is not taken again."
          done
          ls -la shots

      # The 13-inch log is collected before the other devices boot (its 25 shots since 1.2 took 8.9 min in
      # CI-0; with the 2 min wait added after CI-0 that is about 11, so a 14 min window; each extra device
      # writes its own shots/<id>-log.txt below).
      - name: Collect the app log and crash reports (13-inch iPad)
        if: ${{ !cancelled() && steps.simudid.outcome == 'success' }}
        continue-on-error: true
        run: |
          set -uo pipefail
          UDID="${{ steps.simudid.outputs.udid }}"
          mkdir -p shots
          xcrun simctl terminate "$UDID" com.syfan0.tegakicalendar 2>/dev/null || true
          xcrun simctl spawn "$UDID" log show --last 14m --style compact \
            --predicate 'process == "TegakiCalendar" OR eventMessage CONTAINS "tegakicalendar" OR eventMessage CONTAINS "TegakiCalendar"' \
            > shots/app-log.txt 2>&1 || true
          find "$HOME/Library/Logs/DiagnosticReports" -name 'TegakiCalendar*' -mmin -15 -exec cp {} shots/ \; 2>/dev/null || true
          ls -la shots
          grep -c "" shots/app-log.txt || true
          # M4c (docs/M4C_CONTRACT.md §2.4): the canvas's first layout logs "zoom: kind=… pinch=%d
          # enabled=%d min max zoom fitAll ratio view overview" (DEBUG), a pinch "zoom: begin" /
          # "zoom: end …"; pinch=1 means PKCanvasView offers a pinch (F4). C copies the numbers into docs/M4C.md.
          grep 'zoom: ' shots/app-log.txt || true
          # M5 (docs/M5_CONTRACT.md §2.2, §7.7): LiveStoreClient logs "store: …" (DEBUG: environment,
          # product count, states). Screenshot mode uses the inert demo client, so 0 lines here is the
          # expected result; the grep is the reach check for a device log read the same way.
          grep 'store: ' shots/app-log.txt || true
          # 1.1 (docs/M7A_CONTRACT.md §2.2, §5.3, §7.3, §8 3): screenshot mode logs the window's safe area
          # and the paper area with the toolbar's state ("toolbar: safeArea=<top>,<left>,<bottom>,<right>",
          # "toolbar: paperArea=<w>x<h> mode=<expanded|collapsed|peek>"; docs/M7A.md compares a folded shot
          # with the expanded one of the same page), the settings' stroke count ("budget: largest=…") and
          # the tail-only path ("canvas: tail-only": 0 lines is fine, screenshot mode opens the grown paper
          # directly). Shown only; no count is expected.
          grep -E 'toolbar: (safeArea|paperArea)=|budget: largest=|canvas: tail-only' shots/app-log.txt || true

      # 1.2 (docs/M7B_CONTRACT.md §5.3, §2.5): the language, the locale and the holidays the screen chose,
      # how long the holidays took to load (`l10n: holidays loaded <ms> ms`; about 50 ms is the aim) and
      # any key the app did not find (`l10n: missing <key>`). Shown only; the lead copies them to docs/M7B.md.
      - name: The app's l10n lines (13-inch iPad)
        if: ${{ !cancelled() && steps.simudid.outcome == 'success' }}
        continue-on-error: true
        run: |
          set -uo pipefail
          grep 'l10n: ' shots/app-log.txt | awk '{ i = index($0, "l10n: "); if (i > 1) $0 = substr($0, i); if (!seen[$0]++) print }' || true

      # The four other device classes (docs/M4B_CONTRACT.md §6.3), booted one at a time and shut
      # down afterwards: iphone (iPhone 17, 402 pt), iphone69 (iPhone 17 Pro Max, 440 pt, until 1.3; since M6,
      # docs/M6_CONTRACT.md 0-15 / M6-2: the 6.9-inch App Store shots, 1320×2868; 1.4, docs/M7D_CONTRACT.md §3.2: the
      # iPhone 18 Pro Max, the image xcode-27 having no iPhone 17 Pro Max — the prefix fallbacks are iPhone 18 Pro Max,
      # iPhone 17 Pro Max in that order, and a device other than the table's fails the job at "The simulators used are the
      # table's"; whether its pixels are one of the accepted 6.9-inch sizes is not known yet, the store step below warns if
      # not), ipadmini (iPad mini (A17 Pro), 744 pt; iOS 27.0, the only runtime that has it) and
      # ipad11 (iPad Pro 11-inch (M5), 834 pt), 4 portrait pages each as <id>-portrait-<page>.png.
      # Since M6 the iPhone and the 6.9-inch iPhone also shoot the paywall sheet over the month page
      # (docs/M6_CONTRACT.md §4.2: store/iphone/05-paywall.jpg and store/iphone69/05-paywall.jpg).
      # Since M5 (docs/M5_CONTRACT.md §7.5) the 11-inch iPad also shoots the day page in read-only mode
      # (the longest title next to the symbol-only badge: 834 < 980, M5-32) and the iPhone the week in
      # read-only mode (no badge in the two-row header; the notice row 「閲覧専用です。…」 + 「購読する」).
      # The iPhone also shoots the week of 2026-06 (6/7 is a Sunday: the paper starts at the right
      # edge, M4B-3; since M4c the overview shows the whole week, and the same week is shot again as
      # -week-jun for the "6/1" heading of the narrow column, M4C-28), the week at three times its
      # overview ("--screenshot-zoom 3 --screenshot-offset 300,700", docs/M4C_CONTRACT.md §6) and
      # tries the 4 pages in landscape ("--screenshot-landscape", §6.4; the file is still written when
      # the request was ignored, the header then stays two rows). Every shot is best effort; a
      # failed boot only skips that device (1.4: a missing simulator fails the job, at "The simulators used are the
      # table's", §3.2). The 13-inch simulator is shut down
      # first to leave the runner's memory to the next one. Since M6 (docs/M6.md §5.1) every device
      # waits 40 s after its boot with the app in front before the first shot and shoots its four pages
      # again at the end: a freshly booted iOS 26 simulator posts a system banner once, 15–35 s after
      # the boot, and two runs caught it on an App Store source (see the step body).
      - name: Screenshots (iPhone, 6.9-inch iPhone, iPad mini, 11-inch iPad; portrait, 4 pages each)
        if: ${{ !cancelled() && steps.simudid.outcome == 'success' }}
        continue-on-error: true
        run: |
          set -euo pipefail
          PRIMARY="${{ steps.simudid.outputs.udid }}"
          APP="$(find build/DerivedData -name "TegakiCalendar.app" -path "*iphonesimulator*" -not -path "*/Index.noindex/*" | head -1)"
          BUNDLE="com.syfan0.tegakicalendar"
          if [ -z "$APP" ]; then
            echo "::warning::TegakiCalendar.app not found under build/DerivedData; skipping the extra devices."
            exit 0
          fi
          mkdir -p shots
          # J-4 (docs/M7B_CONTRACT.md §1.3, §7.5): the Xcode and the simulator runtimes the photos were drawn
          # with. build.yml and ja-baseline.yml write the same lines (keep them the same), so a `diff` of the
          # two env.txt tells whether two runs drew with the same Xcode and runtimes. No UDIDs (they differ
          # from one runner image to the next).
          sim_env() {  # sim_env <device id> <udid>: "<id>: <device name> | <runtime name> (<runtime build>)"
            xcrun simctl list -j | SIM_ID="$1" SIM_UDID="$2" python3 -I -c '
          import json, os, sys
          data = json.load(sys.stdin)
          runtimes = {r.get("identifier"): r for r in data.get("runtimes", [])}
          for runtime, items in data.get("devices", {}).items():
              for d in items:
                  if d.get("udid") == os.environ["SIM_UDID"]:
                      r = runtimes.get(runtime, {})
                      print("%s: %s | %s (%s)" % (os.environ["SIM_ID"], d.get("name"), r.get("name", runtime), r.get("buildversion", "?")))
                      raise SystemExit
          print("%s: (no simulator %s)" % (os.environ["SIM_ID"], os.environ["SIM_UDID"]))
          '
          }
          xcrun simctl shutdown "$PRIMARY" || true
          # 1.4 D0b (docs/M7D_CONTRACT.md §3.5 (f); docs/M7D.md, D0b; the 13-inch step says why): `shoot` checks each photo's
          # handwriting and takes a short one again, at most twice (ink_retake); the hint, ink_hint. Not the first round of the
          # four pages (INK_SKIP: taken again at the end). INK_STALE counts per device. Same lines in both workflows.
          . "$GITHUB_WORKSPACE/tools/shots/ink_retake.sh"
          ink_build
          # device-id | exact first choice | prefix fallbacks (in order)
          for SPEC in "iphone|iPhone 17|iPhone 17,iPhone" \
                      "iphone69|iPhone 18 Pro Max|iPhone 18 Pro Max,iPhone 17 Pro Max" \
                      "ipadmini|iPad mini (A17 Pro)|iPad mini" \
                      "ipad11|iPad Pro 11-inch (M5)|iPad Pro 11,iPad Air 11,iPad (A"; do
            ID="${SPEC%%|*}"; REST="${SPEC#*|}"; EXACT="${REST%%|*}"; PREFIXES="${REST#*|}"
            FOUND="$(xcrun simctl list -j devices available | SIM_EXACT="$EXACT" SIM_PREFIXES="$PREFIXES" SIM_PRIMARY="$PRIMARY" python3 -c '
          import json, os, re, sys
          devices = json.load(sys.stdin).get("devices", {})
          def version(runtime):                                  # "…iOS-26-5" → (26, 5)
              m = re.search(r"iOS-(\d+)-(\d+)", runtime)
              return (int(m.group(1)), int(m.group(2))) if m else (0, 0)
          primary_runtime = next((r for r, items in devices.items() for d in items if d.get("udid") == os.environ["SIM_PRIMARY"]), None)
          try:                                                   # 1.4 (docs/M7D_CONTRACT.md §3.2): "Required simulators"
              required = set(open(os.path.join(os.environ["RUNNER_TEMP"], "required-simulators-udids.txt"), encoding="utf-8").read().split())
          except (KeyError, OSError):
              required = set()
          found = {}                                             # name → (udid, key): one Required resolved (1.4) > same runtime as the 13-inch > newer iOS
          for runtime, items in devices.items():
              if "iOS" not in runtime:
                  continue
              for d in items:
                  if not (d.get("isAvailable") and d.get("name") and d.get("udid")):
                      continue
                  key = (d["udid"] in required, runtime == primary_runtime, version(runtime))
                  if d["name"] not in found or key > found[d["name"]][1]:
                      found[d["name"]] = (d["udid"], key)
          exact = os.environ["SIM_EXACT"]
          if exact in found:
              print(exact + "|" + found[exact][0])
              raise SystemExit
          for prefix in os.environ["SIM_PREFIXES"].split(","):
              for name in sorted(found):
                  if name.startswith(prefix):
                      print(name + "|" + found[name][0])
                      raise SystemExit
          print("")
          ' || true)"
            if [ -z "$FOUND" ]; then echo "::error::No simulator for $ID (docs/M7D_CONTRACT.md §3.2); the job fails at \"The simulators used are the table's\"."; continue; fi
            NAME="${FOUND%%|*}"; UDID="${FOUND##*|}"
            echo "$ID: $NAME ($UDID)"
            INK_STALE=0
            sim_env "$ID" "$UDID" >> shots/env.txt || echo "::warning::no runtime line for $ID"
            xcrun simctl boot "$UDID" || true
            xcrun simctl bootstatus "$UDID" -b || { echo "::warning::$ID ($NAME) did not boot; skipping."; continue; }
            xcrun simctl ui "$UDID" appearance light || true
            xcrun simctl status_bar "$UDID" override --time "9:41" --batteryState charged --batteryLevel 100 --wifiBars 3 || true
            if ! xcrun simctl install "$UDID" "$APP"; then
              echo "::warning::install failed on $ID; skipping."
              [ "$UDID" = "$PRIMARY" ] || xcrun simctl shutdown "$UDID" || true
              continue
            fi
            shoot() {  # shoot <file> <launch args…>: one shot; a failure only loses this one file (never stops the step)
              local FILE="$1"; shift
              xcrun simctl terminate "$UDID" "$BUNDLE" 2>/dev/null || true
              sleep 1
              SHOT_LAUNCHED="$(date +%s)"   # 1.3: read by hint_shot
              xcrun simctl launch "$UDID" "$BUNDLE" --screenshot-mode "$@" $JA_ARGS || { echo "::warning::launch failed ($FILE)"; return 0; }
              sleep 9
              # `grep` without -q reads the whole list (docs/M7C.md, S1 の残り, decision 8): with -q it stops at the first match,
              # simctl, still writing the list, gets SIGPIPE, and pipefail makes the pipeline fail although the app is in
              # the list (a false warning in 0–9 of build.yml's photos and 5–14 of l10n-shots' in the runs of 11/11–12;
              # none in the prototype's span-shots, removed in S6, which read the whole list). An app not in the list, or no list, still warns.
              xcrun simctl spawn "$UDID" launchctl list 2>/dev/null | grep tegakicalendar > /dev/null || echo "::warning::The app is not running after 9 s ($FILE)"
              xcrun simctl io "$UDID" screenshot "shots/$FILE" || echo "::warning::screenshot failed ($FILE)"
              ink_retake "shots/$FILE" "$FILE" 9 --screenshot-mode "$@" $JA_ARGS
            }
            # 1.3 (docs/M7C.md, wave C1's lead decision 6; the 13-inch step's comment): the pinch hint's toast is up for 20 s
            # from half a second after the canvas appeared. A photo written more than 20 s after its launch is taken once more;
            # a second late one stays, with a warning. A photo taken in time is `shoot`'s, as before.
            # 1.4 D0b (§3.5 (f)): kept also only with its handwriting complete (ink_hint, not shoot's ink_retake); after 2 takes
            # the better one stays (in time first, then fewer pixels short; two late complete takes: the second, as before).
            hint_shot() {  # hint_shot <file> <launch args…>
              local TAKE TOOK
              for TAKE in 1 2; do
                INK_SKIP=1
                shoot "$@"
                INK_SKIP=0
                TOOK=$(( $(date +%s) - SHOT_LAUNCHED ))
                if ink_hint "shots/$1" "$1" "$TAKE" "$TOOK" 20; then
                  echo "pinch hint ($1): written ${TOOK} s after the launch (take $TAKE), inside the toast's 20 s"
                  return 0
                fi
                if [ "$TOOK" -le 20 ]; then
                  echo "pinch hint ($1): written ${TOOK} s after the launch (take $TAKE), inside the toast's 20 s, its handwriting short"
                else
                  echo "pinch hint ($1): written ${TOOK} s after the launch (take $TAKE), after the toast's 20 s"
                fi
              done
              echo "::warning::$1 was written more than 20 s after its launch, or with its handwriting short, twice; the toast or some handwriting may be missing from it (J-4)."
            }
            # M6 (docs/M6.md §5.1): a freshly booted iOS 26 simulator posts a system banner once, 15–35 s
            # after the boot ("Ready for Apple Intelligence" — run 39034481760 caught it on
            # iphone-portrait-week.png, run 39031277533 on ipad11-portrait-day.png, both App Store
            # sources). Wait that window out with the app in front before the first shot (settle) …
            xcrun simctl launch "$UDID" "$BUNDLE" --screenshot-mode --screenshot-month 2026-10 --screenshot-page month $JA_ARGS || true
            sleep 40
            xcrun simctl terminate "$UDID" "$BUNDLE" 2>/dev/null || true
            INK_SKIP=1   # 1.4 D0b: these four are taken again below; their handwriting is checked there
            for PAGE in month week day year; do
              shoot "$ID-portrait-$PAGE.png" --screenshot-month 2026-10 --screenshot-page "$PAGE"
            done
            INK_SKIP=0
            if [ "$ID" = "ipad11" ]; then
              # M5-32: the day page's title 「2026年10月7日(水)」 must stay on one line next to the lock-only badge.
              shoot "$ID-portrait-readonly.png" --screenshot-month 2026-10 --screenshot-page day --screenshot-readonly
            fi
            if [ "$ID" = "iphone" ]; then
              # M5-13: compact width → no badge, the notice row under the header instead.
              shoot "$ID-portrait-readonly.png" --screenshot-month 2026-10 --screenshot-page week --screenshot-readonly
            fi
            if [ "$ID" = "iphone" ] || [ "$ID" = "iphone69" ]; then
              # M6 (docs/M6_CONTRACT.md §4.2, §7.4): the full-height paywall sheet (.large detent) over the
              # month page — the App Store shot 05-paywall of both iPhone classes.
              shoot "$ID-portrait-sheet-paywall.png" --screenshot-month 2026-10 --screenshot-page month --screenshot-sheet paywall
            fi
            # … and shoot the four pages (the store/ sources) once more now, 1.5–2 min after the boot, so
            # a banner that still slipped into a first take is not in the file that is kept (retake).
            for PAGE in month week day year; do
              shoot "$ID-portrait-$PAGE.png" --screenshot-month 2026-10 --screenshot-page "$PAGE"
            done
            if [ "$ID" = "iphone69" ]; then
              # 1.4 (docs/M7D_CONTRACT.md §3.2): the iPhone 18 Pro Max's pixels go into env.txt (whether App Store takes them
              # as a 6.9-inch size is not known; "Store listing set" still only warns). Not a device line ("<id>: …"), so
              # "The simulators used are the table's" does not read it.
              PIXELS="$(sips -g pixelWidth -g pixelHeight "shots/$ID-portrait-month.png" 2>/dev/null | awk '/pixel(Width|Height)/ { printf "%s%s", (n++ ? "x" : ""), $2 }' || true)"
              echo "iphone69 pixels: ${PIXELS:-no photo} ($ID-portrait-month.png)" >> shots/env.txt || true
            fi
            if [ "$ID" = "iphone" ]; then
              # 1.1 (docs/M7A_CONTRACT.md §7.4, §8 6): the folded toolbar (the dock button above the home
              # indicator), the grown month memo and the day's free memo below 24:00 at their strokes,
              # the one-time pinch hint (1.1.1), and (below, with the landscape shots) the folded toolbar
              # in landscape.
              shoot "$ID-portrait-toolbar-collapsed.png" --screenshot-month 2026-10 --screenshot-page month --screenshot-toolbar collapsed
              shoot "$ID-portrait-month-memo.png" --screenshot-month 2026-10 --screenshot-page month --screenshot-grown --screenshot-offset 0,1700
              shoot "$ID-portrait-day-extra.png" --screenshot-month 2026-10 --screenshot-page day --screenshot-grown --screenshot-offset 0,2300
              hint_shot "$ID-portrait-pinch-hint.png" --screenshot-month 2026-10 --screenshot-page month --screenshot-pinch-hint
              # M4B-3 / M4B-27: 6/7 is a Sunday → the 「今日」 column is the last one → the paper starts
              # at the right edge and the time labels are off screen.
              shoot "$ID-portrait-week-sun.png" --screenshot-month 2026-06 --screenshot-page week
              # M4c: the week at 3 × fitAll (0.8613: Tue–Thu from 8:45, the text at its minPoints) and
              # the week of 6/1–6/7 (M4C-28: the first heading is "6/1" without its weekday).
              shoot "$ID-portrait-week-zoom3.png" --screenshot-month 2026-10 --screenshot-page week --screenshot-zoom 3 --screenshot-offset 300,700
              shoot "$ID-portrait-week-jun.png" --screenshot-month 2026-06 --screenshot-page week
              for PAGE in month week day year; do        # §6.4: only the iPhone can turn
                shoot "$ID-landscape-$PAGE.png" --screenshot-month 2026-10 --screenshot-page "$PAGE" --screenshot-landscape
              done
              shoot "$ID-landscape-month-toolbar-collapsed.png" --screenshot-month 2026-10 --screenshot-page month --screenshot-toolbar collapsed --screenshot-landscape
              # The simulator's framebuffer stays portrait (only the app's interface turned), so the
              # landscape shots come out rotated by 90°; stand them up. When the request was ignored
              # (header still two rows) they end up sideways instead, which is the tell.
              # 1.4 D0b (docs/M7D_CONTRACT.md §3.5 (g); docs/M7D.md, D0b): the iOS 27.2 simulator writes them in landscape
              # already (D0, run 44632524223: 2622x1206, turned by 270° they stood sideways), so only a PNG taller than wide
              # is turned. Same lines in both workflows.
              for f in shots/"$ID"-landscape-*.png; do
                [ -f "$f" ] || continue
                TURN_SIZE="$(sips -g pixelWidth -g pixelHeight "$f" 2>/dev/null | awk '/pixelWidth/ { w = $2 } /pixelHeight/ { h = $2 } END { print w + 0, h + 0 }' || true)"
                if [ "${TURN_SIZE#* }" -gt "${TURN_SIZE% *}" ]; then
                  sips -r 270 "$f" > /dev/null || echo "::warning::could not rotate $f"
                fi
              done
            fi
            xcrun simctl terminate "$UDID" "$BUNDLE" 2>/dev/null || true
            # 1.1: 6 → 8 min (the iPhone takes about 21 shots now, plus the 40 s wait).
            xcrun simctl spawn "$UDID" log show --last 8m --style compact --predicate 'process == "TegakiCalendar"' > "shots/$ID-log.txt" 2>&1 || true
            grep 'zoom: ' "shots/$ID-log.txt" || true     # M4c: the canvas's zoom lines of this device
            grep 'store: ' "shots/$ID-log.txt" || true    # M5: the store's lines (0 in screenshot mode, see above)
            grep -E 'toolbar: (safeArea|paperArea)=|budget: largest=|canvas: tail-only' "shots/$ID-log.txt" || true   # 1.1 (see the 13-inch log)
            [ "$UDID" = "$PRIMARY" ] || xcrun simctl shutdown "$UDID" || true
          done
          ls -la shots

      # M6 (docs/M6_CONTRACT.md §4.1, §4.2, §7.4): the App Store listing set. The shots of §4.2 are
      # converted to JPEG (no alpha: `simctl io screenshot` PNGs are usually opaque but that is not
      # guaranteed, and Apple rejects alpha) under shots/store/<device>/NN-<name>.jpg, and each file's
      # pixel size is compared with Apple's accepted portrait sizes for that device class (help page
      # "Screenshot specifications", read 2026-10-17): iPad 13-inch 2064×2752 or 2048×2732, iPhone
      # Dynamic Island (medium) 1206×2622 or 1179×2556, iPhone Dynamic Island (large) 1320×2868 /
      # 1290×2796 / 1260×2736, iPad 11-inch 1668×2420 / 1668×2388 / 1640×2360 / 1488×2266. A size
      # outside its set is a ::warning (a run that fell back to "iPad Air 13-inch" gives 2048×2732 and
      # passes; one that fell back to "iPhone 17 Pro" for iphone69 gives 1206×2622 and warns). The
      # numbers are the provisional listing order (§4.2 — the lead may reorder at §8-5). Always runs,
      # never fails the job; a missing source only skips that one file.
      - name: Store listing set (JPEG, App Store sizes)
        if: ${{ always() && env.QUICK != 'true' }}
        continue-on-error: true
        run: |
          set -uo pipefail
          mkdir -p shots/store/ipad13 shots/store/iphone shots/store/iphone69 shots/store/ipad11
          accepted() {  # accepted <device>: Apple's accepted portrait pixel sizes (docs/M6_CONTRACT.md §4.1)
            case "$1" in
              ipad13)   echo "2064x2752 2048x2732" ;;
              iphone)   echo "1206x2622 1179x2556" ;;
              iphone69) echo "1320x2868 1290x2796 1260x2736" ;;
              ipad11)   echo "1668x2420 1668x2388 1640x2360 1488x2266" ;;
              *)        echo "" ;;
            esac
          }
          store() {  # store <device> <NN-name> <source shot without .png>: convert, then check the size
            local DEV="$1" NAME="$2" SRC="shots/$3.png" OUT="shots/store/$1/$2.jpg" W H SIZE
            if [ ! -f "$SRC" ]; then echo "::warning::store/$DEV/$NAME.jpg: source $SRC is missing; skipped."; return 0; fi
            if ! sips -s format jpeg -s formatOptions 100 "$SRC" --out "$OUT" > /dev/null; then echo "::warning::store/$DEV/$NAME.jpg: sips could not convert $SRC."; return 0; fi
            W="$(sips -g pixelWidth "$OUT" | awk '/pixelWidth/ {print $2}')"
            H="$(sips -g pixelHeight "$OUT" | awk '/pixelHeight/ {print $2}')"
            SIZE="${W}x${H}"
            case " $(accepted "$DEV") " in
              *" $SIZE "*) echo "store/$DEV/$NAME.jpg: ${SIZE} (accepted for $DEV)" ;;
              *) echo "::warning::store/$DEV/$NAME.jpg is ${SIZE}, not one of the accepted sizes for $DEV ($(accepted "$DEV"))." ;;
            esac
          }
          store ipad13   01-month    ipad13-portrait-month
          store ipad13   02-week     ipad13-portrait-week
          store ipad13   03-day      ipad13-portrait-day
          store ipad13   04-year     ipad13-portrait-year
          store ipad13   05-paywall  ipad13-portrait-sheet-paywall
          store ipad13   06-settings ipad13-portrait-sheet-settings
          store iphone   01-week     iphone-portrait-week
          store iphone   02-month    iphone-portrait-month
          store iphone   03-day      iphone-portrait-day
          store iphone   04-year     iphone-portrait-year
          store iphone   05-paywall  iphone-portrait-sheet-paywall
          store iphone69 01-week     iphone69-portrait-week
          store iphone69 02-month    iphone69-portrait-month
          store iphone69 03-day      iphone69-portrait-day
          store iphone69 04-year     iphone69-portrait-year
          store iphone69 05-paywall  iphone69-portrait-sheet-paywall
          store ipad11   01-month    ipad11-portrait-month
          store ipad11   02-week     ipad11-portrait-week
          store ipad11   03-day      ipad11-portrait-day
          store ipad11   04-year     ipad11-portrait-year
          ls -la shots/store/*

      # ---- End of the steps of build.yml ----

      # What the run made, on the run's summary page.
      - name: Summary
        if: always()
        continue-on-error: true
        env:
          REF: ${{ steps.ref.outputs.sha }}
          ARTIFACT: ja-baseline-${{ steps.ref.outputs.short }}
        run: |
          set -uo pipefail
          {
            echo "### ja-baseline (J-4)"
            echo ""
            echo "- reference commit: \`$REF\` ($(git log -1 --format=%s 2>/dev/null || echo '?'))"
            echo "- artifact: \`$ARTIFACT\` (kept 30 days)"
            echo "- PNG files: $(find shots -name '*.png' 2>/dev/null | wc -l | tr -d ' '); JPEG files in store/: $(find shots/store -name '*.jpg' 2>/dev/null | wc -l | tr -d ' ')"
            echo ""
            echo "env.txt:"
            echo ""
            echo '```'
            cat shots/env.txt 2>/dev/null || echo "(none)"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      # The artifact's name carries the commit (J-4 compares 1.2's `screenshots` with
      # ja-baseline-<sha>). overwrite: a re-run of this run (gh run rerun) replaces the photos instead
      # of failing on the existing name.
      - name: Upload the photos
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ja-baseline-${{ steps.ref.outputs.short }}
          path: baseline/shots
          retention-days: 30
          if-no-files-found: warn
          overwrite: true

      # 1.4 (docs/M7D_CONTRACT.md §3.2): the devices this job took are the table's ("Required simulators"): each line
      # "<id>: <name> | <runtime> (<build>)" of its env.txt has the table's name, on the runtime (name and build) that
      # "Required simulators" found for it, and every device of the table has a line (none means it was not found, and its
      # photos or tests are missing). A prefix fallback that landed on another device, or another runtime taken instead of
      # the table's (a newer one, or the iPhone Duo's iOS 27.2), fails the job here. The same lines in every job that boots
      # a simulator; only ENV_TXT differs.
      - name: The simulators used are the table's (1.4)
        if: ${{ !cancelled() && env.QUICK != 'true' }}
        env:
          ENV_TXT: shots/env.txt
        run: |
          set -euo pipefail
          python3 -I - "$RUNNER_TEMP/required-simulators.txt" "$ENV_TXT" <<'EOF'
          import re, sys
          table = [[p.strip() for p in line.rstrip("\n").split("|")] for line in open(sys.argv[1], encoding="utf-8") if line.strip()]
          try:
              resolved = {row[0]: row[2:] for row in (line.rstrip("\n").split("|") for line in open(sys.argv[1].replace(".txt", "-resolved.txt"), encoding="utf-8")) if len(row) == 4}
          except OSError:
              resolved = {}
          try:
              lines = open(sys.argv[2], encoding="utf-8").read().splitlines()
          except OSError as error:
              print("::error::%s could not be read (%s): the devices this job took are not known (docs/M7D_CONTRACT.md §3.2)." % (sys.argv[2], error))
              sys.exit(1)
          taken = {}
          for line in lines:
              m = re.fullmatch(r"([a-z0-9]+): (.+) \| (.+) \(([^()]*)\)", line)
              if m:
                  taken.setdefault(m.group(1), []).append(m.group(2, 3, 4))
          failed = False
          for ident, name, want in table:
              if ident not in taken:
                  print("::error::%s (%s): no line in %s, so it was not taken (docs/M7D_CONTRACT.md §3.2)." % (ident, name, sys.argv[2]))
                  failed = True
              for got, runtime, build in taken.get(ident, []):
                  if ident in resolved:
                      ok = got == name and [runtime, build] == resolved[ident]
                      where = "%s (%s)" % tuple(resolved[ident])
                  else:
                      ok = got == name and (runtime == "iOS " + want or runtime.startswith("iOS " + want + "."))
                      where = "iOS " + want
                  print("%s: %s | %s (%s): %s" % (ident, got, runtime, build, "the table's" if ok else "NOT the table's"))
                  if not ok:
                      print("::error::%s took %s on %s (%s), not the table's %s on %s (docs/M7D_CONTRACT.md §3.2)." % (ident, got, runtime, build, name, where))
                      failed = True
          sys.exit(1 if failed else 0)
          EOF
