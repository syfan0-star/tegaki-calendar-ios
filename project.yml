# XcodeGen spec for the native iPad app "てがきカレンダー".
# Run `xcodegen generate` to produce TegakiCalendar.xcodeproj (the .xcodeproj is not committed).
name: TegakiCalendar

options:
  bundleIdPrefix: com.syfan0
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  generateEmptyDirectories: false

# Project-wide build settings. Swift 5 language mode + minimal concurrency checking keeps the
# first CI build green; tighten to Swift 6 / complete checking in a later milestone.
settings:
  base:
    SWIFT_VERSION: "5.0"
    SWIFT_STRICT_CONCURRENCY: minimal
    IPHONEOS_DEPLOYMENT_TARGET: "17.0"
    TARGETED_DEVICE_FAMILY: "1,2"
    MARKETING_VERSION: "0.5.1"
    CURRENT_PROJECT_VERSION: "1"
    CODE_SIGN_STYLE: Automatic
    # DEVELOPMENT_TEAM is intentionally unset: CI builds for the Simulator with CODE_SIGNING_ALLOWED=NO.
    # testflight.yml passes the team id and the profile on the command line (manual signing).
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    SWIFT_EMIT_LOC_STRINGS: YES

# The pure part of the app (Foundation only) lives in the local Swift package TegakiKit
# (docs/DESIGN.md §8.2, docs/M2_CONTRACT.md §0). The app links three of its products;
# `Layout` re-exports `DayKit` (DayKey / YearMonth), so these three are all the app imports.
packages:
  TegakiKit:
    path: TegakiKit

targets:
  TegakiCalendar:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      # Also picks up Sources/TegakiCalendar/PrivacyInfo.xcprivacy as a resource (the privacy
      # manifest, docs/M4_CONTRACT.md §8.4: UserDefaults, reason CA92.1).
      - path: Sources/TegakiCalendar
    dependencies:
      - package: TegakiKit
        product: Layout
      - package: TegakiKit
        product: Holidays
      - package: TegakiKit
        product: InkModel
    info:
      # Generated by XcodeGen from the properties below (plus the usual CFBundle* defaults).
      path: Support/Info.plist
      properties:
        CFBundleDisplayName: てがきカレンダー
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        CFBundleDevelopmentRegion: ja
        LSRequiresIPhoneOS: true
        # Same wording as docs/DESIGN.md §4.1 and docs/PRIVACY.md 付録 B (keep the three in sync).
        NSCalendarsFullAccessUsageDescription: カレンダーの予定を手帳のページに表示し、手書きから予定を作るために使います。iPadOS には読み取りだけの許可が無いため、フルアクセスをお願いしています。予定は iPad の中だけで扱い、外部には送りません。
        UISupportsDocumentBrowser: false
        UILaunchScreen: {}
        # Silent pushes of the CloudKit zone subscription (docs/M4_CONTRACT.md §2.1, §6.7).
        UIBackgroundModes:
          - remote-notification
        ITSAppUsesNonExemptEncryption: false
        UIRequiresFullScreen: false
        UIApplicationSupportsIndirectInputEvents: true
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.syfan0.tegakicalendar
        PRODUCT_NAME: TegakiCalendar
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        GENERATE_INFOPLIST_FILE: NO
        TARGETED_DEVICE_FAMILY: "1,2"
        SUPPORTS_MACCATALYST: NO
        # iCloud (CloudKit, container iCloud.com.syfan0.tegakicalendar) + aps-environment
        # (docs/M4_CONTRACT.md §8.4). The Simulator build in CI does not sign, so the file is only
        # embedded by testflight.yml, whose profile must carry the same capabilities.
        CODE_SIGN_ENTITLEMENTS: Support/TegakiCalendar.entitlements
    scheme:
      testTargets:
        - TegakiCalendarTests
      gatherCoverageData: false

  # Simulator-only tests of the iOS-specific code (PencilKit ledger, EventKit normalisation).
  # The pure modules are tested by the package itself (`swift test --package-path TegakiKit`).
  TegakiCalendarTests:
    type: bundle.unit-test
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: Tests/TegakiCalendarTests
    dependencies:
      - target: TegakiCalendar
      - package: TegakiKit
        product: Layout
      - package: TegakiKit
        product: InkModel
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.syfan0.tegakicalendar.tests
        GENERATE_INFOPLIST_FILE: YES
        TARGETED_DEVICE_FAMILY: "1,2"
